name: RouterVPN
options:
  bundleIdPrefix: com.eabusham.routervpn
packages:
  WireGuardKit:
    path: .deps/wireguard-apple
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "8"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
targets:
  RouterVPN:
    type: application
    platform: iOS
    sources:
      - App
      - Resources
      - path: ../../LICENSE
        buildPhase: resources
    postBuildScripts:
      - name: Stamp exact source provenance
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ROUTER_VPN_ARTIFACT_FAMILY=ios-app bash "$SRCROOT/stamp-provenance.sh"
      - name: Verify MIT license resource
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          test -s "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/LICENSE"
    settings:
      base:
        PRODUCT_NAME: RouterVPN
        PRODUCT_BUNDLE_IDENTIFIER: com.eabusham.routervpn
        CODE_SIGN_ENTITLEMENTS: Resources/RouterVPN.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Router VPN
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Router VPN connects to your home VPN node on the local network to import its private profile and manage tunnel-only services.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Router VPN can show your real device location on the VPN map when you explicitly tap the location button. Location is not required for the VPN and is never inferred from your IP address.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_RouterVPNSourceSHA: "$(ROUTER_VPN_SOURCE_SHA)"
        INFOPLIST_KEY_RouterVPNSourceRepository: "Eabusham2/router-vpn"
        INFOPLIST_KEY_RouterVPNArtifactFamily: "ios-app"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: RouterVPNPacketTunnel
        embed: true
        codeSign: false
  RouterVPNPacketTunnel:
    type: app-extension
    platform: iOS
    sources: [PacketTunnel]
    preBuildScripts:
      - name: Build pinned wireguard-go bridge and Libbox bridge
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          PIN=2fec12a6e1f6e3460b6ee483aa00ad29cddadab1
          WG_ROOT="$SRCROOT/.deps/wireguard-apple"
          test -d "$WG_ROOT/Sources/WireGuardKitGo"
          ACTUAL="$(git -C "$WG_ROOT" rev-parse HEAD)"
          test "$ACTUAL" = "$PIN" || { echo "WireGuardKit checkout mismatch: $ACTUAL" >&2; exit 1; }
          test "$(sed -n '1p' "$WG_ROOT/Package.swift")" = '// swift-tools-version:5.5'
          make -C "$WG_ROOT/Sources/WireGuardKitGo" build
          test -s "$CONFIGURATION_BUILD_DIR/libwg-go.a"
          "$SRCROOT/prepare-libbox.sh"
          test -d "$SRCROOT/.deps/Libbox.xcframework"
          test -s "$SRCROOT/.deps/libbox-LICENSE.txt"
          test "$(tr -d '\r\n' < "$SRCROOT/.deps/Libbox.xcframework.pin")" = '1.13.12+1086ab2563320e0da0c23b3a491d8dfa0939dff4+go1.26.3+0.1.12+ios,iossimulator'
    postBuildScripts:
      - name: Stamp exact source provenance
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ROUTER_VPN_ARTIFACT_FAMILY=ios-packet-tunnel bash "$SRCROOT/stamp-provenance.sh"
    settings:
      base:
        PRODUCT_NAME: RouterVPNPacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.eabusham.routervpn.PacketTunnel
        CODE_SIGN_ENTITLEMENTS: Resources/PacketTunnel.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Router VPN Tunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
        INFOPLIST_KEY_NSExtension_NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_RouterVPNSourceSHA: "$(ROUTER_VPN_SOURCE_SHA)"
        INFOPLIST_KEY_RouterVPNSourceRepository: "Eabusham2/router-vpn"
        INFOPLIST_KEY_RouterVPNArtifactFamily: "ios-packet-tunnel"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(CONFIGURATION_BUILD_DIR)"
        OTHER_LDFLAGS: "$(inherited) -lresolv -framework UIKit"
        SKIP_INSTALL: YES
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
      - framework: .deps/Libbox.xcframework
        embed: false
