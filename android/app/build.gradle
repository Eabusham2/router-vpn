plugins {
    id 'com.android.application'
}

def projectLicense = rootProject.file('../LICENSE')
def generatedLicenseAssets = file("$buildDir/generated/routervpn-license-assets")
def generatedProvenanceAssets = file("$buildDir/generated/routervpn-provenance-assets")
def generatedProvenanceFile = file("$generatedProvenanceAssets/ROUTER-VPN-SOURCE.json")

android {
    namespace 'com.eabusham.routervpn'
    compileSdk 36

    defaultConfig {
        applicationId 'com.eabusham.routervpn'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main {
            assets.srcDir generatedLicenseAssets
            assets.srcDir generatedProvenanceAssets
        }
    }
}

def awgAar = file('libs/amneziawg-tunnel.aar')
def libboxAar = file('libs/libbox.aar')

tasks.register('stageProjectLicense', Copy) {
    doFirst {
        if (!projectLicense.isFile()) {
            throw new GradleException('Root MIT LICENSE is missing')
        }
    }
    from projectLicense
    into generatedLicenseAssets
}

tasks.register('stageSourceProvenance') {
    outputs.file generatedProvenanceFile
    doLast {
        generatedProvenanceAssets.mkdirs()
        def rawSha = (System.getenv('GITHUB_SHA') ?: System.getenv('ROUTER_VPN_SOURCE_SHA') ?: '').trim().toLowerCase()
        def sourceSha = (rawSha ==~ /[0-9a-f]{40}/) ? rawSha : 'development'
        def repository = (System.getenv('GITHUB_REPOSITORY') ?: 'Eabusham2/router-vpn').trim()
        def body = [
            schema_version: 1,
            repository: repository,
            source_sha: sourceSha,
            artifact_family: 'android-apk',
        ]
        generatedProvenanceFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(body)) + '\n'
    }
}

tasks.register('prepareAmneziaWgTunnel', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'build-awg-tunnel.sh'
    outputs.file awgAar
}

tasks.register('prepareSingBoxLibbox', Exec) {
    workingDir rootProject.projectDir
    // The canonical pinned builder owns its verifier. Do not rewrite it at
    // Gradle execution time: source-level sed patches can drift and mutate an
    // already-correct package path into a false verifier failure.
    commandLine 'bash', 'build-sing-box-libbox.sh'
    outputs.file libboxAar
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('stageProjectLicense')
    dependsOn tasks.named('stageSourceProvenance')
    dependsOn tasks.named('prepareAmneziaWgTunnel')
    dependsOn tasks.named('prepareSingBoxLibbox')
}

tasks.register('verifyDebugProjectLicense') {
    dependsOn 'packageDebug'
    doLast {
        def apk = file("$buildDir/outputs/apk/debug/app-debug.apk")
        if (!apk.isFile()) {
            throw new GradleException('Debug APK is missing while verifying MIT license')
        }
        def zip = new java.util.zip.ZipFile(apk)
        try {
            def entry = zip.getEntry('assets/LICENSE')
            if (entry == null || entry.size <= 0) {
                throw new GradleException('Android APK is missing assets/LICENSE')
            }
            def provenanceEntry = zip.getEntry('assets/ROUTER-VPN-SOURCE.json')
            if (provenanceEntry == null || provenanceEntry.size <= 0) {
                throw new GradleException('Android APK is missing assets/ROUTER-VPN-SOURCE.json')
            }
            def provenance = new groovy.json.JsonSlurper().parse(zip.getInputStream(provenanceEntry))
            if (provenance.artifact_family != 'android-apk' || provenance.repository != (System.getenv('GITHUB_REPOSITORY') ?: 'Eabusham2/router-vpn')) {
                throw new GradleException('Android APK source provenance family/repository mismatch')
            }
            def expectedSha = (System.getenv('GITHUB_SHA') ?: '').trim().toLowerCase()
            if (expectedSha ==~ /[0-9a-f]{40}/) {
                if (provenance.source_sha != expectedSha) {
                    throw new GradleException("Android APK source provenance mismatch: " + provenance.source_sha + " != " + expectedSha)
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.matching { it.name == 'assembleDebug' }.configureEach {
    finalizedBy tasks.named('verifyDebugProjectLicense')
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    // Built from the exact official AmneziaWG Android 2.0.0 source commit by
    // android/build-awg-tunnel.sh. No moving JitPack/Maven coordinate is used.
    implementation files('libs/amneziawg-tunnel.aar')
    // One pinned gomobile runtime built by android/build-sing-box-libbox.sh:
    // sing-box v1.13.12 at 1086ab2563320e0da0c23b3a491d8dfa0939dff4
    // plus libXray at 294fb37343205b9b0cb7b7b1b423d3d4b60d9998, whose
    // go.mod pins Xray-core v26.7.11 (50231eaff98c). Keeping both engines in
    // the same libbox AAR avoids duplicate go.Seq/libgojni runtimes in one APK.
    implementation files('libs/libbox.aar')
}
