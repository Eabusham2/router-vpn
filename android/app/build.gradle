plugins {
    id 'com.android.application'
}

def projectLicense = rootProject.file('../LICENSE')
def generatedLicenseAssets = file("$buildDir/generated/routervpn-license-assets")
def generatedProvenanceAssets = file("$buildDir/generated/routervpn-provenance-assets")
def generatedProvenanceFile = file("$generatedProvenanceAssets/ROUTER-VPN-SOURCE.json")
def provenanceRawSha = (System.getenv('GITHUB_SHA') ?: System.getenv('ROUTER_VPN_SOURCE_SHA') ?: '').trim().toLowerCase()
def provenanceSourceSha = (provenanceRawSha ==~ /[0-9a-f]{40}/) ? provenanceRawSha : 'development'
def provenanceRepository = (System.getenv('GITHUB_REPOSITORY') ?: 'Eabusham2/router-vpn').trim()

android {
    namespace 'com.eabusham.routervpn'
    compileSdk 36

    defaultConfig {
        applicationId 'com.eabusham.routervpn'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    sourceSets {
        main {
            jniLibs.srcDir file('libs/rosenpass-native/jni')
            jniLibs.srcDir file('libs/tor-native/jni')
            assets.srcDir generatedLicenseAssets
            assets.srcDir generatedProvenanceAssets
        }
    }
    packaging {
        jniLibs {
            // Preserve the native package's verified bytes through APK assembly.
            keepDebugSymbols += ['**/libroutervpn_tor.so']
        }
    }
}

def awgAar = file('libs/amneziawg-tunnel.aar')
def awgStamp = file('libs/amneziawg-tunnel.commit')
def awgLicense = file('libs/amneziawg-tunnel-LICENSE.txt')
def libboxAar = file('libs/libbox.aar')
def libboxStamp = file('libs/libbox.commit')
def libboxOpenVPNStamp = file('libs/libbox.openvpn.sha256')
def libboxLicense = file('libs/libbox-LICENSE.txt')
def libxrayLicense = file('libs/libxray-LICENSE.txt')
def nativeAwgLicense = file('libs/native-amneziawg-LICENSE.txt')
def nativeTorPackage = file('libs/tor-native')
def nativeTorNotices = file('libs/tor-notices')

tasks.register('stageProjectLicense', Sync) {
    doFirst {
        if (!projectLicense.isFile()) {
            throw new GradleException('Root MIT LICENSE is missing')
        }
    }
    dependsOn 'prepareSingBoxLibbox'
    from projectLicense
    from(nativeAwgLicense) { into 'third-party' }
    from(nativeTorNotices) { into 'third-party/routervpn-tor' }
    into generatedLicenseAssets
}

tasks.register('stageSourceProvenance') {
    inputs.property 'routerVpnSourceSha', provenanceSourceSha
    inputs.property 'routerVpnSourceRepository', provenanceRepository
    outputs.file generatedProvenanceFile
    doLast {
        generatedProvenanceAssets.mkdirs()
        def body = [
            schema_version: 1,
            repository: provenanceRepository,
            source_sha: provenanceSourceSha,
            artifact_family: 'android-apk',
        ]
        generatedProvenanceFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(body)) + '\n'
    }
}

tasks.register('prepareAmneziaWgTunnel', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'build-awg-tunnel.sh'
    inputs.file rootProject.file('build-awg-tunnel.sh')
    outputs.files awgAar, awgStamp, awgLicense
}

tasks.register('prepareSingBoxLibbox', Exec) {
    workingDir rootProject.projectDir
    // The canonical pinned builder owns its verifier. Do not rewrite it at
    // Gradle execution time: source-level sed patches can drift and mutate an
    // already-correct package path into a false verifier failure.
    commandLine 'bash', 'build-sing-box-libbox.sh'
    inputs.files rootProject.file('build-sing-box-libbox.sh'), rootProject.file('routervpn_xray_bridge.go'), rootProject.file('../mobile/routervpn_openvpn.go'), rootProject.file('../mobile/routervpn_openvpn_native_test.go.tmpl'), rootProject.file('../deploy/test_mobile_openvpn_pinned.sh')
    inputs.file rootProject.file('../deploy/prepare-mobile-amnezia.py')
    inputs.file rootProject.file('../deploy/prepare-mobile-pq.py')
    inputs.files rootProject.file('../deploy/build-mobile-tor-package.py'), rootProject.file('../deploy/prepare-mobile-torpack.py'), rootProject.file('../deploy/prepare-mobile-tor.py'), rootProject.file('../deploy/stage-mobile-tor-notices.py'), rootProject.file('../deploy/verify-mobile-tor-link.py')
    inputs.files rootProject.file('../deploy/test_mobile_tor_loader.py'), rootProject.file('../deploy/test_mobile_tor_package_policy.py')
    inputs.file rootProject.file('../deploy/test_mobile_tor_packaged_link.py')
    inputs.files rootProject.file('../deploy/build-mobile-tor.py'), rootProject.file('../deploy/test-mobile-tor-outbound.py'), rootProject.file('../deploy/test_mobile_tor_package_runtime.py'), rootProject.file('../deploy/test_mobile_tor_thread_signals.py'), rootProject.fileTree('../internal/mobiletor')
    inputs.file rootProject.file('../deploy/prepare-gvisor-scheduler.py')
    inputs.files rootProject.file('../deploy/prepare-mobile-mtu.py'), rootProject.file('../deploy/prepare-retained-tun.py'), rootProject.fileTree('../internal/mobilemtu'), rootProject.fileTree('../internal/mtuprobe'), rootProject.fileTree('../internal/hopmeasure')
    inputs.files rootProject.file('../deploy/prepare-apple-xray.py'), rootProject.file('../deploy/xray_native_dialer_policy.py'), rootProject.fileTree('../internal/applexray'), rootProject.fileTree('../mobile/applexray')
    inputs.files rootProject.file('../deploy/prepare-mobile-multihop.py'), rootProject.fileTree('../internal/mobilemultihop'), rootProject.fileTree('../internal/mobilepq'), rootProject.fileTree('../internal/routechoice'), rootProject.fileTree('../internal/multihoprelay'), rootProject.fileTree('../mobile')
    inputs.files rootProject.file('../deploy/prepare-xray-runtime.py'), rootProject.file('../deploy/xray_connection_policy.py'), rootProject.file('../deploy/xray_datagram_policy.py')
    inputs.files rootProject.file('../deploy/test_android_multihop_pinned.py'), rootProject.file('test_android_multihop_graph.py')
    inputs.files rootProject.file('../deploy/test_android_tor_pinned.py'), rootProject.file('../deploy/test_android_tor_pinned_contract.py'), rootProject.file('test_android_tor_profile.py'), rootProject.file('test_android_tor_form.py'), rootProject.file('test_android_tor_session.py'), rootProject.file('test_android_start_layer_relay_lifecycle.py')
    inputs.files fileTree('src/main/java/com/eabusham/routervpn') { include '*.java' }
    outputs.files libboxAar, libboxStamp, libboxLicense, libxrayLicense, libboxOpenVPNStamp, nativeAwgLicense
    outputs.dirs nativeTorPackage, nativeTorNotices
}

tasks.register('prepareRosenpassNative', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', '../deploy/build-mobile-pq.py', '--platform', 'android', '--output', 'app/libs/rosenpass-native'
    inputs.file rootProject.file('../deploy/build-mobile-pq.py')
    inputs.files rootProject.fileTree('../mobile/rosenpass') { exclude 'target/**' }
    outputs.dir file('libs/rosenpass-native')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareRosenpassNative')
    dependsOn tasks.named('stageProjectLicense')
    dependsOn tasks.named('stageSourceProvenance')
    dependsOn tasks.named('prepareAmneziaWgTunnel')
    dependsOn tasks.named('prepareSingBoxLibbox')
}

tasks.register('verifyDebugProjectLicense') {
    dependsOn 'packageDebug'
    doLast {
        def apk = file("$buildDir/outputs/apk/debug/app-debug.apk")
        if (!apk.isFile()) {
            throw new GradleException('Debug APK is missing while verifying MIT license')
        }
        def zip = new java.util.zip.ZipFile(apk)
        try {
            def entry = zip.getEntry('assets/LICENSE')
            if (entry == null || entry.size <= 0) {
                throw new GradleException('Android APK is missing assets/LICENSE')
            }
            def provenanceEntry = zip.getEntry('assets/ROUTER-VPN-SOURCE.json')
            if (provenanceEntry == null || provenanceEntry.size <= 0) {
                throw new GradleException('Android APK is missing assets/ROUTER-VPN-SOURCE.json')
            }
            def provenance = new groovy.json.JsonSlurper().parse(zip.getInputStream(provenanceEntry))
            if (provenance.artifact_family != 'android-apk' || provenance.repository != (System.getenv('GITHUB_REPOSITORY') ?: 'Eabusham2/router-vpn')) {
                throw new GradleException('Android APK source provenance family/repository mismatch')
            }
            def expectedSha = (System.getenv('GITHUB_SHA') ?: '').trim().toLowerCase()
            if (expectedSha ==~ /[0-9a-f]{40}/) {
                if (provenance.source_sha != expectedSha) {
                    throw new GradleException("Android APK source provenance mismatch: " + provenance.source_sha + " != " + expectedSha)
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.matching { it.name == 'assembleDebug' }.configureEach {
    finalizedBy tasks.named('verifyDebugProjectLicense')
}

tasks.register('verifyDebugNativeTor', Exec) {
    dependsOn 'packageDebug'
    workingDir rootProject.projectDir
    commandLine 'python3', '../deploy/verify-mobile-tor-link.py', '--native-package',
        nativeTorPackage.absolutePath, '--android-apk', file("$buildDir/outputs/apk/debug/app-debug.apk").absolutePath
}

tasks.matching { it.name == 'assembleDebug' }.configureEach {
    finalizedBy tasks.named('verifyDebugNativeTor')
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    // Built from the exact official AmneziaWG Android 2.0.0 source commit by
    // android/build-awg-tunnel.sh. No moving JitPack/Maven coordinate is used.
    implementation files('libs/amneziawg-tunnel.aar')
    // One pinned gomobile runtime built by android/build-sing-box-libbox.sh:
    // sing-box v1.14.1 at 1ac1a339cb1223e9c70eae14c44411c75033c02d
    // plus libXray at 294fb37343205b9b0cb7b7b1b423d3d4b60d9998, whose
    // go.mod pins Xray-core v26.7.11 (50231eaff98c). Keeping both engines in
    // the same libbox AAR avoids duplicate go.Seq/libgojni runtimes in one APK.
    implementation files('libs/libbox.aar')
}
