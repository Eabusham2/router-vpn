plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eabusham.routervpn'
    compileSdk 36

    defaultConfig {
        applicationId 'com.eabusham.routervpn'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

def awgAar = file('libs/amneziawg-tunnel.aar')
def libboxAar = file('libs/libbox.aar')
def libxrayAar = file('libs/libxray.aar')

tasks.register('prepareAmneziaWgTunnel', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'build-awg-tunnel.sh'
    outputs.file awgAar
}

tasks.register('prepareSingBoxLibbox', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'build-sing-box-libbox.sh'
    outputs.file libboxAar
}

tasks.register('prepareXrayLibXray', Exec) {
    workingDir rootProject.projectDir
    commandLine 'bash', 'build-xray-libxray.sh'
    outputs.file libxrayAar
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareAmneziaWgTunnel')
    dependsOn tasks.named('prepareSingBoxLibbox')
    dependsOn tasks.named('prepareXrayLibXray')
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.wireguard.android:tunnel:1.0.20260102'
    // Built from the exact official AmneziaWG Android 2.0.0 source commit by
    // android/build-awg-tunnel.sh. No moving JitPack/Maven coordinate is used.
    implementation files('libs/amneziawg-tunnel.aar')
    // Built from official sing-box v1.13.12 commit
    // 1086ab2563320e0da0c23b3a491d8dfa0939dff4 by the upstream libbox mobile
    // build command. This gives Router VPN a real embedded Android TUN engine
    // without depending on a moving third-party AAR repository.
    implementation files('libs/libbox.aar')
    // Built from official XTLS/libXray commit
    // 294fb37343205b9b0cb7b7b1b423d3d4b60d9998, whose go.mod pins Xray-core
    // v26.7.11 at 50231eaff98c. The build script also pins gomobile.
    implementation files('libs/libxray.aar')
}
