name: Installed Unix Naive H2 native host acceptance

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: unix-naive-h2-host-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  host:
    name: Actual retained Naive H2 host on ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # This independent phase adds48 Linux or36 Darwin cases. Each keeps the
    # existing installed-host operation and per-case deadlines. Existing
    # native phases, case inventories and their aggregate budgets are unchanged.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Install real Linux namespace and native build tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git iproute2 nftables util-linux uidmap sudo passwd
          test -c /dev/net/tun
      - name: Require exact original inventory, verdicts and release dependency
        run: python3 deploy/test_unix_naive_h2_host_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-native-runtime-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/naive-h2-host-bundle
      - name: Verify complete exact-source native bundle
        run: python3 deploy/native-runtime-bundle.py extract '${{ matrix.os }}/${{ matrix.arch }}' "$RUNNER_TEMP/naive-h2-host-bundle/native-${{ matrix.os }}-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/naive-h2-host-verified"
      - name: Require actual H2, selected DNS, protection, MTU, restoration and retirement
        timeout-minutes: 110
        env:
          ROUTERVPN_UNIX_NAIVE_H2_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_NAIVE_HOST_RECEIPT: ${{ runner.temp }}/naive-h2-host-${{ matrix.os }}-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: python3 deploy/test_unix_naive_h2_host.py --bundle "$RUNNER_TEMP/naive-h2-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_NAIVE_HOST_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Naive-H2-native-host-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/naive-h2-host-${{ matrix.os }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
