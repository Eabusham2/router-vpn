name: One-shot Linux settings reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-linux-settings-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace shipping include with warning-clean source and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test -s client/linux/routervpn-profile-settings-v2.inc
          cp client/linux/routervpn-profile-settings-v2.inc client/linux/routervpn-profile-settings-v1.inc
          rm -f .github/workflows/one-shot-linux-settings-reconcile.yml
          cat > deploy/linux-settings-reconcile-v2.complete <<'EOF'
          routervpn-profile-settings-v1.inc is byte-for-byte reconciled from warning-clean v2 source.
          The shipping build continues to reference v1 so package paths do not fork.
          EOF
          cmp client/linux/routervpn-profile-settings-v1.inc client/linux/routervpn-profile-settings-v2.inc
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/linux/routervpn-profile-settings-v1.inc deploy/linux-settings-reconcile-v2.complete .github/workflows/one-shot-linux-settings-reconcile.yml
          git commit -m "Make shipping Linux settings include warning-clean"
          git push origin HEAD:main
