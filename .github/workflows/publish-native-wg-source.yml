name: Verify native WireGuard source publication
on:
  push:
    paths:
      - '.github/workflows/publish-native-wg-source.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-native-wg-source
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android JSON implementation for executable graph tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Verify source transfer, execute regressions and publish immutable objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, tempfile, time, urllib.error, urllib.request
          root=pathlib.Path.cwd()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-wg-source-verification'
          out.mkdir(exist_ok=True)
          api_root='https://api.github.com/repos/Eabusham2/router-vpn/'
          base=os.environ['GITHUB_SHA']
          expected_tree='97542d11b9de785fe5e8fedf0508bfef9f381ae5'
          expected_base_tree='d09e67eaa8f3fe56da359bb5083d471d9018b319'
          parts='98bfa3f25193bef1fd8d4cb96351d15c7116a1b4 74bd8936ff72414e27ca1b038c48a23dbb54de6c fbcab28a92fd1c42ba6a0a012393c803cee4fa89 fafe7646423b7cbbd14a98af21834ee467db9805 62b78626fbe092dbe8f08e4f93d2d33f9cbaa321 0c36c935f5a1086af93f98f3746522927ce979f0'.split()
          def git(*args):
              return subprocess.check_output(['git',*args])
          def api(path,data=None):
              body=None if data is None else json.dumps(data).encode()
              for attempt in range(4):
                  request=urllib.request.Request(api_root+path,data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
                  try:
                      with urllib.request.urlopen(request,timeout=40) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504) or attempt==3:raise
                      time.sleep(2**attempt)
          def blobsha(raw):
              return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          def blob(sha):
              response=api('git/blobs/'+sha)
              assert response['encoding']=='base64'
              raw=base64.b64decode(response['content'])
              assert blobsha(raw)==sha,'source object integrity failure'
              return raw
          assert git('status','--porcelain').strip()==b''
          assert api('git/ref/heads/main')['object']['sha']==base,'main advanced; reconcile first'
          bootstrap_tree=api('git/commits/'+base)['tree']['sha']
          git('rm','.github/workflows/publish-native-wg-source.yml')
          assert git('write-tree').decode().strip()==expected_base_tree,'unexpected source base'
          encoded=b''.join(blob(sha) for sha in parts)
          assert len(encoded)==30284
          compressed=base64.b64decode(encoded,validate=True)
          assert len(compressed)==22712 and blobsha(compressed)=='bbba20db83d245bf5c1ca83c32d1d4abc3f3bd37'
          patch=lzma.decompress(compressed,memlimit=512*1024*1024)
          assert len(patch)==90934
          assert hashlib.sha256(patch).hexdigest()=='805e9284c5afc0382b2ed6d6d55d7e02aefa347baa770a87f526e9bae184b5d6'
          with tempfile.TemporaryDirectory() as directory:
              path=pathlib.Path(directory)/'native-source.patch';path.write_bytes(patch)
              git('apply','--check','--unidiff-zero','--index',str(path))
              git('apply','--unidiff-zero','--index',str(path))
          assert git('write-tree').decode().strip()==expected_tree,'reconstructed source tree differs'
          checks=[
              ['go','test','-race','-count=1','-timeout=240s','./...'],
              ['go','vet','./...'],
              ['python3','android/test_android_multihop_graph.py'],
              ['python3','android/test_android_multihop_contract.py'],
              ['python3','android/test_android_layered_service_compile.py'],
              ['python3','modes/test_runtime_pid_registration.py'],
              ['python3','modes/test_stop_mode_pid_ownership.py'],
              ['python3','modes/test_runtime_pids.py'],
              ['python3','deploy/test_bundled_xray.py'],
              ['python3','deploy/full-audit-v4.py'],
              ['python3','deploy/workflow-structure-audit.py'],
              ['python3','deploy/validate-repo.py'],
          ]
          for number,command in enumerate(checks):
              logfile=out/('check-'+str(number)+'.log')
              with logfile.open('w') as log:
                  result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,timeout=900)
              print(('PASS ' if result.returncode==0 else 'FAIL ')+' '.join(command),flush=True)
              if result.returncode:
                  print(logfile.read_text(errors='replace')[-16000:],flush=True)
                  raise SystemExit(result.returncode)
          assert git('diff','--name-only').strip()==b''
          assert git('ls-files','--others','--exclude-standard').strip()==b''
          assert git('write-tree').decode().strip()==expected_tree
          assert api('git/ref/heads/main')['object']['sha']==base,'main advanced during verification'
          entries=[]
          for row in git('diff','--cached','--name-status','--no-renames').decode().splitlines():
              status,path=row.split('\t',1)
              if status=='D':
                  assert path=='.github/workflows/publish-native-wg-source.yml'
                  entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
                  continue
              mode,sha,_=git('ls-files','--stage','--',path).decode().split('\t')[0].split()
              raw=git('cat-file','blob',sha)
              result=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert result['sha']==sha,'published source blob differs'
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
          assert len(entries)==24
          tree=api('git/trees',{'base_tree':bootstrap_tree,'tree':entries})
          assert tree['sha']==expected_tree,'published tree differs from tested source'
          result={'base':base,'tree':tree['sha'],'entries':entries,'checks':[' '.join(c) for c in checks],'ref_updated':False}
          (out/'source-objects.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result),flush=True)
          print('Source tests and immutable objects verified. This job did not update a branch or create a commit.',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-vpn-native-wg-source-verification
          path: ${{ runner.temp }}/native-wg-source-verification/
          if-no-files-found: error
          retention-days: 1
