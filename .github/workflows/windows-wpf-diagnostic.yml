name: Windows WPF diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wpf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize native WPF source for Windows PowerShell 5.1
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path('client/RouterVPN-Windows-App.ps1')
          s=p.read_text(encoding='utf-8')
          replacements={
              '→':'->','—':'-','–':'-','•':'-','…':'...',
              '’':"'",'‘':"'",'“':'"','”':'"',' ':' '
          }
          for old,new in replacements.items(): s=s.replace(old,new)
          unknown=sorted({c for c in s if ord(c)>127})
          if unknown: raise SystemExit('unmapped non-ASCII characters in Windows PowerShell source: '+repr(unknown))
          p.write_text(s,encoding='utf-8',newline='\n')
          '@ | python -
      - name: Parse and self-test native WPF app under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/RouterVPN-Windows-App.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){ throw "Windows PowerShell 5.1 WPF self-test failed with exit code $LASTEXITCODE" }
      - name: Commit compatibility repair if needed
        shell: pwsh
        run: |
          if(git status --porcelain -- client/RouterVPN-Windows-App.ps1){
            git config user.name 'router-vpn-ci'
            git config user.email 'actions@users.noreply.github.com'
            git add client/RouterVPN-Windows-App.ps1
            git commit -m 'Make Windows onboarding PowerShell 5.1 safe'
            git push origin HEAD:main
          }
