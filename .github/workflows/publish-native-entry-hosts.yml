              assert blob['sha']==sha
              entries.append({'path':name,'type':'blob','mode':mode,'sha':sha})
          entries.append({'path':'.github/workflows/publish-native-entry-hosts.yml','mode':'100644','type':'blob','sha':None})
          base=api('git/commits/'+parent)
          tree=api('git/trees',{'base_tree':base['tree']['sha'],'tree':entries});assert tree['sha']==TREE
