name: Windows native Node process acceptance

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-node-process-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  image:
    name: Compile the original Windows Node process race fixture
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '1'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact native process gate inputs and result boundaries
        shell: pwsh
        run: |
          python deploy/test_windows_node_process_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Node process gate lost its source or result boundary' }
      - name: Validate the original baseline inventory and receipt boundaries
        shell: pwsh
        run: |
          python deploy/test_windows_node_process_phases.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Node baseline partition contract failed' }
      - name: Pinned compiler for the retained Node process race checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-node-process-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned Windows Node process compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned Windows Node process C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compile and capture the single Windows native baseline image
        timeout-minutes: 20
        shell: pwsh
        run: python deploy/windows_node_process_phases.py image --output "${{ runner.temp }}/node-process-image"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-node-process-image-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/node-process-image/node-process.test.exe
            ${{ runner.temp }}/node-process-image/image.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  baseline:
    name: Windows Node process baseline (${{ matrix.group }})
    needs: image
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '1'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [native-early-shared, late-shared, ordered, latency, product]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned compiler for the retained Node process race checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-node-process-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned Windows Node process compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned Windows Node process C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/download-artifact@v4
        with:
          name: windows-node-process-image-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/node-process-image
      - name: Execute every original group assigned to this native shard
        timeout-minutes: 20
        shell: pwsh
        run: python deploy/windows_node_process_phases.py run --group '${{ matrix.group }}' --image "${{ runner.temp }}/node-process-image" --output "${{ runner.temp }}/node-process-phase"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-node-process-baseline-${{ matrix.group }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/node-process-phase/phase.json
            ${{ runner.temp }}/node-process-phase/native.log
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  controls:
    name: Windows Node process control (${{ matrix.suite }})
    runs-on: windows-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '1'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [ownership-controls-1, ownership-controls-2, prospective-all]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact native process gate inputs and result boundaries
        shell: pwsh
        run: |
          python deploy/test_windows_node_process_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Node process gate lost its source or result boundary' }
      - name: Pinned compiler for the retained Node process race checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-node-process-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned Windows Node process compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned Windows Node process C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Execute required native Node suite
        timeout-minutes: 20
        shell: pwsh
        run: |
          python deploy/test_windows_node_process.py --suite '${{ matrix.suite }}'
          if ($LASTEXITCODE -ne 0) { throw 'Actual retained Windows Node process gate failed' }

  required:
    name: Verify every original Windows Node group and control
    needs: [image, baseline, controls]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-node-process-image-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/node-process-image
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-node-process-baseline-*-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/node-process-receipts
          merge-multiple: false
      - name: Verify the original image and complete disjoint native verdicts
        env:
          NATIVE_REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: python deploy/windows_node_process_phases.py aggregate --image "${{ runner.temp }}/node-process-image" --receipts "${{ runner.temp }}/node-process-receipts" --output "${{ runner.temp }}/node-process-accepted"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-node-process-accepted-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/node-process-accepted/accepted.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
