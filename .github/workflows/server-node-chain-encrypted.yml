name: Ordered Server encrypted suffix acceptance

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'mobile/server_chain/**'
      - 'mobile/server_chain_acceptance/**'
      - 'mobile/desktop/**'
      - 'internal/mobilemultihop/**'
      - 'internal/multihoprelay/**'
      - 'internal/awgpolicy/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/server-node-chain-encrypted.yml'
  pull_request:
    paths:
      - 'mobile/server_chain/**'
      - 'mobile/server_chain_acceptance/**'
      - 'mobile/desktop/**'
      - 'internal/mobilemultihop/**'
      - 'internal/multihoprelay/**'
      - 'internal/awgpolicy/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/server-node-chain-encrypted.yml'

permissions:
  contents: read

concurrency:
  group: server-node-chain-encrypted-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  encrypted:
    name: Actual WG/AWG and SS2022 Server on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install actual namespace and native compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git iproute2 util-linux sudo
      - name: Require exact verdict, source, cleanup and platform inventory
        run: python3 deploy/test_server_node_chain_encrypted_runner.py
      - name: Require actual encrypted suffix, selected DNS, UoT and joined Stop
        timeout-minutes: 45
        env:
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_SERVER_RECEIPT: ${{ runner.temp }}/server-node-chain-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_server_node_chain_encrypted.py --standalone --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_SERVER_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Server-encrypted-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/server-node-chain-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
