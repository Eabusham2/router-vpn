name: Ordered Server encrypted suffix acceptance

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'mobile/server_chain/**'
      - 'mobile/server_chain_acceptance/**'
      - 'mobile/chain/**'
      - 'mobile/desktop/**'
      - 'internal/mobilemultihop/**'
      - 'internal/multihoprelay/**'
      - 'internal/awgpolicy/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/server-node-chain-encrypted.yml'

permissions:
  contents: read

concurrency:
  # Coalesce only direct main pushes; preserve active native and exact caller runs.
  group: server-node-chain-encrypted-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Ordered Server encrypted suffix acceptance' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  encrypted:
    name: Actual WG/AWG, CONNECT and SS2022 Server on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install actual namespace and native compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git iproute2 util-linux sudo
      - name: Require exact verdict, source, cleanup and platform inventory
        run: python3 deploy/test_server_node_chain_encrypted_runner.py
      - name: Require CONNECT verdict, source, authentication and cleanup inventory
        run: python3 deploy/test_server_node_chain_connect_encrypted_runner.py
      # The currently failing independent suffix runs first so its original
      # proof counters are available promptly. Both native gates stay required.
      - name: Require actual HTTP and HTTPS CONNECT suffix and selected-path DNS
        timeout-minutes: 45
        env:
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_CONNECT_SERVER_RECEIPT: ${{ runner.temp }}/server-connect-node-chain-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_server_node_chain_connect_encrypted.py --standalone --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_CONNECT_SERVER_RECEIPT"
      - name: Require original candidate agent and terminal cleanup
        timeout-minutes: 10
        run: |
          python3 deploy/test_server_node_chain_candidate_worker_runner.py
          python3 deploy/test_server_node_chain_candidate_worker.py --phase agent --output "${{ runner.temp }}/server-candidate-agent-${{ matrix.arch }}"
          python3 deploy/test_server_node_chain_candidate_worker.py --phase terminal-control --output "${{ runner.temp }}/server-candidate-terminal-${{ matrix.arch }}"
      - name: Require actual encrypted suffix, selected DNS, UoT and joined Stop
        timeout-minutes: 45
        env:
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_SERVER_RECEIPT: ${{ runner.temp }}/server-node-chain-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_server_node_chain_encrypted.py --standalone --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_SERVER_RECEIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RouterVPN-Server-encrypted-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/server-node-chain-${{ matrix.arch }}.json
            ${{ runner.temp }}/server-connect-node-chain-${{ matrix.arch }}.json
            ${{ runner.temp }}/server-candidate-agent-${{ matrix.arch }}/
            ${{ runner.temp }}/server-candidate-terminal-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14

  openvpn-direct:
    name: Require actual zero-prefix OpenVPN Server suffix
    uses: ./.github/workflows/server-openvpn-direct-encrypted.yml

  hysteria-final:
    name: Require actual Hysteria2 Server final
    uses: ./.github/workflows/server-hysteria-encrypted.yml
