name: Product reconciliation patch v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/product-reconciliation-patch-v3.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run corrected reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/product-reconciliation-patch-v2.yml').read_text().splitlines()
          start=next(i for i,x in enumerate(src) if x.strip()=='run: |')+1
          body='\n'.join((x[10:] if x.startswith('          ') else x) for x in src[start:])+'\n'
          old="for ident in (\"wireguard\",\"amneziawg2\",\"shadowsocks\",\"hysteria2\",\"overtls\",\"shadowsocksr\",\"socks5\"):\\n    m=re.search(r'\"'+re.escape(ident)+r'\".*?\\\\)\\\\)',s,re.S); assert m and \"simple=True\" in m.group(0),ident\\n"
          new="for ident in (\"wireguard\",\"amneziawg2\",\"shadowsocks\",\"hysteria2\",\"overtls\",\"shadowsocksr\",\"socks5\"):\\n    start=s.index('\\\"'+ident+'\\\"')\\n    end=min([x for x in [s.find('methods.append(asset(',start+1),s.find('methods += [',start+1),s.find('return methods',start+1)] if x!=-1])\\n    assert \"simple=True\" in s[start:end],ident\\n"
          if old not in body:
              raise SystemExit('expected brittle test fragment not found')
          body=body.replace(old,new,1)
          body=body.replace("git rm -f .github/workflows/product-reconciliation-patch.yml .github/workflows/product-reconciliation-patch-v2.yml","git rm -f .github/workflows/product-reconciliation-patch.yml .github/workflows/product-reconciliation-patch-v2.yml .github/workflows/product-reconciliation-patch-v3.yml",1)
          Path('/tmp/reconcile.sh').write_text(body)
          PY
          bash -n /tmp/reconcile.sh
          bash /tmp/reconcile.sh
