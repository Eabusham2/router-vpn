name: Kill switch contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-kill-switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit contract
        run: python3 modes/test_kill_switch.py
      - name: Syntax
        run: |
          python3 -m py_compile modes/kill-switch.py modes/mtu-policy.py
          bash -n modes/stop-mode.sh
          bash -n client/install-linux.sh
      - name: Fail-closed integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          mtu=Path('modes/mtu-policy.py').read_text()
          stop=Path('modes/stop-mode.sh').read_text()
          ks=Path('modes/kill-switch.py').read_text()
          assert 'with_name("kill-switch.py")' in mtu
          assert '[sys.executable, str(helper), "apply"]' in mtu
          assert 'kill-switch.py' in stop and 'release' in stop
          assert 'policy drop' in ks
          assert 'nft' in ks and '"-c"' in ks and '"-f"' in ks
          assert 'action == "reassert"' in ks
          print('Linux kill-switch fail-closed integration markers: OK')
          PY
      - name: Persistent always boot contract
        run: |
          grep -q 'nftables' client/install-linux.sh
          grep -q 'Before=network-pre.target' client/install-linux.sh
          grep -q 'RequiredBy=network-pre.target' client/install-linux.sh
          grep -q 'kill-switch.py reassert' client/install-linux.sh
          grep -q 'router-vpn-killswitch-recovery' client/install-linux.sh
          grep -q 'kill-switch.py.*force-off' client/install-linux.sh
