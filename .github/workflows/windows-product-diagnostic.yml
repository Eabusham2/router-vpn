name: Windows product diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-self-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Windows PowerShell 5.1 product self-test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/RouterVPN-Windows-App.ps1 -SelfTest
          if($LASTEXITCODE -ne 0){ throw "Native Windows product self-test failed with exit code $LASTEXITCODE" }
      - name: Build generic Windows packages
        shell: bash
        run: |
          ./deploy/build-client.sh
          ./deploy/package-builds.sh
      - name: Portable amd64 direct self-test with visible output
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=(Resolve-Path 'dist/packages/RouterVPN-Portable-Windows-amd64.zip').Path
          $extract=Join-Path $env:RUNNER_TEMP 'portable-direct-amd64'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive $extract -Force
          $root=Get-ChildItem $extract -Directory | Select-Object -First 1
          $exe=Join-Path $root.FullName 'RouterVPNPortable.exe'
          & $exe --self-test
          if($LASTEXITCODE -ne 0){ throw "Portable direct self-test failed with exit code $LASTEXITCODE" }
          $movedParent=Join-Path $env:RUNNER_TEMP 'portable-direct-moved-amd64'
          Remove-Item $movedParent -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $movedParent | Out-Null
          $moved=Join-Path $movedParent $root.Name
          Move-Item $root.FullName $moved
          & (Join-Path $moved 'RouterVPNPortable.exe') --self-test
          if($LASTEXITCODE -ne 0){ throw "Relocated Portable direct self-test failed with exit code $LASTEXITCODE" }
