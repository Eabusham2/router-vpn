name: Build all Router VPN release gates

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  statuses: write

jobs:
  source-snapshot:
    name: Exact-SHA source snapshot
    uses: ./.github/workflows/source-snapshot.yml
    secrets: inherit

  release-candidate:
    name: Authoritative one-SHA native release matrix
    uses: ./.github/workflows/release-candidate.yml
    secrets: inherit

  portainer-preflight:
    name: Authoritative ARM64 Portainer preflight
    uses: ./.github/workflows/arm64-portainer-preflight.yml
    secrets: inherit

  publish-arm64-images:
    name: Publish exact-SHA ARM64 server images
    needs: [source-snapshot, release-candidate, portainer-preflight]
    uses: ./.github/workflows/publish-arm64-images.yml
    secrets: inherit

  production-compose:
    name: Materialize verified exact-SHA production compose
    needs: [publish-arm64-images]
    uses: ./.github/workflows/production-release-compose.yml
    secrets: inherit
