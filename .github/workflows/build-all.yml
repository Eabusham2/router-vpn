name: Build all platforms

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup-merged-branch:
    name: Keep only main branch
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete every non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
            --jq '.[].name' | while IFS= read -r branch; do
              [ "$branch" = main ] && continue
              encoded=$(python3 - "$branch" <<'PY'
import sys, urllib.parse
print(urllib.parse.quote(sys.argv[1], safe=''))
PY
              )
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded"
              echo "Deleted non-main branch: $branch"
            done

  project-package:
    name: All-in-one router-vpn.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Build all-in-one project ZIP
        run: |
          chmod +x release-make-zip.sh deploy/build-client.sh deploy/package-builds.sh
          ./release-make-zip.sh /tmp/router-vpn.zip
          unzip -tq /tmp/router-vpn.zip >/dev/null
          sha256sum -c /tmp/router-vpn.zip.sha256
          mkdir -p dist/release
          cp /tmp/router-vpn.zip /tmp/router-vpn.zip.sha256 dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-project-package
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30

  desktop-unix:
    name: Desktop, Unix, and router validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate source, catalog, scripts, and compose
        env:
          ENDPOINT: 203.0.113.10
          ADGUARD4: 192.168.50.133
        run: |
          go test ./...
          python3 deploy/validate-repo.py
          python3 -m json.tool configs/client/modes.json >/dev/null
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile
          find modes server client deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          docker compose -f server/portainer-compose.yaml config >/dev/null
          docker compose -f server/compose.yaml config >/dev/null
      - name: Build router images
        run: |
          docker build -f server/init/Dockerfile -t router-vpn-ci-init .
          docker build -f deploy/router-agent.Dockerfile -t router-vpn-ci-agent .
          docker build -f server/wireguard/Dockerfile -t router-vpn-ci-wireguard .
          docker build -f server/awg2/Dockerfile -t router-vpn-ci-awg2 .
          docker build -f server/rosenpass/Dockerfile -t router-vpn-ci-rosenpass .
          docker build -f server/naive/Dockerfile -t router-vpn-ci-naive .
          docker build -f server/ss-v2ray/Dockerfile -t router-vpn-ci-ss-v2ray .
      - name: Build all Go targets
        run: |
          chmod +x deploy/build-client.sh deploy/package-builds.sh
          ./deploy/build-client.sh
      - name: Package archives and PortableApps layouts
        run: ./deploy/package-builds.sh
      - name: Verify desktop and Unix packages
        run: |
          test -f dist/packages/RouterVPN-Windows-amd64.zip
          test -f dist/packages/RouterVPN-Windows-arm64.zip
          test -f dist/packages/RouterVPNPortable-amd64.zip
          test -f dist/packages/RouterVPNPortable-arm64.zip
          test -f dist/packages/RouterVPN-darwin-amd64.tar.gz
          test -f dist/packages/RouterVPN-darwin-arm64.tar.gz
          test -f dist/packages/RouterVPN-linux-amd64.tar.gz
          test -f dist/packages/RouterVPN-linux-arm64.tar.gz
          (
            cd dist/packages
            sha256sum -c SHA256SUMS
            for archive in ./*.zip; do unzip -tq "$archive" >/dev/null; done
            for archive in ./*.tar.gz; do tar -tzf "$archive" >/dev/null; done
          )
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-desktop-unix
          path: |
            dist/packages/*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Collect and verify APK
        run: |
          mkdir -p dist/mobile
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/mobile/RouterVPN-android-debug.apk
          unzip -tq dist/mobile/RouterVPN-android-debug.apk >/dev/null
          sha256sum dist/mobile/RouterVPN-android-debug.apk > dist/mobile/RouterVPN-android-debug.apk.sha256
          sha256sum -c dist/mobile/RouterVPN-android-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Android-APK
          path: dist/mobile/*
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS IPA
    runs-on: macos-15
    env:
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
      IOS_TUNNEL_PROFILE_BASE64: ${{ secrets.IOS_TUNNEL_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios/RouterVPN
        run: xcodegen generate
      - name: Build unsigned device app
        working-directory: ios/RouterVPN
        run: |
          xcodebuild \
            -project RouterVPN.xcodeproj \
            -scheme RouterVPN \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM='' \
            build
      - name: Package and verify unsigned re-signable IPA
        working-directory: ios/RouterVPN
        run: |
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/RouterVPN.app"
          test -d "$APP"
          test -d "$APP/PlugIns/RouterVPNPacketTunnel.appex"
          rm -rf build/unsigned
          mkdir -p build/unsigned/Payload
          ditto "$APP" build/unsigned/Payload/RouterVPN.app
          (
            cd build/unsigned
            zip -qry ../RouterVPN-unsigned-resignable.ipa Payload
          )
          unzip -tq build/RouterVPN-unsigned-resignable.ipa >/dev/null
          unzip -l build/RouterVPN-unsigned-resignable.ipa | grep -q 'Payload/RouterVPN.app/PlugIns/RouterVPNPacketTunnel.appex/'
          shasum -a 256 build/RouterVPN-unsigned-resignable.ipa > build/RouterVPN-unsigned-resignable.ipa.sha256
          shasum -a 256 -c build/RouterVPN-unsigned-resignable.ipa.sha256
      - name: Import Apple signing assets
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_APP_PROFILE_BASE64 != '' && env.IOS_TUNNEL_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path('/tmp/router-vpn-cert.p12').write_bytes(base64.b64decode(os.environ['IOS_CERTIFICATE_BASE64']))
          profiles = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          profiles.mkdir(parents=True, exist_ok=True)
          (profiles / 'router-vpn-app.mobileprovision').write_bytes(base64.b64decode(os.environ['IOS_APP_PROFILE_BASE64']))
          (profiles / 'router-vpn-tunnel.mobileprovision').write_bytes(base64.b64decode(os.environ['IOS_TUNNEL_PROFILE_BASE64']))
          PY
          security create-keychain -p actions /tmp/router-vpn.keychain
          security default-keychain -s /tmp/router-vpn.keychain
          security unlock-keychain -p actions /tmp/router-vpn.keychain
          security set-keychain-settings -lut 21600 /tmp/router-vpn.keychain
          security import /tmp/router-vpn-cert.p12 \
            -k /tmp/router-vpn.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions /tmp/router-vpn.keychain
      - name: Archive signed app
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_APP_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' && env.IOS_TUNNEL_PROFILE_BASE64 != '' }}
        working-directory: ios/RouterVPN
        run: |
          xcodebuild \
            -project RouterVPN.xcodeproj \
            -scheme RouterVPN \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/RouterVPN.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive
      - name: Export and verify signed IPA
        if: ${{ env.IOS_CERTIFICATE_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_APP_PROFILE_BASE64 != '' && env.IOS_TUNNEL_PROFILE_BASE64 != '' && env.APPLE_TEAM_ID != '' }}
        working-directory: ios/RouterVPN
        run: |
          rm -rf build/signed
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/RouterVPN.xcarchive" \
            -exportPath "$PWD/build/signed" \
            -exportOptionsPlist ../ExportOptions.plist
          ipa=$(find build/signed -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          cp "$ipa" build/RouterVPN-signed.ipa
          unzip -tq build/RouterVPN-signed.ipa >/dev/null
          shasum -a 256 build/RouterVPN-signed.ipa > build/RouterVPN-signed.ipa.sha256
          shasum -a 256 -c build/RouterVPN-signed.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-iOS-IPA
          path: |
            ios/RouterVPN/build/RouterVPN-unsigned-resignable.ipa
            ios/RouterVPN/build/RouterVPN-unsigned-resignable.ipa.sha256
            ios/RouterVPN/build/RouterVPN-signed.ipa
            ios/RouterVPN/build/RouterVPN-signed.ipa.sha256
            ios/RouterVPN/build/RouterVPN.xcarchive
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: All-platform release bundle
    runs-on: ubuntu-latest
    needs: [project-package, desktop-unix, android, ios]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-platforms
      - name: Build aggregate checksum and archives
        run: |
          find all-platforms -type f -print0 | sort -z | xargs -0 sha256sum > all-platforms/SHA256SUMS
          zip -qr RouterVPN-all-platforms.zip all-platforms
          unzip -tq RouterVPN-all-platforms.zip >/dev/null
          tar -czf RouterVPN-all-platforms.tar.gz all-platforms
          tar -tzf RouterVPN-all-platforms.tar.gz >/dev/null
          sha256sum RouterVPN-all-platforms.zip RouterVPN-all-platforms.tar.gz > RouterVPN-all-platforms.SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-all-platforms
          path: |
            RouterVPN-all-platforms.zip
            RouterVPN-all-platforms.tar.gz
            RouterVPN-all-platforms.SHA256SUMS
            all-platforms/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
