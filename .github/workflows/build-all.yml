name: Router VPN Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  statuses: write
  actions: read

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require successful CI for this exact source (do not rerun CI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&per_page=100" > "$RUNNER_TEMP/ci.json"
          python3 - "$RUNNER_TEMP/ci.json" <<'PY'
          import json, sys
          runs = json.load(open(sys.argv[1]))["workflow_runs"]
          assert any(r["status"] == "completed" and r["conclusion"] == "success" for r in runs), "Run CI successfully on this commit before releasing"
          PY
      - name: Archive exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/router-vpn-source-${GITHUB_SHA}.tar.gz"
          members="$RUNNER_TEMP/router-vpn-source-${GITHUB_SHA}.members.txt"
          manifest="$RUNNER_TEMP/router-vpn-source-${GITHUB_SHA}.json"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --is-shallow-repository)" = false
          git archive --format=tar.gz --prefix="router-vpn-${GITHUB_SHA}/" -o "$archive" HEAD
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          android_version_code="$(( $(git rev-list --count HEAD) + 1 ))"
          python3 - "$manifest" "$GITHUB_SHA" "$tree_sha" "$GITHUB_REPOSITORY" "$android_version_code" <<'PY'
          import json, pathlib, re, sys
          path, commit, tree, repo, android_code = sys.argv[1:]
          if not re.fullmatch(r"[0-9a-f]{40}", commit) or not re.fullmatch(r"[0-9a-f]{40}", tree):
              raise SystemExit("invalid exact source snapshot identity")
          if not 2 <= int(android_code) <= 2100000000:
              raise SystemExit("Android version code exceeds its supported range")
          pathlib.Path(path).write_text(json.dumps({
              "schema_version": 1,
              "repository": repo,
              "source_sha": commit,
              "tree_sha": tree,
              "artifact_family": "exact-source-snapshot",
              "android_version_code": int(android_code),
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          (cd "$RUNNER_TEMP" && sha256sum -c "$(basename "$archive").sha256")
          tar -tzf "$archive" > "$members"
          test -s "$members"
          grep -Fxq "router-vpn-${GITHUB_SHA}/" "$members"
          head -n 5 "$members"
      - name: Upload exact source snapshot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: router-vpn-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/router-vpn-source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/router-vpn-source-${{ github.sha }}.tar.gz.sha256
            ${{ runner.temp }}/router-vpn-source-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish artifact pointer on exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          python3 - <<'PY' > "$RUNNER_TEMP/source-snapshot-status.json"
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "router-vpn/source-snapshot",
              "description": "artifact:" + os.environ["ARTIFACT_ID"],
              "target_url": os.environ["ARTIFACT_URL"],
          }))
          PY
          curl -fsS --retry 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"$RUNNER_TEMP/source-snapshot-status.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

  tor-windows:
    name: Pinned Windows Tor compile prerequisite
    needs: source-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends autoconf automake libtool make perl pkg-config
      - name: Compile the exact user-mode Tor helper and native C tests
        run: |
          python3 deploy/build-desktop-tor.py compile windows/amd64 dist/tor-compiled/windows-amd64 --work "$RUNNER_TEMP/tor-source-build" --cache "$RUNNER_TEMP/tor-source-cache" --compiler "$RUNNER_TEMP/tor-llvm-mingw" --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Tor-Windows-compile-${{ github.sha }}
          path: dist/tor-compiled/windows-amd64
          if-no-files-found: error
          retention-days: 3

  native-runtimes:
    name: Complete native engine ${{ matrix.target }}
    needs: tor-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux/amd64, slug: linux-amd64, runner: ubuntu-24.04}
          - {target: linux/arm64, slug: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: darwin/amd64, slug: darwin-amd64, runner: macos-15-intel}
          - {target: darwin/arm64, slug: darwin-arm64, runner: macos-15}
          - {target: windows/amd64, slug: windows-amd64, runner: windows-latest}
          - {target: windows/arm64, slug: windows-arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    # Linux retains its separate SOCKS/REALITY allowance. Windows adds the
    # bounded CONNECT14 stage after original prefix6/SOCKS8; inner limits remain.
    # Added schema6 native ceilings total 6,225s (103.75min); retain the prior
    # 200min Linux allocation plus 110min for these exact cases and validation.
    # Job 139481669110 exhausted the old hour in the shared controller checks,
    # before final protocol, package and host acceptance. Give both native Mac
    # builds the six-hour hosted job ceiling. Each child keeps its own deadline.
    timeout-minutes: ${{ startsWith(matrix.target, 'darwin/') && 360 || startsWith(matrix.target, 'linux/') && 310 || 220 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libclang-dev cmake ninja-build pkg-config libssl-dev autoconf automake libtool make perl nftables iproute2 passwd util-linux
      - name: Verify Linux protection after route loss
        if: runner.os == 'Linux'
        run: sudo env ROUTERVPN_NATIVE_KILLSWITCH=1 python3 modes/test_kill_switch.py
      - name: Install native macOS build libraries
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config openssl@3 autoconf automake libtool
      - name: Verify native macOS owned-socket PF lifecycle
        if: runner.os == 'macOS'
        timeout-minutes: 18
        env:
          ROUTERVPN_DARWIN_NATIVE_HOST_ACCEPTANCE: '1'
        run: python3 deploy/darwin-pf-abi.py --native-smoke --receipt "$RUNNER_TEMP/routervpn-native-pf.json"
      - name: Save native macOS PF component evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-native-PF-${{ matrix.slug }}-${{ github.sha }}
          path: ${{ runner.temp }}/routervpn-native-pf.json
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare exact Rust and native C toolchains
        shell: bash
        run: python3 deploy/setup-desktop-native-toolchain.py '${{ matrix.target }}' "$RUNNER_TEMP/native-toolchain"
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: RouterVPN-Tor-Windows-compile-${{ github.sha }}
          path: dist/tor-compiled/windows-amd64
      - name: Compute complete source identity
        id: policy
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('native_build', 'deploy/build-native-runtime.py')
          build = importlib.util.module_from_spec(spec); spec.loader.exec_module(build)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256='+build.digest()+'\n')
          PY
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          key: complete-native-v1-${{ runner.os }}-${{ matrix.slug }}-${{ steps.policy.outputs.sha256 }}-${{ hashFiles('deploy/setup-desktop-native-toolchain.py', 'deploy/install-desktop-windows-toolchain.py') }}
          path: dist/native-runtime/${{ matrix.slug }}
      - uses: actions/cache@v4
        if: startsWith(matrix.target, 'linux/')
        with:
          key: pinned-dnssec-v1-${{ matrix.slug }}-${{ hashFiles('native/dnssec/sources.json', 'native/dnssec/validator.c', 'native/dnssec/validator.h', 'deploy/build-dnssec-validator.py', 'deploy/verify-dnssec-validator.py') }}
          path: dist/.dnssec-cache
      - name: Build and validate the complete native engine
        shell: bash
        run: |
          set -euo pipefail
          # macOS Bash 3.2 treats an empty array as unset under nounset.
          runtime_args=('${{ matrix.target }}' 'dist/native-runtime/${{ matrix.slug }}')
          if [[ '${{ matrix.target }}' == windows/* ]]; then
            runtime_args+=(--tor-compiled dist/tor-compiled/windows-amd64)
          fi
          # Native PF/system-keychain acceptance is explicit on disposable CI only.
          if [[ '${{ matrix.target }}' == darwin/* ]]; then
            export ROUTERVPN_DARWIN_NATIVE_HOST_ACCEPTANCE=1
          fi
          python3 deploy/build-native-runtime.py "${runtime_args[@]}"
          python3 deploy/native-runtime-bundle.py archive '${{ matrix.target }}' 'dist/native-runtime/${{ matrix.slug }}' 'dist/native-artifact/native-${{ matrix.slug }}.tar.gz'
      - uses: actions/cache/save@v4
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
          path: dist/native-runtime/${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-native-runtime-${{ matrix.slug }}-${{ github.sha }}
          path: dist/native-artifact/native-${{ matrix.slug }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  generic-builds:
    needs: native-runtimes
    name: Windows installed and Portable packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: ./.github/actions/go-windows-sockets
      - uses: actions/download-artifact@v4
        with:
          pattern: RouterVPN-native-runtime-windows-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifacts
          merge-multiple: true
      - name: Build and package Windows clients
        run: |
          chmod +x deploy/build-client.sh deploy/package-builds.sh
          ./deploy/build-client.sh --windows
          python3 deploy/native-runtime-bundle.py stage "$RUNNER_TEMP/native-runtime-artifacts" dist/native-runtime windows/amd64 windows/arm64
          ./deploy/package-builds.sh
          (cd dist/packages && sha256sum -c SHA256SUMS)
          bash deploy/scope-windows-release-candidate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-generic-release-candidate
          path: |
            dist/packages/*
          if-no-files-found: error
          retention-days: 1

  windows-native-smoke:
    name: Windows native + Portable ${{ matrix.arch }}
    needs: generic-builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: windows-latest}
          - {arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: ./.github/actions/go-windows-sockets
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify native Windows Tor host compatibility API
        shell: pwsh
        env: {ROUTER_VPN_REQUIRE_TOR_HELPERS: '1'}
        run: go test -v -run '^TestWindowsTor(ArchitecturePolicy|HostCompatibilityNative)$' ./cmd/client
      - uses: actions/download-artifact@v4
        with: {name: RouterVPN-generic-release-candidate, path: artifacts}
      - name: Smoke-test packaged Windows launchers
        shell: pwsh
        env:
          ROUTER_VPN_ARCH: '${{ matrix.arch }}'
          ROUTERVPN_CAPTURE_SELF_TEST_LAYOUT: '1'
        run: |
          $ErrorActionPreference='Stop'
          foreach($family in @('Windows','Portable-Windows')){
            $archive=(Get-ChildItem artifacts -Recurse -Filter "RouterVPN-$family-$env:ROUTER_VPN_ARCH.zip"|Select-Object -First 1).FullName
            if(-not $archive){throw "Missing $family package"}
            $extract=if($family -eq 'Windows'){Join-Path $env:RUNNER_TEMP "installed-$env:ROUTER_VPN_ARCH"}else{Join-Path $env:RUNNER_TEMP "smoke-portable-$env:ROUTER_VPN_ARCH"}
            Expand-Archive $archive $extract -Force
            $root=(Get-ChildItem -LiteralPath $extract -Directory|Select-Object -First 1).FullName
            $name=if($family -eq 'Windows'){'RouterVPN.exe'}else{'RouterVPNPortable.exe'}
            $dataRoot=if($family -eq 'Windows'){$root}else{Join-Path $root 'Data'}
            # Reproduce installer ACLs and keep Portable defaults inside the same private desktop boundary.
            $packageRoot=if($family -eq 'Windows'){$root}else{Join-Path $root 'App/RouterVPN'}
            $aclHelper=Join-Path $packageRoot 'client/Protect-RouterVPN-Windows-PrivateRoot.ps1'
            $aclItem=Get-Item -LiteralPath $aclHelper -Force
            if($aclItem.PSIsContainer-or($aclItem.Attributes-band[IO.FileAttributes]::ReparsePoint)-ne0){throw 'Packaged Windows private-root helper is not a regular file'}
            & $aclHelper -Root $root -TraceSetup | Out-Host
            $evidence=Join-Path $env:RUNNER_TEMP "routervpn-ui/$family"
            [void][IO.Directory]::CreateDirectory($evidence)
            $stdout=Join-Path $evidence 'launcher.stdout.log'
            $stderr=Join-Path $evidence 'launcher.stderr.log'
            $p=Start-Process -FilePath (Join-Path $root $name) -ArgumentList '--self-test' -WorkingDirectory $root -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
            $p.Refresh()
            $exitCode=$p.ExitCode
            Write-Host "Packaged $family self-test exit: $exitCode"
            if($null-eq$exitCode-or$exitCode-ne0){
              foreach($diagnostic in @($stdout,$stderr)){
                if(Test-Path -LiteralPath $diagnostic -PathType Leaf){
                  Write-Host ([IO.Path]::GetFileName($diagnostic))
                  Get-Content -LiteralPath $diagnostic -Tail 60 | ForEach-Object { if($_.Length-gt1024){$_.Substring(0,1024)}else{$_} }
                }
              }
              $report=Join-Path $dataRoot 'windows-self-test-error.json'
              if(Test-Path -LiteralPath $report -PathType Leaf){
                try{
                  $item=Get-Item -LiteralPath $report -Force
                  if($item.PSIsContainer-or($item.Attributes-band[IO.FileAttributes]::ReparsePoint)-ne0){throw 'Invalid self-test diagnostic receipt'}
                  $receiptStream=[IO.File]::Open($report,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::Read)
                  try{
                    if($receiptStream.Length-gt16384){throw 'Oversized self-test diagnostic receipt'}
                    $reader=[IO.StreamReader]::new($receiptStream,[Text.Encoding]::UTF8)
                    try{$text=$reader.ReadToEnd()}finally{$reader.Dispose()}
                  }finally{$receiptStream.Dispose()}
                  [IO.File]::WriteAllText((Join-Path $evidence 'windows-self-test-error.json'),$text,[Text.UTF8Encoding]::new($false))
                  Write-Host $text
                }catch{Write-Warning 'The private self-test diagnostic receipt was unavailable.'}
              }
              foreach($layout in @('windows-640x480.png','windows-1040x720.png')){
                $image=Join-Path $dataRoot $layout
                if(Test-Path -LiteralPath $image -PathType Leaf){Copy-Item -LiteralPath $image -Destination (Join-Path $evidence $layout)}
              }
              throw "Packaged $family self-test failed (exit $exitCode)"
            }
            foreach($layout in @('windows-640x480.png','windows-1040x720.png')){
              $image=Join-Path $dataRoot $layout
              $bytes=[IO.File]::ReadAllBytes($image)
              if($bytes.Length -lt 33 -or [BitConverter]::ToString($bytes,0,8) -cne '89-50-4E-47-0D-0A-1A-0A'){throw "Packaged $family omitted its rendered $layout"}
              [IO.File]::Move($image,(Join-Path $evidence $layout))
            }
          }
      - name: Save rendered Windows layouts and launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Windows-layout-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/routervpn-ui/*/*.png
            ${{ runner.temp }}/routervpn-ui/*/*.log
            ${{ runner.temp }}/routervpn-ui/*/windows-self-test-error.json
          if-no-files-found: warn
          retention-days: 7

      - name: Execute packaged Windows WFP enforcement
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'; $arch=$env:ROUTER_VPN_ARCH
          $installed=Join-Path $env:RUNNER_TEMP "installed-$arch"
          $roots=@(Get-ChildItem -LiteralPath $installed -Directory)
          if($roots.Count -ne 1){throw 'Expected exactly one extracted Windows release package'}
          $test=Join-Path $roots[0].FullName 'client/test-windows-wfp.ps1'
          if(-not(Test-Path -LiteralPath $test -PathType Leaf)){throw 'Shipped Windows package lacks its WFP enforcement test'}
          foreach($shell in @('pwsh','powershell.exe')){
            & $shell -NoProfile -ExecutionPolicy Bypass -File $test -SourceRoot $roots[0].FullName
            if($LASTEXITCODE -ne 0){throw "Packaged Windows $arch WFP kernel enforcement failed in $shell"}
          }

  android:
    needs: source-snapshot
    name: Android native APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: ./.github/actions/go-windows-sockets
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.0'}
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Android graph integration dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential autoconf automake libtool pkg-config perl patch
      - name: Build and verify the configured Android delivery
        env:
          ROUTERVPN_ANDROID_KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && secrets.ROUTERVPN_ANDROID_KEYSTORE_BASE64 || '' }}
          ROUTERVPN_ANDROID_STORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ROUTERVPN_ANDROID_STORE_PASSWORD || '' }}
          ROUTERVPN_ANDROID_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.ROUTERVPN_ANDROID_KEY_ALIAS || '' }}
          ROUTERVPN_ANDROID_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ROUTERVPN_ANDROID_KEY_PASSWORD || '' }}
          ROUTERVPN_ANDROID_CERT_SHA256: ${{ github.ref == 'refs/heads/main' && vars.ROUTERVPN_ANDROID_CERT_SHA256 || '' }}
          ROUTERVPN_ANDROID_REQUIRE_PRODUCTION: ${{ github.ref == 'refs/heads/main' && vars.ROUTERVPN_ANDROID_REQUIRE_PRODUCTION || '' }}
        run: python3 android/build-delivery.py
      - name: Launch the packaged Android app
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/routervpn-android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          install -d -m 700 "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" "$RUNNER_TEMP/android-ui"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'emulator' 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n routervpn-ci -p "$ANDROID_AVD_HOME/routervpn-ci.avd" -k 'system-images;android-35;google_apis;x86_64' --force <<<no
          emulator="$ANDROID_HOME/emulator/emulator"
          "$emulator" -list-avds | grep -Fx routervpn-ci
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          export ANDROID_SERIAL=emulator-5554
          "$emulator" -avd routervpn-ci -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader > "$RUNNER_TEMP/android-ui/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'timeout 5s adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" >/dev/null 2>&1 || true' EXIT
          boot_deadline=$((SECONDS + 360))
          until [[ "$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null || (( SECONDS >= boot_deadline )); then
              tail -n 60 "$RUNNER_TEMP/android-ui/emulator.log" >&2
              exit 1
            fi
            sleep 2
          done
          adb shell input keyevent 82
          adb install -r android/app/build/outputs/routervpn/app-debug.apk
          adb logcat -b crash -c
          adb shell am start -W -n com.eabusham.routervpn/.ProductActivity
          sleep 3
          test -n "$(adb shell pidof com.eabusham.routervpn | tr -d '\r')"
          adb shell dumpsys activity activities > "$RUNNER_TEMP/android-ui/activity.txt"
          grep -E 'mResumedActivity|topResumedActivity' "$RUNNER_TEMP/android-ui/activity.txt" | grep -F com.eabusham.routervpn
          adb shell uiautomator dump /sdcard/routervpn.xml
          adb pull /sdcard/routervpn.xml "$RUNNER_TEMP/android-ui/layout.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/android-ui/android-launch.png"
          adb shell wm size 640x1280
          adb shell wm density 320
          adb shell settings put system font_scale 2.0
          python3 - "$RUNNER_TEMP/android-ui" <<'PYUI'
          from pathlib import Path
          import re, subprocess, sys, xml.etree.ElementTree as ET

          out = Path(sys.argv[1])
          package = "com.eabusham.routervpn"
          def shell(*args):
              return subprocess.check_output(["adb", "shell", *map(str, args)], text=True).strip()
          def bounds(node):
              return tuple(map(int, re.findall(r"-?\d+", node.attrib["bounds"])))
          def capture(name):
              shell("uiautomator", "dump", "/sdcard/routervpn.xml")
              data = subprocess.check_output(["adb", "exec-out", "cat", "/sdcard/routervpn.xml"])
              (out / (name + ".xml")).write_bytes(data)
              (out / (name + ".png")).write_bytes(subprocess.check_output(["adb", "exec-out", "screencap", "-p"]))
              return list(ET.fromstring(data).iter("node"))

          def home_choice(nodes, caption):
              for row in nodes:
                  if any(child.get("text") == caption for child in row):
                      for child in row:
                          if child.get("class") == "android.widget.Spinner":
                              return child
              return None

          def selected_label(spinner):
              if spinner is not None:
                  return next((n.get("text") for n in spinner if n.get("text")), None)

          for name, rotation in [("portrait", 0), ("landscape", 1)]:
              shell("wm", "user-rotation", "lock", rotation)
              shell("am", "force-stop", package)
              shell("am", "start", "-W", "-n", package + "/.ProductActivity")
              pages = f"android-{name}-large-text"
              initial = capture(pages)
              handle = next(node for node in initial if node.get("content-desc") == "Expand connection controls")
              left, top, right, bottom = bounds(handle)
              shell("input", "tap", (left + right) // 2, (top + bottom) // 2)
              required = {"Connect", "Kill switch", "Forward", "Multihop", "Open settings", "Profiles",
                          "Performance", "MTU", "Mode", "DNS", "Help"}
              menus = {"Mode", "DNS"} if name == "portrait" else set()
              for page in range(20):
                  nodes = capture(f"{pages}-{page:02d}")
                  if any(node.get("text") == "Cancel startup" for node in nodes):
                      # An empty fresh install must settle at Connect without a VPN permission request.
                      for attempt in range(3):
                          nodes = capture(f"{pages}-startup-{attempt}")
                          if not any(node.get("text") == "Cancel startup" for node in nodes):
                              break
                      else:
                          raise RuntimeError(f"{name}: empty-profile startup never returned to idle")
                  if not any(node.get("package") == package for node in nodes):
                      raise RuntimeError(f"{name}: the installed Activity lost the foreground")
                  scroll = next(node for node in nodes if node.get("class") == "android.widget.ScrollView")
                  left, top, right, bottom = bounds(scroll)
                  root = bounds(nodes[0])
                  if (root[2] - root[0] > root[3] - root[1]) != (rotation == 1):
                      raise RuntimeError(f"{name}: Activity has the wrong orientation")
                  if page == 0:
                      primary = {"Kill switch", "Connect", "-- ms", "Forward"}
                      for node in nodes:
                          x, y, end_x, end_y = bounds(node)
                          if left <= x < end_x <= right and top < y < end_y < bottom:
                              primary.discard(node.get("text"))
                      if primary:
                          raise RuntimeError(f"{name}: expanded primary row is clipped: {sorted(primary)}")
                  for node in nodes:
                      x, y, end_x, end_y = bounds(node)
                      if left <= x < end_x <= right and top <= y < end_y <= bottom:
                          required.discard(node.get("text"))
                  for caption in sorted(menus):
                      spinner = home_choice(nodes, caption)
                      original = selected_label(spinner)
                      if not original or spinner.get("enabled") != "true":
                          continue
                      x, y, end_x, end_y = bounds(spinner)
                      if not (left <= x < end_x <= right and top < y < end_y < bottom):
                          continue
                      shell("input", "tap", (x + end_x) // 2, (y + end_y) // 2)
                      prefix = f"{pages}-{caption.lower()}"
                      popup = capture(prefix + "-choices")
                      choices = {item.get("text"): item for widget in popup if widget.get("package") == package
                                 and widget.get("class") == "android.widget.ListView"
                                 for item in widget.iter("node") if item.get("text")}
                      if original not in choices or len(choices) < 2:
                          raise RuntimeError(f"{caption}: the installed spinner did not expose its choices")
                      row_x, row_y, row_end_x, row_end_y = bounds(choices[original])
                      label = next(item for item in spinner if item.get("text") == original)
                      label_x, label_y, label_end_x, label_end_y = bounds(label)
                      if row_x < x or row_end_x > end_x or (row_end_x-row_x <= label_end_x-label_x and
                              row_end_y-row_y < label_end_y-label_y):
                          raise RuntimeError(f"{caption}: the popup clipped its original visible choice")
                      shell("input", "keyevent", "KEYCODE_BACK")
                      nodes = capture(prefix + "-closed")
                      if not any(n.get("package") == package for n in nodes) or selected_label(home_choice(nodes, caption)) != original:
                          raise RuntimeError(f"{caption}: Back did not restore the original selection")
                      menus.remove(caption)
                  if not required and not menus:
                      break
                  x = (left + right) // 2
                  shell("input", "swipe", x, bottom - 16, x, top + (bottom - top) // 3, 600)
              if required:
                  raise RuntimeError(f"{name}: controls were not reached by scrolling: {sorted(required)}")
              if menus:
                  raise RuntimeError(f"{name}: dropdowns were not reached: {sorted(menus)}")
          PYUI
          adb logcat -b crash -d > "$RUNNER_TEMP/android-ui/crash.log"
          ! grep -F 'FATAL EXCEPTION' "$RUNNER_TEMP/android-ui/crash.log"
      - name: Save Android launch evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RouterVPN-Android-layout-${{ github.sha }}
          path: ${{ runner.temp }}/android-ui
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Android-release-candidate
          path: |
            android/app/build/outputs/routervpn/app-debug.apk
            android/app/build/outputs/routervpn/android-delivery.json
          if-no-files-found: error
          retention-days: 1

  ios:
    needs: source-snapshot
    name: iOS/iPadOS real WireGuard + Libbox PacketTunnel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: ./.github/actions/go-windows-sockets
      - name: Install XcodeGen
        run: |
          brew install xcodegen autoconf automake libtool pkg-config
      - name: Prepare exact pinned WireGuardKit
        working-directory: ios/RouterVPN
        run: |
          sh prepare-wireguard-kit.sh

      - name: Prepare exact pinned Libbox before Xcode resolves the framework
        working-directory: ios/RouterVPN
        run: ./prepare-libbox.sh
      - name: Generate and build unsigned native app
        working-directory: ios/RouterVPN
        run: |
          xcodegen generate
          xcodebuild -project RouterVPN.xcodeproj -scheme RouterVPN -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' ROUTER_VPN_SOURCE_SHA="$GITHUB_SHA" INFOPLIST_KEY_RouterVPNSourceSHA="$GITHUB_SHA" build
      - name: Verify pinned engines and package IPA
        working-directory: ios/RouterVPN
        run: |
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/RouterVPN.app"; EXT="$APP/PlugIns/RouterVPNPacketTunnel.appex"; WG="$PWD/.deps/wireguard-apple"; IPA="$PWD/build/RouterVPN-native-unsigned-resignable.ipa"
          test -d "$EXT" || { echo "::error::PacketTunnel extension is missing"; exit 1; }
          test "$(git -C "$WG" rev-parse HEAD)" = '9d5ee60edefa95b933a738dd7cda671dd18021fc' || { echo "::error::WireGuardKit commit pin mismatch"; exit 1; }
          test "$(sed -n '1p' "$WG/Package.swift")" = '// swift-tools-version:5.5' || { echo "::error::WireGuardKit Package.swift toolchain contract changed"; exit 1; }
          test "$(cat .deps/wireguard-apple.pin)" = '9d5ee60edefa95b933a738dd7cda671dd18021fc' || { echo "::error::WireGuardKit recorded pin mismatch"; exit 1; }
          python3 ../../deploy/prepare-apple-amnezia-timers.py "$WG" --verify
          test -s "$PWD/build/DerivedData/Build/Products/Release-iphoneos/libwg-go.a" || { echo "::error::libwg-go.a is missing"; exit 1; }
          test "$(plutil -extract RouterVPNSourceSHA raw -o - "$APP/Info.plist")" = "$GITHUB_SHA" || { echo "::error::iOS app source SHA mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNSourceRepository raw -o - "$APP/Info.plist")" = 'Eabusham2/router-vpn' || { echo "::error::iOS app source repository mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNArtifactFamily raw -o - "$APP/Info.plist")" = 'ios-app' || { echo "::error::iOS app artifact family mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNSourceSHA raw -o - "$EXT/Info.plist")" = "$GITHUB_SHA" || { echo "::error::iOS PacketTunnel source SHA mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNSourceRepository raw -o - "$EXT/Info.plist")" = 'Eabusham2/router-vpn' || { echo "::error::iOS PacketTunnel source repository mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNArtifactFamily raw -o - "$EXT/Info.plist")" = 'ios-packet-tunnel' || { echo "::error::iOS PacketTunnel artifact family mismatch"; exit 1; }
          test -d .deps/Libbox.xcframework || { echo "::error::Libbox.xcframework is missing"; exit 1; }
          test -s .deps/libbox-LICENSE.txt || { echo "::error::Libbox license is missing"; exit 1; }
          grep -Fq '1.14.1+1ac1a339cb1223e9c70eae14c44411c75033c02d+go1.26.3+0.1.12+ios,iossimulator' .deps/Libbox.xcframework.pin || { echo "::error::Libbox exact pin mismatch"; exit 1; }
          for marker in 'WireGuardAdapter(with: self)' 'startLibbox' 'RouterVPNLibboxEngine' 'body["node_id"] as? String == expectedNodeID' 'body["proof"] as? String == Self.proofKind'; do grep -Fq "$marker" PacketTunnel/PacketTunnelProvider.swift || { echo "::error::PacketTunnel source contract missing: $marker"; exit 1; }; done
          rm -rf build/unsigned; mkdir -p build/unsigned/Payload; ditto "$APP" build/unsigned/Payload/RouterVPN.app; (cd build/unsigned && zip -qry ../RouterVPN-native-unsigned-resignable.ipa Payload); unzip -tq "$IPA" >/dev/null
          python3 ../../server/scripts/mobile-artifact-provenance.py --name router-vpn-ios.ipa --path "$IPA" --sha "$GITHUB_SHA" --repo Eabusham2/router-vpn
      - name: Read back generated SDK APIs from the release Xcode build
        run: python3 deploy/verify-ios-generated-sdk.py --source-sha "$GITHUB_SHA" --output ios/RouterVPN/build/generated-sdk-receipt
      - name: Build and launch iPhone and iPad simulators
        timeout-minutes: 30
        working-directory: ios/RouterVPN
        run: |
          set -euo pipefail
          xcodebuild -project RouterVPN.xcodeproj -scheme RouterVPN -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$PWD/build/SimulatorDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' ROUTER_VPN_SOURCE_SHA="$GITHUB_SHA" INFOPLIST_KEY_RouterVPNSourceSHA="$GITHUB_SHA" build
          mkdir -p "$RUNNER_TEMP/ios-ui"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-ui/devices.json"
          python3 - "$RUNNER_TEMP/ios-ui/devices.json" <<'PY' > "$RUNNER_TEMP/ios-ui/selected.txt"
          import json, sys
          devices = [device for group in json.load(open(sys.argv[1]))['devices'].values() for device in group if device.get('isAvailable')]
          for family in ('iPhone', 'iPad'):
              selected = next((device for device in devices if device['name'].startswith(family)), None)
              if selected is None:
                  raise SystemExit('No installed ' + family + ' simulator')
              print(family.lower(), selected['udid'])
          PY
          xcrun simctl help ui > "$RUNNER_TEMP/ios-ui/simctl-ui-help.txt" 2>&1
          grep -F 'content_size' "$RUNNER_TEMP/ios-ui/simctl-ui-help.txt"
          largest=accessibility-extra-extra-extra-large
          content_size() { xcrun simctl ui "$simulator" content_size | awk 'NF {print $NF}'; }
          capture_launch() {
            local name="$1" launch app_pid
            launch="$(xcrun simctl launch "$simulator" com.eabusham.routervpn)"
            printf '%s\n' "$launch" > "$RUNNER_TEMP/ios-ui/$name.txt"
            app_pid="$(printf '%s\n' "$launch" | awk '/: [0-9]+$/ {print $NF}')"
            [[ "$app_pid" =~ ^[0-9]+$ ]]
            sleep 3
            kill -0 "$app_pid"
            xcrun simctl io "$simulator" screenshot "$RUNNER_TEMP/ios-ui/$name.png"
          }
          while read -r family simulator; do
            original_size=''
            xcrun simctl boot "$simulator"
            trap 'if [[ -n "$original_size" ]]; then xcrun simctl ui "$simulator" content_size "$original_size" || echo "Failed to restore simulator content size" >&2; fi; xcrun simctl shutdown "$simulator" || true' EXIT
            xcrun simctl bootstatus "$simulator" -b
            original_size="$(content_size)"
            [[ "$original_size" =~ ^[a-z]+(-[a-z]+)*$ ]]
            xcrun simctl install "$simulator" build/SimulatorDerivedData/Build/Products/Release-iphonesimulator/RouterVPN.app
            capture_launch "$family-launch"
            xcrun simctl terminate "$simulator" com.eabusham.routervpn
            xcrun simctl ui "$simulator" content_size "$largest"
            [[ "$(content_size)" == "$largest" ]]
            capture_launch "$family-largest-text"
            xcrun simctl ui "$simulator" content_size "$original_size"
            [[ "$(content_size)" == "$original_size" ]]
            printf 'Original: %s\nCaptured: %s\nRestored: %s\n' "$original_size" "$largest" "$original_size" > "$RUNNER_TEMP/ios-ui/$family-content-size.txt"
            original_size=''
            xcrun simctl shutdown "$simulator"
            trap - EXIT
          done < "$RUNNER_TEMP/ios-ui/selected.txt"
      - name: Save iPhone and iPad launch evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RouterVPN-iOS-layout-${{ github.sha }}
          path: ${{ runner.temp }}/ios-ui
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-iOS-generated-sdk-${{ github.sha }}
          path: ios/RouterVPN/build/generated-sdk-receipt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with: {name: RouterVPN-iOS-release-candidate, path: ios/RouterVPN/build/RouterVPN-native-unsigned-resignable.ipa, if-no-files-found: error, retention-days: 1}

  macos:
    needs: native-runtimes
    name: macOS native AppKit amd64 + arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: ./.github/actions/go-windows-sockets
      - uses: actions/download-artifact@v4
        with:
          pattern: RouterVPN-native-runtime-darwin-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifacts
          merge-multiple: true
      - name: Verify and stage exact native runtime payloads
        shell: bash
        run: python3 deploy/native-runtime-bundle.py stage "$RUNNER_TEMP/native-runtime-artifacts" dist/native-runtime darwin/amd64 darwin/arm64
      - name: Build native macOS packages
        env:
          ROUTERVPN_UI_EVIDENCE_DIR: '${{ runner.temp }}/routervpn-ui'
        run: |
          chmod +x client/macos/build-native-app.sh deploy/package-macos-native.sh
          ./deploy/package-macos-native.sh
          (cd dist/macos-native && shasum -a 256 -c SHA256SUMS)
      - name: Save rendered macOS layouts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RouterVPN-macOS-layout-${{ github.sha }}
          path: ${{ runner.temp }}/routervpn-ui/*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-macOS-release-candidate
          path: |
            dist/macos-native/RouterVPN-darwin-amd64.tar.gz
            dist/macos-native/RouterVPN-darwin-arm64.tar.gz
            dist/macos-native/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  macos-intel-smoke:
    name: macOS packaged Intel AppKit launch
    needs: macos
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-macOS-release-candidate
          path: ${{ runner.temp }}/routervpn-macos-packaged
      - name: Verify and launch the packaged Intel app
        env:
          ROUTERVPN_UI_EVIDENCE_DIR: '${{ runner.temp }}/routervpn-macos-intel-layout'
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          cd "$RUNNER_TEMP/routervpn-macos-packaged"
          shasum -a 256 -c SHA256SUMS
          mkdir -p "$RUNNER_TEMP/routervpn-macos-intel"
          tar -xzf RouterVPN-darwin-amd64.tar.gz -C "$RUNNER_TEMP/routervpn-macos-intel"
          package="$RUNNER_TEMP/routervpn-macos-intel/RouterVPN-darwin-amd64"
          app="$package/RouterVPN.app/Contents/MacOS/RouterVPN"
          test "$(lipo -archs "$app")" = x86_64
          codesign --verify --deep --strict --verbose=2 "$package/RouterVPN.app"
          python3 - "$package" <<'PYMACINTEL'
          import json, os, subprocess, sys
          from pathlib import Path
          package = Path(sys.argv[1])
          provenance = json.loads((package / 'ROUTER-VPN-SOURCE.json').read_text())
          if (provenance.get('source_sha') != os.environ['GITHUB_SHA']
                  or provenance.get('repository') != os.environ['GITHUB_REPOSITORY']
                  or provenance.get('artifact_family') != 'macos-amd64'):
              raise RuntimeError('Packaged Intel app does not belong to this exact repository/source')
          executable = package / 'RouterVPN.app/Contents/MacOS/RouterVPN'
          subprocess.run([str(executable), '--self-test'], cwd=package, check=True, timeout=90)
          evidence = Path(os.environ['ROUTERVPN_UI_EVIDENCE_DIR'])
          for name in ('macos-720x560.png', 'macos-1050x720.png'):
              image = (evidence / name).read_bytes()
              if len(image) < 33 or image[:8] != b'\x89PNG\r\n\x1a\n':
                  raise RuntimeError('Packaged Intel app omitted its rendered ' + name)
          PYMACINTEL
      - name: Save rendered Intel macOS layouts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RouterVPN-macOS-layout-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/routervpn-macos-intel-layout/*.png
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: native-runtimes
    name: Linux native GTK ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: ./.github/actions/go-windows-sockets
      - name: Install GTK build and runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libcurl4-openssl-dev libjson-glib-dev pkg-config file xvfb xauth binutils python3 nftables iproute2 passwd util-linux libc-bin pkexec polkitd systemd
      - uses: actions/download-artifact@v4
        with:
          pattern: RouterVPN-native-runtime-linux-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifacts
          merge-multiple: true
      - name: Verify and stage exact native runtime payloads
        shell: bash
        run: python3 deploy/native-runtime-bundle.py stage "$RUNNER_TEMP/native-runtime-artifacts" dist/native-runtime linux/${{ matrix.arch }}
      - name: Build native Linux package
        run: |
          chmod +x client/linux/build-native-app.sh deploy/package-linux-native.sh
          ./deploy/package-linux-native.sh '${{ matrix.arch }}'
          (cd dist/linux-native && sha256sum -c "RouterVPN-linux-${{ matrix.arch }}.sha256")
          export ROUTERVPN_UI_EVIDENCE_DIR="$RUNNER_TEMP/routervpn-linux-layout/evidence"
          mkdir -p "$ROUTERVPN_UI_EVIDENCE_DIR"
          tar -xzf "dist/linux-native/RouterVPN-linux-${{ matrix.arch }}.tar.gz" -C "$RUNNER_TEMP/routervpn-linux-layout"
          xvfb-run -a "$RUNNER_TEMP/routervpn-linux-layout/RouterVPN-linux-${{ matrix.arch }}/router-vpn-app" --layout-self-test
      - name: Save native Linux layout images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RouterVPN-Linux-layout-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/routervpn-linux-layout/evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Exercise installed protected SMART transitions
        run: |
          sudo apt-get install -y --no-install-recommends kbd libpam0g-dev wireguard-tools dnsmasq-base openssl tcpdump
          python3 deploy/verify-linux-smart.py --archive "dist/linux-native/RouterVPN-linux-${{ matrix.arch }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Linux-${{ matrix.arch }}-release-candidate
          path: |
            dist/linux-native/RouterVPN-linux-${{ matrix.arch }}.tar.gz
            dist/linux-native/RouterVPN-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: Aggregate one-SHA native release candidate
    needs: [generic-builds, windows-native-smoke, android, ios, macos, macos-intel-smoke, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: '*-release-candidate', path: dist/release-candidate, merge-multiple: false}
      - name: Manifest and verify artifact tree
        run: |
          python3 deploy/verify-release-candidate-provenance.py dist/release-candidate --sha "$GITHUB_SHA"
          (cd dist && find release-candidate -type f -print | sort)
          (cd dist && find release-candidate -type f -print0 | sort -z | xargs -0 sha256sum > RELEASE-CANDIDATE-SHA256SUMS)
          test -s dist/RELEASE-CANDIDATE-SHA256SUMS
          (cd dist && sha256sum -c RELEASE-CANDIDATE-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-release-candidate-${{ github.sha }}
          path: |
            dist/release-candidate/**
            dist/RELEASE-CANDIDATE-SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  server-images:
    needs: [source-snapshot, aggregate]
    name: Build and publish ARM64 images
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: init
            dockerfile: server/init/Dockerfile
            image: router-vpn-init
          - name: agent
            dockerfile: deploy/router-agent.Dockerfile
            image: router-vpn-agent
          - name: updater
            dockerfile: deploy/update-controller.Dockerfile
            image: router-vpn-updater
          - name: wireguard
            dockerfile: server/wireguard/Dockerfile
            image: router-vpn-wireguard
          - name: awg2
            dockerfile: server/awg2/Dockerfile
            image: router-vpn-awg2
          - name: rosenpass
            dockerfile: server/rosenpass/Dockerfile
            image: router-vpn-rosenpass
          - name: naive
            dockerfile: server/naive/Dockerfile
            image: router-vpn-naive
          - name: ss-v2ray
            dockerfile: server/ss-v2ray/Dockerfile
            image: router-vpn-ss-v2ray
          - name: aux
            dockerfile: server/aux-proxies/Dockerfile
            image: router-vpn-aux
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        if: matrix.name == 'init'
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/download-artifact@v4
        if: matrix.name == 'init'
        with:
          pattern: RouterVPN-native-runtime-windows-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifacts
          merge-multiple: true
      - name: Verify complete Windows runtimes for same-image fallback
        if: matrix.name == 'init'
        run: python3 deploy/native-runtime-bundle.py stage "$RUNNER_TEMP/native-runtime-artifacts" dist/native-runtime windows/amd64 windows/arm64
      - name: Record exact source tree identity
        shell: bash
        run: |
          set -euo pipefail
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'SOURCE_TREE_SHA=%s\n' "$tree_sha" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          load: true
          push: false
          tags: |
            ghcr.io/eabusham2/${{ matrix.image }}:arm64-main
            ghcr.io/eabusham2/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Eabusham2/router-vpn
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source-tree=${{ env.SOURCE_TREE_SHA }}
      - name: Run ARM64 init end to end
        if: matrix.name == 'init'
        run: |
          TEST_ROOT="$RUNNER_TEMP/router-vpn-preflight"
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 -e ENDPOINT=1.1.1.1 \
            -v "$TEST_ROOT:/opt/router-vpn" ghcr.io/eabusham2/router-vpn-init:${GITHUB_SHA}
          docker run --rm --platform linux/arm64 -v "$TEST_ROOT:/opt/router-vpn:ro" alpine:3.22 sh -c '
            test -e /opt/router-vpn/.initialized &&
            test -s /opt/router-vpn/config/router-agent.json &&
            test -s /opt/router-vpn/config/transports/server.json &&
            test -s /opt/router-vpn/config/xray/server.json &&
            test -s /opt/router-vpn/client-bundle/router-vpn-bundle.json
          '
      - name: Run ARM64 finalizer end to end
        if: matrix.name == 'init'
        run: |
          TEST_ROOT="$RUNNER_TEMP/router-vpn-preflight"
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 -e ENDPOINT=1.1.1.1 \
            -e OVERTLS_PORT=14443 -e OVERTLS_INTERNAL_PORT=14444 -e SSR_PORT=15443 \
            -v "$TEST_ROOT:/opt/router-vpn" --entrypoint /bin/bash \
            ghcr.io/eabusham2/router-vpn-init:${GITHUB_SHA} /src/server/finalize/current-entrypoint.sh
          docker run --rm --platform linux/arm64 -v "$TEST_ROOT:/opt/router-vpn:ro" alpine:3.22 sh -c '
            test -e /opt/router-vpn/.finalized &&
            test ! -e /opt/router-vpn/router-vpn-client-bundle.zip &&
            test ! -e /opt/router-vpn/downloads/router-vpn-client-bundle.zip &&
            test -s /opt/router-vpn/config/rosenpass/server.toml &&
            test -s /opt/router-vpn/client-bundle/routers.json &&
            test -s /opt/router-vpn/client-bundle/router-vpn-bundle.json &&
            test -s /opt/router-vpn/client-bundle/logical-modes.json &&
            test -s /opt/router-vpn/client-bundle/setup-assets.json &&
            test -s /opt/router-vpn/downloads/router-vpn-device-setup.html &&
            test -s /opt/router-vpn/downloads/download-policy.json &&
            test -s /opt/router-vpn/config/aux/overtls-server.json &&
            test -s /opt/router-vpn/config/aux/ssr-server.json &&
            test -z "$(find /opt/router-vpn/downloads -maxdepth 1 -type f -name "*.zip" -print -quit)"
          '
      - name: Verify installed standalone Tor control without network access
        if: matrix.name == 'agent'
        run: |
          docker run --rm --network none --platform linux/arm64 \
            --entrypoint python3 ghcr.io/eabusham2/router-vpn-agent:${GITHUB_SHA} \
            /usr/local/share/router-vpn/tor/verify.py --prefix /usr/local \
            --platform linux/arm64 --offline-self-test
      - name: Verify installed private Tor provisioning without network access
        if: matrix.name == 'agent'
        run: |
          docker run --rm --network none --platform linux/arm64 \
            --mount "type=bind,src=${PWD},dst=/routervpn-source,readonly" \
            --entrypoint python3 ghcr.io/eabusham2/router-vpn-agent:${GITHUB_SHA} \
            /routervpn-source/deploy/test_server_tor_pairing.py --installed -v
      - name: Verify installed private benchmark traffic and Emergency Stop tools
        if: matrix.name == 'agent'
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import hashlib, ipaddress, json, os, re, secrets, shutil, subprocess, tempfile, time
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          tree = os.environ["SOURCE_TREE_SHA"]
          ref = "ghcr.io/eabusham2/router-vpn-agent:" + sha
          scope = "routervpn-bench-" + secrets.token_hex(8)
          label = "routervpn.benchmark=" + scope
          work = Path(tempfile.mkdtemp(prefix=scope + "-", dir=os.environ["RUNNER_TEMP"]))
          os.chmod(work, 0o700)
          deadline = time.monotonic() + 150
          failure = cleanup_failure = None
          token = secrets.token_hex(32)
          node = secrets.token_hex(32)
          image = None
          names = {scope + "-" + role for role in ("agent", "peer", "nonpeer")}

          def run(*args, timeout=20):
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise TimeoutError("agent image qualification command budget expired")
              done = subprocess.run(["docker", *args], text=True, stdout=subprocess.PIPE,
                                    stderr=subprocess.PIPE, timeout=min(timeout, remaining))
              if done.returncode:
                  detail = (done.stderr + done.stdout).replace(token, "[redacted]")[-2000:]
                  raise RuntimeError("docker " + args[0] + " failed: " + detail)
              return (done.stdout + (done.stderr if args[0] == "logs" else "")).strip()

          def inspect(kind, identity):
              rows = json.loads(run(kind, "inspect", identity))
              assert len(rows) == 1
              return rows[0]

          def labels(row):
              return row.get("Labels") or row.get("Config", {}).get("Labels") or {}

          def cleanup():
              global deadline
              deadline = time.monotonic() + 60
              retired, errors = [], []
              ids = run("container", "ls", "-aq", "--no-trunc", "--filter", "label=" + label).split()
              for cid in ids:
                  try:
                      row = inspect("container", cid)
                      assert row["Id"] == cid and row["Name"].lstrip("/") in names
                      assert labels(row).get("routervpn.benchmark") == scope and row["Image"] == image
                      if row["State"]["Status"] == "created":
                          assert row["State"]["Pid"] == 0
                          code = None
                      else:
                          if row["State"]["Running"]:
                              run("stop", "--time", "5", cid, timeout=12)
                          code = int(run("wait", cid, timeout=5))
                          row = inspect("container", cid)
                          assert not row["State"]["Running"] and row["State"]["Pid"] == 0
                          assert code == row["State"]["ExitCode"]
                          expected = (0, 143) if row["Name"].lstrip("/") == scope + "-agent" else (0,)
                          if code not in expected:
                              errors.append(RuntimeError("unexpected owned container exit " + str(code) + ": " + cid))
                      run("rm", cid)
                      assert not run("container", "ls", "-aq", "--no-trunc", "--filter", "id=" + cid)
                      retired.append({"id": cid, "exit_code": code})
                  except Exception as error:
                      errors.append(error)
              nets = run("network", "ls", "-q", "--no-trunc", "--filter", "label=" + label).split()
              for nid in nets:
                  try:
                      row = inspect("network", nid)
                      assert row["Id"] == nid and row["Name"] == scope and row["Internal"]
                      assert labels(row).get("routervpn.benchmark") == scope and not row["Containers"]
                      run("network", "rm", nid)
                      assert not run("network", "ls", "-q", "--no-trunc", "--filter", "id=" + nid)
                  except Exception as error:
                      errors.append(error)
              if run("container", "ls", "-aq", "--filter", "label=" + label) or run("network", "ls", "-q", "--filter", "label=" + label):
                  errors.append(RuntimeError("owned image qualification resources remain"))
              if errors:
                  raise ExceptionGroup("agent image cleanup failed", errors)
              return retired

          try:
              assert re.fullmatch(r"[0-9a-f]{40}", sha) and re.fullmatch(r"[0-9a-f]{40}", tree)
              original = inspect("image", ref)
              image = original["Id"]
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", image)
              assert original["Architecture"] == "arm64" and original["Os"] == "linux"
              assert labels(original)["org.opencontainers.image.revision"] == sha
              assert labels(original)["org.opencontainers.image.source-tree"] == tree
              assert labels(original)["org.opencontainers.image.source"] == "https://github.com/Eabusham2/router-vpn"
              assert original["Config"]["Entrypoint"] == ["/usr/local/bin/router-vpn-agent"]
              nid = run("network", "create", "--internal", "--driver", "bridge", "--label", label, scope)
              network = inspect("network", nid)
              assert network["Id"] == nid and network["Internal"] and network["Name"] == scope
              assert labels(network)["routervpn.benchmark"] == scope and not network["Containers"]
              cidrs = [ipaddress.ip_network(item["Subnet"]) for item in network["IPAM"]["Config"]]
              cidrs = [item for item in cidrs if item.version == 4]
              assert len(cidrs) == 1 and cidrs[0].num_addresses >= 8
              agent_ip, peer_ip, nonpeer_ip = [str(cidrs[0].network_address + i) for i in (2, 3, 4)]
              config = {"listen": agent_ip + ":8787", "token": token, "node_id": node,
                        "tunnel_cidrs": [peer_ip + "/32"], "wan_interface": "eth0",
                        "nft_table": "routervpn_image_benchmark", "daita_listen": agent_ip + ":45999"}
              (work / "agent.json").write_text(json.dumps(config))
              os.chmod(work / "agent.json", 0o600)
              probe = r'''
          import hashlib, http.client, json, secrets, shutil, sys, time
          from pathlib import Path
          cfg = json.loads(Path("/run/routervpn-benchmark/agent.json").read_text())
          host = cfg["listen"].rsplit(":", 1)[0]
          peer = cfg["tunnel_cidrs"][0].split("/")[0]
          mode = sys.argv[1]
          size = 8 << 20
          assert shutil.which("wg") and shutil.which("awg")
          def request(method, path, auth=None, body=None, timeout=10):
              c = http.client.HTTPConnection(host, 8787, timeout=timeout)
              try:
                  c.connect()
                  source = c.sock.getsockname()[0]
                  headers = {} if auth is None else {"Authorization": "Bearer " + auth}
                  c.request(method, path, body=body, headers=headers)
                  r = c.getresponse()
                  data = r.read(size + 1)
                  assert len(data) <= size
                  return r.status, dict(r.getheaders()), data, source
              finally:
                  c.close()
          until = time.monotonic() + 15
          while True:
              try:
                  code, headers, body, source = request("GET", "/health", timeout=1)
                  assert code == 200 and json.loads(body) == {
                      "ok": True, "node_id": cfg["node_id"], "proof": "router-vpn-private-agent-v1"}
                  break
              except (OSError, http.client.HTTPException):
                  if time.monotonic() >= until:
                      raise
                  time.sleep(0.2)
          assert (source == peer) == (mode == "peer")
          denials = []
          bad_token = "wrong-" + secrets.token_hex(32) if mode == "peer" else cfg["token"]
          expected = b"bad token\n" if mode == "peer" else b"source is not a tunnel peer\n"
          for method, path, payload in (("GET", "/api/benchmark/download", None),
                                         ("POST", "/api/benchmark/upload", b"x" * (64 << 10))):
              code, headers, body, actual = request(method, path, bad_token, payload)
              assert actual == source and code == 403 and body == expected
              denials.append({"method": method, "status": code})
          result = {"mode": mode, "actual_peer": source, "denials": denials}
          if mode == "peer":
              code, headers, body, actual = request("GET", "/api/benchmark/download", cfg["token"])
              headers = {k.lower(): v for k, v in headers.items()}
              assert code == 200 and actual == peer and len(body) == size
              assert headers["x-routervpn-peer"] == peer and headers["x-routervpn-benchmark"] == "download-v1"
              assert headers["x-routervpn-benchmark-bytes"] == str(size) and headers["content-length"] == str(size)
              assert headers["content-type"] == "application/octet-stream"
              assert headers["content-encoding"] == "identity" and headers["cache-control"] == "no-store, no-transform"
              result["download"] = {"bytes": len(body), "sha256": hashlib.sha256(body).hexdigest()}
              payload = secrets.token_bytes(size)
              code, headers, body, actual = request("POST", "/api/benchmark/upload", cfg["token"], payload)
              answer = json.loads(body)
              assert code == 200 and actual == peer and answer["ok"] is True
              assert answer["bytes"] == size and answer["peer"] == peer and answer["direction"] == "upload"
              assert answer["proof"] == "authenticated tunnel-peer private throughput sink"
              assert isinstance(answer["server_receive_ms"], (int, float)) and answer["server_receive_ms"] >= 0
              result["upload"] = {"bytes": answer["bytes"], "sha256": hashlib.sha256(payload).hexdigest()}
          print(json.dumps(result, sort_keys=True))
          '''
              (work / "probe.py").write_text(probe)
              os.chmod(work / "probe.py", 0o600)
              def create(role, address):
                  args = ["create", "--init", "--name", scope + "-" + role, "--label", label, "--platform", "linux/arm64",
                          "--network", nid, "--ip", address, "--read-only", "--cap-drop", "ALL", "--cap-add", "DAC_READ_SEARCH",
                          "--security-opt", "no-new-privileges", "--pids-limit", "64",
                          "--mount", "type=bind,src=" + str(work) + ",dst=/run/routervpn-benchmark,readonly"]
                  if role == "agent":
                      args += ["--cap-add", "NET_ADMIN", "--tmpfs", "/tmp:rw,noexec,nosuid,nodev,mode=1777,size=16m",
                               "-e", "ROUTER_VPN_CONFIG=/run/routervpn-benchmark/agent.json",
                               "-e", "ROUTER_VPN_MULTIHOP_CONFIG=/run/routervpn-benchmark/absent-relays.json", image]
                  else:
                      args += ["--entrypoint", "python3", image, "-B", "/run/routervpn-benchmark/probe.py", role]
                  cid = run(*args)
                  row = inspect("container", cid)
                  assert row["Id"] == cid and row["Image"] == image and labels(row)["routervpn.benchmark"] == scope
                  assert row["HostConfig"]["ReadonlyRootfs"] and not row["HostConfig"]["PortBindings"]
                  binds = [m for m in row["Mounts"] if m["Type"] == "bind"]
                  assert len(binds) == 1 and binds[0]["Source"] == str(work)
                  assert binds[0]["Destination"] == "/run/routervpn-benchmark" and not binds[0]["RW"]
                  assert all(m in binds or (role == "agent" and m["Type"] == "tmpfs" and m["Destination"] == "/tmp")
                             for m in row["Mounts"])
                  tmpfs = row["HostConfig"].get("Tmpfs") or {}
                  assert tmpfs == ({"/tmp": "rw,noexec,nosuid,nodev,mode=1777,size=16m"} if role == "agent" else {})
                  caps = {c.removeprefix("CAP_") for c in row["HostConfig"]["CapAdd"]}
                  assert caps == ({"DAC_READ_SEARCH", "NET_ADMIN"} if role == "agent" else {"DAC_READ_SEARCH"})
                  run("start", cid)
                  row = inspect("container", cid)
                  links = list(row["NetworkSettings"]["Networks"].values())
                  assert len(links) == 1 and links[0]["NetworkID"] == nid and links[0]["IPAddress"] == address
                  assert not row["HostConfig"]["Privileged"]
                  return cid
              agent = create("agent", agent_ip)
              results = []
              for role, address in (("peer", peer_ip), ("nonpeer", nonpeer_ip)):
                  cid = create(role, address)
                  code = int(run("wait", cid, timeout=60))
                  output = run("logs", "--tail", "20", cid)
                  assert code == 0, role + " benchmark probe failed"
                  result = json.loads(output)
                  assert result["mode"] == role and result["actual_peer"] == address
                  results.append(result)
                  state = inspect("container", agent)
                  assert state["State"]["Running"] and state["Image"] == image
              augmented = run("exec", agent, "python3", "-B", "-c", r'''
          import json, stat
          from pathlib import Path
          original = json.loads(Path("/run/routervpn-benchmark/agent.json").read_text())
          files = list(Path("/tmp").glob("router-vpn-agent-*.json"))
          assert len(files) == 1 and files[0].lstat().st_uid == 0
          assert stat.S_IMODE(files[0].lstat().st_mode) == 0o600
          current = json.loads(files[0].read_text())
          ports = current.pop("reserved_ports")
          assert current == original and {22, 53, 8787, 45999, 26240, 26271}.issubset(ports)
          print("original private startup augmentation verified")
          ''')
              assert augmented == "original private startup augmentation verified"
              assert inspect("image", ref)["Id"] == image
              proof = {"source_commit": sha, "source_tree": tree, "image_id": image,
                       "network_id": nid, "agent_id": agent, "agent_ip": agent_ip, "private_startup_augmentation": True,
                       "scope": "installed agent HTTP/authentication; encrypted tunnel transport is qualified separately",
                       "results": results}
          except Exception as error:
              failure = error
              try:
                  for cid in run("container", "ls", "-aq", "--filter", "label=" + label).split():
                      detail = run("logs", "--tail", "20", cid).replace(token, "[redacted]")
                      print(detail[-3000:], flush=True)
              except Exception:
                  pass
          finally:
              try:
                  retired = cleanup()
                  shutil.rmtree(work)
              except Exception as error:
                  cleanup_failure = error
          if failure or cleanup_failure:
              raise ExceptionGroup("installed agent benchmark failed",
                                   [e for e in (failure, cleanup_failure) if e is not None])
          proof["retired_containers"] = retired
          proof["owned_network_removed"] = True
          print(json.dumps(proof, sort_keys=True))
          PY
      - name: Push the already built and verified image
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/eabusham2/${{ matrix.image }}:${GITHUB_SHA}"
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = arm64
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          docker push "$ref"
          docker push "ghcr.io/eabusham2/${{ matrix.image }}:arm64-main"
      - name: Verify published exact-SHA ARM64 image provenance
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/eabusham2/${{ matrix.image }}:${GITHUB_SHA}"
          docker pull --platform linux/arm64 "$ref" >/dev/null
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = 'arm64'
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = 'https://github.com/Eabusham2/router-vpn'
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.source-tree" }}')" = "$SOURCE_TREE_SHA"
          printf '%s %s\n' "$ref" "$SOURCE_TREE_SHA"

  production-compose:
    needs: server-images
    name: Materialize exact-head production compose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and verify exact-head compose
        run: |
          set -euo pipefail
          mkdir -p dist/production-release
          out="dist/production-release/RouterVPN-Portainer-${GITHUB_SHA}.yaml"
          python3 deploy/materialize-production-compose.py --sha "$GITHUB_SHA" --output "$out"
          test "$(python3 server/scripts/verify-production-compose.py "$out")" = "$GITHUB_SHA"
          grep -Fq "GENERATED exact-SHA Router VPN production compose: ${GITHUB_SHA}" "$out"
          test "$(grep -Eo 'ghcr\.io/eabusham2/router-vpn-(init|agent|wireguard|awg2|rosenpass|naive|ss-v2ray|aux|updater):[0-9a-f]{40}' "$out" | sed 's/.*://' | sort -u)" = "$GITHUB_SHA"
          grep -Fq "ghcr.io/eabusham2/router-vpn-updater:${GITHUB_SHA}" "$out"
          ! grep -Fq '/var/run/docker.sock' "$out"
          test "$(sed -n 's/^[[:space:]]*ROUTER_VPN_GITHUB_SHA:[[:space:]]*\([0-9a-f]\{40\}\)[[:space:]]*$/\1/p' "$out")" = "$GITHUB_SHA"
          (cd dist/production-release && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")
          (cd dist/production-release && sha256sum -c "$(basename "$out").sha256")
      - name: Upload exact-head Portainer compose
        uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-production-compose-${{ github.sha }}
          path: dist/production-release/*
          if-no-files-found: error
          retention-days: 1

  publish-exact-sha-release:
    name: Publish immutable exact-SHA native download release
    needs: [source-snapshot, aggregate, production-compose]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-release-candidate-${{ github.sha }}
          path: dist/release-input
      - name: Materialize ten native assets and exact-SHA manifests
        run: |
          set -euo pipefail
          rm -rf dist/exact-sha-release
          python3 deploy/materialize-exact-sha-release.py \
            --input dist/release-input \
            --output dist/exact-sha-release \
            --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY"
          (cd dist/exact-sha-release && sha256sum -c SHA256SUMS)
      - name: Create or refresh the immutable exact-SHA prerelease
        run: |
          set -euo pipefail
          TAG="router-vpn-sha-${GITHUB_SHA}"
          cat > dist/exact-sha-release-notes.md <<EOF
          Router VPN native packages built and verified from exact source SHA \`${GITHUB_SHA}\`.

          Delivery order in the private Setup Center:
          1. this exact-SHA GitHub Release;
          2. exact-SHA GitHub Actions artifact;
          3. one bounded router-local Windows x64/ARM64 installed or Portable build when GitHub is unavailable.

          macOS and Linux require matching native packages; the router does not replace their native build environments.

          The selected package and its owned local build workspace remain retryable for 30 minutes after becoming ready, then are deleted automatically. Android and iOS remain exact-SHA GitHub-only. Generic assets are secret-free; private node linking is separate.
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          android = json.loads(Path('dist/exact-sha-release/RouterVPN-RELEASE.json').read_text())['android_delivery']
          with Path('dist/exact-sha-release-notes.md').open('a') as notes:
              notes.write('\nAndroid delivery: ' + android['label'] + '.\n\n')
              notes.write('Version code: ' + str(android['version_code']) + '. Signing certificate SHA-256: `' + android['certificate_sha256'] + '`.\n\n')
              notes.write('`app-debug.apk` is the retained compatibility filename; the verified signing state above identifies its actual build variant. An upgrade requires the same installed signing identity. A new production key cannot upgrade an unrelated debug-key installation.\n')
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ACTUAL_TARGET="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .target_commitish)"
            test "$ACTUAL_TARGET" = "$GITHUB_SHA" || {
              echo "Existing exact-SHA release target mismatch: $ACTUAL_TARGET" >&2
              exit 1
            }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Router VPN exact SHA ${GITHUB_SHA}" \
              --notes-file dist/exact-sha-release-notes.md \
              --prerelease
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Router VPN exact SHA ${GITHUB_SHA}" \
              --notes-file dist/exact-sha-release-notes.md \
              --prerelease
          fi
          mapfile -d '' ASSETS < <(find dist/exact-sha-release -maxdepth 1 -type f -print0 | sort -z)
          test "${#ASSETS[@]}" -eq 12
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify release target, tag and uploaded asset digests
        run: |
          set -euo pipefail
          TAG="router-vpn-sha-${GITHUB_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > dist/exact-sha-release-api.json
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > dist/exact-sha-tag-api.json
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          tag = "router-vpn-sha-" + sha
          root = Path("dist/exact-sha-release")
          release = json.loads(Path("dist/exact-sha-release-api.json").read_text())
          ref = json.loads(Path("dist/exact-sha-tag-api.json").read_text())
          assert release["tag_name"] == tag, release
          assert release["target_commitish"] == sha, release
          assert release["draft"] is False, release
          assert ref["object"]["type"] == "commit" and ref["object"]["sha"] == sha, ref
          expected = {path.name: path for path in root.iterdir() if path.is_file()}
          actual = {item["name"]: item for item in release.get("assets", [])}
          assert set(actual) == set(expected), (sorted(actual), sorted(expected))
          for name, path in expected.items():
              item = actual[name]
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              assert int(item["size"]) == path.stat().st_size, (name, item)
              assert item.get("digest") == digest, (name, item.get("digest"), digest)
          print("exact-SHA GitHub Release assets verified", tag)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-exact-sha-release-${{ github.sha }}
          path: |
            dist/exact-sha-release/**
            dist/exact-sha-release-api.json
            dist/exact-sha-tag-api.json
          if-no-files-found: error
          retention-days: 30
