name: Imported Naive H2 source and native reference
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  naive-h2-apple-graphs:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Export all 81 actual Swift Naive H2 source graphs
        shell: bash
        env:
          ROUTERVPN_APPLE_IMPORTED_NAIVE_H2_FIXTURES: ${{ runner.temp }}/naive-h2-apple
          ROUTERVPN_APPLE_NAIVE_H2_HOME_GRAPHS: ${{ runner.temp }}/naive-h2-home-apple
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/naive-h2-apple" "$RUNNER_TEMP/naive-h2-home-apple"
          python3 deploy/test_ios_tor_profile.py
      - uses: actions/upload-artifact@v4
        with:
          name: imported-naive-h2-apple-graphs
          path: ${{ runner.temp }}/naive-h2-apple
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: imported-naive-h2-home-apple-graphs
          path: ${{ runner.temp }}/naive-h2-home-apple
          if-no-files-found: error
          retention-days: 7

  imported-naive-h2-reference:
    needs: naive-h2-apple-graphs
    runs-on: ubuntu-24.04
    # Keep the original reference job's budget intact. These new, separate
    # parser/protocol/peer stages have their own finite aggregate allowance.
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: go1.26.3
      GOMAXPROCS: '2'
      GOGC: '60'
      GOMEMLIMIT: 2048MiB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the actual Android JSON dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libandroid-json-java
      - name: Prepare the exact captured Naive H2 desktop reference sources
        shell: bash
        run: |
          set -euo pipefail
          native_core="$RUNNER_TEMP/routervpn-imported-naive-h2-core"
          native_xray="$RUNNER_TEMP/routervpn-imported-naive-h2-xray"
          git init "$native_core"
          git -C "$native_core" remote add origin https://github.com/SagerNet/sing-box.git
          git -C "$native_core" fetch --depth=1 origin 1ac1a339cb1223e9c70eae14c44411c75033c02d
          git -C "$native_core" checkout --detach FETCH_HEAD
          git init "$native_xray"
          git -C "$native_xray" remote add origin https://github.com/XTLS/Xray-core.git
          git -C "$native_xray" fetch --depth=1 origin 50231eaff98ccc31b5cbd247a721c16e97fe5ec1
          git -C "$native_xray" checkout --detach FETCH_HEAD
          python3 deploy/prepare-relay-core.py "$native_core" "$native_xray"
          python3 deploy/prepare-mobile-performance.py "$native_core"
          python3 deploy/mobile_openvpn_close_policy.py "$native_core"
          python3 deploy/prepare-desktop-external.py "$native_core"
          python3 deploy/prepare-mobile-buffers.py "$native_core"
          (cd "$native_core" && go mod tidy)
      - uses: actions/download-artifact@v4
        with:
          name: imported-naive-h2-apple-graphs
          path: ${{ runner.temp }}/naive-h2-apple
      - uses: actions/download-artifact@v4
        with:
          name: imported-naive-h2-home-apple-graphs
          path: ${{ runner.temp }}/naive-h2-home-apple
      - name: Export all 81 actual Android and desktop Naive H2 source graphs
        timeout-minutes: 20
        env:
          ROUTERVPN_ANDROID_IMPORTED_NAIVE_H2_FIXTURES: ${{ runner.temp }}/naive-h2-android
          ROUTERVPN_DESKTOP_IMPORTED_NAIVE_H2_FIXTURES: ${{ runner.temp }}/naive-h2-desktop
          ROUTERVPN_ANDROID_NAIVE_H2_HOME_GRAPHS: ${{ runner.temp }}/naive-h2-home-android
          ROUTERVPN_DESKTOP_NAIVE_H2_HOME_GRAPHS: ${{ runner.temp }}/naive-h2-home-desktop
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/naive-h2-android" "$RUNNER_TEMP/naive-h2-desktop" "$RUNNER_TEMP/naive-h2-home-android" "$RUNNER_TEMP/naive-h2-home-desktop"
          python3 android/test_android_imported_router.py \
            --phase naive-h2--socks5 --phase naive-h2--shadowsocks \
            --phase naive-h2--hysteria2 --phase naive-h2--http-connect \
            --phase naive-h2--https-connect --phase naive-h2--wireguard \
            --phase naive-h2--amneziawg --phase naive-h2--openvpn-tcp \
            --phase naive-h2--openvpn-udp
          go test -race ./cmd/client -run '^TestDesktopImportedNaiveH2' -count=1 -timeout=180s
      - name: Execute separate Naive H2 parser protocol and imported peer inventories
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          python3 deploy/test_imported_naive_h2_workflow.py
          python3 deploy/test_mobile_imported_naive_h2_runner.py
          python3 deploy/test_mobile_imported_naive_h2.py \
            "$RUNNER_TEMP/routervpn-imported-naive-h2-core" \
            --android "$RUNNER_TEMP/naive-h2-android" --apple "$RUNNER_TEMP/naive-h2-apple" \
            --desktop "$RUNNER_TEMP/naive-h2-desktop" \
            --android-home "$RUNNER_TEMP/naive-h2-home-android" --apple-home "$RUNNER_TEMP/naive-h2-home-apple" \
            --desktop-home "$RUNNER_TEMP/naive-h2-home-desktop"
          python3 deploy/test_mobile_imported_naive_h2.py \
            "$RUNNER_TEMP/routervpn-imported-naive-h2-core" --loopback-only
          python3 deploy/test_mobile_imported_naive_h2.py \
            "$RUNNER_TEMP/routervpn-imported-naive-h2-core" --reference-only
