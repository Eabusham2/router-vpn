name: Wire release gaps

on:
  push:
    branches: [main]
    paths:
      - 'deploy/wire-release-gaps.py'
      - 'deploy/finalize-release-wiring.py'
      - '.github/workflows/wire-release-gaps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wire-release-gaps-main
  cancel-in-progress: false

jobs:
  wire:
    if: github.repository == 'Eabusham2/router-vpn'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Rebase to latest main and apply idempotent wiring
        run: |
          set -euo pipefail
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          python3 deploy/finalize-release-wiring.py
          gofmt -w cmd/client/main.go cmd/client/bundle_staging.go cmd/client/bundle_staging_test.go
          go test ./cmd/client ./internal/common
          python3 deploy/full-audit-v4.py
          python3 deploy/release-gap-audit.py
          git diff --check
      - name: Push only the validated live wiring changes
        run: |
          set -euo pipefail
          if git diff --quiet -- cmd/client/main.go server/portainer-current.yaml deploy/full-audit-v4.py; then
            echo 'Release-gap wiring is already applied.'
            exit 0
          fi
          git add cmd/client/main.go server/portainer-current.yaml deploy/full-audit-v4.py
          git commit -m 'Wire atomic imports and AI-aware Setup Center'
          git pull --rebase origin main
          git push origin HEAD:main
