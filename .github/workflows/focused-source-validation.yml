name: Focused source validation

run-name: Focused ${{ inputs.suite }} at ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit to validate
        required: true
        type: string
      suite:
        description: Fixed validation suite
        required: true
        type: choice
        options:
          - ordered-clock
          - legacy-clock
          - android-tor
          - android-prefix-owner
          - linux-hy2
          - socks-source
          - macos-profiles
          - socks-runtime
          - socks-owner
          - socks-bridge
          - socks-mtu
          - darwin-hy2

permissions:
  contents: read

concurrency:
  group: focused-source-${{ inputs.source_sha }}-${{ inputs.suite }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOFLAGS: '-p=2 -mod=readonly'

jobs:
  validate:
    runs-on: ${{ inputs.suite == 'macos-profiles' && 'macos-15-intel' || inputs.suite == 'darwin-hy2' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (inputs.suite == 'macos-profiles' || inputs.suite == 'darwin-hy2') && 45 || 30 }}
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SUITE: ${{ inputs.suite }}
      VALIDATOR_SHA: ${{ github.sha }}
    steps:
      - name: Validate the requested source and dispatch identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          if os.environ.get("GITHUB_REPOSITORY") != "Eabusham2/router-vpn" or os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("Focused validation requires the captured main workflow.")
          for name in ("SOURCE_SHA", "VALIDATOR_SHA"):
              if not re.fullmatch(r"[0-9a-f]{40}", os.environ.get(name, "")):
                  raise SystemExit(name + " must be a complete lowercase Git commit.")
          if os.environ.get("SUITE") not in ("ordered-clock", "legacy-clock", "android-tor", "android-prefix-owner", "linux-hy2", "socks-source", "macos-profiles", "socks-runtime", "socks-owner", "socks-mtu", "darwin-hy2", "socks-bridge"):
              raise SystemExit("Unknown focused validation suite.")
          PY
      - name: Check out the trusted validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: validator
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the exact candidate and its original parent
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Install Python for the native macOS source fixtures
        if: inputs.suite == 'macos-profiles' || inputs.suite == 'darwin-hy2'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the original canonical macOS temporary root
        if: inputs.suite == 'macos-profiles' || inputs.suite == 'darwin-hy2'
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify source identity and required validator controls
        shell: bash
        run: |
          python3 validator/deploy/focused_source_identity.py --self-test
          python3 validator/deploy/test_focused_multihop_clocks.py --self-test
          if [[ "$SUITE" == "macos-profiles" ]]; then
            python3 validator/deploy/test_validate_macos_profile_source.py
          fi
          if [[ "$SUITE" == "socks-mtu" ]]; then
            python3 validator/deploy/test_focused_socks_mtu_runner.py
          fi
          if [[ "$SUITE" == "darwin-hy2" ]]; then
            python3 validator/deploy/test_validate_darwin_hy2_source.py
          fi
          if [[ "$SUITE" == "socks-runtime" ]]; then
            python3 validator/deploy/test_focused_socks_runtime_runner.py
          fi
          if [[ "$SUITE" == "socks-bridge" ]]; then
            python3 validator/deploy/test_focused_socks_bridge_runner.py
          fi
          if [[ "$SUITE" == "socks-owner" ]]; then
            python3 validator/deploy/test_validate_node_chain_socks_owner.py
          fi
          if [[ "$SUITE" == "socks-source" ]]; then
            python3 validator/deploy/test_focused_socks_source_runner.py
          fi
          if [[ "$SUITE" == "linux-hy2" ]]; then
            python3 validator/deploy/test_validate_linux_hy2_source.py
          fi
          python3 validator/deploy/focused_source_identity.py \
            --suite "$SUITE" --source "$GITHUB_WORKSPACE/candidate" \
            --source-sha "$SOURCE_SHA" --base-sha "$VALIDATOR_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/selection.json"
      - name: Install the pinned Go toolchain
        if: inputs.suite != 'macos-profiles'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: candidate/go.sum
      - name: Install the Java fixture toolchain
        if: inputs.suite == 'android-tor' || inputs.suite == 'android-prefix-owner'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the original Android JSON implementation
        if: inputs.suite == 'android-tor' || inputs.suite == 'android-prefix-owner'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libandroid-json-java
      - name: Install the Linux encrypted-reference compiler dependencies
        if: inputs.suite == 'linux-hy2' || inputs.suite == 'socks-owner' || inputs.suite == 'socks-bridge'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config
      - name: Require the original clock cases and compiled negative controls
        if: inputs.suite == 'ordered-clock' || inputs.suite == 'legacy-clock'
        shell: bash
        run: |
          python3 validator/deploy/test_focused_multihop_clocks.py \
            --suite "$SUITE" --source "$GITHUB_WORKSPACE/candidate" \
            --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests"
      - name: Compile original macOS profile callbacks and all causal controls
        if: inputs.suite == 'macos-profiles'
        shell: bash
        run: |
          python3 validator/deploy/validate-macos-profile-source.py \
            --source "$GITHUB_WORKSPACE/candidate" --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests"
      - name: Require original typed SOCKS MTU planner and owner controls
        if: inputs.suite == 'socks-mtu'
        shell: bash
        run: |
          python3 validator/deploy/test_focused_socks_mtu.py \
            --suite "$SUITE" --source "$GITHUB_WORKSPACE/candidate" \
            --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests"
      - name: Compile original Darwin HY2 sources and encrypted reference
        if: inputs.suite == 'darwin-hy2'
        shell: bash
        run: |
          python3 candidate/deploy/test_macos_node_chain_host_runner.py
          python3 candidate/deploy/test_macos_node_candidate_prefix_host_runner.py
          python3 validator/deploy/validate-darwin-hy2-source.py \
            --source "$GITHUB_WORKSPACE/candidate" --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests"
      - name: Require typed SOCKS runtime and preserved proof lifecycle controls
        if: inputs.suite == 'socks-runtime'
        shell: bash
        run: |
          python3 validator/deploy/test_focused_socks_runtime.py \
            --suite "$SUITE" --source "$GITHUB_WORKSPACE/candidate" \
            --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests"
      - name: Compile typed native SOCKS composition and original encrypted owners
        if: inputs.suite == 'socks-bridge'
        shell: bash
        run: |
          python3 validator/deploy/test_focused_socks_bridge.py \
            --suite "$SUITE" --source "$GITHUB_WORKSPACE/candidate" \
            --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests"
      - name: Require original encrypted SOCKS association ownership
        if: inputs.suite == 'socks-owner'
        shell: bash
        run: |
          python3 validator/deploy/validate-node-chain-socks-owner.py \
            --source "$GITHUB_WORKSPACE/candidate" --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests"
      - name: Require dormant SOCKS source and original schema compiler controls
        if: inputs.suite == 'socks-source'
        shell: bash
        run: |
          python3 validator/deploy/test_focused_socks_source.py \
            --suite "$SUITE" --source "$GITHUB_WORKSPACE/candidate" \
            --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests"
      - name: Require complete installed HY2 sources and original encrypted peers
        if: inputs.suite == 'linux-hy2'
        shell: bash
        run: |
          python3 validator/deploy/validate-linux-hy2-source.py \
            --source "$GITHUB_WORKSPACE/candidate" --source-sha "$SOURCE_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/tests" --go "$(command -v go)"
      - name: Execute the original Android fixture and required rejection controls
        if: inputs.suite == 'android-tor' || inputs.suite == 'android-prefix-owner'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, signal, subprocess, sys, time
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "candidate"
          output = Path(os.environ["GITHUB_WORKSPACE"]) / "validation-output" / "tests"
          output.mkdir(parents=True, exist_ok=False)
          import runpy
          trusted = runpy.run_path(str(Path(os.environ["GITHUB_WORKSPACE"]) / "validator" / "deploy" / "test_focused_multihop_clocks.py"))
          def git(*args):
              return trusted["git"](source, *args)
          def snapshot():
              return trusted["snapshot"](source)
          before = snapshot()
          actual = git("rev-parse", "HEAD").decode().strip()
          if actual != os.environ["SOURCE_SHA"]:
              raise SystemExit("Android source identity changed before execution.")
          suite = os.environ["SUITE"]
          manifest = {
              "schema": 1, "suite": suite, "requested_source_sha": os.environ["SOURCE_SHA"],
              "actual_source_sha": actual, "validator_sha": os.environ["VALIDATOR_SHA"],
              "tree_sha": git("rev-parse", "HEAD^{tree}").decode().strip(),
              "source_file_count": len(before),
              "source_closure_sha256": hashlib.sha256(json.dumps(before, sort_keys=True, separators=(",", ":")).encode()).hexdigest(),
              "status": "running", "outer_seconds": 1200,
          }
          def save():
              (output / "manifest.json").write_text(json.dumps(manifest, sort_keys=True, indent=2) + "\n")
          def alive(group):
              try:
                  os.killpg(group, 0)
                  return True
              except ProcessLookupError:
                  return False
          def join_group(group, seconds):
              end = time.monotonic() + seconds
              while alive(group) and time.monotonic() < end:
                  time.sleep(0.02)
              return not alive(group)
          save()
          scripts = {
              "android-tor": "android/test_android_tor_profile.py",
              "android-prefix-owner": "android/test_android_node_candidate_preparation_owner.py",
          }
          log = output / (suite + ".log")
          command = [sys.executable, str(source / scripts[suite])]
          started = time.monotonic()
          try:
              with log.open("wb") as stream:
                  process = subprocess.Popen(command, cwd=source, stdout=stream,
                                             stderr=subprocess.STDOUT, start_new_session=True)
                  manifest["pid"] = process.pid
                  save()
                  timed_out = False
                  try:
                      code = process.wait(timeout=1200)
                  except subprocess.TimeoutExpired:
                      timed_out = True
                      os.killpg(process.pid, signal.SIGKILL)
                      code = process.wait(timeout=10)
                  joined = join_group(process.pid, 5)
                  if not joined:
                      os.killpg(process.pid, signal.SIGKILL)
                      joined_after_kill = join_group(process.pid, 5)
                  else:
                      joined_after_kill = True
              raw = log.read_bytes()
              text = raw.decode("utf-8", "replace")
              tor_markers = (
                  r"Android Tor: PASS \(348 shipping Java/Go graphs; [1-9][0-9]* checks; OS/startup doubled, native Tor traffic separate\)",
                  r"Android Tor capacity negative controls: 2 rejected by real compiler/host preparation",
                  r"Android Local Tor padding compiler: PASS \(160 shipping Java/Go captures; [1-9][0-9]* source/policy/session checks; actual production admission\)",
              )
              owner_markers = (
                  r"Android temporary candidate process owner: [1-9][0-9]* executable composed host checks passed; explicit OS/native/source boundaries\.",
                  *(re.escape("Android temporary candidate supervisor rejected: " + family + "/" + str(number))
                    for number, family in enumerate(("permission", "complete", "graph-join", "complete", "complete", "complete", "complete"))),
              )
              markers = tor_markers if suite == "android-tor" else owner_markers
              counts = [len(re.findall(r"^" + marker + r"$", text, re.MULTILINE)) for marker in markers]
              manifest.update(exit=code, timed_out=timed_out, process_group_joined=joined,
                              group_absent_after_cleanup=joined_after_kill, marker_counts=counts,
                              elapsed_seconds=round(time.monotonic() - started, 3),
                              log=log.name, log_sha256=hashlib.sha256(raw).hexdigest())
              if timed_out or code != 0 or not joined or counts != [1] * len(markers):
                  raise RuntimeError("Original Android execution or its required controls did not finish.")
              if snapshot() != before or git("status", "--porcelain", "--untracked-files=no"):
                  raise RuntimeError("Android fixture changed its original tracked source.")
              manifest["status"] = "passed"
              print(json.dumps(manifest, sort_keys=True), flush=True)
          except BaseException as error:
              manifest["status"] = "failed"
              manifest["error"] = str(error)
              raise
          finally:
              save()
          PY
      - name: Recheck the original source after successful validation
        shell: bash
        run: |
          python3 validator/deploy/focused_source_identity.py \
            --suite "$SUITE" --source "$GITHUB_WORKSPACE/candidate" \
            --source-sha "$SOURCE_SHA" --base-sha "$VALIDATOR_SHA" \
            --output "$GITHUB_WORKSPACE/validation-output/selection-after.json"
      - name: Preserve exact-source results and failure logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: focused-${{ inputs.suite }}-${{ inputs.source_sha }}
          path: validation-output/
          if-no-files-found: error
          retention-days: 14
