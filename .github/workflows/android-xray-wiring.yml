name: Android Xray wiring

on:
  push:
    branches: [main]
    paths:
      - 'android/migrate-mainactivity-xray.py'
      - '.github/workflows/android-xray-wiring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase on live main
        run: git pull --rebase origin main
      - name: Apply guarded MainActivity migration
        run: python3 android/migrate-mainactivity-xray.py
      - name: Validate Android source contract
        run: |
          python3 android/test_android_runtime_contract.py
          grep -q 'private NativeXrayController xray;' android/app/src/main/java/com/eabusham/routervpn/MainActivity.java
          grep -q 'private void chooseXrayMode()' android/app/src/main/java/com/eabusham/routervpn/MainActivity.java
          grep -q 'Native Xray:' android/app/src/main/java/com/eabusham/routervpn/MainActivity.java
      - name: Push migration result
        run: |
          if git diff --quiet -- android/app/src/main/java/com/eabusham/routervpn/MainActivity.java; then
            echo 'MainActivity already current'
            exit 0
          fi
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git add android/app/src/main/java/com/eabusham/routervpn/MainActivity.java
          git commit -m 'Wire native Android Xray UI'
          git pull --rebase origin main
          git push origin HEAD:main
