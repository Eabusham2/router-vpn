name: Android runtime UI wiring

on:
  push:
    branches: [main]
    paths:
      - 'android/migrate-mainactivity-xray.py'
      - 'android/migrate-mainactivity-all.py'
      - 'android/migrate-native-policy.py'
      - 'android/test_android_runtime_contract.py'
      - 'android/test_android_native_policy_contract.py'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidNativeProfilePolicy.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidUnderlyingNetworkMonitor.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/NativeWireGuardController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/NativeAmneziaWGController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/NativeXrayController.java'
      - '.github/workflows/android-xray-wiring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase on live main
        run: git pull --rebase origin main
      - name: Apply guarded Android runtime migrations
        run: |
          python3 android/migrate-mainactivity-xray.py
          python3 android/migrate-mainactivity-all.py
          python3 android/migrate-native-policy.py
      - name: Validate Android source contracts
        run: |
          python3 android/test_android_runtime_contract.py
          python3 android/test_android_native_policy_contract.py
          grep -q 'private NativeXrayController xray;' android/app/src/main/java/com/eabusham/routervpn/MainActivity.java
          grep -q 'private void requestAll()' android/app/src/main/java/com/eabusham/routervpn/MainActivity.java
          grep -q 'AndroidNativeProfilePolicy.selectedPlainUdpDns(root)' android/app/src/main/java/com/eabusham/routervpn/NativeXrayController.java
      - name: Push migration result
        run: |
          if git diff --quiet -- android/app/src/main/java/com/eabusham/routervpn/MainActivity.java android/app/src/main/java/com/eabusham/routervpn/NativeXrayController.java; then
            echo 'Android runtime wiring already current'
            exit 0
          fi
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git add android/app/src/main/java/com/eabusham/routervpn/MainActivity.java android/app/src/main/java/com/eabusham/routervpn/NativeXrayController.java
          git commit -m 'Wire Android native DNS MTU recovery truth'
          git pull --rebase origin main
          git push origin HEAD:main
