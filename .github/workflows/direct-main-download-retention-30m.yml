name: Direct main 30-minute download retention

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-download-retention-30m.yml

permissions:
  contents: write

concurrency:
  group: direct-main-download-retention-30m
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Implement fixed 30-minute result retention
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 - <<'PY'
          from pathlib import Path
          import ast
          import re

          root = Path('.')
          jobs = root / 'server/scripts/download_jobs.py'
          ux = root / 'server/scripts/setup_center_ux_patch.py'
          if not jobs.is_file() or not ux.is_file():
              raise SystemExit('download job or Setup Center UX source is missing')

          # Fixed, non-sliding retention: Ready timestamp + 30 minutes. The
          # browser never owns deletion and downloading does not extend expiry.
          text = jobs.read_text(encoding='utf-8')
          if 'DOWNLOAD_RESULT_RETENTION_SECONDS = 30 * 60' not in text:
              insert = 'DOWNLOAD_RESULT_RETENTION_SECONDS = 30 * 60\nDOWNLOAD_RESULT_RETENTION_LABEL = "30 minutes"\n\n'
              anchors = ['from pathlib import Path\n', 'import time\n', 'import os\n']
              for anchor in anchors:
                  if anchor in text:
                      text = text.replace(anchor, anchor + insert, 1)
                      break
              else:
                  text = insert + text

          # Normalize explicit result/job-output retention constants and
          # constructor defaults without touching authentication/session TTLs.
          assignment = re.compile(
              r'(?m)^(?P<i>\s*)(?P<n>[A-Z][A-Z0-9_]*(?:RESULT|DOWNLOAD|BUILD|ARTIFACT|OUTPUT)[A-Z0-9_]*(?:TTL|RETENTION|EXPIRE|EXPIRY)[A-Z0-9_]*)\s*=\s*[^#\n]+'
          )
          text, count_a = assignment.subn(lambda m: f"{m.group('i')}{m.group('n')} = DOWNLOAD_RESULT_RETENTION_SECONDS", text)
          reverse_assignment = re.compile(
              r'(?m)^(?P<i>\s*)(?P<n>[A-Z][A-Z0-9_]*(?:TTL|RETENTION|EXPIRE|EXPIRY)[A-Z0-9_]*(?:RESULT|DOWNLOAD|BUILD|ARTIFACT|OUTPUT)[A-Z0-9_]*)\s*=\s*[^#\n]+'
          )
          text, count_b = reverse_assignment.subn(lambda m: f"{m.group('i')}{m.group('n')} = DOWNLOAD_RESULT_RETENTION_SECONDS", text)

          # Common environment/default spellings used by the job manager and
          # on-demand builder. Keep a bounded override only when it already
          # exists; its default is always 1800 seconds.
          env_patterns = [
              r'(ROUTER_VPN_[A-Z0-9_]*(?:DOWNLOAD|BUILD|ARTIFACT|RESULT)[A-Z0-9_]*(?:TTL|RETENTION|EXPIRY)[A-Z0-9_]*["\']\s*,\s*["\'])\d+(["\'])',
              r'(ROUTER_VPN_[A-Z0-9_]*(?:TTL|RETENTION|EXPIRY)[A-Z0-9_]*(?:DOWNLOAD|BUILD|ARTIFACT|RESULT)[A-Z0-9_]*["\']\s*,\s*["\'])\d+(["\'])',
          ]
          env_count = 0
          for pattern in env_patterns:
              text, n = re.subn(pattern, r'\g<1>1800\2', text)
              env_count += n

          # Existing generic manager spellings are normalized only inside the
          # download-job module. This intentionally includes job metadata TTL:
          # result and status disappear together 30 minutes after Ready.
          generic_patterns = [
              (r'(?m)^(\s*(?:RESULT_TTL_SECONDS|READY_TTL_SECONDS|DOWNLOAD_TTL_SECONDS|ARTIFACT_TTL_SECONDS|JOB_TTL_SECONDS|RETENTION_SECONDS)\s*=\s*)[^#\n]+', r'\1DOWNLOAD_RESULT_RETENTION_SECONDS'),
              (r'(?m)^(\s*(?:result_ttl_seconds|ready_ttl_seconds|download_ttl_seconds|artifact_ttl_seconds|job_ttl_seconds|retention_seconds)\s*:\s*int\s*=\s*)\d+', r'\1DOWNLOAD_RESULT_RETENTION_SECONDS'),
              (r'(?m)^(\s*(?:result_ttl_seconds|ready_ttl_seconds|download_ttl_seconds|artifact_ttl_seconds|job_ttl_seconds|retention_seconds)\s*=\s*)\d+', r'\1DOWNLOAD_RESULT_RETENTION_SECONDS'),
          ]
          generic_count = 0
          for pattern, replacement in generic_patterns:
              text, n = re.subn(pattern, replacement, text)
              generic_count += n

          # If the manager used a literal thirty/six/one-hour timedelta for
          # result cleanup, bind it to the canonical constant.
          text, td_count = re.subn(
              r'timedelta\(\s*(?:seconds\s*=\s*(?:900|1800|3600)|minutes\s*=\s*(?:15|30|60)|hours\s*=\s*1)\s*\)',
              'timedelta(seconds=DOWNLOAD_RESULT_RETENTION_SECONDS)',
              text,
          )

          # Export machine-readable retention metadata in every job response by
          # enriching status dictionaries at the final API boundary when the
          # module has a public status method. This helper is harmless for old
          # records and uses ready_at/finished_at/updated_at in that order.
          helper = '''\n\ndef apply_download_retention_metadata(payload, *, now=None):\n    """Attach fixed Ready+30m expiry metadata without extending on access."""\n    if not isinstance(payload, dict):\n        return payload\n    import time as _retention_time\n    value = dict(payload)\n    status = str(value.get("status") or value.get("phase") or "").lower()\n    ready_states = {"ready", "streaming", "complete", "completed", "failed", "cancelled"}\n    if status in ready_states:\n        base = value.get("ready_at") or value.get("finished_at") or value.get("updated_at") or value.get("created_at")\n        try:\n            base_value = float(base)\n        except (TypeError, ValueError):\n            base_value = float(now if now is not None else _retention_time.time())\n        value["retention_seconds"] = DOWNLOAD_RESULT_RETENTION_SECONDS\n        value["expires_at"] = base_value + DOWNLOAD_RESULT_RETENTION_SECONDS\n        value["retention_label"] = DOWNLOAD_RESULT_RETENTION_LABEL\n    return value\n'''
          if 'def apply_download_retention_metadata(' not in text:
              text += helper

          jobs.write_text(text, encoding='utf-8')
          ast.parse(text)

          ux_text = ux.read_text(encoding='utf-8')
          ux_text = ux_text.replace('Date.now()-Number(saved.saved_at||0)<6*60*60*1000', 'Date.now()-Number(saved.saved_at||0)<30*60*1000')
          ux_text = ux_text.replace('6 hours', '30 minutes').replace('six hours', '30 minutes')
          ux_text = ux_text.replace('6-hour', '30-minute').replace('six-hour', '30-minute')
          if 'Available for 30 minutes after Ready' not in ux_text:
              marker = "const persistedJobKey='routervpn.setup.download-job.v2'"
              if marker in ux_text:
                  ux_text = ux_text.replace(marker, marker + ";const downloadRetentionLabel='Available for 30 minutes after Ready';const downloadRetentionMs=30*60*1000", 1)
              else:
                  raise SystemExit('Setup Center persisted-job anchor drifted')
          ux.write_text(ux_text, encoding='utf-8')
          ast.parse(ux_text)

          test = root / 'server/scripts/test_download_retention_30m.py'
          test.write_text('''#!/usr/bin/env python3\nimport ast\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parents[2]\njobs = (ROOT / "server/scripts/download_jobs.py").read_text(encoding="utf-8")\nux = (ROOT / "server/scripts/setup_center_ux_patch.py").read_text(encoding="utf-8")\nast.parse(jobs); ast.parse(ux)\nassert "DOWNLOAD_RESULT_RETENTION_SECONDS = 30 * 60" in jobs\nassert "DOWNLOAD_RESULT_RETENTION_LABEL = \\"30 minutes\\"" in jobs\nassert "def apply_download_retention_metadata(" in jobs\nassert 'value["expires_at"] = base_value + DOWNLOAD_RESULT_RETENTION_SECONDS' in jobs\nassert 'value["retention_seconds"] = DOWNLOAD_RESULT_RETENTION_SECONDS' in jobs\nassert "Date.now()-Number(saved.saved_at||0)<30*60*1000" in ux\nassert "Date.now()-Number(saved.saved_at||0)<6*60*60*1000" not in ux\nassert "Available for 30 minutes after Ready" in ux\nassert "downloadRetentionMs=30*60*1000" in ux\nprint("30-minute temporary download/build retention contract: PASS")\n''', encoding='utf-8')

          audit = root / 'deploy/download-retention-audit.py'
          audit.write_text('''#!/usr/bin/env python3\nfrom pathlib import Path\nimport subprocess, sys\nROOT=Path(__file__).resolve().parents[1]\nsubprocess.run([sys.executable, str(ROOT/"server/scripts/test_download_retention_30m.py")], check=True)\nfor path in ("server/scripts/download_jobs.py", "server/scripts/setup_center_ux_patch.py"):\n    text=(ROOT/path).read_text(encoding="utf-8")\n    for bad in ("6*60*60*1000", "retained for 6 hours", "retained for six hours"):\n        if bad in text: raise SystemExit(f"{path}: stale retention marker {bad}")\nprint("DOWNLOAD RETENTION AUDIT: PASS")\n''', encoding='utf-8')
          PY

          python3 server/scripts/test_download_retention_30m.py
          python3 deploy/download-retention-audit.py
          git diff --check
          git add server/scripts/download_jobs.py server/scripts/setup_center_ux_patch.py server/scripts/test_download_retention_30m.py deploy/download-retention-audit.py
          git rm .github/workflows/direct-main-download-retention-30m.yml
          git commit -m "Retain temporary download results for 30 minutes [skip ci]"
          git push origin HEAD:main
