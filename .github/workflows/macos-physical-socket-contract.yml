name: macOS physical socket ownership

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/mobiletor/**'
      - '!internal/mobiletor/desktop_socket_windows*.go'
      - '!internal/mobiletor/desktop_socket_native_windows*.go'
      - 'internal/common/**'
      - 'deploy/test_desktop_darwin_guardian.py'
      - 'deploy/test_desktop_darwin_guardian_runner.py'
      - 'deploy/test_desktop_socket_uid.py'
      - 'deploy/prepare-desktop-external.py'
      - '.github/workflows/macos-physical-socket-contract.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/mobiletor/**'
      - '!internal/mobiletor/desktop_socket_windows*.go'
      - '!internal/mobiletor/desktop_socket_native_windows*.go'
      - 'internal/common/**'
      - 'deploy/test_desktop_darwin_guardian.py'
      - 'deploy/test_desktop_darwin_guardian_runner.py'
      - 'deploy/test_desktop_socket_uid.py'
      - 'deploy/prepare-desktop-external.py'
      - '.github/workflows/macos-physical-socket-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anchor-lifetime-probe:
    name: Native single-filter PF anchor lifetime on ${{ matrix.runner }}
    concurrency:
      group: macos-pf-anchor-probe-${{ github.workflow }}-${{ github.ref }}-${{ matrix.runner }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Prove actual single-filter commit and rollback retire their native namespace
        # This diagnostic does not alter the production PF loader or replace
        # the full guardian/mutation gate below. Native anchor absence is
        # required; empty filter output alone is not a passing result.
        run: python3 deploy/test_desktop_darwin_guardian.py . --go "$(command -v go)" --case FilterOnlyRetirement
      - name: Prove typed native filter fields and reject broken private ABI projections
        # This separately exercises the proposed native loader; the shipping
        # PFLoad call path stays unchanged until the native transaction passes.
        run: python3 deploy/test_desktop_darwin_guardian.py . --go "$(command -v go)" --case NativeFilterProjection --projection-mutations
      - name: Prove exact baseline transition and retained child ownership
        # The fixed native utility is still dormant in the shipping Python
        # path. This uses only a newly owned, scoped fixture namespace.
        run: python3 deploy/test_desktop_darwin_guardian.py . --go "$(command -v go)" --case BaselineTransition --baseline-mutations

  native-sockets:
    name: Native PF, socket and utun ownership on ${{ matrix.runner }}
    concurrency:
      group: macos-physical-sockets-${{ github.workflow }}-${{ github.ref }}-${{ matrix.runner }}
      # Finish each active native diagnostic. An unallocated ARM runner must
      # not prevent a completed Intel lane from testing its next correction.
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify bounded native failure diagnostics
        run: python3 deploy/test_desktop_darwin_guardian_runner.py
      - name: Prove actual kernel boundaries and reject broken production variants
        # This compiles as the build user and elevates only the scoped native
        # fixture. It neither opens public Tor nor changes the runner's default
        # route, production Router VPN anchor, or global PF state table.
        run: python3 deploy/test_desktop_darwin_guardian.py . --go "$(command -v go)" --mutations
