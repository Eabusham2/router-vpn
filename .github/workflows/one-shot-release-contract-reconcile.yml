name: One-shot release contract reconciliation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-release-contract-reconcile.yml

permissions:
  contents: write

concurrency:
  group: one-shot-release-contract-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconcile provenance and Linux transform contracts
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          provenance = Path('deploy/source_provenance.py')
          text = provenance.read_text(encoding='utf-8')
          old = 'raise RuntimeError(f"provenance parent changed before adoption: {path.parent}")'
          new = 'raise RuntimeError(f"source provenance root changed before adoption: {path.parent}")'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('source provenance adoption diagnostic drifted')
          provenance.write_text(text, encoding='utf-8')

          source = Path('client/linux/routervpn-unified-shell-v8.inc')
          actual = hashlib.sha256(source.read_bytes()).hexdigest()
          allowed = {
              'b2d82155dce50cca68d74cd51a55c527f67438b2a21f871be945ea092f5c5a9e',
          }
          if actual not in allowed:
              raise SystemExit(f'unreviewed Linux unified source hash: {actual}')
          transform = Path('client/linux/apply-session-mutation.py')
          body = transform.read_text(encoding='utf-8')
          pattern = r"('routervpn-unified-shell-v8\.inc': \(')([0-9a-f]{64})(', \[)"
          match = re.search(pattern, body)
          if not match:
              raise SystemExit('Linux unified transform entry is missing')
          body = body[:match.start(2)] + actual + body[match.end(2):]
          transform.write_text(body, encoding='utf-8')
          PY
          python3 deploy/test_source_provenance.py
          python3 deploy/test_source_provenance_adoption_identity.py
          python3 deploy/test-production-release-compose.py
          python3 deploy/linux-session-mutation-audit.py
          python3 deploy/validate-repo.py
          git diff --check
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          git rm .github/workflows/one-shot-release-contract-reconcile.yml
          git add deploy/source_provenance.py client/linux/apply-session-mutation.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Reconcile exact-SHA provenance and Linux shipping contracts [skip ci]'
          git push origin HEAD:main
