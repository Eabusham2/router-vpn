name: Finish remaining direct-main closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finish-remaining-main.yml

permissions:
  contents: write

concurrency:
  group: finish-remaining-direct-main
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Apply any unconsumed verified finalizer patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          from pathlib import Path
          import subprocess

          workflow = Path('.github/workflows/finalize-auto-update-ownership.yml')
          if not workflow.is_file():
              print('Original finalizer already removed; no embedded patch remains.')
              raise SystemExit(0)

          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = None
          for index, line in enumerate(lines):
              if "cat > /tmp/router-vpn-auto-update.patch.gz.b64 <<'PATCH_B64'" in line:
                  start = index + 1
                  break
          if start is None:
              raise SystemExit('finalizer exists but embedded patch start is missing')
          encoded_lines: list[str] = []
          for line in lines[start:]:
              if line.strip() == 'PATCH_B64':
                  break
              encoded_lines.append(line.strip())
          else:
              raise SystemExit('finalizer exists but embedded patch terminator is missing')
          encoded = ''.join(encoded_lines)
          if not encoded:
              raise SystemExit('finalizer embedded patch is empty')
          patch = gzip.decompress(base64.b64decode(encoded))
          patch_path = Path('/tmp/router-vpn-final.patch')
          patch_path.write_bytes(patch)
          forward = subprocess.run(['git', 'apply', '--check', str(patch_path)]).returncode == 0
          reverse = subprocess.run(['git', 'apply', '--reverse', '--check', str(patch_path)]).returncode == 0
          if forward:
              subprocess.run(['git', 'apply', str(patch_path)], check=True)
              print('Applied the verified finalizer patch.')
          elif reverse:
              print('Verified finalizer patch was already applied.')
          else:
              raise SystemExit('embedded finalizer patch neither applies nor matches current source')
          PY

      - name: Remove proven-temporary finalizers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-auto-update-ownership.yml
          rm -f .github/workflows/finish-remaining-main.yml

      - name: Format and run authoritative source gates
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_go < <(git diff --name-only -- '*.go')
          if ((${#changed_go[@]})); then gofmt -w "${changed_go[@]}"; fi
          go test ./...
          go vet ./...
          for audit in \
            deploy/auto-update-audit.py \
            deploy/durable-state-transaction-audit.py \
            deploy/current-requirements-reconciliation-audit.py \
            deploy/product-shipping-audit.py \
            deploy/exact-head-blocker-audit.py \
            deploy/unified-map-shipping-audit.py \
            deploy/native-session-mutation-audit.py \
            deploy/recovered-requirements-1-264-audit.py \
            deploy/recovered-requirements-265-311-audit.py \
            deploy/recovered-addendum-312-356-audit.py \
            deploy/recovered-corrections-audit.py \
            deploy/validate-repo.py \
            deploy/release-orchestration-audit.py
          do
            test -f "$audit"
            python3 "$audit"
          done
          git diff --check

      - name: Commit completed closure directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No source change remained after verification.'
            exit 0
          fi
          git commit -m 'Finalize automatic update ownership and cleanup'
          git fetch origin main
          test "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)"
          git push origin HEAD:main
