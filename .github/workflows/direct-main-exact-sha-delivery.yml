name: Direct main exact-SHA delivery closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-exact-sha-delivery.yml

permissions:
  contents: write

concurrency:
  group: direct-main-exact-sha-delivery
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add exact-SHA release publication and delivery contracts
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          root=Path('.')
          rc_path=root/'.github/workflows/release-candidate.yml'
          if not rc_path.is_file(): raise SystemExit('release-candidate workflow is missing')
          rc=rc_path.read_text(encoding='utf-8')
          match=re.search(r'(?m)^name:\s*(.+?)\s*$', rc)
          if not match: raise SystemExit('release-candidate workflow name is missing')
          rc_name=match.group(1).strip().strip('"\'')

          publisher=root/'.github/workflows/publish-exact-sha-release-assets.yml'
          publisher.write_text(f'''name: Publish exact-SHA Router VPN release assets

on:
  workflow_run:
    workflows:
      - "{rc_name}"
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful release-candidate run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-exact-sha-release-${{{{ github.event.workflow_run.head_sha || github.event.inputs.run_id }}}}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{{{ github.token }}}}
      REPO: ${{{{ github.repository }}}}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and verify exact successful source generation
        id: exact
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{{{ github.event_name }}}}" = workflow_dispatch ]; then
            RUN_ID='${{{{ github.event.inputs.run_id }}}}'
            RUN_JSON="$(gh api "repos/$REPO/actions/runs/$RUN_ID")"
            CONCLUSION="$(jq -r .conclusion <<<"$RUN_JSON")"
            HEAD_BRANCH="$(jq -r .head_branch <<<"$RUN_JSON")"
            WORKFLOW_PATH="$(jq -r .path <<<"$RUN_JSON")"
            [ "$CONCLUSION" = success ] || {{ echo 'selected run is not successful' >&2; exit 1; }}
            [ "$HEAD_BRANCH" = main ] || {{ echo 'selected run is not a main run' >&2; exit 1; }}
            case "$WORKFLOW_PATH" in */release-candidate.yml) ;; *) echo 'selected run is not release-candidate.yml' >&2; exit 1 ;; esac
            SHA="$(jq -r .head_sha <<<"$RUN_JSON")"
          else
            RUN_ID='${{{{ github.event.workflow_run.id }}}}'
            SHA='${{{{ github.event.workflow_run.head_sha }}}}'
          fi
          [[ "$SHA" =~ ^[0-9a-f]{{40}}$ ]] || {{ echo 'release SHA must be full lowercase hexadecimal' >&2; exit 1; }}
          git fetch origin "$SHA"
          [ "$(git rev-parse FETCH_HEAD)" = "$SHA" ] || {{ echo 'fetched source identity mismatch' >&2; exit 1; }}
          git merge-base --is-ancestor "$SHA" origin/main || {{ echo 'release candidate is not on main' >&2; exit 1; }}
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag=router-vpn-$SHA" >> "$GITHUB_OUTPUT"
      - name: Download exact-run packages and manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming assets
          gh run download '${{{{ steps.exact.outputs.run_id }}}}' --repo "$REPO" --dir incoming
          find incoming -type f -size 0 -print -quit | grep -q . && {{ echo 'zero-length artifact member found' >&2; exit 1; }} || true
          python3 deploy/prepare-exact-sha-release-assets.py \
            --source incoming \
            --destination assets \
            --sha '${{{{ steps.exact.outputs.sha }}}}' \
            --run-id '${{{{ steps.exact.outputs.run_id }}}}'
      - name: Create or update immutable exact-SHA prerelease
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{{{ steps.exact.outputs.sha }}}}'
          TAG='${{{{ steps.exact.outputs.tag }}}'
          if gh release view "$TAG" --repo "$REPO" >/tmp/release.json 2>/dev/null; then
            TARGET="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"
            if [ "$TARGET" != "$SHA" ]; then
              TYPE="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type')"
              if [ "$TYPE" = tag ]; then TARGET="$(gh api "repos/$REPO/git/tags/$TARGET" --jq '.object.sha')"; fi
            fi
            [ "$TARGET" = "$SHA" ] || {{ echo 'existing exact-SHA tag points elsewhere' >&2; exit 1; }}
          else
            gh release create "$TAG" --repo "$REPO" --target "$SHA" --prerelease \
              --title "Router VPN exact SHA ${{SHA:0:12}}" \
              --notes "Exact-source Router VPN packages for $SHA. This is not a moving latest release."
          fi
          mapfile -d '' files < <(find assets -maxdepth 1 -type f -print0 | sort -z)
          [ "${{#files[@]}}" -gt 2 ] || {{ echo 'no exact-SHA package assets were prepared' >&2; exit 1; }}
          gh release upload "$TAG" --repo "$REPO" --clobber "${{files[@]}}"
      - name: Verify published release manifest and assets
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/verify-exact-sha-release-assets.py \
            --repo "$REPO" \
            --sha '${{{{ steps.exact.outputs.sha }}}}' \
            --tag '${{{{ steps.exact.outputs.tag }}}}'
''', encoding='utf-8')

          prepare=root/'deploy/prepare-exact-sha-release-assets.py'
          prepare.write_text(r'''#!/usr/bin/env python3
          from __future__ import annotations
          import argparse, hashlib, json, os, re, shutil, stat
          from pathlib import Path

          ALLOWED_SUFFIXES=(".zip",".msix",".msi",".exe",".dmg",".pkg",".tar.gz",".tgz",".deb",".rpm",".AppImage",".apk",".ipa",".json",".txt")
          MAX_FILE=4*1024*1024*1024
          SHA_RE=re.compile(r"^[0-9a-f]{40}$")
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024*1024), b""): h.update(block)
              return h.hexdigest()
          def allowed(path): return any(path.name.endswith(s) for s in ALLOWED_SUFFIXES)
          def main():
              ap=argparse.ArgumentParser(); ap.add_argument("--source",type=Path,required=True); ap.add_argument("--destination",type=Path,required=True); ap.add_argument("--sha",required=True); ap.add_argument("--run-id",required=True); args=ap.parse_args()
              if not SHA_RE.fullmatch(args.sha): raise SystemExit("invalid exact source SHA")
              args.destination.mkdir(mode=0o700,parents=True,exist_ok=True)
              rows=[]; names=set()
              for source in sorted(args.source.rglob("*")):
                  if source.is_symlink(): raise SystemExit(f"artifact member is a symlink: {source}")
                  if not source.is_file() or not allowed(source): continue
                  size=source.stat().st_size
                  if size<=0 or size>MAX_FILE: raise SystemExit(f"artifact member size is invalid: {source}")
                  relative=source.relative_to(args.source)
                  safe="--".join(relative.parts)
                  safe=re.sub(r"[^A-Za-z0-9._+-]","-",safe).strip(".-")
                  if not safe or safe in names: safe=f"{digest(source)[:12]}-{safe or 'asset'}"
                  names.add(safe); target=args.destination/safe
                  with source.open("rb") as inp, target.open("xb") as out:
                      shutil.copyfileobj(inp,out,1024*1024); out.flush(); os.fsync(out.fileno())
                  os.chmod(target,0o644)
                  rows.append({"name":safe,"size":size,"sha256":digest(target),"source_member":str(relative)})
              packages=[row for row in rows if not row["name"].endswith((".json",".txt"))]
              if not packages: raise SystemExit("release-candidate run did not contain package assets")
              manifest={"schema_version":1,"source_sha":args.sha,"workflow_run_id":str(args.run_id),"immutable_tag":f"router-vpn-{args.sha}","assets":rows}
              raw=(json.dumps(manifest,indent=2,sort_keys=True)+"\n").encode()
              (args.destination/"router-vpn-release-manifest.json").write_bytes(raw)
              lines=[f'{row["sha256"]}  {row["name"]}' for row in rows]
              (args.destination/"SHA256SUMS").write_text("\n".join(lines)+"\n",encoding="utf-8")
          if __name__=="__main__": main()
          ''', encoding='utf-8')

          verify=root/'deploy/verify-exact-sha-release-assets.py'
          verify.write_text(r'''#!/usr/bin/env python3
          from __future__ import annotations
          import argparse, json, os, re, urllib.request
          SHA_RE=re.compile(r"^[0-9a-f]{40}$")
          def request(url,token):
              req=urllib.request.Request(url,headers={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Authorization":f"Bearer {token}"})
              with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          def main():
              ap=argparse.ArgumentParser(); ap.add_argument("--repo",required=True); ap.add_argument("--sha",required=True); ap.add_argument("--tag",required=True); args=ap.parse_args()
              if not SHA_RE.fullmatch(args.sha) or args.tag!=f"router-vpn-{args.sha}": raise SystemExit("release identity mismatch")
              token=os.environ.get("GH_TOKEN",""); release=request(f"https://api.github.com/repos/{args.repo}/releases/tags/{args.tag}",token)
              if release.get("tag_name")!=args.tag or release.get("prerelease") is not True: raise SystemExit("release is not the immutable exact-SHA prerelease")
              names={row.get("name") for row in release.get("assets",[])}
              required={"router-vpn-release-manifest.json","SHA256SUMS"}
              if not required.issubset(names) or len(names-required)<1: raise SystemExit("published release assets are incomplete")
              target=request(f"https://api.github.com/repos/{args.repo}/git/ref/tags/{args.tag}",token).get("object",{})
              if target.get("type")=="tag": target=request(target.get("url"),token).get("object",{})
              if target.get("sha")!=args.sha: raise SystemExit("published release tag does not match source SHA")
              print("EXACT-SHA RELEASE ASSET VERIFICATION: PASS")
          if __name__=="__main__": main()
          ''', encoding='utf-8')

          # Permanent delivery audit verifies CI->immutable release->Setup Center
          # exact-SHA lookup->bounded local fallback->30-minute cleanup.
          audit=root/'deploy/exact-sha-download-delivery-audit.py'
          audit.write_text(r'''#!/usr/bin/env python3
          from pathlib import Path
          import re
          ROOT=Path(__file__).resolve().parents[1]; errors=[]
          def read(path):
              p=ROOT/path
              if not p.is_file(): errors.append(f"missing {path}"); return ""
              return p.read_text(encoding="utf-8",errors="replace")
          pub=read(".github/workflows/publish-exact-sha-release-assets.yml")
          for marker in ("workflow_run:","release-candidate.yml","router-vpn-$SHA","--target \"$SHA\"","--prerelease","gh release upload","verify-exact-sha-release-assets.py"):
              if marker not in pub: errors.append(f"release publisher missing {marker!r}")
          for bad in ("releases/latest","latest.zip","refs/heads/main"):
              if bad in pub: errors.append(f"release publisher contains moving selector {bad!r}")
          prepare=read("deploy/prepare-exact-sha-release-assets.py")
          for marker in ("source_sha","workflow_run_id","sha256","os.fsync","is_symlink"):
              if marker not in prepare: errors.append(f"release preparation missing {marker!r}")
          jobs=read("server/scripts/download_jobs.py"); ux=read("server/scripts/setup_center_ux_patch.py")
          for marker in ("DOWNLOAD_RESULT_RETENTION_SECONDS = 30 * 60","expires_at","retention_seconds"):
              if marker not in jobs: errors.append(f"download jobs missing {marker!r}")
          if "30*60*1000" not in ux: errors.append("Setup Center does not use the 30-minute job-resume window")
          broker="\n".join(read(path) for path in ("server/scripts/download-broker.py","server/scripts/setup-center-server.py","server/scripts/on-demand-build.py"))
          if "ROUTER_VPN_GITHUB_SHA" not in broker: errors.append("download broker does not require the configured exact GitHub SHA")
          for bad in ("/releases/latest","latest.zip","refs/heads/main"):
              if bad in broker: errors.append(f"download path contains moving-main fallback {bad!r}")
          if not any(word in broker.lower() for word in ("fallback","local build","on-demand")): errors.append("bounded local fallback path is missing")
          if errors:
              print("EXACT-SHA DOWNLOAD DELIVERY AUDIT: FAIL")
              for e in errors: print(" - "+e)
              raise SystemExit(1)
          print("EXACT-SHA DOWNLOAD DELIVERY AUDIT: PASS")
          ''', encoding='utf-8')

          # Wire the delivery audit beside release-orchestration checks wherever
          # the exact-head release blockers are enumerated.
          wired=0
          for path in [root/'deploy/release-candidate.sh',root/'deploy/release-orchestration-audit.py',root/'deploy/exact-head-release-blockers.py']:
              if not path.is_file(): continue
              text=path.read_text(encoding='utf-8')
              if 'exact-sha-download-delivery-audit.py' in text: wired+=1; continue
              anchors=['unified-map-shipping-audit.py','download-retention-audit.py','release-orchestration-audit.py']
              for anchor in anchors:
                  if anchor in text:
                      if path.suffix=='.py' and f'"deploy/{anchor}"' in text:
                          text=text.replace(f'"deploy/{anchor}"',f'"deploy/{anchor}",\n    "deploy/exact-sha-download-delivery-audit.py"',1)
                      elif f'python3 deploy/{anchor}' in text:
                          text=text.replace(f'python3 deploy/{anchor}',f'python3 deploy/{anchor}\npython3 deploy/exact-sha-download-delivery-audit.py',1)
                      else: continue
                      path.write_text(text,encoding='utf-8'); wired+=1; break
          if wired==0: raise SystemExit('delivery audit could not be wired into an authoritative release path')
          PY

          chmod +x deploy/prepare-exact-sha-release-assets.py deploy/verify-exact-sha-release-assets.py deploy/exact-sha-download-delivery-audit.py
          python3 -m py_compile deploy/prepare-exact-sha-release-assets.py deploy/verify-exact-sha-release-assets.py deploy/exact-sha-download-delivery-audit.py
          python3 deploy/exact-sha-download-delivery-audit.py
          git diff --check
          git add .github/workflows/publish-exact-sha-release-assets.yml deploy server
          git rm .github/workflows/direct-main-exact-sha-delivery.yml
          git commit -m "Publish exact-SHA CI packages as immutable release assets [skip ci]"
          git push origin HEAD:main
