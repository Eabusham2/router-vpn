name: Original encrypted SS2022 prefix paths

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: ss-node-chain-prefix-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Original SS2022 source, runtime, desktop and Box MTU ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: validator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify exact source and native contract inventories
        run: python3 validator/deploy/test_desktop_node_chain_ss_prefix_contract_runner.py
      - name: Require actual reference UDP lifetime and ownership controls
        run: python3 validator/deploy/test_reference_udp_lifetime.py
      - name: Execute original and prefix source, pointer refusal and Box MTU contracts
        timeout-minutes: 50
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOGC: '100'
          GOMEMLIMIT: 2GiB
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          python3 validator/deploy/test_desktop_node_chain_ss_prefix_contract.py \
            --source-checkout "$GITHUB_WORKSPACE/source" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" \
            --receipt "$RUNNER_TEMP/ss-prefix-contracts.json"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-SS2022-contracts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ss-prefix-contracts.json
            ${{ runner.temp }}/ss-prefix-contract-logs/*.jsonl
            ${{ runner.temp }}/ss-prefix-contract-logs/box.log
          if-no-files-found: error
          retention-days: 14

      - name: Retain failed source/native contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-SS2022-contract-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ss-prefix-contract-logs/*.jsonl
            ${{ runner.temp }}/ss-prefix-contract-logs/*.log
          if-no-files-found: ignore
          retention-days: 14

  encrypted:
    name: Original ${{ matrix.mode }} and SS2022 ${{ matrix.form }} prefixes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [wg, awg2-fast, awg2-strong]
        form: [literal, hostname]
    steps:
      - uses: actions/checkout@v4
        with:
          path: validator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify native phase, image and aggregate refusal controls
        run: python3 validator/deploy/test_desktop_node_chain_ss_prefix_runner.py
      - name: Execute every captured four/eight-node measurement position
        timeout-minutes: 50
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOGC: '100'
          GOMEMLIMIT: 2GiB
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_IMPORTED_SS_MODE: ${{ matrix.mode }}
          ROUTERVPN_IMPORTED_SS_FORM: ${{ matrix.form }}
        run: |
          python3 validator/deploy/test_desktop_node_chain_ss_prefix.py \
            --source-checkout "$GITHUB_WORKSPACE/source" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" \
            --mode "$ROUTERVPN_IMPORTED_SS_MODE" --form "$ROUTERVPN_IMPORTED_SS_FORM" \
            --receipt "$RUNNER_TEMP/ss-prefix-$ROUTERVPN_IMPORTED_SS_MODE-$ROUTERVPN_IMPORTED_SS_FORM.json"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-SS2022-prefix-${{ matrix.mode }}-${{ matrix.form }}-${{ github.sha }}
          path: ${{ runner.temp }}/ss-prefix-${{ matrix.mode }}-${{ matrix.form }}.json
          if-no-files-found: error
          retention-days: 14

  complete:
    name: Require all original SS2022 prefix source/image receipts
    needs: [contracts, encrypted]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: validator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: RouterVPN-SS2022-prefix-*-${{ github.sha }}
          path: ${{ runner.temp }}/ss-prefix-units
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-SS2022-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/ss-prefix-contracts
      - name: Require every exact-SHA unit, position, refusal and retained image
        env:
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          python3 validator/deploy/test_desktop_node_chain_ss_prefix.py \
            --source-checkout "$GITHUB_WORKSPACE/source" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" \
            --aggregate "$RUNNER_TEMP/ss-prefix-units" \
            --contracts "$RUNNER_TEMP/ss-prefix-contracts/ss-prefix-contracts.json" --receipt "$RUNNER_TEMP/ss-prefix-complete.json"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-SS2022-prefix-complete-${{ github.sha }}
          path: ${{ runner.temp }}/ss-prefix-complete.json
          if-no-files-found: error
          retention-days: 14
