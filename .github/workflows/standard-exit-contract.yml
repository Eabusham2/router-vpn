name: Custom standard exit contract

on:
  push:
    branches: [main]
    paths:
      - 'cmd/client/standard_exit*.go'
      - 'cmd/client/standard_exits*.go'
      - 'cmd/client/openvpn_standard_exit*.go'
      - 'cmd/client/external_profile*.go'
      - 'cmd/client/profile_public_view*.go'
      - 'cmd/client/multihop_native_routes.go'
      - 'internal/common/types.go'
      - 'internal/common/profile_schema.go'
      - 'internal/common/external_profile_test.go'
      - 'modes/native-standard-exit-linux.sh'
      - 'modes/native-openvpn-standard-exit.sh'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidStandardExit*.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidDirectStandardExitController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java'
      - 'android/test_android_standard_exit_contract.py'
      - '.github/workflows/standard-exit-contract.yml'
  pull_request:
    paths:
      - 'cmd/client/standard_exit*.go'
      - 'cmd/client/standard_exits*.go'
      - 'cmd/client/openvpn_standard_exit*.go'
      - 'cmd/client/external_profile*.go'
      - 'cmd/client/profile_public_view*.go'
      - 'cmd/client/multihop_native_routes.go'
      - 'internal/common/types.go'
      - 'internal/common/profile_schema.go'
      - 'internal/common/external_profile_test.go'
      - 'modes/native-standard-exit-linux.sh'
      - 'modes/native-openvpn-standard-exit.sh'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidStandardExit*.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidDirectStandardExitController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java'
      - 'android/test_android_standard_exit_contract.py'
      - '.github/workflows/standard-exit-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Go custom-exit and unified-profile tests
        run: go test ./cmd/client ./internal/common
      - name: Native helper syntax
        run: |
          bash -n modes/native-standard-exit-linux.sh
          bash -n modes/native-openvpn-standard-exit.sh
      - name: Fail-closed proof and unified-node markers
        run: |
          grep -Fq 'python3 "$KILL_SWITCH" apply' modes/native-standard-exit-linux.sh
          grep -Fq 'TUNNEL_ALIAS" == "router-vpn"' modes/native-standard-exit-linux.sh
          grep -Fq 'proveStandardExit(exit.ExpectedPublicIP)' cmd/client/standard_exit_runtime.go
          grep -Fq '127.0.0.1", "listen_port":1099' cmd/client/standard_exit_runtime.go
          grep -Fq 'OpenVPNConfig' cmd/client/standard_exits.go
          grep -Fq 'openVPNRuntimeCapability()' cmd/client/standard_exits.go
          grep -Fq 'sanitizeOpenVPNConfig' cmd/client/openvpn_standard_exit_profile.go
          grep -Fq 'script-security' cmd/client/openvpn_standard_exit_profile.go
          grep -Fq 'OpenVPN custom exit currently requires a literal remote' cmd/client/openvpn_standard_exit_profile.go
          grep -Fq 'redirect-gateway def1' cmd/client/openvpn_standard_exit_runtime.go
          grep -Fq 'redirect-gateway ipv6' cmd/client/openvpn_standard_exit_runtime.go
          grep -Fq 'proveOpenVPNStandardExit(exit.ExpectedPublicIP)' cmd/client/openvpn_standard_exit_runtime.go
          grep -Fq 'registerStandardExitDispatchRoutes(h, a)' cmd/client/multihop_native_routes.go
          grep -Fq 'registerExternalProfileRoutes(h, a)' cmd/client/multihop_native_routes.go
          grep -Fq 'standardExitFromExternalProfile' cmd/client/external_profile_standard_exit.go
          grep -Fq 'validateStandardExit(&exit)' cmd/client/external_profile_standard_exit.go
          grep -Fq '/api/nodes' cmd/client/external_profile_connect.go
          grep -Fq '/api/external-profile/connect' cmd/client/external_profile_connect.go
          grep -Fq 'externalRuntimePolicy(externalProfile)' cmd/client/external_profile_connect.go
          grep -Fq 'proveStandardExit(exit.ExpectedPublicIP)' cmd/client/external_profile_connect.go
          grep -Fq 'proveOpenVPNStandardExit(exit.ExpectedPublicIP)' cmd/client/external_profile_connect.go
          grep -Fq 'Router VPN WireGuard entry -> external' cmd/client/external_profile_connect.go
          grep -Fq 'publicProfileStoreFor' cmd/client/profile_public_view.go
          grep -Fq 'Editable:kind=="router-vpn"' cmd/client/profile_public_view.go
          grep -Fq 'TestPublicExternalProfileRedactsAllProtocolCredentials' cmd/client/profile_public_view_test.go
          grep -Fq 'TestPublicProfileStoreDoesNotLeakExternalWireGuardKeys' cmd/client/profile_public_view_test.go
          grep -Fq 'RouterProfileSchemaVersion = 3' internal/common/types.go
          grep -Fq 'NodeKind' internal/common/types.go
          grep -Fq 'ExpectedPublicIP' internal/common/types.go
          grep -Fq 'expected_public_ip must be the public address expected' internal/common/profile_schema.go
          grep -Fq 'TestExternalOpenVPNProfileAcceptedAsDataOnly' internal/common/external_profile_test.go
          grep -Fq 'native OpenVPN adapter' cmd/client/standard_exits_test.go
          grep -Fq 'endpoint["detour"] != "entry-wg"' cmd/client/standard_exits_test.go
          grep -Fq 'out["detour"] != "entry-wg"' cmd/client/standard_exits_test.go
          grep -Fq 'standard-exits.json permissions are too broad; expected 0600' cmd/client/standard_exits.go

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Android custom-exit source contract
        run: python3 android/test_android_standard_exit_contract.py
      - name: Native unified-node product contract
        run: |
          grep -Fq 'AndroidUnifiedNodeCatalog' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'Router VPN and external nodes share one list' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'external list-only (no real coordinates)' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'EXTRA_EXIT_ID' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'KIND_EXTERNAL' android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java
          grep -Fq 'never infer them from an IP' android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java
          grep -Fq 'Connect direct external exit' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'Router VPN WireGuard entry → external exit' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'EXTRA_EXIT_ID' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'VpnService.prepare(this)' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'OpenVPN unavailable' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'StandardExitActivity' android/app/src/main/AndroidManifest.xml
