name: Custom standard exit contract

on:
  push:
    branches: [main]
    paths:
      - 'cmd/client/*.go'
      - 'cmd/client/standard_exit*.go'
      - 'cmd/client/standard_exits*.go'
      - 'cmd/client/openvpn_standard_exit*.go'
      - 'cmd/client/external_profile*.go'
      - 'cmd/client/external_entry*.go'
      - 'cmd/client/windows_openvpn_external.go'
      - 'cmd/client/profile_public_view*.go'
      - 'cmd/client/multihop_native_routes.go'
      - 'client/native-openvpn-windows.ps1'
      - 'client/Install-RouterVPN-OpenVPN.ps1'
      - 'client/Setup-Windows-Runtime.ps1'
      - 'deploy/package-builds.sh'
      - 'internal/common/types.go'
      - 'internal/common/profile_schema.go'
      - 'internal/common/external_profile_test.go'
      - 'modes/native-standard-exit-linux.sh'
      - 'modes/native-openvpn-standard-exit.sh'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidStandardExit*.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidDirectStandardExitController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java'
      - 'android/test_android_standard_exit_contract.py'
      - '.github/workflows/standard-exit-contract.yml'
  pull_request:
    paths:
      - 'cmd/client/*.go'
      - 'cmd/client/standard_exit*.go'
      - 'cmd/client/standard_exits*.go'
      - 'cmd/client/openvpn_standard_exit*.go'
      - 'cmd/client/external_profile*.go'
      - 'cmd/client/external_entry*.go'
      - 'cmd/client/windows_openvpn_external.go'
      - 'cmd/client/profile_public_view*.go'
      - 'cmd/client/multihop_native_routes.go'
      - 'client/native-openvpn-windows.ps1'
      - 'client/Install-RouterVPN-OpenVPN.ps1'
      - 'client/Setup-Windows-Runtime.ps1'
      - 'deploy/package-builds.sh'
      - 'internal/common/types.go'
      - 'internal/common/profile_schema.go'
      - 'internal/common/external_profile_test.go'
      - 'modes/native-standard-exit-linux.sh'
      - 'modes/native-openvpn-standard-exit.sh'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidStandardExit*.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidDirectStandardExitController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java'
      - 'android/test_android_standard_exit_contract.py'
      - '.github/workflows/standard-exit-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Go custom-exit unified-profile and external-entry tests
        run: go test ./cmd/client ./internal/common
      - name: Native Unix helper syntax
        run: |
          bash -n modes/native-standard-exit-linux.sh
          bash -n modes/native-openvpn-standard-exit.sh
      - name: Fail-closed proof unified-node API and chain markers
        run: |
          grep -Fq 'python3 "$KILL_SWITCH" apply' modes/native-standard-exit-linux.sh
          grep -Fq 'TUNNEL_ALIAS" == "router-vpn"' modes/native-standard-exit-linux.sh
          grep -Fq 'proveStandardExit(exit.ExpectedPublicIP)' cmd/client/standard_exit_runtime.go
          grep -Fq '127.0.0.1", "listen_port":1099' cmd/client/standard_exit_runtime.go
          grep -Fq 'OpenVPNConfig' cmd/client/standard_exits.go
          grep -Fq 'sanitizeOpenVPNConfig' cmd/client/openvpn_standard_exit_profile.go
          grep -Fq 'OpenVPN custom exit currently requires a literal remote' cmd/client/openvpn_standard_exit_profile.go
          grep -Fq 'redirect-gateway def1' cmd/client/openvpn_standard_exit_runtime.go
          grep -Fq 'redirect-gateway ipv6' cmd/client/openvpn_standard_exit_runtime.go
          grep -Fq 'proveOpenVPNStandardExit(exit.ExpectedPublicIP)' cmd/client/openvpn_standard_exit_runtime.go
          grep -Fq 'registerPlatformStandardExitRoutes(h, a)' cmd/client/multihop_native_routes.go
          grep -Fq 'registerExternalProfileRoutes(h, a)' cmd/client/multihop_native_routes.go
          grep -Fq 'buildExternalEntryChain' cmd/client/external_entry_chain.go
          grep -Fq 'node_kind' internal/common/types.go
          grep -Fq 'publicProfileStoreFor' cmd/client/profile_public_view.go

  windows-openvpn:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Go custom-exit contracts
        shell: pwsh
        run: go test ./cmd/client ./internal/common
      - name: Windows OpenVPN setup helper contracts
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/Install-RouterVPN-OpenVPN.ps1 -SelfTest
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/Setup-Windows-Runtime.ps1 -SelfTest
          if (-not (Select-String -LiteralPath client/native-openvpn-windows.ps1 -SimpleMatch 'OpenVPN native adapter')) { throw 'native OpenVPN Windows adapter marker missing' }
          if (-not (Select-String -LiteralPath cmd/client/windows_openvpn_external.go -SimpleMatch 'startWindowsOpenVPNExternal')) { throw 'Windows OpenVPN external runtime marker missing' }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android standard-exit contract
        run: python3 android/test_android_standard_exit_contract.py
