name: Custom standard exit contract

on:
  push:
    branches: [main]
    paths:
      - 'cmd/client/*.go'
      - 'cmd/client/standard_exit*.go'
      - 'cmd/client/standard_exits*.go'
      - 'cmd/client/openvpn_standard_exit*.go'
      - 'cmd/client/external_profile*.go'
      - 'cmd/client/external_entry*.go'
      - 'cmd/client/windows_openvpn_external.go'
      - 'cmd/client/profile_public_view*.go'
      - 'cmd/client/multihop_native_routes.go'
      - 'client/native-openvpn-windows.ps1'
      - 'client/Install-RouterVPN-OpenVPN.ps1'
      - 'client/Setup-Windows-Runtime.ps1'
      - 'deploy/package-builds.sh'
      - 'deploy/standard-exit-private-runtime-audit.py'
      - 'deploy/typed-external-node-audit.py'
      - 'internal/common/types.go'
      - 'internal/common/profile_schema.go'
      - 'internal/common/external_profile_test.go'
      - 'modes/native-standard-exit-linux.sh'
      - 'modes/native-openvpn-standard-exit.sh'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidStandardExit*.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidDirectStandardExitController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java'
      - 'android/test_android_standard_exit_contract.py'
      - '.github/workflows/standard-exit-contract.yml'
  pull_request:
    paths:
      - 'cmd/client/*.go'
      - 'cmd/client/standard_exit*.go'
      - 'cmd/client/standard_exits*.go'
      - 'cmd/client/openvpn_standard_exit*.go'
      - 'cmd/client/external_profile*.go'
      - 'cmd/client/external_entry*.go'
      - 'cmd/client/windows_openvpn_external.go'
      - 'cmd/client/profile_public_view*.go'
      - 'cmd/client/multihop_native_routes.go'
      - 'client/native-openvpn-windows.ps1'
      - 'client/Install-RouterVPN-OpenVPN.ps1'
      - 'client/Setup-Windows-Runtime.ps1'
      - 'deploy/package-builds.sh'
      - 'deploy/standard-exit-private-runtime-audit.py'
      - 'deploy/typed-external-node-audit.py'
      - 'internal/common/types.go'
      - 'internal/common/profile_schema.go'
      - 'internal/common/external_profile_test.go'
      - 'modes/native-standard-exit-linux.sh'
      - 'modes/native-openvpn-standard-exit.sh'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidStandardExit*.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidDirectStandardExitController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java'
      - 'android/test_android_standard_exit_contract.py'
      - '.github/workflows/standard-exit-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Go custom-exit unified-profile and external-entry tests
        run: go test ./cmd/client ./internal/common
      - name: Native Unix helper syntax
        run: |
          bash -n modes/native-standard-exit-linux.sh
          bash -n modes/native-openvpn-standard-exit.sh
      - name: Structured standard-exit shipping audits
        run: |
          python3 deploy/standard-exit-private-runtime-audit.py
          python3 deploy/typed-external-node-audit.py
      - name: Critical fail-closed route and proof wiring
        run: |
          grep -Fq 'python3 "$KILL_SWITCH" apply' modes/native-standard-exit-linux.sh
          grep -Fq 'TUNNEL_ALIAS" == "router-vpn"' modes/native-standard-exit-linux.sh
          grep -Fq 'proveStandardExit(exit.ExpectedPublicIP)' cmd/client/standard_exit_runtime.go
          grep -Fq '127.0.0.1", "listen_port":1099' cmd/client/standard_exit_runtime.go
          grep -Fq 'registerPlatformStandardExitRoutes(h, a)' cmd/client/multihop_native_routes.go
          grep -Fq 'registerExternalProfileRoutes(h, a)' cmd/client/multihop_native_routes.go
          ! grep -Fq 'registerStandardExitDispatchRoutes(h, a)' cmd/client/multihop_native_routes.go
          grep -Fq 'externalProfileProtocolCapabilities()' cmd/client/multihop_native_routes.go
          grep -Fq 'standardExitFromExternalProfile' cmd/client/external_profile_standard_exit.go
          grep -Fq 'externalRuntimePolicy(externalProfile)' cmd/client/external_profile_connect.go
          grep -Fq 'external_entry_hop' cmd/client/external_profile_connect.go
          grep -Fq 'RouterProfileSchemaVersion = 4' internal/common/types.go
          grep -Fq 'standard-exits.json permissions are too broad; expected 0600' cmd/client/standard_exits.go

  windows-openvpn:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Compile Windows client source
        shell: powershell
        run: go test -run '^$' ./cmd/client ./internal/common
      - name: Parse native Windows OpenVPN helpers with Windows PowerShell
        shell: powershell
        run: |
          foreach ($path in @('client/native-openvpn-windows.ps1','client/Install-RouterVPN-OpenVPN.ps1','client/Setup-Windows-Runtime.ps1')) {
            $source = Get-Content -Raw -LiteralPath $path
            $null = [scriptblock]::Create($source)
          }
          $source = Get-Content -Raw -LiteralPath 'client/native-openvpn-windows.ps1'
          if ($source -notmatch "Get-NetRoute -DestinationPrefix '0.0.0.0/1'") { throw 'missing def1 route proof' }
          if ($source -notmatch "Get-NetRoute -DestinationPrefix '128.0.0.0/1'") { throw 'missing second def1 route proof' }
          if ($source -notmatch "Kill 'tunnel'") { throw 'strict firewall never promotes the proven OpenVPN interface' }
          if ($source -notmatch "OpenVPN 2\\.7\\.") { throw 'OpenVPN 2.7 pin check is missing' }
          if ($source -match 'windows-driver\s+wintun') { throw 'OpenVPN 2.7 removed Wintun; stale driver directive found' }
      - name: Pinned zero-knowledge OpenVPN setup contract
        shell: powershell
        run: |
          $setup = Get-Content -Raw -LiteralPath 'client/Install-RouterVPN-OpenVPN.ps1'
          foreach ($marker in @("OpenVPNVersion = '2.7.5'","OpenVPNBuild = 'I001'",'swupdate.openvpn.org/community/releases','5865472','6234112','Get-AuthenticodeSignature','OpenVPN','Start-Process -FilePath ''powershell.exe'' -Verb RunAs','msiexec.exe','arm64','x64')) {
            if (-not $setup.Contains($marker)) { throw "missing pinned OpenVPN setup marker: $marker" }
          }
          if ($setup -match 'latest') { throw 'OpenVPN setup must not use a floating latest URL' }
          $runtime = Get-Content -Raw -LiteralPath 'client/Setup-Windows-Runtime.ps1'
          foreach ($marker in @('Install-RouterVPN-OpenVPN.ps1','& $OpenVPNSetup','OpenVPN 2.7.x')) {
            if (-not $runtime.Contains($marker)) { throw "Windows runtime setup does not own OpenVPN setup: $marker" }
          }
      - name: Windows OpenVPN source and package contract
        shell: powershell
        run: |
          $go = Get-Content -Raw -LiteralPath 'cmd/client/windows_openvpn_external.go'
          foreach ($marker in @('windowsOpenVPNRuntimeCapability','prepareWindowsOpenVPNRuntime','windowsOpenVPNStandardExitCommand','redirect-gateway def1','dev tun')) {
            if (-not $go.Contains($marker)) { throw "missing Windows OpenVPN marker: $marker" }
          }
          $connect = Get-Content -Raw -LiteralPath 'cmd/client/external_profile_connect.go'
          if (-not $connect.Contains('runtime.GOOS == "windows"')) { throw 'Windows OpenVPN dispatch is missing' }
          if (-not $connect.Contains('windowsOpenVPNStandardExitCommand')) { throw 'external profile does not dispatch to native Windows OpenVPN' }
          $legacy = Get-Content -Raw -LiteralPath 'cmd/client/standard_exit_platform_routes.go'
          if (-not $legacy.Contains('windowsOpenVPNStandardExitCommand')) { throw 'legacy standard-exit API disagrees with unified Windows OpenVPN support' }
          $package = Get-Content -Raw -LiteralPath 'deploy/package-builds.sh'
          if (-not $package.Contains('cp -a "$ROOT/client" "$dir/client"')) { throw 'installed Windows package does not include the current client helper tree' }
          if (-not $package.Contains('cp -a "$ROOT/client" "$app/client"')) { throw 'Windows Portable does not include the current client helper tree' }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Android custom-exit source contract
        run: python3 android/test_android_standard_exit_contract.py
      - name: Cross-platform typed external-node audit
        run: python3 deploy/typed-external-node-audit.py
      - name: Native unified-node product contract
        run: |
          grep -Fq 'catalog=new AndroidUnifiedNodeCatalog(nodeStore,exitStore)' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'if(!selected.isRouterVpn())' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'new Intent(this,StandardExitActivity.class)' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'intent.putExtra(StandardExitActivity.EXTRA_EXIT_ID,selected.id)' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'KIND_EXTERNAL' android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java
          grep -Fq 'never infer them from an IP' android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedNodeCatalog.java
          grep -Fq 'Connect direct external exit' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'Router VPN WireGuard entry → external exit' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'VpnService.prepare(this)' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'OpenVPN unavailable' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'StandardExitActivity' android/app/src/main/AndroidManifest.xml
