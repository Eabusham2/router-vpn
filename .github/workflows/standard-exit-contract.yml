name: Custom standard exit contract

on:
  push:
    branches: [main]
    paths:
      - 'cmd/client/standard_exit*.go'
      - 'cmd/client/standard_exits*.go'
      - 'modes/native-standard-exit-linux.sh'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidStandardExit*.java'
      - 'android/test_android_standard_exit_contract.py'
      - '.github/workflows/standard-exit-contract.yml'
  pull_request:
    paths:
      - 'cmd/client/standard_exit*.go'
      - 'cmd/client/standard_exits*.go'
      - 'modes/native-standard-exit-linux.sh'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidStandardExit*.java'
      - 'android/test_android_standard_exit_contract.py'
      - '.github/workflows/standard-exit-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Go custom-exit tests
        run: go test ./cmd/client
      - name: Linux helper and fail-closed markers
        run: |
          bash -n modes/native-standard-exit-linux.sh
          grep -Fq 'python3 "$KILL_SWITCH" apply' modes/native-standard-exit-linux.sh
          grep -Fq 'TUNNEL_ALIAS" == "router-vpn"' modes/native-standard-exit-linux.sh
          grep -Fq 'proveStandardExit(exit.ExpectedPublicIP)' cmd/client/standard_exit_runtime.go
          grep -Fq '127.0.0.1", "listen_port":1099' cmd/client/standard_exit_runtime.go
          grep -Fq 'Protocol: "openvpn", Supported: false' cmd/client/standard_exits.go
          grep -Fq 'standard-exits.json permissions are too broad; expected 0600' cmd/client/standard_exits.go
          grep -Fq 'standardExitRuntimeParts(e,"entry-wg")' cmd/client/standard_exits_test.go
          grep -Fq 'endpoint["detour"]!="entry-wg"' cmd/client/standard_exits_test.go
          grep -Fq 'out["detour"]!="entry-wg"' cmd/client/standard_exits_test.go

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Android custom-exit source contract
        run: python3 android/test_android_standard_exit_contract.py
      - name: Native product UI exposure
        run: |
          grep -Fq 'Custom Exits' android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java
          grep -Fq 'StandardExitActivity' android/app/src/main/AndroidManifest.xml
          grep -Fq 'VpnService.prepare(this)' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
          grep -Fq 'OpenVPN unavailable' android/app/src/main/java/com/eabusham/routervpn/StandardExitActivity.java
