name: Direct main reconciled source certification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-source-certification.yml

permissions:
  contents: write

timeout-minutes: 360

concurrency:
  group: direct-main-source-certification
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false
      - name: Install native Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libcurl4-openssl-dev libjson-glib-dev pkg-config file binutils
      - name: Run complete reconciled source matrix
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          go test ./...
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile
          find modes server client deploy router -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          while IFS= read -r audit; do
            echo "===== $audit ====="
            python3 "$audit"
          done < <(find deploy -maxdepth 1 -type f \( -name '*audit*.py' -o -name 'validate-repo.py' \) | sort)
          python3 deploy/test-production-release-compose.py
          python3 server/scripts/test_download_jobs.py
          python3 server/scripts/test_setup_center_ux_patch.py
          python3 server/scripts/test_source_provenance.py
          python3 deploy/test_source_provenance.py
          python3 deploy/test_source_provenance_adoption_identity.py
          for test in \
            android/test_android_private_file_store_contract.py \
            android/test_android_connection_profile_store_contract.py \
            android/test_android_node_store_transaction_contract.py \
            ios/RouterVPN/test_private_json_store_contract.py \
            ios/RouterVPN/test_connection_profile_store_fail_closed.py; do
            test ! -f "$test" || python3 "$test"
          done
          bash deploy/package-linux-native.sh amd64
          git diff --check
          test -z "$(git status --short)"
      - name: Publish clean exact-head source certification commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/direct-main-source-certification.yml
          git commit -m "Certify reconciled Router VPN source"
          git push origin HEAD:main
