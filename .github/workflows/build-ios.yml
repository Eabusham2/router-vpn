name: Build signed iOS IPA
on: {workflow_dispatch: {}}
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Import signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions /tmp/router-vpn.keychain
          security default-keychain -s /tmp/router-vpn.keychain
          security unlock-keychain -p actions /tmp/router-vpn.keychain
          security import /tmp/cert.p12 -k /tmp/router-vpn.keychain -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions /tmp/router-vpn.keychain
      - name: Install provisioning profiles
        env:
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_TUNNEL_PROFILE_BASE64: ${{ secrets.IOS_TUNNEL_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_APP_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/router-vpn-app.mobileprovision"
          echo "$IOS_TUNNEL_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/router-vpn-tunnel.mobileprovision"
      - name: Generate project
        working-directory: ios/RouterVPN
        run: xcodegen generate
      - name: Archive
        working-directory: ios/RouterVPN
        run: xcodebuild -project RouterVPN.xcodeproj -scheme RouterVPN -configuration Release -archivePath /tmp/RouterVPN.xcarchive archive DEVELOPMENT_TEAM='${{ secrets.APPLE_TEAM_ID }}'
      - name: Export IPA
        working-directory: ios/RouterVPN
        run: xcodebuild -exportArchive -archivePath /tmp/RouterVPN.xcarchive -exportPath /tmp/ipa -exportOptionsPlist ../ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-IPA
          path: /tmp/ipa/*.ipa
