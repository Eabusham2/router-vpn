name: Verify Android entry Start Layer checkpoint
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore the exact tested application source
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          BASE='7fc2668b7c94e8beb561ed8b21f567b482ddfa82'
          PATCH='deploy/continuation-entry-start-android.patch'
          OWN='.github/workflows/verify-android-entry-start-checkpoint.yml'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD~2')==BASE
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          raw=pathlib.Path(PATCH).read_bytes()
          assert len(raw)==40401 and hashlib.sha256(raw).hexdigest()=='f89930d243921ae6793884c50e1fb113e4d5d4166124a9497a288f8e28d058d2'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'entry-start.patch';target.write_bytes(raw)
          subprocess.run(['git','rm','--',OWN,PATCH],check=True)
          subprocess.run(['git','apply','--index','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          assert git('write-tree')=='5cfc112988229422f51e404bc056aa4a21b15c10'
          PY
      - name: Verify actual native policy and Android startup consumers
        run: |
          go test -race -count=1 -timeout=90s ./internal/mobilemultihop
          go vet ./internal/mobilemultihop
          python3 android/test_android_multihop_start_layer.py
          python3 android/test_android_layered_service_compile.py
          python3 deploy/test_android_multihop_pinned_contract.py
          bash -n android/build-sing-box-libbox.sh
          bash -n ios/RouterVPN/prepare-libbox.sh
      - name: Commit the verified source tree
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          test "$(git write-tree)" = 5cfc112988229422f51e404bc056aa4a21b15c10
          git -c user.name='Router VPN Development' -c user.email=router-vpn@users.noreply.github.com commit -m 'Wire captured entry Start Layers into Android multihop startup and native validation'
          git log -1 --format='%H%n%T%n%P%n%s' | tee "$RUNNER_TEMP/verified-commit.txt"
      - name: Publish using a guarded fast-forward
        continue-on-error: true
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
      - uses: actions/upload-artifact@v4
        with:
          name: android-entry-start-tested-commit
          path: ${{ runner.temp }}/verified-commit.txt
          if-no-files-found: error
          retention-days: 7
