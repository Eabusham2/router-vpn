name: Keep only main branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify no unexpected branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t extra < <(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | grep -vx main || true)
          if ((${#extra[@]})); then
            printf 'Unexpected non-main branch(es):\n' >&2
            printf '  %s\n' "${extra[@]}" >&2
            printf 'Inspect merge/contents before deleting anything.\n' >&2
            exit 1
          fi
          echo 'Branch policy OK: main is the only branch.'
