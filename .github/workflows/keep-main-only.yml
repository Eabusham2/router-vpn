name: Keep only main branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only verified obsolete publisher branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/cleanup-known-stale-branches.sh
