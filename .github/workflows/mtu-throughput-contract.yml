name: MTU throughput optimizer contract

on:
  push:
    branches: [main]
    paths:
      - 'modes/network_context.py'
      - 'modes/mtu-policy.py'
      - 'modes/test_mtu_policy.py'
      - 'modes/mtu-throughput-tuner.py'
      - 'modes/mtu-throughput-tuner-platform.py'
      - 'modes/kill-switch-platform.py'
      - 'client/Optimize-RouterVPN-MTU.ps1'
      - 'client/Private-RouterVPN-State.ps1'
      - 'cmd/client/mtu_retest.go'
      - 'cmd/client/mtu_retest_test.go'
      - 'cmd/client/extras.go'
      - 'deploy/package-builds.sh'
      - '.github/workflows/mtu-throughput-contract.yml'
  pull_request:
    paths:
      - 'modes/network_context.py'
      - 'modes/mtu-policy.py'
      - 'modes/test_mtu_policy.py'
      - 'modes/mtu-throughput-tuner.py'
      - 'modes/mtu-throughput-tuner-platform.py'
      - 'modes/kill-switch-platform.py'
      - 'client/Optimize-RouterVPN-MTU.ps1'
      - 'cmd/client/mtu_retest.go'
      - 'cmd/client/mtu_retest_test.go'
      - 'cmd/client/extras.go'
      - 'deploy/package-builds.sh'
      - '.github/workflows/mtu-throughput-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Compile MTU policy and optimizers
        run: python3 -m py_compile modes/network_context.py modes/mtu-policy.py modes/mtu-throughput-tuner.py modes/mtu-throughput-tuner-platform.py modes/test_mtu_policy.py
      - name: Run deterministic MTU policy/network tests
        run: python3 modes/test_mtu_policy.py
      - name: Run deterministic direct and platform-wrapper optimizer self-tests
        run: |
          python3 modes/mtu-throughput-tuner.py --self-test
          python3 modes/mtu-throughput-tuner-platform.py --self-test
      - name: Check fail-closed network-specific contract markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('modes/mtu-throughput-tuner.py').read_text()
          wrapper=Path('modes/mtu-throughput-tuner-platform.py').read_text()
          policy=Path('modes/mtu-policy.py').read_text()
          route=Path('cmd/client/mtu_retest.go').read_text()
          package=Path('deploy/package-builds.sh').read_text()
          required=[
            'prove_node(profile)',
            'enforce_kill_switch()',
            'set_interface_mtu(alias, family, original)',
            '"effective_mtu_source"] = "auto-throughput"',
            'HOMEVPN_MTU_OPTIMIZE_FORCE',
            'private_ip(host)',
            'candidate_mtus(ceiling)',
            'pick_winner(results)',
            'network_fingerprint(endpoint)',
            'generated_profile_fingerprint(root, profile_id, mode)',
          ]
          for marker in required:
            assert marker in s or marker in policy, marker
          for marker in ['kill-switch-platform.py','CORE.enforce_kill_switch = enforce_platform_kill_switch']:
            assert marker in wrapper, marker
          for marker in ['/api/mtu/retest','mtuRetestTimeout = 2 * time.Minute','connect the selected Router VPN node first','set this node MTU policy to Auto before Retest','mtu-throughput-tuner-platform.py','Optimize-RouterVPN-MTU.ps1']:
            assert marker in route, marker
          assert 'cp -a "$ROOT/modes/." "$dir/modes/"' in package
          print('Unix/macOS MTU optimizer + packaged local Retest fail-closed contract OK')
          PY
      - name: Go client MTU Retest and Portable path seam compiles
        run: go test ./cmd/client -count=1

  windows-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          foreach($file in @('client/Private-RouterVPN-State.ps1','client/Optimize-RouterVPN-MTU.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}
          }
      - name: Run deterministic Windows self-test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/Optimize-RouterVPN-MTU.ps1 -Action self-test
      - name: Check Windows fail-closed network-specific contract markers
        shell: powershell
        run: |
          $s=Get-Content -Raw client/Optimize-RouterVPN-MTU.ps1
          foreach($marker in @('Prove-Node $profile','Ensure-KillSwitch $profile $alias','Set-Mtu $alias $family $original','Find-NetRoute','Set-NetIPInterface','Get-NetworkFingerprint','Get-GeneratedProfileFingerprint','HOMEVPN_NETWORK_CONTEXT','Private-RouterVPN-State.ps1','Get-RouterVPNSelectedProfile','durable_owner=''Router VPN Go controller /api/mtu/retest''')){
            if(-not $s.Contains($marker)){throw "missing contract marker: $marker"}
          }
          foreach($forbidden in @('Persist-Winner','$Ctx.Path+''.mtu.tmp''','Move-Item -LiteralPath $tmp -Destination $Ctx.Path -Force')){
            if($s.Contains($forbidden)){throw "Windows MTU helper regained direct profile-store persistence: $forbidden"}
          }
          $private=Get-Content -Raw client/Private-RouterVPN-State.ps1
          foreach($marker in @('Assert-RouterVPNNoReparseAncestors','FileShare]::Read','Get-RouterVPNProfileStore','Get-RouterVPNSelectedProfile')){
            if(-not $private.Contains($marker)){throw "missing private-state helper marker: $marker"}
          }
          Write-Host 'Windows MTU optimizer fail-closed controller-owned persistence contract OK'
