name: MTU throughput optimizer contract

on:
  push:
    branches: [main]
    paths:
      - 'modes/mtu-throughput-tuner.py'
      - 'client/Optimize-RouterVPN-MTU.ps1'
      - '.github/workflows/mtu-throughput-contract.yml'
  pull_request:
    paths:
      - 'modes/mtu-throughput-tuner.py'
      - 'client/Optimize-RouterVPN-MTU.ps1'
      - '.github/workflows/mtu-throughput-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile optimizer
        run: python3 -m py_compile modes/mtu-throughput-tuner.py
      - name: Run deterministic optimizer self-test
        run: python3 modes/mtu-throughput-tuner.py --self-test
      - name: Check fail-closed contract markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('modes/mtu-throughput-tuner.py').read_text()
          required=[
            'prove_node(profile)',
            'enforce_kill_switch()',
            'set_interface_mtu(alias, family, original)',
            '"effective_mtu_source"] = "auto-throughput"',
            'HOMEVPN_MTU_OPTIMIZE_FORCE',
            'private_ip(host)',
            'candidate_mtus(ceiling)',
            'pick_winner(results)',
          ]
          for marker in required:
            assert marker in s, marker
          print('Unix MTU optimizer fail-closed contract OK')
          PY

  windows-contract:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'client/Optimize-RouterVPN-MTU.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}
      - name: Run deterministic Windows self-test
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/Optimize-RouterVPN-MTU.ps1 -Action self-test
      - name: Check Windows fail-closed contract markers
        shell: powershell
        run: |
          $s=Get-Content -Raw client/Optimize-RouterVPN-MTU.ps1
          foreach($marker in @('Prove-Node $profile','Ensure-KillSwitch $profile $alias','Set-Mtu $alias $family $original','effective_mtu_source','auto-throughput','Find-NetRoute','Set-NetIPInterface')){
            if(-not $s.Contains($marker)){throw "missing contract marker: $marker"}
          }
          Write-Host 'Windows MTU optimizer fail-closed contract OK'
