name: One-shot authoritative concurrency gate v4

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-authoritative-concurrency-gate-v4
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install permanent concurrency isolation and remove one-shot state
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          git fetch origin main
          git reset --hard origin/main
          base="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflows = {
              ".github/workflows/source-snapshot.yml": "source-snapshot",
              ".github/workflows/release-candidate.yml": "release-candidate",
              ".github/workflows/arm64-portainer-preflight.yml": "arm64-portainer",
              ".github/workflows/publish-arm64-images.yml": "publish-arm64-portainer",
              ".github/workflows/production-release-compose.yml": "production-release-compose",
          }
          begin = "$" + "{{ "
          end = " }}"
          for filename, prefix in workflows.items():
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines()
              old = f"  group: {prefix}-{begin}github.ref{end}-{begin}github.sha{end}"
              new = f"{old}-{begin}github.run_id{end}"
              if new not in lines:
                  if lines.count(old) != 1:
                      raise SystemExit(f"unexpected concurrency contract in {filename}")
                  lines[lines.index(old)] = new
                  path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          audit = '''#!/usr/bin/env python3
          """Require reusable release children to isolate caller-owned exact-SHA evidence."""
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          WORKFLOWS = {
              ".github/workflows/source-snapshot.yml": "source-snapshot",
              ".github/workflows/release-candidate.yml": "release-candidate",
              ".github/workflows/arm64-portainer-preflight.yml": "arm64-portainer",
              ".github/workflows/publish-arm64-images.yml": "publish-arm64-portainer",
              ".github/workflows/production-release-compose.yml": "production-release-compose",
          }
          begin = "$" + "{{ "
          end = " }}"
          for filename, prefix in WORKFLOWS.items():
              text = (ROOT / filename).read_text(encoding="utf-8")
              expected = f"group: {prefix}-{begin}github.ref{end}-{begin}github.sha{end}-{begin}github.run_id{end}"
              assert expected in text, f"{filename} can cancel caller-owned exact-SHA evidence"
              assert "workflow_call:" in text and "workflow_dispatch:" in text, f"{filename} trigger contract drifted"
          print("Reusable release workflow concurrency audit: PASS")
          '''
          Path("deploy/reusable-workflow-concurrency-audit.py").write_text(textwrap.dedent(audit), encoding="utf-8")

          release = Path(".github/workflows/release-candidate.yml")
          lines = release.read_text(encoding="utf-8").splitlines()
          invocation = "          python3 deploy/reusable-workflow-concurrency-audit.py"
          anchor = "          python3 deploy/workflow-structure-audit.py"
          if invocation not in lines:
              if lines.count(anchor) != 1:
                  raise SystemExit("release candidate workflow-structure audit anchor drifted")
              lines.insert(lines.index(anchor) + 1, invocation)
              release.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          rm -f .github/workflows/one-shot-*.yml
          rm -f deploy/.one-shot-authoritative-concurrency-trigger
          python3 deploy/reusable-workflow-concurrency-audit.py
          python3 deploy/workflow-structure-audit.py
          python3 deploy/workflow-evidence-pipeline-audit.py
          python3 deploy/release-orchestration-audit.py
          python3 -m py_compile deploy/reusable-workflow-concurrency-audit.py
          git diff --check
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Gate reusable release workflow concurrency"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base"
          git push origin HEAD:main
