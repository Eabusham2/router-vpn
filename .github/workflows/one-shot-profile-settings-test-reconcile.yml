name: One-shot profile settings test reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-profile-settings-test-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace settings test with collision-safe version
        shell: bash
        run: |
          set -euo pipefail
          cp cmd/client/profile_settings_test_v2.go cmd/client/profile_settings_test.go
          rm -f cmd/client/profile_settings_test_v2.go .github/workflows/one-shot-profile-settings-test-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Avoid profile settings test helper collisions"
          git push origin HEAD:main
