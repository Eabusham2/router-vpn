name: Clean audit drafts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-audit-drafts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove superseded audit drafts only
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch deploy/full-audit.py deploy/full-audit-v2.py
          if git diff --cached --quiet; then
            echo 'No superseded audit drafts remain.'
            exit 0
          fi
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git commit -m 'Remove superseded audit drafts'
          git push origin HEAD:main
