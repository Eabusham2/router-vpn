name: Router VPN server release status

on:
  workflow_run:
    workflows:
      - "Publish ARM64 Portainer images"
      - "ARM64 Portainer preflight"
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    name: Publish exact-head server workflow status
    runs-on: ubuntu-24.04
    steps:
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          case "$WORKFLOW_NAME" in
            "Publish ARM64 Portainer images") CONTEXT='Router VPN ARM64 images' ;;
            "ARM64 Portainer preflight") CONTEXT='Router VPN ARM64 Portainer preflight' ;;
            *) echo "Unexpected workflow: $WORKFLOW_NAME" >&2; exit 2 ;;
          esac
          case "$CONCLUSION" in
            success) STATE=success; DESCRIPTION="$WORKFLOW_NAME passed for exact head" ;;
            *) STATE=failure; DESCRIPTION="$WORKFLOW_NAME: ${CONCLUSION:-unknown}" ;;
          esac
          python3 - "$STATE" "$DESCRIPTION" "$CONTEXT" "$RUN_URL" > "$RUNNER_TEMP/status.json" <<'PY'
          import json, sys
          state, description, context, url = sys.argv[1:5]
          print(json.dumps({
              "state": state,
              "description": description[:140],
              "context": context,
              "target_url": url,
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"
          if [[ "$STATE" != success ]]; then exit 1; fi
