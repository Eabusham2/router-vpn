name: One-shot macOS user location

on:
  push:
    branches:
      - automation/macos-user-location

permissions:
  contents: write

concurrency:
  group: one-shot-macos-user-location
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Implement macOS location and remove transport automation
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 .github/scripts/apply-macos-user-location.py
          git push origin HEAD:main
          git push origin --delete automation/macos-user-location || true
