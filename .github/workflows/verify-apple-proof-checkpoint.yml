name: Verify Apple proof lifecycle checkpoint
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Restore exact saved lifecycle change
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess
          BASE='25696dc05c8963895c6a6e9d51b1c53ee76d55dd'
          PATCH='deploy/continuation-apple-proof.patch'
          OWN='.github/workflows/verify-apple-proof-checkpoint.yml'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')==BASE
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          raw=pathlib.Path(PATCH).read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='e787b45acd4ed9e8a7e1095e51e050fda5700b642bc567567c5ead4def175913'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'lifecycle.patch';target.write_bytes(raw)
          subprocess.run(['git','rm','--',OWN,PATCH],check=True)
          subprocess.run(['git','apply','--index','--check',str(target)],check=True)
          subprocess.run(['git','apply','--index',str(target)],check=True)
          assert git('write-tree')=='aea2126cfacb01655024386debcc4ba11dbc5c21'
          subprocess.run(['git','-c','user.name=Router VPN Development','-c','user.email=router-vpn@users.noreply.github.com','commit','-m','Capture raw and external Apple network ownership before asynchronous proof'],check=True)
          print('VERIFIED_LIFECYCLE_COMMIT='+git('rev-parse','HEAD'),flush=True)
          PY
      - name: Execute actual callback, source and native policy regressions
        run: |
          go test -race -count=1 -timeout=120s ./internal/applexray ./internal/mobilemultihop ./internal/multihoprelay
          python3 ios/RouterVPN/test_packet_tunnel_libbox_contract.py
          python3 deploy/test_ios_xray_exits.py
          python3 deploy/test_ios_mtu_policy.py
      - name: Publish Git objects and attempt guarded fast-forward
        continue-on-error: true
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse 'HEAD^{tree}')" = aea2126cfacb01655024386debcc4ba11dbc5c21
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
      - name: Save exact tested commit metadata
        if: success()
        run: |
          git log -1 --format='%H%n%T%n%P%n%s' | tee "$RUNNER_TEMP/apple-proof-commit.txt"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: apple-proof-tested-commit
          path: ${{ runner.temp }}/apple-proof-commit.txt
          if-no-files-found: error
          retention-days: 7
