name: Aux proxies and setup assets ARM64

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aux-proxies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    name: Native ARM64 setup assets + ephemeral downloads + mode validation
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Static checks
        run: |
          python3 -m py_compile \
            server/scripts/generate-setup-assets.py \
            server/scripts/generate-aux-proxies.py \
            server/scripts/build-download-on-demand.py \
            server/scripts/download-broker.py
          python3 -m json.tool configs/client/logical-modes.json >/dev/null
          bash -n server/finalize/finalize.sh
          bash -n server/finalize/upgrade-safe.sh
          bash -n server/scripts/publish-downloads.sh
          bash -n client/setup-windows-runtime.sh
          bash -n server/aux-proxies/entrypoint.sh
          bash -n server/naive/entrypoint.sh
          bash -n modes/check-mode.sh
          bash -n modes/check-combined.sh
          sh -n router/asus-merlin-router-vpn-forwards.sh

      - name: Build init ARM64
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/init/Dockerfile -t router-vpn-ci-init:arm64 .

      - name: Run init and finalizer end to end
        run: |
          TEST_ROOT="$RUNNER_TEMP/router-vpn-aux-test"
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 -e ENDPOINT=1.1.1.1 \
            -v "$TEST_ROOT:/opt/router-vpn" router-vpn-ci-init:arm64
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 -e ENDPOINT=1.1.1.1 \
            -e OVERTLS_PORT=14443 -e OVERTLS_INTERNAL_PORT=14444 -e SSR_PORT=15443 \
            -v "$TEST_ROOT:/opt/router-vpn" --entrypoint /bin/bash \
            router-vpn-ci-init:arm64 /src/server/finalize/current-entrypoint.sh
          docker run --rm --platform linux/arm64 -v "$TEST_ROOT:/opt/router-vpn:ro" alpine:3.22 sh -ec '
            test -s /opt/router-vpn/client-bundle/setup-assets.json
            test -s /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            test -s /opt/router-vpn/downloads/router-vpn-device-setup.html
            test -s /opt/router-vpn/downloads/download-policy.json
            test -s /opt/router-vpn/config/aux/overtls-server.json
            test -s /opt/router-vpn/config/aux/ssr-server.json
            test -s /opt/router-vpn/client-bundle/generated/overtls/overtls-client.json
            test -s /opt/router-vpn/client-bundle/generated/shadowsocksr/ssr-client.json
            test -s /opt/router-vpn/client-bundle/logical-modes.json
            test -s /opt/router-vpn/client-bundle/client/Setup-Windows-Runtime.ps1
            test -s /opt/router-vpn/client-bundle/client/setup-windows-runtime.sh
            test ! -e /opt/router-vpn/client-bundle/dist
            ! find /opt/router-vpn/downloads -maxdepth 1 -type f -name "*.zip" | grep -q .
            grep -q "WireGuard" /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            grep -q "Potatso" /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            grep -q "SOCKS5 + TLS (OverTLS)" /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            grep -q "ShadowsocksR" /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            grep -q "router-vpn-windows-portable-amd64.zip" /opt/router-vpn/downloads/router-vpn-device-setup.html
            grep -q "router-vpn-portableapps-arm64.zip" /opt/router-vpn/downloads/router-vpn-device-setup.html
            grep -q "generated on demand" /opt/router-vpn/downloads/router-vpn-device-setup.html
          '
          sudo chown -R "$(id -u):$(id -g)" "$TEST_ROOT"

      - name: Verify on-demand home-linked Portable and PortableApps packages
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/router-vpn-aux-test"
          BROKER=$(docker run -d --rm --platform linux/arm64 --network host \
            -e ROUTER_VPN_GITHUB_DISABLE=1 \
            -v "$TEST_ROOT:/opt/router-vpn:ro" \
            --entrypoint python3 router-vpn-ci-init:arm64 \
            /src/server/scripts/download-broker.py --base /opt/router-vpn --port 8786)
          trap 'docker logs "$BROKER" || true; docker rm -f "$BROKER" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8786/healthz >/dev/null && break
            sleep .2
          done
          curl -fsS http://127.0.0.1:8786/api/download-policy | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["server_cache"] is False and x["preferred_source"]=="github-actions"'

          require_file() {
            local archive=$1 path=$2
            unzip -Z1 "$archive" | grep -Fxq "$path" || { echo "MISSING in $(basename "$archive"): $path" >&2; unzip -Z1 "$archive" >&2; return 1; }
          }
          require_absent() {
            local archive=$1 path=$2
            ! unzip -Z1 "$archive" | grep -Fxq "$path" || { echo "UNEXPECTED in $(basename "$archive"): $path" >&2; return 1; }
          }
          require_ini() {
            local archive=$1 path=$2 pattern=$3
            unzip -p "$archive" "$path" | tr -d '\r' | grep -Eq "$pattern" || { echo "BAD metadata: $pattern" >&2; return 1; }
          }
          fetch_one() {
            local name=$1 out=$2 headers=$3
            curl -fsS -D "$headers" -o "$out" "http://127.0.0.1:8786/$name"
            grep -Eiq '^X-Router-VPN-Source: local-fallback\r?$' "$headers"
            unzip -tq "$out" >/dev/null
            # The AI Board persistent directory must stay archive-free after every request.
            ! find "$TEST_ROOT/downloads" -maxdepth 1 -type f -name '*.zip' | grep -q .
          }

          for arch in amd64 arm64; do
            portable="$RUNNER_TEMP/home-portable-$arch.zip"
            paf="$RUNNER_TEMP/home-portableapps-$arch.zip"
            fetch_one "router-vpn-windows-portable-$arch.zip" "$portable" "$RUNNER_TEMP/h1-$arch"
            fetch_one "router-vpn-portableapps-$arch.zip" "$paf" "$RUNNER_TEMP/h2-$arch"

            root="RouterVPNPortable-$arch"
            for path in \
              "$root/RouterVPNPortable.exe" \
              "$root/Setup-Windows-Runtime.ps1" \
              "$root/README.txt" \
              "$root/App/RouterVPN/router-vpn-client.exe" \
              "$root/App/RouterVPN/router-vpn-dns.exe" \
              "$root/App/RouterVPN/logical-modes.json" \
              "$root/Data/routers.json" \
              "$root/Data/generated/wg/wg.conf" \
              "$root/Data/generated/max-tls-wg/chain.env" \
              "$root/Data/generated/max-quic-awg/chain.env"; do
              require_file "$portable" "$path"
            done

            require_absent "$paf" "$root/Setup-Windows-Runtime.ps1"
            require_absent "$paf" "$root/README.txt"
            for path in \
              "$root/RouterVPNPortable.exe" \
              "$root/App/RouterVPN/client/Setup-Windows-Runtime.ps1" \
              "$root/App/AppInfo/appinfo.ini" \
              "$root/App/AppInfo/installer.ini" \
              "$root/Other/Help/readme.txt" \
              "$root/Data/routers.json" \
              "$root/Data/generated/wg/wg.conf" \
              "$root/Data/generated/max-tls-wg/chain.env" \
              "$root/Data/generated/max-quic-awg/chain.env"; do
              require_file "$paf" "$path"
            done
            require_ini "$paf" "$root/App/AppInfo/appinfo.ini" '^Type=PortableApps\.comFormat$'
            require_ini "$paf" "$root/App/AppInfo/appinfo.ini" '^Version=3\.9$'
            require_ini "$paf" "$root/App/AppInfo/appinfo.ini" '^OpenSource=true$'
            require_ini "$paf" "$root/App/AppInfo/appinfo.ini" '^CommercialUse=true$'
            require_ini "$paf" "$root/App/AppInfo/appinfo.ini" '^Icons=2$'
            require_ini "$paf" "$root/App/AppInfo/appinfo.ini" '^Start2=powershell\.exe .*Setup-Windows-Runtime\.ps1$'
            require_ini "$paf" "$root/App/AppInfo/installer.ini" '^RemoveDataDirectory=false$'
            rm -f "$portable" "$paf"
          done

          # A full private bundle is also generated only when explicitly requested.
          bundle="$RUNNER_TEMP/home-bundle.zip"
          fetch_one router-vpn-client-bundle.zip "$bundle" "$RUNNER_TEMP/h3"
          unzip -Z1 "$bundle" | grep -q '/router-vpn-bundle.json$'
          rm -f "$bundle"
          ! find "$TEST_ROOT/downloads" -maxdepth 1 -type f -name '*.zip' | grep -q .

      - name: Validate formerly grey combined and MAX modes
        run: |
          TEST_ROOT="$RUNNER_TEMP/router-vpn-aux-test"
          docker run --rm --platform linux/arm64 \
            -v "$TEST_ROOT:/opt/router-vpn:ro" \
            --entrypoint /bin/bash router-vpn-ci-init:arm64 -euo pipefail -c '
              export HOMEVPN_ROOT=/opt/router-vpn/client-bundle
              export HOMEVPN_PROFILE_ID=home
              cd /src/modes

              echo "=== combined profiles ==="
              ./check-combined.sh split
              ./check-combined.sh max

              echo "=== WG MAX profiles ==="
              ./check-mode.sh max-quic-wg
              ./check-mode.sh max-tls-wg

              echo "=== AWG MAX generated profiles ==="
              mkdir -p /tmp/awg-check-bin
              for cmd in amneziawg-go awg awg-quick; do
                printf "#!/bin/sh\nexit 0\n" >"/tmp/awg-check-bin/$cmd"
                chmod +x "/tmp/awg-check-bin/$cmd"
              done
              export PATH="/tmp/awg-check-bin:$PATH"
              ./check-mode.sh max-quic-awg
              ./check-mode.sh max-tls-awg

              echo "=== ALL must have at least one validated MAX branch ==="
              ./check-mode.sh all
            '

      - name: Build auxiliary proxy ARM64 image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/aux-proxies/Dockerfile -t router-vpn-ci-aux:arm64 .

      - name: Smoke-test generated OverTLS and SSR services
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/overtls-bin router-vpn-ci-aux:arm64 --version
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/ssr-server router-vpn-ci-aux:arm64 -h >/dev/null 2>&1
          TEST_ROOT="$RUNNER_TEMP/router-vpn-aux-test"
          CID=$(docker run -d --platform linux/arm64 --network host \
            -v "$TEST_ROOT/config/aux:/router-vpn:ro" router-vpn-ci-aux:arm64)
          trap 'docker logs "$CID" || true; docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          sleep 3
          docker inspect -f '{{.State.Running}}' "$CID" | grep -qx true
          docker logs "$CID"
