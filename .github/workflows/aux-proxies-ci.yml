name: Aux proxies and setup assets ARM64

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aux-proxies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    name: Native ARM64 setup assets + ephemeral downloads + mode validation
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Static checks
        run: |
          python3 -m py_compile \
            server/scripts/generate-setup-assets.py \
            server/scripts/generate-aux-proxies.py \
            server/scripts/build-download-on-demand.py \
            server/scripts/download-broker.py \
            server/scripts/download_jobs.py \
            server/scripts/import_payloads.py \
            server/scripts/normalize-setup-imports.py \
            server/scripts/ensure-setup-auth.py \
            server/scripts/pairing.py
          python3 -m json.tool configs/client/logical-modes.json >/dev/null
          python3 deploy/validate-repo.py
          bash -n server/finalize/finalize.sh
          bash -n server/finalize/upgrade-safe.sh
          bash -n server/scripts/publish-downloads.sh
          bash -n client/setup-windows-runtime.sh
          bash -n server/aux-proxies/entrypoint.sh
          bash -n server/naive/entrypoint.sh
          bash -n modes/check-mode.sh
          bash -n modes/check-combined.sh
          sh -n router/asus-merlin-router-vpn-forwards.sh

      - name: Build init ARM64
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/init/Dockerfile -t router-vpn-ci-init:arm64 .

      - name: Run init and finalizer end to end
        run: |
          TEST_ROOT="$RUNNER_TEMP/router-vpn-aux-test"
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 -e ENDPOINT=1.1.1.1 \
            -v "$TEST_ROOT:/opt/router-vpn" router-vpn-ci-init:arm64
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 -e ENDPOINT=1.1.1.1 \
            -e OVERTLS_PORT=14443 -e OVERTLS_INTERNAL_PORT=14444 -e SSR_PORT=15443 \
            -v "$TEST_ROOT:/opt/router-vpn" --entrypoint /bin/bash \
            router-vpn-ci-init:arm64 /src/server/finalize/current-entrypoint.sh
          docker run --rm --platform linux/arm64 -v "$TEST_ROOT:/opt/router-vpn:ro" alpine:3.22 sh -ec '
            test -s /opt/router-vpn/config/setup-center.token
            test "$(stat -c %a /opt/router-vpn/config/setup-center.token)" = 600
            test -s /opt/router-vpn/client-bundle/setup-assets.json
            test -s /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            test -s /opt/router-vpn/downloads/router-vpn-device-setup.html
            test -s /opt/router-vpn/downloads/download-policy.json
            test ! -e /opt/router-vpn/downloads/router-vpn-bundle.json
            test ! -e /opt/router-vpn/downloads/CREDENTIALS.txt
            test -s /opt/router-vpn/config/aux/overtls-server.json
            test -s /opt/router-vpn/config/aux/ssr-server.json
            test -s /opt/router-vpn/client-bundle/generated/overtls/overtls-client.json
            test -s /opt/router-vpn/client-bundle/generated/shadowsocksr/ssr-client.json
            test -s /opt/router-vpn/client-bundle/logical-modes.json
            test -s /opt/router-vpn/client-bundle/client/Setup-Windows-Runtime.ps1
            test -s /opt/router-vpn/client-bundle/client/setup-windows-runtime.sh
            test ! -e /opt/router-vpn/client-bundle/dist
            test ! -e /opt/router-vpn/router-vpn-client-bundle.zip
            ! find /opt/router-vpn/downloads -maxdepth 1 -type f -name "*.zip" | grep -q .
            ! grep -q "setup-center.token" /opt/router-vpn/client-bundle/router-vpn-bundle.json
            grep -q "WireGuard" /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            grep -q "Potatso" /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            grep -q "SOCKS5 + TLS (OverTLS)" /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            grep -q "ShadowsocksR" /opt/router-vpn/client-bundle/router-vpn-device-setup.html
            grep -q "router-vpn-windows-portable-amd64.zip" /opt/router-vpn/downloads/router-vpn-device-setup.html
            ! grep -qi "portableapps" /opt/router-vpn/downloads/router-vpn-device-setup.html
            grep -q "generated on demand" /opt/router-vpn/downloads/router-vpn-device-setup.html
          '
          sudo chown -R "$(id -u):$(id -g)" "$TEST_ROOT"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'router-vpn-aux-test'
          for rel in ('config/aux/ssr-server.json', 'client-bundle/generated/shadowsocksr/ssr-client.json'):
              cfg = json.loads((root / rel).read_text())
              assert cfg['method'] == 'aes-256-ctr', (rel, cfg['method'])
              assert cfg['protocol'] == 'auth_aes128_md5', (rel, cfg['protocol'])
              assert cfg['obfs'] == 'tls1.2_ticket_auth', (rel, cfg['obfs'])
          assets=json.loads((root/'client-bundle/setup-assets.json').read_text())
          assert assets['methodContractVersion'] == 2
          assert assets['qrPolicy'].startswith('QR is emitted only')
          by_id={m['id']:m for m in assets['methods']}
          assert by_id['shadowsocks']['importType']=='sip002' and by_id['shadowsocks']['qrSupported'] is True
          assert by_id['shadowsocksr']['importType']=='ssr-uri' and by_id['shadowsocksr']['qrSupported'] is True
          assert by_id['socks5']['qrSupported'] is False
          assert by_id['overtls']['qrSupported'] is False
          PY

      - name: Verify authenticated generic packages, private bundle, and one-time pairing
        run: |
          set -euo pipefail
          TEST_ROOT="$RUNNER_TEMP/router-vpn-aux-test"
          SETUP_TOKEN=$(tr -d '\r\n' < "$TEST_ROOT/config/setup-center.token")
          test ${#SETUP_TOKEN} -ge 32
          BROKER=$(docker run -d --rm --platform linux/arm64 --network host \
            -e ROUTER_VPN_GITHUB_DISABLE=1 \
            -v "$TEST_ROOT:/opt/router-vpn:ro" \
            --entrypoint python3 router-vpn-ci-init:arm64 \
            /src/server/scripts/download-broker.py --base /opt/router-vpn --port 8786)
          trap 'docker logs "$BROKER" || true; docker rm -f "$BROKER" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8786/healthz >/dev/null && break
            sleep .2
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8786/)" = 401
          curl -fsS -H "Authorization: Bearer $SETUP_TOKEN" http://127.0.0.1:8786/ >/dev/null
          curl -fsS http://127.0.0.1:8786/api/download-policy | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["server_cache"] is False and x["preferred_source"]=="github-actions" and x["fallback"]=="router-local-generic-build" and x["local_build_scope"]=="requested-generic-package-only" and x["generic_packages_secret_free"] is True and x["node_linking"]=="separate-bundle-or-pairing" and x["setup_center_auth"].startswith("required")'
          curl -fsS http://127.0.0.1:8786/api/pairing/policy | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["lan_only"] is True and x["one_time"] is True and x["apple_local_network_permission_required"] is True'

          PAIR_JSON=$(curl -fsS -X POST -H "Authorization: Bearer $SETUP_TOKEN" -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8786/api/pairing)
          PAIR_CODE=$(printf '%s' "$PAIR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["pairing"]["code"])')
          test ${#PAIR_CODE} -eq 6
          curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"code\":\"$PAIR_CODE\"}" http://127.0.0.1:8786/api/pairing/redeem > "$RUNNER_TEMP/paired-node.json"
          python3 - "$RUNNER_TEMP/paired-node.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x.get('routerProfiles')
          assert x.get('profiles',{}).get('wg',{}).get('wg.conf')
          assert 'setup-center.token' not in json.dumps(x)
          PY
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d "{\"code\":\"$PAIR_CODE\"}" http://127.0.0.1:8786/api/pairing/redeem)" = 403

          require_file() {
            local archive=$1 path=$2
            unzip -Z1 "$archive" | grep -Fxq "$path" || { echo "MISSING in $(basename "$archive"): $path" >&2; unzip -Z1 "$archive" >&2; return 1; }
          }
          fetch_one() {
            local name=$1 out=$2 headers=$3 expected_source=$4
            curl -fsS -H "Authorization: Bearer $SETUP_TOKEN" -D "$headers" -o "$out" "http://127.0.0.1:8786/$name"
            if ! grep -Fqi "X-Router-VPN-Source: $expected_source" "$headers"; then
              echo "Unexpected package source response for $name:" >&2
              cat "$headers" >&2
              return 1
            fi
            unzip -tq "$out" >/dev/null
            ! find "$TEST_ROOT/downloads" -maxdepth 1 -type f -name '*.zip' | grep -q .
          }

          for arch in amd64 arm64; do
            portable="$RUNNER_TEMP/generic-portable-$arch.zip"
            fetch_one "router-vpn-windows-portable-$arch.zip" "$portable" "$RUNNER_TEMP/h-$arch" router-local-generic-build
            root="RouterVPNPortable-$arch"
            for path in \
              "$root/RouterVPNPortable.exe" \
              "$root/RouterVPNSetupRuntime.exe" \
              "$root/Setup-Windows-Runtime.ps1" \
              "$root/README.txt" \
              "$root/App/RouterVPN/router-vpn-client.exe" \
              "$root/App/RouterVPN/router-vpn-dns.exe" \
              "$root/App/RouterVPN/logical-modes.json" \
              "$root/App/RouterVPN/LICENSE" \
              "$root/Data/routers.json"; do
              require_file "$portable" "$path"
            done
            ! unzip -Z1 "$portable" | grep -Eq '(^|/)router-vpn-bundle\.json$'
            ! unzip -Z1 "$portable" | grep -Eq "$root/(App/RouterVPN/|Data/)generated/.+"
            unzip -p "$portable" "$root/Data/routers.json" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("selected_id","")=="" and x.get("profiles",[])==[]'
            ! unzip -Z1 "$portable" | grep -q "$root/App/AppInfo/"
            rm -f "$portable"
          done

          bundle="$RUNNER_TEMP/private-node-bundle.zip"
          fetch_one router-vpn-client-bundle.zip "$bundle" "$RUNNER_TEMP/h-bundle" private-node-bundle
          unzip -Z1 "$bundle" | grep -q '/router-vpn-bundle.json$'
          unzip -Z1 "$bundle" | grep -q '/generated/wg/wg.conf$'
          unzip -Z1 "$bundle" | grep -q '/generated/max-tls-wg/chain.env$'
          ! unzip -p "$bundle" '*/router-vpn-bundle.json' | grep -q 'setup-center.token'
          rm -f "$bundle"
          ! find "$TEST_ROOT/downloads" -maxdepth 1 -type f -name '*.zip' | grep -q .

      - name: Validate formerly grey combined and MAX modes
        run: |
          TEST_ROOT="$RUNNER_TEMP/router-vpn-aux-test"
          docker run --rm --platform linux/arm64 \
            -v "$TEST_ROOT:/opt/router-vpn:ro" \
            --entrypoint /bin/bash router-vpn-ci-init:arm64 -euo pipefail -c '
              export HOMEVPN_ROOT=/opt/router-vpn/client-bundle
              export HOMEVPN_PROFILE_ID=home
              cd /src/modes
              ./check-combined.sh split
              ./check-combined.sh max
              ./check-mode.sh max-quic-wg
              ./check-mode.sh max-tls-wg
              mkdir -p /tmp/awg-check-bin
              for cmd in amneziawg-go awg awg-quick; do
                printf "#!/bin/sh\nexit 0\n" >"/tmp/awg-check-bin/$cmd"
                chmod +x "/tmp/awg-check-bin/$cmd"
              done
              export PATH="/tmp/awg-check-bin:$PATH"
              ./check-mode.sh max-quic-awg
              ./check-mode.sh max-tls-awg
              ./check-mode.sh all
            '

      - name: Build auxiliary proxy ARM64 image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/aux-proxies/Dockerfile -t router-vpn-ci-aux:arm64 .

      - name: Smoke-test generated OverTLS and SSR services
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/overtls-bin router-vpn-ci-aux:arm64 --version
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/ssr-server router-vpn-ci-aux:arm64 -h >/dev/null 2>&1
          TEST_ROOT="$RUNNER_TEMP/router-vpn-aux-test"
          AUX="$TEST_ROOT/config/aux"
          CIDS=()
          cleanup() {
            for cid in "${CIDS[@]:-}"; do docker rm -f "$cid" >/dev/null 2>&1 || true; done
          }
          trap cleanup EXIT
          fail_with_logs() {
            local title=$1 cid=$2 state logs
            state=$(docker inspect -f 'running={{.State.Running}} exit={{.State.ExitCode}} error={{.State.Error}}' "$cid" 2>/dev/null || true)
            logs=$(docker logs "$cid" 2>&1 | tail -40 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=${title} ARM64 runtime::${state} | ${logs}"
            return 1
          }
          assert_running() {
            local title=$1 cid=$2
            sleep 2
            if [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo false)" != true ]; then
              fail_with_logs "$title" "$cid"
            fi
          }

          OT=$(docker run -d --platform linux/arm64 --network host \
            -v "$AUX:/router-vpn:ro" \
            --entrypoint /usr/local/bin/overtls-bin router-vpn-ci-aux:arm64 \
            -r server -c /router-vpn/overtls-server.json)
          CIDS+=("$OT")
          assert_running OverTLS "$OT"
          docker rm -f "$OT" >/dev/null
          CIDS=()

          SSR=$(docker run -d --platform linux/arm64 --network host \
            -v "$AUX:/router-vpn:ro" \
            --entrypoint /usr/local/bin/ssr-server router-vpn-ci-aux:arm64 \
            -c /router-vpn/ssr-server.json)
          CIDS+=("$SSR")
          assert_running ShadowsocksR "$SSR"
          docker rm -f "$SSR" >/dev/null
          CIDS=()

          BOTH=$(docker run -d --platform linux/arm64 --network host \
            -v "$AUX:/router-vpn:ro" router-vpn-ci-aux:arm64)
          CIDS+=("$BOTH")
          assert_running Combined-aux "$BOTH"
          docker logs "$BOTH"
