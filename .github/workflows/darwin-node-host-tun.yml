name: Darwin installed ordered host native acceptance

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: darwin-node-host-tun-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  host:
    name: Actual installed ordered host, PF, utun and public MTU on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # All67 independent native cases retain their original240-second deadlines.
    # The original37 and SOCKS8 precede22 actual HTTP(S) CONNECT cases.
    # Preparation, two bounded compiler calls, extraction and joined cleanup
    # have separate budget; no component-only result can satisfy this job.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Verify exhaustive cases, native verdicts and exact artifact consumer
        run: python3 deploy/test_macos_node_chain_host_runner.py
      - name: Preserve original SOCKS ownership and verdict controls
        run: python3 deploy/test_macos_socks_node_chain_host_runner.py
      - name: Verify actual CONNECT inventory, trust and stream retirement controls
        run: python3 deploy/test_macos_connect_node_chain_host_runner.py
      - uses: actions/download-artifact@v4
        with:
          # No run-id, repository, token or wildcard: only this caller run's
          # complete bundle for the exact target and source commit is accepted.
          name: RouterVPN-native-runtime-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/ordered-host-bundle
      - name: Verify complete exact-source native bundle before installing its sealed copy
        run: python3 deploy/native-runtime-bundle.py extract 'darwin/${{ matrix.arch }}' "$RUNNER_TEMP/ordered-host-bundle/native-darwin-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/ordered-host-verified"
      - name: Require actual original encrypted graph, public MTU and joined native retirement
        timeout-minutes: 110
        env:
          ROUTERVPN_DARWIN_NODE_CHAIN_HOST_ACCEPTANCE: '1'
          ROUTERVPN_DARWIN_SOCKS_NODE_CHAIN_HOST_ACCEPTANCE: '1'
          ROUTERVPN_DARWIN_CONNECT_NODE_CHAIN_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_HOST_RECEIPT: ${{ runner.temp }}/darwin-node-host-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_macos_connect_node_chain_host.py --bundle "$RUNNER_TEMP/ordered-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_HOST_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Darwin-ordered-host-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-node-host-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  paired-host:
    name: Actual installed paired Router host and Auto MTU on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Require complete paired host inventory and authoritative workflow
        run: |
          python3 deploy/test_macos_paired_node_host_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-native-runtime-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/paired-host-bundle
      - name: Verify exact-source paired runtime bundle
        run: python3 deploy/native-runtime-bundle.py extract 'darwin/${{ matrix.arch }}' "$RUNNER_TEMP/paired-host-bundle/native-darwin-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/paired-host-verified"
      - name: Require real paired graphs, protection, measurements and cancellation
        timeout-minutes: 110
        env:
          ROUTERVPN_DARWIN_PAIRED_NODE_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_PAIRED_HOST_RECEIPT: ${{ runner.temp }}/darwin-paired-node-host-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_macos_paired_node_host.py --bundle "$RUNNER_TEMP/paired-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_PAIRED_HOST_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Darwin-paired-host-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-paired-node-host-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  imported-execution-host:
    name: Actual imported trio Server and Compare on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Require imported execution inventory, cleanup controls and authoritative workflow
        run: |
          python3 deploy/test_macos_imported_execution_host_runner.py
          python3 deploy/test_macos_imported_execution_alias_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-native-runtime-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/imported-execution-host-bundle
      - name: Verify exact-source imported execution runtime bundle
        run: python3 deploy/native-runtime-bundle.py extract 'darwin/${{ matrix.arch }}' "$RUNNER_TEMP/imported-execution-host-bundle/native-darwin-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/imported-execution-host-verified"
      - name: Require real imported Server, both Compare winners and retained restoration
        timeout-minutes: 110
        env:
          ROUTERVPN_DARWIN_IMPORTED_EXECUTION_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_IMPORTED_EXECUTION_RECEIPT: ${{ runner.temp }}/darwin-imported-execution-host-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_macos_imported_execution_host.py --bundle "$RUNNER_TEMP/imported-execution-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_IMPORTED_EXECUTION_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Darwin-imported-execution-host-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-imported-execution-host-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  paired-ss-execution-host:
    name: Actual paired two-node SS Server and Compare on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Require paired SS execution inventory, cleanup controls and authoritative workflow
        run: |
          python3 deploy/test_macos_paired_ss_execution_host_runner.py
          python3 deploy/test_macos_imported_execution_alias_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-native-runtime-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/paired-ss-execution-host-bundle
      - name: Verify exact-source paired SS execution runtime bundle
        run: python3 deploy/native-runtime-bundle.py extract 'darwin/${{ matrix.arch }}' "$RUNNER_TEMP/paired-ss-execution-host-bundle/native-darwin-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/paired-ss-execution-host-verified"
      - name: Require real paired SS Server, both Compare winners and retained restoration
        timeout-minutes: 110
        env:
          ROUTERVPN_DARWIN_PAIRED_SS_EXECUTION_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_PAIRED_SS_EXECUTION_RECEIPT: ${{ runner.temp }}/darwin-paired-ss-execution-host-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_macos_paired_ss_execution_host.py --bundle "$RUNNER_TEMP/paired-ss-execution-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_PAIRED_SS_EXECUTION_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Darwin-paired-ss-execution-host-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-paired-ss-execution-host-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  imported-execution-layers-host:
    name: Actual independent paired Start Layers with Server and Compare on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Fourteen layer cases keep separate native and compiler budgets.
    # The original thirteen unlayered cases remain in the preceding job.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Require independent paired layers, cleanup controls and authoritative workflow
        run: |
          python3 deploy/test_macos_imported_execution_host_runner.py
          python3 deploy/test_macos_imported_execution_layers_host_runner.py
          python3 deploy/test_macos_imported_execution_alias_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-native-runtime-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/imported-execution-layers-host-bundle
      - name: Verify exact-source independent layer runtime bundle
        run: python3 deploy/native-runtime-bundle.py extract 'darwin/${{ matrix.arch }}' "$RUNNER_TEMP/imported-execution-layers-host-bundle/native-darwin-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/imported-execution-layers-host-verified"
      - name: Require real independent entry and exit layers and wrong-key refusal
        timeout-minutes: 110
        env:
          ROUTERVPN_DARWIN_IMPORTED_EXECUTION_LAYERS_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_IMPORTED_EXECUTION_LAYERS_RECEIPT: ${{ runner.temp }}/darwin-imported-execution-layers-host-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_macos_imported_execution_layers_host.py --bundle "$RUNNER_TEMP/imported-execution-layers-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_IMPORTED_EXECUTION_LAYERS_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Darwin-imported-execution-layers-host-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-imported-execution-layers-host-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  connect-execution-host:
    name: Actual CONNECT trio Server and Compare on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Require CONNECT execution inventory, cleanup controls and authoritative workflow
        run: |
          python3 deploy/test_macos_connect_execution_host_runner.py
          python3 deploy/test_macos_imported_execution_alias_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-native-runtime-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/connect-execution-host-bundle
      - name: Verify exact-source CONNECT execution runtime bundle
        run: python3 deploy/native-runtime-bundle.py extract 'darwin/${{ matrix.arch }}' "$RUNNER_TEMP/connect-execution-host-bundle/native-darwin-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/connect-execution-host-verified"
      - name: Require real CONNECT Server, both Compare winners and retained restoration
        timeout-minutes: 110
        env:
          ROUTERVPN_DARWIN_CONNECT_EXECUTION_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_CONNECT_EXECUTION_RECEIPT: ${{ runner.temp }}/darwin-connect-execution-host-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_macos_connect_execution_host.py --bundle "$RUNNER_TEMP/connect-execution-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_CONNECT_EXECUTION_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Darwin-connect-execution-host-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-connect-execution-host-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
