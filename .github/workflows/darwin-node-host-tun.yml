name: Darwin installed ordered host native acceptance

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: darwin-node-host-tun-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  host:
    name: Actual installed ordered host, PF, utun and public MTU on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # All67 independent native cases retain their original240-second deadlines.
    # The original37 and SOCKS8 precede22 actual HTTP(S) CONNECT cases.
    # Preparation, two bounded compiler calls, extraction and joined cleanup
    # have separate budget; no component-only result can satisfy this job.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Verify exhaustive cases, native verdicts and exact artifact consumer
        run: python3 deploy/test_macos_node_chain_host_runner.py
      - name: Preserve original SOCKS ownership and verdict controls
        run: python3 deploy/test_macos_socks_node_chain_host_runner.py
      - name: Verify actual CONNECT inventory, trust and stream retirement controls
        run: python3 deploy/test_macos_connect_node_chain_host_runner.py
      - uses: actions/download-artifact@v4
        with:
          # No run-id, repository, token or wildcard: only this caller run's
          # complete bundle for the exact target and source commit is accepted.
          name: RouterVPN-native-runtime-darwin-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/ordered-host-bundle
      - name: Verify complete exact-source native bundle before installing its sealed copy
        run: python3 deploy/native-runtime-bundle.py extract 'darwin/${{ matrix.arch }}' "$RUNNER_TEMP/ordered-host-bundle/native-darwin-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/ordered-host-verified"
      - name: Require actual original encrypted graph, public MTU and joined native retirement
        timeout-minutes: 110
        env:
          ROUTERVPN_DARWIN_NODE_CHAIN_HOST_ACCEPTANCE: '1'
          ROUTERVPN_DARWIN_SOCKS_NODE_CHAIN_HOST_ACCEPTANCE: '1'
          ROUTERVPN_DARWIN_CONNECT_NODE_CHAIN_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_HOST_RECEIPT: ${{ runner.temp }}/darwin-node-host-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_macos_connect_node_chain_host.py --bundle "$RUNNER_TEMP/ordered-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_HOST_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Darwin-ordered-host-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-node-host-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
