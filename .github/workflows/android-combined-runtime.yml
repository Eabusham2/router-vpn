name: Android combined runtime gate

on:
  push:
    branches: [main]
    paths:
      - 'android/build-sing-box-libbox.sh'
      - 'android/routervpn_xray_bridge.go'
      - 'android/app/build.gradle'
      - 'android/app/src/main/java/com/eabusham/routervpn/XrayVpnService.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/NativeXrayController.java'
      - 'android/test_android_runtime_contract.py'
      - '.github/workflows/android-combined-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore pinned native Android build cache
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/libbox.aar
            android/app/libs/libbox.commit
            android/app/libs/libbox-LICENSE.txt
            android/app/libs/libxray-LICENSE.txt
            android/app/libs/amneziawg-tunnel.aar
            android/app/libs/amneziawg-tunnel.commit
            android/app/libs/amneziawg-tunnel-LICENSE.txt
          key: routervpn-android-combined-${{ runner.os }}-${{ hashFiles('android/build-sing-box-libbox.sh', 'android/routervpn_xray_bridge.go', 'android/build-awg-tunnel.sh') }}
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run Android source truth contracts
        run: |
          python3 android/test_android_runtime_contract.py
          python3 android/test_android_native_policy_contract.py
      - name: Build one-runtime APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p android --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee android-combined-runtime.log
      - name: Verify combined AAR and APK runtime shape
        shell: bash
        run: |
          set -euo pipefail
          bash android/build-sing-box-libbox.sh
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -n "$APK" -a -s "$APK"
          unzip -l "$APK" > /tmp/apk.list
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -q "lib/$abi/libbox.so" /tmp/apk.list || { echo "APK missing $abi/libbox.so" >&2; exit 1; }
          done
          if grep -q 'libgojni\.so' /tmp/apk.list; then
            echo 'APK unexpectedly contains standalone libgojni.so' >&2
            exit 1
          fi
          test ! -e android/app/libs/libxray.aar || { echo 'standalone libxray.aar must not be packaged or left in app/libs' >&2; exit 1; }
          printf 'combined Android runtime APK verified: %s\n' "$APK"
      - name: Upload combined APK evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Android-combined-runtime-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/libs/libbox.commit
            android/app/libs/libbox-LICENSE.txt
            android/app/libs/libxray-LICENSE.txt
          if-no-files-found: error
          retention-days: 2
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Android-combined-runtime-log-${{ github.sha }}
          path: android-combined-runtime.log
          if-no-files-found: ignore
          retention-days: 1
