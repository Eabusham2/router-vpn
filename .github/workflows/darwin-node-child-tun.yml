name: Darwin generated ordered child utun acceptance

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'mobile/desktop/**'
      - 'mobile/mtu/**'
      - 'internal/mobilemultihop/**'
      - 'internal/mobiletor/**'
      - 'internal/macosprocess/**'
      - 'internal/desktopnetwork/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/darwin-node-child-tun.yml'
  pull_request:
    paths:
      - 'mobile/desktop/**'
      - 'mobile/mtu/**'
      - 'internal/mobilemultihop/**'
      - 'internal/mobiletor/**'
      - 'internal/macosprocess/**'
      - 'internal/desktopnetwork/**'
      - 'deploy/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/darwin-node-child-tun.yml'

permissions:
  contents: read

concurrency:
  group: darwin-node-child-tun-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  child:
    name: Actual ordered child, PF and utun on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify exact native verdict, ownership and source projection boundaries
        run: python3 deploy/test_darwin_node_child_tun_runner.py
      - name: Compile exact native fixtures before changing host networking
        timeout-minutes: 25
        run: ROUTERVPN_DARWIN_NODE_CHILD_ACCEPTANCE=1 CGO_ENABLED=1 python3 deploy/test_darwin_node_child_tun.py --standalone --compile-only --require-commit "$GITHUB_SHA"
      - name: Require real inherited child, every-node proof, selected DNS, utun rollback and joined stop
        timeout-minutes: 45
        env:
          ROUTERVPN_DARWIN_NODE_CHILD_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_CHILD_RECEIPT: ${{ runner.temp }}/darwin-node-child-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          # This is an explicit disposable macOS host. The fixture refuses an
          # existing installation and preserves unjoined PF/native ownership.
          # No cross-platform compilation or component result satisfies it.
          python3 deploy/test_darwin_node_child_tun.py --standalone --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_CHILD_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Darwin-ordered-child-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/darwin-node-child-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
