name: Apply Router-VPN final batch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Stage final Router-VPN consolidation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact validated local batch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9a7330d6a8ce05fc53a8082b6f57a7e45af7fe6c"
          cat .routervpn-final-patch/part01 .routervpn-final-patch/part02 .routervpn-final-patch/part03 .routervpn-final-patch/part04a .routervpn-final-patch/part04b .routervpn-final-patch/part04c .routervpn-final-patch/part04d | base64 -d | gunzip > /tmp/routervpn-final.patch
          git apply --check /tmp/routervpn-final.patch
          git apply --index /tmp/routervpn-final.patch
          rm -rf .routervpn-final-patch
          rm -f .github/workflows/apply-routervpn-final-batch.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && { echo 'No final changes staged'; exit 1; }
          git commit -m 'Finalize recovered requirements, shipping gates, and ASUS safety'
          git push origin HEAD:main
