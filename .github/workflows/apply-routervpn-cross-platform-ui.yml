name: Apply RouterVPN cross-platform UI update

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated cross-platform source patch
        shell: bash
        run: |
          set -euo pipefail
          git switch -C publish origin/main
          cat .github/ui-patch-part-00 .github/ui-patch-part-01 .github/ui-patch-part-02 .github/ui-patch-part-03 .github/ui-patch-part-04 .github/ui-patch-part-05 > /tmp/routervpn-ui.b64
          echo '5e06a3d90bb5637d0afeb79d764dc03a427fdb2b3b907a3106ab181f67e9833f  /tmp/routervpn-ui.b64' | sha256sum -c -
          base64 -d /tmp/routervpn-ui.b64 > /tmp/routervpn-ui.patch.gz
          gzip -dc /tmp/routervpn-ui.patch.gz > /tmp/routervpn-cross-platform-ui.patch
          echo '697bee9287c72cded97898e0dd34aac70d64e2475d5daf581ef79bea756727eb  /tmp/routervpn-cross-platform-ui.patch' | sha256sum -c -
          git apply --check /tmp/routervpn-cross-platform-ui.patch
          git apply /tmp/routervpn-cross-platform-ui.patch
          rm -f .github/routervpn-cross-platform-ui.patch.gz.b64 .github/workflows/apply-routervpn-cross-platform-ui.yml .github/ui-patch-part-00 .github/ui-patch-part-01 .github/ui-patch-part-02 .github/ui-patch-part-03 .github/ui-patch-part-04 .github/ui-patch-part-05
          git diff --check
      - name: Re-run source-first product gates
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/linux-auto-requirements-audit.py
          python3 deploy/profile-settings-audit.py
          python3 deploy/product-parity-audit.py
          python3 deploy/linux-full-profile-shipping-audit.py
          python3 deploy/full-audit-v4.py
          python3 deploy/latest-a20-product-contract-audit.py
          python3 deploy/recovered-requirements-1-264-audit.py
          python3 deploy/recovered-requirements-265-311-audit.py
          python3 deploy/recovered-addendum-312-356-audit.py
          python3 deploy/recovered-corrections-audit.py
          python3 deploy/release-orchestration-audit.py
          python3 deploy/validate-repo.py
      - name: Commit real source and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Eabusham2'
          git config user.email 'eabusham2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Unify AUTO requirements across native map-first UI'
          git push origin HEAD:main
