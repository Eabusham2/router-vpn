name: One-shot Setup Center download recovery

on:
  push:
    branches:
      - automation/setup-center-download-resume

permissions:
  contents: write

concurrency:
  group: one-shot-setup-center-download-resume
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add interruption-safe progress and remove transport automation
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 .github/scripts/apply-setup-center-download-resume.py
          git push origin HEAD:main
          git push origin --delete automation/setup-center-download-resume || true
