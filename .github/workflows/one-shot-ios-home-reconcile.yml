name: One-shot iOS Home reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ios-home-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make canonical Home source authoritative and self-remove
        shell: bash
        run: |
          set -euo pipefail
          cp ios/RouterVPN/App/IOSHomeSummaryViewV2.swift.txt ios/RouterVPN/App/IOSHomeSummaryView.swift
          rm -f ios/RouterVPN/App/IOSHomeSummaryViewV2.swift.txt .github/workflows/one-shot-ios-home-reconcile.yml
          grep -Fq 'IOSProfileSettingsView' ios/RouterVPN/App/IOSHomeSummaryView.swift
          grep -Fq 'ViewThatFits' ios/RouterVPN/App/IOSHomeSummaryView.swift
          grep -Fq 'Cached profile.publicIP is never used as live proof' ios/RouterVPN/App/IOSHomeSummaryView.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make adaptive iOS Home settings source authoritative"
          git push origin HEAD:main
