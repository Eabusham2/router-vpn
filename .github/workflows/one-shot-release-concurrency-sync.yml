name: One-shot release concurrency sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-release-concurrency-sync.yml

permissions:
  contents: write

concurrency:
  group: one-shot-release-concurrency-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'Eabusham2/router-vpn'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply audited reusable-workflow concurrency repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path

          begin = "$" + "{{ "
          end = " }}"
          workflows = {
              ".github/workflows/source-snapshot.yml": "source-snapshot",
              ".github/workflows/release-candidate.yml": "release-candidate",
              ".github/workflows/arm64-portainer-preflight.yml": "arm64-portainer",
              ".github/workflows/publish-arm64-images.yml": "publish-arm64-portainer",
              ".github/workflows/production-release-compose.yml": "production-release-compose",
          }
          audit_replacements = []
          for filename, prefix in workflows.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old = f"  group: {prefix}-{begin}github.ref{end}-{begin}github.sha{end}"
              new = f"  group: {prefix}-{begin}github.workflow{end}-{begin}github.ref{end}-{begin}github.sha{end}"
              if text.count(old) != 1 or new in text:
                  raise SystemExit(f"unexpected concurrency contract in {filename}")
              path.write_text(text.replace(old, new), encoding="utf-8")
              audit_replacements.append((old.strip(), new.strip()))

          audit = Path("deploy/release-orchestration-audit.py")
          text = audit.read_text(encoding="utf-8")
          for old, new in audit_replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected orchestration audit contract: {old}")
              text = text.replace(old, new)
          for old, new in (
              (
                  'f"{rel} can be canceled by a different release SHA"',
                  'f"{rel} must isolate the authoritative caller from standalone same-SHA diagnostics"',
              ),
              (
                  'f"{rel} does not collapse duplicate same-SHA runs"',
                  'f"{rel} does not collapse duplicates from the same caller"',
              ),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected orchestration audit message: {old}")
              text = text.replace(old, new)
          audit.write_text(text, encoding="utf-8")
          PY

          git rm --ignore-unmatch \
            .github/workflows/one-shot-release-concurrency-repair.yml \
            .github/workflows/one-shot-release-concurrency-sync.yml

          python3 deploy/workflow-structure-audit.py
          python3 deploy/workflow-evidence-pipeline-audit.py
          python3 deploy/workflow-source-integrity-audit.py
          python3 deploy/validate-repo.py
          python3 deploy/release-orchestration-audit.py
          git diff --check

          git add \
            .github/workflows/source-snapshot.yml \
            .github/workflows/release-candidate.yml \
            .github/workflows/arm64-portainer-preflight.yml \
            .github/workflows/publish-arm64-images.yml \
            .github/workflows/production-release-compose.yml \
            deploy/release-orchestration-audit.py
          git diff --cached --check
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          git commit -m "Isolate reusable release workflow concurrency"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
