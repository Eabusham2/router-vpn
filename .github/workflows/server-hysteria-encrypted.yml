name: Hysteria2 Server encrypted suffix acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: hysteria-server-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  encrypted:
    name: Actual Hysteria2 Server on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install actual namespace and native compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git iproute2 util-linux sudo
      - name: Require exact Hysteria2 source, transport and retirement inventory
        run: python3 deploy/test_server_node_chain_hysteria_encrypted_runner.py
      - name: Require actual QUIC authentication, packet prefixes, final DNS and joined Stop
        timeout-minutes: 40
        env:
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_HYSTERIA_SERVER_RECEIPT: ${{ runner.temp }}/server-hysteria-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_server_node_chain_hysteria_encrypted.py --standalone --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_HYSTERIA_SERVER_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Hysteria2-Server-encrypted-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/server-hysteria-${{ matrix.arch }}.json
          if-no-files-found: error
