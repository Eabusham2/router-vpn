name: Linux native app

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/linux/**'
      - 'deploy/package-linux-native.sh'
      - 'deploy/test-linux-rendered-layout.sh'
      - 'deploy/test-linux-via-entry-candidates-ui.py'
      - 'deploy/test_desktop_mtu.py'
      - 'deploy/test_desktop_startup_settings.py'
      - 'deploy/test_desktop_protection_settings.py'
      - 'deploy/test_desktop_dns_settings.py'
      - 'deploy/test_desktop_quick_dns.py'
      - 'deploy/test_linux_dns_measurement.py'
      - 'deploy/test_linux_controller_privilege.py'
      - 'deploy/test_linux_native_install.py'
      - 'deploy/materialize-desktop-icons.py'
      - 'cmd/client/**'
      - 'cmd/dnsproxy/**'
      - 'internal/common/**'
      - 'modes/**'
      - 'client/**'
      - 'configs/client/**'
      - 'deploy/check-generic-package-secrets.py'
      - '.github/workflows/linux-native-app.yml'
  push:
    branches: [main]
    paths:
      - 'client/linux/**'
      - 'deploy/package-linux-native.sh'
      - 'deploy/test-linux-rendered-layout.sh'
      - 'deploy/test-linux-via-entry-candidates-ui.py'
      - 'deploy/test_desktop_mtu.py'
      - 'deploy/test_desktop_startup_settings.py'
      - 'deploy/test_desktop_protection_settings.py'
      - 'deploy/test_desktop_dns_settings.py'
      - 'deploy/test_desktop_quick_dns.py'
      - 'deploy/test_linux_dns_measurement.py'
      - 'deploy/test_linux_controller_privilege.py'
      - 'deploy/test_linux_native_install.py'
      - 'deploy/materialize-desktop-icons.py'
      - 'cmd/client/**'
      - 'cmd/dnsproxy/**'
      - 'internal/common/**'
      - 'modes/**'
      - 'client/**'
      - 'configs/client/**'
      - 'deploy/check-generic-package-secrets.py'
      - '.github/workflows/linux-native-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtimes:
    name: Build and verify complete native runtimes
    uses: ./.github/workflows/desktop-native-runtime.yml
    with:
      platform: linux

  native-linux:
    needs: native-runtimes
    name: Native GTK ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libcurl4-openssl-dev libjson-glib-dev pkg-config file xvfb xauth nftables iproute2 passwd util-linux pkexec
      - name: Desktop icon generator self-test
        run: python3 deploy/materialize-desktop-icons.py --self-test
      - name: Native routed candidate selection and cancellation
        run: python3 deploy/test-linux-via-entry-candidates-ui.py
      - name: Test controller and shared contracts
        run: go test ./cmd/client ./internal/common
      - name: GTK MTU progress, exact cancellation and final rollback receipts
        run: python3 deploy/test_desktop_mtu.py --platform linux
      - name: Imported-node startup settings preserve captured identity
        run: python3 deploy/test_desktop_startup_settings.py --platform linux
      - name: Native protection controls preserve the captured node
        run: python3 deploy/test_desktop_protection_settings.py --platform linux
      - name: DNS editors preserve the captured node and selected transport
        run: python3 deploy/test_desktop_dns_settings.py --platform linux
      - name: Compact DNS preserves captured ownership and encrypted Home
        run: python3 deploy/test_desktop_quick_dns.py --platform linux
      - name: GTK measured DNS selection, cancellation drain and expiring drafts
        run: python3 deploy/test_linux_dns_measurement.py
      - name: GTK captured device policy and atomic startup settings
        run: python3 deploy/test_linux_device_settings.py
      - uses: actions/download-artifact@v4
        with:
          pattern: RouterVPN-native-runtime-linux-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifacts
          merge-multiple: true
      - name: Verify and stage exact native runtime payloads
        shell: bash
        run: python3 deploy/native-runtime-bundle.py stage "$RUNNER_TEMP/native-runtime-artifacts" dist/native-runtime linux/${{ matrix.arch }}
      - name: Build and package native Linux app
        shell: bash
        run: |
          set +e
          chmod +x client/linux/build-native-app.sh deploy/package-linux-native.sh
          ./deploy/package-linux-native.sh '${{ matrix.arch }}' >"$RUNNER_TEMP/linux-native-build.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/linux-native-build.log"
          if [ "$rc" -ne 0 ]; then
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=Linux native ${{ matrix.arch }} build::${line}"
            done < <(tail -n 20 "$RUNNER_TEMP/linux-native-build.log")
            exit "$rc"
          fi
      - name: Verify native GTK package contract
        run: |
          arch='${{ matrix.arch }}'
          archive="dist/linux-native/RouterVPN-linux-$arch.tar.gz"
          test -s "$archive"
          members="$RUNNER_TEMP/linux-native-$arch-members.txt"
          tar -tzf "$archive" > "$members"
          for member in router-vpn-app router-vpn-update router-vpn.png router-vpn.desktop install-router-vpn.sh LICENSE; do
            grep -Fxq "RouterVPN-linux-$arch/$member" "$members"
          done
          ! grep -Fq 'router-vpn-bundle.json' "$members"
          test ! -d "dist/linux-native/work-$arch"
          grep -Fq 'SRC="$ROOT/client/linux/routervpn-gtk-product-v5.c"' client/linux/build-native-app.sh
          grep -Fq 'SHIPPED=("$SRC"' client/linux/build-native-app.sh
          grep -Fq 'routervpn-unified-shell-v8.inc' client/linux/build-native-app.sh
          grep -Fq 'gtk_stack_new' client/linux/routervpn-unified-shell-v8.inc
          grep -Fq 'gtk_window_new' client/linux/routervpn-gtk-product-v5.c
          grep -Fq -- '--self-test' client/linux/routervpn-gtk-product-v5.c
          grep -Fq 'http://127.0.0.1:8788' client/linux/routervpn-gtk-product.c
          grep -Fq '/api/connect-logical' client/linux/routervpn-gtk-product.c
          ! grep -Eqi 'WebKit|WebView|chromium|electron|xdg-open|sensible-browser' client/linux/routervpn-gtk-product-v5.c client/linux/routervpn-gtk-product-v4.c client/linux/routervpn-gtk-product-v3.c client/linux/routervpn-gtk-product.c
          work="$RUNNER_TEMP/linux-native-inspect-$arch"
          rm -rf "$work"
          mkdir -p "$work"
          tar -xzf "$archive" -C "$work"
          root="$work/RouterVPN-linux-$arch"
          grep -Fxq 'TryExec=/usr/local/bin/router-vpn' "$root/router-vpn.desktop"
          grep -Fxq 'Exec=/usr/local/bin/router-vpn' "$root/router-vpn.desktop"
          grep -Fxq 'Icon=router-vpn' "$root/router-vpn.desktop"
          grep -Fxq 'StartupWMClass=router-vpn-app' "$root/router-vpn.desktop"
          grep -Fq '[[ ! -f "$ROOT/routers.json" ]]' "$root/install-router-vpn.sh"
          test -s "$root/router-vpn.png"
          python3 - "$root/router-vpn.png" <<'PY'
          from pathlib import Path
          import sys
          data=Path(sys.argv[1]).read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n') and len(data)>4096
          print('Linux Router VPN icon contract OK')
          PY
          (cd dist/linux-native && sha256sum -c "RouterVPN-linux-$arch.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Linux-Native-${{ matrix.arch }}-CI
          path: |
            dist/linux-native/RouterVPN-linux-${{ matrix.arch }}.tar.gz
            dist/linux-native/RouterVPN-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 1
