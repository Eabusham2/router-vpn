name: iOS pinned Libbox engine contract

on:
  push:
    branches: [main]
    paths:
      - 'ios/RouterVPN/prepare-libbox.sh'
      - 'ios/RouterVPN/test_libbox_build_contract.py'
      - 'ios/RouterVPN/test_libbox_link_contract.py'
      - 'ios/RouterVPN/project.yml'
      - 'ios/RouterVPN/PacketTunnel/Libbox*.swift'
      - '.github/workflows/ios-libbox-engine.yml'
  pull_request:
    paths:
      - 'ios/RouterVPN/prepare-libbox.sh'
      - 'ios/RouterVPN/test_libbox_build_contract.py'
      - 'ios/RouterVPN/test_libbox_link_contract.py'
      - 'ios/RouterVPN/project.yml'
      - 'ios/RouterVPN/PacketTunnel/Libbox*.swift'
      - '.github/workflows/ios-libbox-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-libbox:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Static pin and link contracts
        run: |
          python3 ios/RouterVPN/test_libbox_build_contract.py
          python3 ios/RouterVPN/test_libbox_link_contract.py
      - name: Build exact Apple Libbox XCFramework
        working-directory: ios/RouterVPN
        run: ./prepare-libbox.sh
      - name: Verify exact pin slices and generated API
        working-directory: ios/RouterVPN
        run: |
          test -d .deps/Libbox.xcframework
          test -s .deps/libbox-LICENSE.txt
          grep -Fq '1.13.12+1086ab2563320e0da0c23b3a491d8dfa0939dff4+go1.26.3+0.1.12+ios,iossimulator' .deps/Libbox.xcframework.pin
          python3 - <<'PY'
          import plistlib
          p=plistlib.load(open('.deps/Libbox.xcframework/Info.plist','rb'))
          plats={(x.get('SupportedPlatform'),x.get('SupportedPlatformVariant','')) for x in p['AvailableLibraries']}
          assert ('ios','') in plats, plats
          assert ('ios','simulator') in plats, plats
          PY
          HEADER=$(find .deps/Libbox.xcframework -path '*/Headers/Libbox.h' -print -quit)
          test -s "$HEADER"
          echo '=== exact pinned Libbox PlatformInterface/command signatures ==='
          SIGNATURES="$RUNNER_TEMP/routervpn-libbox-signatures.txt"
          grep -nE 'PlatformInterface|CommandServer|StartOrReloadService|OpenTun|openTun|LibboxVersion|SetupOptions' "$HEADER" >"$SIGNATURES" || true
          head -n 240 "$SIGNATURES"
          grep -Fq 'LibboxVersion' "$HEADER"
          grep -Fq 'LibboxPlatformInterface' "$HEADER"
          grep -Fq 'LibboxCommandServer' "$HEADER"
      - name: Prepare pinned WireGuardKit and compile PacketTunnel import probe
        working-directory: ios/RouterVPN
        run: |
          sh prepare-wireguard-kit.sh
          brew install xcodegen
          xcodegen generate
          xcodebuild -project RouterVPN.xcodeproj -scheme RouterVPN -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/LibboxProbeDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' ROUTER_VPN_SOURCE_SHA="$GITHUB_SHA" build
          APP="$PWD/build/LibboxProbeDerivedData/Build/Products/Release-iphoneos/RouterVPN.app"
          test "$(plutil -extract RouterVPNSourceSHA raw "$APP/Info.plist")" = "$GITHUB_SHA"
          test "$(plutil -extract RouterVPNArtifactFamily raw "$APP/Info.plist")" = "ios-app"
          test "$(plutil -extract RouterVPNSourceSHA raw "$APP/PlugIns/RouterVPNPacketTunnel.appex/Info.plist")" = "$GITHUB_SHA"
          test "$(plutil -extract RouterVPNArtifactFamily raw "$APP/PlugIns/RouterVPNPacketTunnel.appex/Info.plist")" = "ios-packet-tunnel"
          grep -Fq 'import Libbox' PacketTunnel/LibboxCompileProbe.swift
          grep -Fq 'LibboxVersion()' PacketTunnel/LibboxCompileProbe.swift
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Libbox-1.13.12-signature
          path: |
            ios/RouterVPN/.deps/Libbox.xcframework/**/Headers/Libbox.h
            ios/RouterVPN/.deps/Libbox.xcframework.pin
            ios/RouterVPN/.deps/libbox-LICENSE.txt
          if-no-files-found: error
          retention-days: 1
