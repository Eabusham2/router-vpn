name: Linux installed SOCKS Server and Compare acceptance

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: linux-socks-execution-host-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  host:
    name: Actual SOCKS trio Server and Compare on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Install native namespace and compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git iproute2 nftables util-linux uidmap sudo passwd
          test -c /dev/net/tun
      - name: Require SOCKS execution inventory, cleanup controls and authoritative workflow
        run: |
          python3 deploy/test_linux_socks_execution_host_runner.py
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-native-runtime-linux-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/socks-execution-host-bundle
      - name: Verify exact-source SOCKS execution runtime bundle
        run: python3 deploy/native-runtime-bundle.py extract 'linux/${{ matrix.arch }}' "$RUNNER_TEMP/socks-execution-host-bundle/native-linux-${{ matrix.arch }}.tar.gz" "$RUNNER_TEMP/socks-execution-host-verified"
      - name: Require real SOCKS Server, both Compare winners and retained restoration
        timeout-minutes: 110
        env:
          ROUTERVPN_LINUX_SOCKS_EXECUTION_HOST_ACCEPTANCE: '1'
          ROUTERVPN_EXPECTED_SOURCE: ${{ github.sha }}
          ROUTERVPN_SOCKS_EXECUTION_RECEIPT: ${{ runner.temp }}/linux-socks-execution-host-${{ matrix.arch }}.json
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_linux_socks_execution_host.py --bundle "$RUNNER_TEMP/socks-execution-host-verified" --require-commit "$ROUTERVPN_EXPECTED_SOURCE" --receipt "$ROUTERVPN_SOCKS_EXECUTION_RECEIPT"
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Linux-socks-execution-host-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/linux-socks-execution-host-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
