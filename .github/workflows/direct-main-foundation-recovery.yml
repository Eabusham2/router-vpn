name: Direct main foundation recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-foundation-recovery.yml

permissions:
  contents: write

concurrency:
  group: direct-main-foundation-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finish and clean direct-main foundation work
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          if test -f .github/scripts/fix-release-foundations.py; then
            python3 .github/scripts/fix-release-foundations.py
          fi
          if test -f .github/scripts/reconcile-shipping-transform-baselines.py; then
            python3 .github/scripts/reconcile-shipping-transform-baselines.py
          fi
          python3 deploy/test-production-release-compose.py
          python3 server/scripts/test_source_provenance.py
          python3 deploy/test_source_provenance.py
          python3 deploy/test_source_provenance_adoption_identity.py
          python3 deploy/validate-repo.py
          python3 deploy/native-session-mutation-audit.py
          python3 deploy/unified-map-shipping-audit.py
          bash -n deploy/package-macos-native.sh
          bash -n deploy/package-linux-native.sh
          git diff --check
          rm -f \
            .github/scripts/fix-release-foundations.py \
            .github/scripts/reconcile-shipping-transform-baselines.py \
            .github/workflows/direct-main-release-foundations.yml \
            .github/workflows/direct-main-shipping-transform-reconcile.yml \
            .github/workflows/direct-main-foundation-recovery.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Finish exact-SHA release and native shipping reconciliation [skip ci]"
            git push origin HEAD:main
          fi
