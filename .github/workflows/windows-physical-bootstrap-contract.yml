name: Windows physical bootstrap composition

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Direct main pushes share one diagnostic lane. Releases and manual runs own
  # their original run and receipts, even when another caller uses the same ref.
  group: windows-physical-bootstrap-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Windows physical bootstrap composition' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  native-node-kernel:
    name: Actual WFP ${{ matrix.phase }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # The complete seven-phase process exceeded 30m on both architectures.
    # Keep each existing phase bounded and require all fourteen receipts below.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        architecture: [amd64, arm64]
        phase: [node-baseline, node-controls, external-hysteria2, external-socks, external-packet, external-openvpn, external-ss-entry]
        include:
          - architecture: amd64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Verify test-only native firewall scope
        shell: pwsh
        run: |
          python deploy/test_windows_external_provider_join.py
          if ($LASTEXITCODE -ne 0) { throw 'Original provider process/reader join failed' }
          python deploy/test_windows_node_physical_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Node scope/source boundary failed' }
          python deploy/test_windows_node_physical_ci_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Complete native CI receipt boundary failed' }
      - name: Prove actual WFP, encrypted peers and exact native reversal
        shell: pwsh
        run: |
          # Real BFE and WG/AWG in distinct retained executable processes.
          # TUN stays harmless; no route, node/DNS or device claim is inferred.
          python deploy/test_windows_node_physical_ci.py --architecture '${{ matrix.architecture }}' --phase '${{ matrix.phase }}' --receipt '${{ runner.temp }}/windows-physical-${{ matrix.architecture }}-${{ matrix.phase }}.json'
          if ($LASTEXITCODE -ne 0) { throw 'Actual WFP encrypted Node composition failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-physical-${{ matrix.architecture }}-${{ matrix.phase }}
          path: ${{ runner.temp }}/windows-physical-${{ matrix.architecture }}-${{ matrix.phase }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  native-node-complete:
    name: Complete WFP encrypted Node matrix
    needs: native-node-kernel
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require every original native phase job
        env:
          NATIVE_RESULT: ${{ needs.native-node-kernel.result }}
        run: |
          python -c 'import os; assert os.environ["NATIVE_RESULT"] == "success", "Every original Windows native phase job must succeed"'
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-physical-*
          path: ${{ runner.temp }}/windows-physical-receipts
          merge-multiple: true
      - name: Verify both complete phase inventories and original source identities
        env:
          NATIVE_RESULT: ${{ needs.native-node-kernel.result }}
        run: python deploy/test_windows_node_physical_ci.py --aggregate '${{ runner.temp }}/windows-physical-receipts' --needs-result "$NATIVE_RESULT"
  native-node-composition:
    name: Captured Node startup on ${{ matrix.runner }}
    needs: native-node-source
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Prove exact native protection succession and reversal
        timeout-minutes: 8
        shell: pwsh
        run: |
          # Real BFE rules scoped to this executable; no route/profile changes.
          # This diagnostic does not claim race instrumentation or host adoption.
          python deploy/test_windows_protection_transfer.py --bootstrap-only
          if ($LASTEXITCODE -ne 0) { throw 'Exact native protection succession failed' }
      - name: Prove retained read-only recovery snapshot and callback lifetime
        if: success() || failure()
        timeout-minutes: 6
        shell: pwsh
        run: |
          python deploy/test_windows_protection_observation.py --bootstrap-only
          if ($LASTEXITCODE -ne 0) { throw 'Retained native recovery observation failed' }
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-startup-${{ matrix.architecture }}-*
          path: ${{ runner.temp }}/windows-startup-receipts
          merge-multiple: true
      - name: Verify every captured startup suite and mutant against fresh pinned source
        if: always()
        shell: pwsh
        env:
          SOURCE_RESULT: ${{ needs.native-node-source.result }}
        run: |
          python deploy/test_windows_node_physical_ci.py --architecture '${{ matrix.architecture }}' --source-aggregate '${{ runner.temp }}/windows-startup-receipts' --needs-result $env:SOURCE_RESULT
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete captured native Node composition' }
  native-node-source:
    name: Captured Node ${{ matrix.phase }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # Run 45080403984 finished its baselines, then exhausted the shared 30m
    # after 40 or 34 of 64 mutation verdicts. Keep each native deadline.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        phase: [bootstrap-baselines, bootstrap-controls-1, bootstrap-controls-2]
        include:
          - architecture: amd64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Verify source phase inventory and exact receipt requirements
        shell: pwsh
        run: |
          python deploy/test_desktop_node_phases.py
          if ($LASTEXITCODE -ne 0) { throw 'Captured source partition failed' }
          python deploy/test_windows_node_physical_ci_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Captured source receipt boundary failed' }
      - name: Execute exact captured Box startup and encrypted peer phase
        shell: pwsh
        run: |
          python deploy/test_windows_node_physical_ci.py --architecture '${{ matrix.architecture }}' --source-phase '${{ matrix.phase }}' --receipt '${{ runner.temp }}/windows-startup-${{ matrix.architecture }}-${{ matrix.phase }}.json'
          if ($LASTEXITCODE -ne 0) { throw 'Captured native Node source phase failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-startup-${{ matrix.architecture }}-${{ matrix.phase }}
          path: ${{ runner.temp }}/windows-startup-${{ matrix.architecture }}-${{ matrix.phase }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  native-node-source-complete:
    name: Complete captured Node startup and protection on both architectures
    needs: [native-node-source, native-node-composition]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every source, native protection and recovery job
        env:
          SOURCE_RESULT: ${{ needs.native-node-source.result }}
          COMPOSITION_RESULT: ${{ needs.native-node-composition.result }}
        run: test "$SOURCE_RESULT" = success && test "$COMPOSITION_RESULT" = success
  native-bootstrap:
    name: Native Windows bootstrap on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Verify prospective overlay and source boundaries
        shell: pwsh
        run: |
          python deploy/test_windows_physical_bootstrap_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows bootstrap overlay/source boundary failed' }
      - name: Execute actual compiler, native factory, WFP and selected DNS bootstrap
        shell: pwsh
        run: |
          # CGO-disabled bootstrap-only diagnostic: no TUN/routes, package,
          # Tor circuit, native PQ link, race, or device acceptance is claimed.
          # Every WFP rule also matches this exact test executable. The explicit
          # fixture resolver receives a bounded real HTTPS DNS query.
          python deploy/test_windows_physical_bootstrap.py --standalone --prospective
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows bootstrap composition failed' }
      - name: Prove actual Wintun ownership and WFP retirement
        if: success() || failure()
        shell: pwsh
        run: |
          python deploy/test_windows_physical_tunnel_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Wintun source/overlay boundary failed' }
          # Unique held native adapters only; external configuration prevents
          # address, default-route and DNS changes. No OS admission overlay.
          python deploy/test_windows_physical_tunnel.py --standalone
          if ($LASTEXITCODE -ne 0) { throw 'Actual Wintun/WFP ownership failed' }
      - name: Captured ordinary native command and three-protocol proof composition
        if: success() || failure()
        shell: pwsh
        run: |
          # Actual protocol, selected DNS, proof and command tests use explicit
          # injected OS/TUN boundaries. The WFP and Wintun gates above remain
          # required; no legacy handoff or end-user activation is inferred.
          python deploy/test_windows_external_physical.py --standalone
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary Windows native composition failed' }

  required:
    name: Complete Windows physical bootstrap on both architectures
    needs: [native-node-complete, native-node-source-complete, native-bootstrap]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every WFP, startup and native bootstrap result
        env:
          WFP_RESULT: ${{ needs.native-node-complete.result }}
          STARTUP_RESULT: ${{ needs.native-node-source-complete.result }}
          BOOTSTRAP_RESULT: ${{ needs.native-bootstrap.result }}
        shell: python
        run: |
          import os
          for name in ("WFP_RESULT", "STARTUP_RESULT", "BOOTSTRAP_RESULT"):
              result = os.environ[name]
              if result != "success":
                  raise SystemExit(f"{name} ended with {result}")
