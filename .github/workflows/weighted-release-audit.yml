name: Weighted release audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weighted-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Score legacy and recovered source/live release gates
        run: |
          python3 deploy/weighted-release-audit.py | tee "$RUNNER_TEMP/weighted-release.json"
          python3 deploy/recovered-release-audit-v2.py | tee "$RUNNER_TEMP/recovered-release.json"
          python3 - "$RUNNER_TEMP/weighted-release.json" "$RUNNER_TEMP/recovered-release.json" <<'PY'
          import json,sys
          legacy=json.load(open(sys.argv[1])); recovered=json.load(open(sys.argv[2]))
          assert legacy['source_weight'] == 88.0, legacy
          assert legacy['manual_live_weight'] == 12.0, legacy
          assert recovered['source_weight'] == 88.0, recovered
          assert recovered['manual_live_weight'] == 12.0, recovered
          assert recovered['score_percent'] >= 84.5, recovered
          print(f"Legacy weighted score: {legacy['score_percent']:.2f}%")
          print(f"Recovered-contract full release score: {recovered['score_percent']:.2f}%")
          print(f"Recovered source earned: {recovered['source_earned']:.2f}/88.00%")
          for g in recovered['recovered_gates']:
              if not g['pass']:
                  print(f"RECOVERED GAP [{g['weight']}%]: {g['name']} - {g['note']}")
          failed=[g for g in legacy['gates'] if not g['pass']]
          for g in failed:
              print(f"LEGACY UNRESOLVED [{g['kind']}] {g['weight']}%: {g['name']} {g['note']}")
          PY
