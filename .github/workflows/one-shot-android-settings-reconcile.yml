name: One-shot Android settings reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-android-settings-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make fail-closed Android settings source authoritative
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialogV2.java.txt
          cp android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialogV2.java.txt android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialog.java
          rm -f android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialogV2.java.txt .github/workflows/one-shot-android-settings-reconcile.yml
          grep -Fq 'hasLiveVpn' android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialog.java
          grep -Fq 'TRANSPORT_VPN' android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialog.java
          grep -Fq 'getOwnerUid' android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialog.java
          grep -Fq 'VPN became active while settings were open' android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialog.java
          cat > deploy/android-settings-reconcile-v2.complete <<'EOF'
          AndroidProfileSettingsDialog.java is reconciled from V2 and blocks persistent mutation while a VPN is live.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Block Android settings mutation while VPN is live"
          git push origin HEAD:main
