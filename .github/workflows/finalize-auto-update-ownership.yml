name: Finalize automatic update ownership

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-auto-update-ownership.yml

permissions:
  contents: write

concurrency:
  group: finalize-auto-update-ownership
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified source patch and remove obsolete markers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/router-vpn-auto-update.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/router-vpn-auto-update.patch.gz.b64 | gzip -d > /tmp/router-vpn-auto-update.patch
          git apply --check /tmp/router-vpn-auto-update.patch
          git apply /tmp/router-vpn-auto-update.patch
          rm -f \
            deploy/source-reconcile-v3-trigger.txt \
            deploy/source-reconcile-v4-trigger.txt \
            deploy/source-reconcile-v5-trigger.txt \
            deploy/source-reconcile-v6-trigger.txt \
            deploy/android-settings-reconcile-v2.complete \
            deploy/linux-settings-reconcile-v2.complete \
            deploy/macos-settings-reconcile-v2.complete
          gofmt -w \
            internal/updatepolicy/store.go \
            internal/updatepolicy/store_test.go \
            cmd/app-update/main.go \
            cmd/app-update/main_test.go \
            cmd/client/native_auto_update.go \
            cmd/client/native_auto_update_test.go
          git diff --check

      - name: Verify automatic update and durable-state contracts
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/updatepolicy ./cmd/app-update ./cmd/client
          go vet ./internal/updatepolicy ./cmd/app-update ./cmd/client
          go test ./cmd/...
          python3 -m py_compile deploy/auto-update-audit.py
          python3 deploy/auto-update-audit.py
          python3 deploy/durable-state-transaction-audit.py
          python3 deploy/current-requirements-audit.py
          python3 deploy/latest-a20-product-contract-audit.py
          python3 deploy/exact-head-release-blockers-audit.py

      - name: Commit verified finalization directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          git add -A
          git diff --cached --quiet && { echo 'No source delta'; exit 1; }
          git commit -m 'Finalize verified app update ownership and cleanup'
          git pull --rebase origin main
          git push origin HEAD:main
