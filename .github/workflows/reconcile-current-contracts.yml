name: Reconcile current shipping and release contracts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-current-contracts.yml

permissions:
  contents: write

concurrency:
  group: reconcile-current-contracts-main
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply reconciled current contracts
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/reconcile-current-contracts.py
          python3 -m py_compile \
            deploy/materialize-production-compose.py \
            deploy/test-production-release-compose.py \
            client/linux/apply-session-mutation.py
          bash -n deploy/package-macos-native.sh
          bash -n deploy/package-linux-native.sh
          python3 deploy/test-production-release-compose.py
          python3 deploy/linux-session-mutation-audit.py
          python3 deploy/unified-map-shipping-audit.py
          python3 deploy/setup-center-download-retention-audit.py
          git diff --check
      - name: Commit directly to main and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          git add \
            deploy/package-macos-native.sh \
            deploy/package-linux-native.sh \
            client/linux/apply-session-mutation.py \
            deploy/materialize-production-compose.py \
            deploy/test-production-release-compose.py \
            .github/workflows/production-release-compose.yml
          git rm .github/scripts/reconcile-current-contracts.py .github/workflows/reconcile-current-contracts.yml
          git commit -m "Reconcile native packaging and exact-SHA compose contracts [skip ci]"
          git push origin HEAD:main
