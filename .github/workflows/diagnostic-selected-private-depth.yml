name: Selected private stream depth with a separate native worker

on:
  push:
    branches: [diagnostic/selected-private-stream-depth-20261125]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    if: github.ref == 'refs/heads/diagnostic/selected-private-stream-depth-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/go-windows-sockets
      - name: Prepare the native Linux compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake ninja-build pkg-config libssl-dev autoconf automake libtool make perl
          python3 deploy/setup-desktop-native-toolchain.py linux/amd64 "$RUNNER_TEMP/native-toolchain"
      - name: Build the pinned Rosenpass static archive and verify its receipt
        run: python3 deploy/build-desktop-pq.py linux/amd64 "$RUNNER_TEMP/desktop-pq" --cache "$RUNNER_TEMP/native-pq-cache"
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-linux-amd64-pq-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-pq/DESKTOP-PQ.json
            ${{ runner.temp }}/desktop-pq/libroutervpn_rosenpass.a
          if-no-files-found: error
          retention-days: 3
      - name: Reproduce the four-node limit and verify the depth and role controls
        run: |
          python3 deploy/test_node_chain_multiple_imported_native_runner.py
          python3 deploy/diagnostic-selected-private-stream.py precondition "$RUNNER_TEMP" --depth
          go test -p=1 -count=1 -run "^TestSelectedPrivateStreamMeasurement" ./internal/hopmeasure
      - name: Exercise 37 encrypted paths with a separate registered worker
        run: |
          set -euo pipefail
          added=()
          cleanup() { for address in "${added[@]}"; do sudo ip address del "$address/32" dev lo; done; }
          trap cleanup EXIT
          for address in 10.80.0.1 10.80.0.2 198.51.100.151; do
            sudo ip address add "$address/32" dev lo
            added+=("$address")
          done
          python3 deploy/diagnostic-selected-private-stream.py encrypted "$RUNNER_TEMP" --depth
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-linux-amd64-selected-private-depth-${{ github.sha }}
          path: ${{ runner.temp }}/selected-private-depth.json
          if-no-files-found: error
          retention-days: 7
