name: Final gap reconciliation

on:
  push:
    paths:
      - server/scripts/_final_gap_patch.py
      - server/scripts/_fix_gap_patch.py
      - .github/workflows/final-gap-reconciliation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 server/scripts/_fix_gap_patch.py
          python3 server/scripts/_final_gap_patch.py
          rm -f server/scripts/_fix_gap_patch.py
          python3 -m py_compile server/scripts/download-broker.py server/scripts/generate-setup-assets.py server/scripts/download_jobs.py modes/mtu-policy.py server/scripts/ai_help_provider.py server/scripts/setup-center-ai-server.py
          python3 server/scripts/test_download_jobs.py
          python3 server/scripts/test_setup_imports.py
          python3 modes/test_mtu_policy.py
          git diff --check
          git config user.name router-vpn-ci
          git config user.email router-vpn-ci@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finish Setup Center methods and download progress'
          git push origin HEAD:main
