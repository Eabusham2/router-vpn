name: Final product gap reconciliation

on:
  push:
    paths:
      - .github/workflows/final-gap-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch remaining Setup Center and download gaps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              out, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{label}: expected one replacement, got {n}")
              return out

          # ---- Detailed asynchronous download phases ----
          p = Path('server/scripts/download-broker.py')
          s = p.read_text()
          s = sub_once(s, r'def _download_limited\(url: str, path: Path\) -> None:\n.*?\n\ndef _safe_artifact_name', '''def _download_limited(url: str, path: Path, progress=None) -> None:
              total = 0
              if progress:
                  progress("downloading", 28)
              with _urlopen(url, timeout=25) as r, path.open("wb") as w:
                  try:
                      expected = int(r.headers.get("Content-Length", "0") or 0)
                  except ValueError:
                      expected = 0
                  while True:
                      chunk = r.read(CHUNK)
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > MAX_GITHUB_ARTIFACT:
                          raise RuntimeError("GitHub artifact exceeds safety limit")
                      w.write(chunk)
                      if progress and expected > 0:
                          progress("downloading", min(39, 28 + int(11 * total / expected)))
              if total == 0:
                  raise RuntimeError("GitHub returned an empty artifact")


def _safe_artifact_name''', 'download_limited', re.S)

          s = sub_once(s, r'def fetch_artifact_member\(artifact_name: str, wanted: str, temp: Path, output_name: str\) -> Path:\n.*?\n\ndef _run_builder', '''def fetch_artifact_member(artifact_name: str, wanted: str, temp: Path, output_name: str, progress=None) -> Path:
              if os.environ.get("ROUTER_VPN_GITHUB_DISABLE", "").lower() in ("1", "true", "yes"):
                  raise RuntimeError("GitHub artifact use disabled")
              if progress:
                  progress("locating", 15)
              repo, branch, head_sha = _github_scope()
              if not artifact_name:
                  raise RuntimeError("invalid GitHub artifact name")
              q = urllib.parse.urlencode({"name": artifact_name, "per_page": 100})
              meta = _read_limited_json(f"https://api.github.com/repos/{repo}/actions/artifacts?{q}")
              candidates = _artifact_candidates(meta, artifact_name, branch, head_sha)
              if not candidates:
                  scope = branch or "any branch"
                  if head_sha:
                      scope += f" at {head_sha}"
                  raise RuntimeError(f"no unexpired {artifact_name} artifact for {scope}")
              outer = temp / (artifact_name + "-artifact.zip")
              _download_limited(candidates[0]["archive_download_url"], outer, progress=progress)
              if progress:
                  progress("validating", 42)
              selected = temp / output_name
              with zipfile.ZipFile(outer) as zf:
                  item = _pick_member(zf, wanted)
                  with zf.open(item) as r, selected.open("wb") as w:
                      shutil.copyfileobj(r, w, CHUNK)
              outer.unlink(missing_ok=True)
              if not selected.is_file() or selected.stat().st_size == 0:
                  raise RuntimeError("selected GitHub package is empty")
              return selected


def _fetch_first_artifact(sources, temp: Path, output_name: str, progress=None) -> Path:
              failures = []
              for artifact_name, wanted in sources:
                  try:
                      return fetch_artifact_member(str(artifact_name), str(wanted), temp, output_name, progress=progress)
                  except Exception as exc:
                      failures.append(f"{artifact_name}: {type(exc).__name__}: {exc}")
              raise RuntimeError("; ".join(failures) if failures else "no GitHub artifact sources configured")


def fetch_github_package(home_name: str, temp: Path, progress=None) -> Path:
              generic = _builder.generic_name(home_name)
              if not generic:
                  raise RuntimeError("this download has no generic GitHub package")
              override = os.environ.get("ROUTER_VPN_GITHUB_ARTIFACT", "").strip()
              if override:
                  sources = ((override, generic),)
              else:
                  sources = NATIVE_PACKAGE_ARTIFACTS.get(home_name, (("RouterVPN-client-desktop-unix-ci", generic),))
              return _fetch_first_artifact(sources, temp, generic, progress=progress)


def fetch_direct_mobile(name: str, temp: Path, progress=None) -> Path:
              spec = DIRECT_ARTIFACTS[name]
              try:
                  return _fetch_first_artifact(spec["sources"], temp, name, progress=progress)
              except Exception as exc:
                  raise RuntimeError(
                      f"{name} requires its same-SHA GitHub mobile artifact; the Linux home node does not fake a platform-specific mobile build fallback: {exc}"
                  ) from exc


def _run_builder''', 'artifact progress functions', re.S)

          s = sub_once(s, r'def _run_builder\(base: Path, name: str, temp: Path, source: Path \| None\) -> Path:\n.*?\n\ndef build_package\(base: Path, name: str, temp: Path\) -> tuple\[Path, str\]:\n.*?\n\n@contextmanager', '''def _run_builder(base: Path, name: str, temp: Path, source: Path | None, progress=None) -> Path:
              output = temp / name
              args = [
                  "python3", str(BUILDER_PATH), "--base", str(base),
                  "--source-root", os.environ.get("ROUTER_VPN_FALLBACK_ROOT", "/src"),
                  "--name", name, "--output", str(output),
              ]
              if source is not None:
                  args += ["--source-archive", str(source)]
              if progress:
                  progress("building", 58)
              subprocess.run(args, check=True, timeout=PACKAGE_TIMEOUT, stdout=subprocess.DEVNULL)
              if progress:
                  progress("packaging", 84)
              return output


def build_package(base: Path, name: str, temp: Path, progress=None) -> tuple[Path, str]:
              if progress:
                  progress("locating", 15)
              if name in DIRECT_ARTIFACTS:
                  result = fetch_direct_mobile(name, temp, progress=progress)
                  if progress:
                      progress("validating", 90)
                  return result, "github"
              if name == "router-vpn-client-bundle.zip":
                  if progress:
                      progress("packaging", 70)
                  return _run_builder(base, name, temp, None, progress=progress), "private-node-bundle"
              source = None
              try:
                  source = fetch_github_package(name, temp, progress=progress)
              except Exception as exc:
                  print(f"download broker: GitHub build unavailable for {name}: {type(exc).__name__}: {exc}; compiling requested generic package locally", flush=True)
              if source is not None:
                  try:
                      if progress:
                          progress("validating", 48)
                      return _run_builder(base, name, temp, source, progress=progress), "github"
                  except Exception as exc:
                      print(f"download broker: GitHub package validation/repack failed for {name}: {type(exc).__name__}: {exc}; compiling requested generic package locally", flush=True)
              if progress:
                  progress("building", 58)
              return _run_builder(base, name, temp, None, progress=progress), "router-local-generic-build"


@contextmanager''', 'builder progress functions', re.S)

          old = '''            with package.open("rb") as f:
                          shutil.copyfileobj(f, self.wfile, CHUNK)
                      success = True'''
          new = '''            sent = 0
                      with package.open("rb") as f:
                          while True:
                              chunk = f.read(CHUNK)
                              if not chunk:
                                  break
                              self.wfile.write(chunk)
                              sent += len(chunk)
                              self.server.jobs.update_delivery(job_id, sent, size)
                      success = True'''
          if old not in s:
              raise SystemExit('job streaming block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # ---- Setup Center Methods: simple external protocols only ----
          p = Path('server/scripts/generate-setup-assets.py')
          s = p.read_text()
          methods = '''def build_methods(gen: pathlib.Path, endpoint: str, socks_host: str) -> list[dict]:
              methods: list[dict] = []
              methods.append(asset(
                  "router-vpn-app", "Router VPN native app", "Recommended full experience",
                  config="Install Router VPN once, then import/link router-vpn-bundle.json or use one-time pairing. Add more home/server nodes later without reinstalling the app. AUTO, SMART AUTO, CUSTOM, complex stacks, DNS, node map, kill switch, multihop, MTU/Jumbo and forwarding belong in Router VPN itself.",
                  apps=["Router VPN native app"],
                  note="Use this for the complete multi-node Router VPN feature set. Application packages are generic and secret-free; node data is downloaded/paired separately.",
                  native="Native Router VPN application; this is not a browser/PWA substitute.", simple=True,
              ))
              methods.append(asset(
                  "wireguard", "WireGuard Raw", "Simple VPN", config=read_text(gen/"wg"/"wg.conf"),
                  apps=["WireGuard", "Router VPN"],
                  note="Fastest and simplest full-tunnel profile. Recommended first connectivity test.",
                  native="WireGuard app: add/import tunnel, choose the generated .conf or scan its QR, approve the OS VPN permission, then connect.", simple=True,
              ))
              methods.append(asset(
                  "amneziawg2", "AmneziaWG 2", "Simple obfuscated VPN", config=read_text(gen/"awg2-fast"/"awg.conf"),
                  apps=["AmneziaVPN / AmneziaWG", "Router VPN"],
                  note="WireGuard-family tunnel with packet/header obfuscation.",
                  native="Amnezia-compatible app: import the generated AWG config, approve VPN permission, then connect.", simple=True,
              ))

              ss = outbound(gen/"shadowsocks"/"sing-box.json"); ss_url=""
              if endpoint and endpoint != "router.invalid" and ss:
                  ui=urllib.parse.quote(str(ss.get("method") or ""),safe="")+":"+urllib.parse.quote(str(ss.get("password") or ""),safe="")
                  ss_url=f"ss://{ui}@{hostport(endpoint,int(ss.get('server_port') or 8388))}/#Router%20VPN%20Shadowsocks"
              methods.append(asset(
                  "shadowsocks", "Shadowsocks 2022", "Simple proxy", url=ss_url,
                  config=read_text(gen/"shadowsocks"/"sing-box.json"),
                  apps=["Shadowsocks/SIP002-compatible client", "sing-box", "Router VPN"],
                  note="Uses the public node endpoint, never the LAN-only AI Board address. If the endpoint is not known yet, Setup Center shows the config but does not fabricate a QR.",
                  native="Import the SIP002 URL/QR in a client that explicitly supports its Shadowsocks 2022 method.", simple=True,
              ))

              hy=outbound(gen/"hysteria2"/"sing-box.json"); hy_url=""
              if endpoint and endpoint != "router.invalid" and hy:
                  tls=hy.get("tls") if isinstance(hy.get("tls"),dict) else {}; obfs=hy.get("obfs") if isinstance(hy.get("obfs"),dict) else {}; q=[]
                  if tls.get("server_name"): q.append(("sni",str(tls["server_name"])))
                  pin=cert_sha256(gen/"hysteria2"/"cert.pem")
                  if pin:q.append(("pinSHA256",pin))
                  if obfs.get("type"):q.append(("obfs",str(obfs["type"])))
                  if obfs.get("password"):q.append(("obfs-password",str(obfs["password"])))
                  hy_url="hysteria2://"+urllib.parse.quote(str(hy.get("password") or ""),safe="")+"@"+hostport(endpoint,int(hy.get("server_port") or 8443))+"/?"+urllib.parse.urlencode(q)+"#Router%20VPN%20Hysteria2"
              methods.append(asset(
                  "hysteria2", "Hysteria2 + QUIC", "Simple QUIC VPN/proxy", url=hy_url,
                  config=read_text(gen/"hysteria2"/"sing-box.json"), apps=["Hysteria2", "sing-box", "Router VPN"],
                  note="Public-endpoint Hysteria2 import URL plus full config.", native="Import into a Hysteria2/sing-box-compatible client.", simple=True,
              ))

              overtls=read_text(gen/"overtls"/"overtls-client.json")
              methods.append(asset(
                  "overtls", "SOCKS5 + TLS (OverTLS)", "Simple compatibility proxy", config=overtls,
                  apps=["OverTLS-compatible client"],
                  note="Public TLS terminates on the home node; backend 14444 stays loopback-only. Separate from Router VPN's 20 raw/16 logical mode catalog.",
                  native="Import the generated OverTLS client config in an explicitly compatible client.", simple=bool(overtls),
              ))
              ssr=read_text(gen/"shadowsocksr"/"ssr-client.json")
              methods.append(asset(
                  "shadowsocksr", "ShadowsocksR", "Legacy compatibility", config=ssr,
                  apps=["ShadowsocksR-compatible client"],
                  note="Legacy compatibility only; prefer WireGuard, Shadowsocks 2022, Hysteria2, or Router VPN.", native="Import only into an SSR-compatible client.", simple=bool(ssr),
              ))

              # SOCKS5 is deliberately private and reachable only after the device
              # already has a route home. Do not generate a WAN/public QR for it.
              socks=f"SOCKS5 host: {socks_host}\\nPort: 1080\\nAuthentication: none\\nUse only after the device already reaches home through Router VPN/WireGuard/AmneziaWG."
              item=asset(
                  "socks5", "SOCKS5 (inside VPN)", "Private app proxy", config=socks,
                  apps=["Potatso (manual SOCKS5 profile)", "Apps with SOCKS5 support", "Router VPN"],
                  note="Private in-tunnel proxy only. Never WAN-forward TCP 1080. The LAN/private host is intentional and is not the public VPN exit IP.",
                  native=f"Potatso/manual client: add SOCKS5 host {socks_host}, port 1080, no authentication, only after the device is already connected home through a VPN tunnel.", simple=True,
              )
              item["qrPayload"]=""; item["qrPngBase64"]=""
              methods.append(item)
              return methods
          '''
          s = sub_once(s, r'def build_methods\(gen: pathlib.Path, endpoint: str, socks_host: str\) -> list\[dict\]:\n.*?\n    return methods\n', methods, 'simple methods', re.S)

          devices = '''    devices={
                "ios":{"label":"iPhone / iPad","customApp":"Router VPN is a real native app. Raw WireGuard uses the PacketTunnel engine today; unsupported layered/AWG/multihop combinations stay visibly unavailable instead of being faked.","steps":["Install Router VPN or a simple compatible protocol app.","Import/pair router-vpn-bundle.json to add this node without reinstalling Router VPN.","WireGuard: import/scan the generated WireGuard profile in the WireGuard app if you want the simplest independent client.","Only choose a Setup Center Method whose client explicitly supports that protocol."]},
                "android":{"label":"Android","customApp":"Router VPN Android is a native VpnService app with native WireGuard/AmneziaWG and supported layered engines. Unsupported combinations fail closed with a reason.","steps":["Install the Router VPN APK.","Import/pair router-vpn-bundle.json to add this node; add later nodes the same way.","Approve Android VPN permission on first connection.","For an independent simple client, import the matching WireGuard/AWG/Shadowsocks/Hysteria2 method below."]},
                "macos":{"label":"macOS","customApp":"Router VPN is a native AppKit application. Install once, then import/pair one or many Router VPN nodes.","steps":["Download the package matching Apple Silicon or Intel.","Install/launch Router VPN and grant required network permissions.","Import/pair router-vpn-bundle.json.","Use Nodes/Map, Modes, DNS, Advanced, Forwarding, Settings and Help inside the native app."]},
                "windows":{"label":"Windows","customApp":"Router VPN is a native Windows application; WSL is not part of the product path. Installed and normal Portable packages are available for x64 and ARM64.","steps":["Download the matching Installed or Portable package.","Launch Router VPN as required for full-device tunnel/firewall operations and approve Windows firewall/network prompts.","Import/pair router-vpn-bundle.json; add more nodes later without reinstalling.","Use WireGuard separately only when you intentionally want the simplest independent profile."]},
                "linux":{"label":"Linux","customApp":"Router VPN is a native GTK application on x86-64 and ARM64.","steps":["Download the matching Linux package.","Install/launch Router VPN and grant the required TUN/firewall privileges.","Import/pair router-vpn-bundle.json.","Use the native app for complex modes/stacks; Methods below are only simple external-client options."]},
                "manual":{"label":"Other / manual","customApp":"Use only a simple generated protocol that another client explicitly supports. Complex Router VPN stacks are not exported as fake universal imports.","steps":["Choose a simple Method below.","Follow its exact client/import guidance.","If no compact interoperable QR exists, use the config/manual fields instead.","Never expose Setup Center, admin, SSH or private SOCKS5 ports to WAN."]},
              }
          '''
          s = sub_once(s, r'    devices=\{.*?\n    \}\n    modes = read_json', devices + '    modes = read_json', 'device guidance', re.S)

          old = "const availableMethods=(DATA.methods||[]).filter(x=>x.available);availableMethods.sort((a,b)=>(b.simple?1:0)-(a.simple?1:0)||a.label.localeCompare(b.label));for(const m of availableMethods){const o=document.createElement('option');o.value=m.id;o.textContent=(m.simple?'Easy — ':'Advanced — ')+m.label;$('method').appendChild(o)}"
          new = "const availableMethods=(DATA.methods||[]).filter(x=>x.available&&x.simple);availableMethods.sort((a,b)=>a.label.localeCompare(b.label));for(const m of availableMethods){const o=document.createElement('option');o.value=m.id;o.textContent=m.label;$('method').appendChild(o)}"
          if old not in s: raise SystemExit('method picker source not found')
          s=s.replace(old,new,1)

          old = "const downloads=[['Router profile only','router-vpn-bundle.json','For an already-installed Router VPN app/controller'],['ASUS forwarding helper','asus-merlin-router-vpn-forwards.sh','Persistent Merlin NAT/FORWARD helper'],['macOS Apple Silicon','router-vpn-macos-arm64.zip','M1/M2/M3/M4 and later arm64 Macs'],['macOS Intel','router-vpn-macos-amd64.zip','Intel Macs'],['Linux ARM64','router-vpn-linux-arm64.zip','ARM64 Linux'],['Linux x86-64','router-vpn-linux-amd64.zip','x86-64 Linux'],['Complete private fallback','router-vpn-client-bundle.zip','All platforms/profiles; largest download'],['Checksums','SHA256SUMS','Verify direct downloads before bypassing OS security warnings']];"
          new = "const downloads=[['Node data only','router-vpn-bundle.json','Private node data for an already-installed Router VPN app'],['Windows x64','router-vpn-windows-amd64.zip','Native installed app'],['Windows ARM64','router-vpn-windows-arm64.zip','Native installed app'],['Windows Portable x64','router-vpn-windows-portable-amd64.zip','Normal portable app; no PAF/PortableApps wrapper'],['Windows Portable ARM64','router-vpn-windows-portable-arm64.zip','Normal portable app; no PAF/PortableApps wrapper'],['macOS Apple Silicon','router-vpn-macos-arm64.zip','Native AppKit app'],['macOS Intel','router-vpn-macos-amd64.zip','Native AppKit app'],['Linux ARM64','router-vpn-linux-arm64.zip','Native GTK app'],['Linux x86-64','router-vpn-linux-amd64.zip','Native GTK app'],['Android','router-vpn-android.apk','Native Android VpnService app'],['iPhone / iPad','router-vpn-ios.ipa','Native iOS/iPadOS app; signing may be required'],['ASUS forwarding helper','asus-merlin-router-vpn-forwards.sh','Persistent Merlin NAT/FORWARD helper'],['Private recovery bundle','router-vpn-client-bundle.zip','Explicit private fallback/recovery bundle'],['Checksums','SHA256SUMS','Verify downloads before bypassing OS security warnings']];"
          if old not in s: raise SystemExit('downloads list source not found')
          s=s.replace(old,new,1)

          replacements={
            'Router VPN app/controller + router-vpn-bundle.json':'Router VPN native app + router-vpn-bundle.json or one-time pairing',
            'app/controller':'native app',
            'local app/PWA':'native app',
            'controller surfaces':'native apps',
            'Android provides onboarding/controller/import':'Android uses a native VpnService application and node import',
            'Router VPN mobile is the onboarding/controller/import surface':'Router VPN iOS is a native application with a real WireGuard PacketTunnel path',
            'Use the Router VPN app/controller':'Use the Router VPN native app',
            'full multi-engine controller':'full native multi-engine app',
            'Windows build and WSL2 transport environment described in repository docs':'native Windows build; WSL is not required or supported for the product path',
            'Default DNS policy: fastest (changeable to Home AdGuard, custom, DoT, DoH, DoH3, or rescue in client)':'Default DNS policy: Home AdGuard (changeable to Fastest measured, common/custom UDP/TCP, DoT, DoH, DoH3, or Rescue in the client)',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          p.write_text(s)

          # Finalizer text must match the actual bundle default (home AdGuard).
          p=Path('server/finalize/finalize.sh'); s=p.read_text()
          s=s.replace('Default DNS policy: fastest (changeable to Home AdGuard, custom, DoT, DoH, DoH3, or rescue in client)', 'Default DNS policy: Home AdGuard (changeable to Fastest measured, common/custom UDP/TCP, DoT, DoH, DoH3, or Rescue in the client)')
          p.write_text(s)

          # Remove all obsolete one-shot reconciliation workflows, including this one.
          wf=Path('.github/workflows')
          for name in [
              'product-reconciliation-patch.yml','product-reconciliation-patch-v2.yml','product-reconciliation-patch-v3.yml',
              'product-reconciliation-patch-v4.yml','product-reconciliation-patch-v5.yml','final-gap-reconciliation.yml'
          ]:
              (wf/name).unlink(missing_ok=True)
          PY
          python3 -m py_compile server/scripts/download-broker.py server/scripts/generate-setup-assets.py
          python3 server/scripts/test_setup_imports.py
          git diff --check
          git config user.name router-vpn-ci
          git config user.email router-vpn-ci@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git commit -m 'Finish Setup Center methods and download progress'
          git push origin HEAD:main
