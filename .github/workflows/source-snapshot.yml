name: Exact-SHA source snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Stage final Router-VPN consolidation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact validated Router-VPN batch
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9a7330d6a8ce05fc53a8082b6f57a7e45af7fe6c HEAD
          cat .routervpn-final-patch/part01a .routervpn-final-patch/part01b .routervpn-final-patch/part01c .routervpn-final-patch/part01d .routervpn-final-patch/part02 .routervpn-final-patch/part03 .routervpn-final-patch/part04a .routervpn-final-patch/part04b .routervpn-final-patch/part04c .routervpn-final-patch/part04d | base64 -d | gunzip > /tmp/routervpn-final.patch
          git apply --check /tmp/routervpn-final.patch
          git apply --index /tmp/routervpn-final.patch
          rm -rf .routervpn-final-patch
          git checkout 9a7330d6a8ce05fc53a8082b6f57a7e45af7fe6c -- .github/workflows/release-candidate.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet && { echo 'No final changes staged'; exit 1; }
          git commit -m 'Finalize recovered requirements, shipping gates, and ASUS safety'
          git push origin HEAD:main

  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/router-vpn-source-${GITHUB_SHA}.tar.gz"
          members="$RUNNER_TEMP/router-vpn-source-${GITHUB_SHA}.members.txt"
          git archive --format=tar.gz --prefix="router-vpn-${GITHUB_SHA}/" -o "$archive" HEAD
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          tar -tzf "$archive" > "$members"
          test -s "$members"
          head -n 5 "$members"
      - name: Upload exact source snapshot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: router-vpn-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/router-vpn-source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/router-vpn-source-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
      - name: Publish artifact pointer on exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          python3 - <<'PY' > "$RUNNER_TEMP/source-snapshot-status.json"
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "router-vpn/source-snapshot",
              "description": "artifact:" + os.environ["ARTIFACT_ID"],
              "target_url": os.environ["ARTIFACT_URL"],
          }))
          PY
          curl -fsS --retry 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"$RUNNER_TEMP/source-snapshot-status.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
