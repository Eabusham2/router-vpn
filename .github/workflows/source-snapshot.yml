name: Exact-SHA source snapshot

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: source-snapshot-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/router-vpn-source-${GITHUB_SHA}.tar.gz"
          members="$RUNNER_TEMP/router-vpn-source-${GITHUB_SHA}.members.txt"
          manifest="$RUNNER_TEMP/router-vpn-source-${GITHUB_SHA}.json"
          git archive --format=tar.gz --prefix="router-vpn-${GITHUB_SHA}/" -o "$archive" HEAD
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$manifest" "$GITHUB_SHA" "$tree_sha" "$GITHUB_REPOSITORY" <<'PY'
          import json, pathlib, re, sys
          path, commit, tree, repo = sys.argv[1:]
          if not re.fullmatch(r"[0-9a-f]{40}", commit) or not re.fullmatch(r"[0-9a-f]{40}", tree):
              raise SystemExit("invalid exact source snapshot identity")
          pathlib.Path(path).write_text(json.dumps({
              "schema_version": 1,
              "repository": repo,
              "source_sha": commit,
              "tree_sha": tree,
              "artifact_family": "exact-source-snapshot",
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          (cd "$RUNNER_TEMP" && sha256sum -c "$(basename "$archive").sha256")
          tar -tzf "$archive" > "$members"
          test -s "$members"
          grep -Fxq "router-vpn-${GITHUB_SHA}/" "$members"
          head -n 5 "$members"
      - name: Upload exact source snapshot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: router-vpn-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/router-vpn-source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/router-vpn-source-${{ github.sha }}.tar.gz.sha256
            ${{ runner.temp }}/router-vpn-source-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 1
      - name: Publish artifact pointer on exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          python3 - <<'PY' > "$RUNNER_TEMP/source-snapshot-status.json"
          import json, os
          print(json.dumps({
              "state": "success",
              "context": "router-vpn/source-snapshot",
              "description": "artifact:" + os.environ["ARTIFACT_ID"],
              "target_url": os.environ["ARTIFACT_URL"],
          }))
          PY
          curl -fsS --retry 3 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"$RUNNER_TEMP/source-snapshot-status.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
