name: Apply desktop saved-profile AUTO badges

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/desktop-auto-badge-trigger'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add truthful saved-profile AUTO badges
        shell: bash
        run: |
          set -euo pipefail
          git switch -C publish origin/main
          python3 - <<'PY'
          from pathlib import Path

          p=Path('client/RouterVPN-Windows-ProfileSettings.ps1')
          s=p.read_text(encoding='utf-8')
          old='$label="$($p.name) • $($p.mode) • $($p.node_id)";[void]$items.Add([pscustomobject]@{id=[string]$p.id;display=$label;name=[string]$p.name;mode=[string]$p.mode;node_id=[string]$p.node_id})'
          new='$prefs=$p.preferences;$enc=$false;$obf=$false;if($null-ne$prefs){$enc=[bool]$prefs.auto_require_encrypted;$obf=[bool]$prefs.auto_require_obfuscation};$req=if($null-eq$prefs){\'AUTO n/a\'}elseif($enc-and$obf){\'AUTO Encrypted+Obfuscation\'}elseif($enc){\'AUTO Encrypted\'}elseif($obf){\'AUTO Obfuscation\'}else{\'AUTO Off\'};$label="$($p.name) • $($p.mode) • $($p.node_id) • $req";[void]$items.Add([pscustomobject]@{id=[string]$p.id;display=$label;name=[string]$p.name;mode=[string]$p.mode;node_id=[string]$p.node_id})'
          if s.count(old)!=1: raise SystemExit('Windows saved-profile label seam drifted')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('client/macos/RouterVPNProfileSettings.swift')
          s=p.read_text(encoding='utf-8')
          old='''                let node = profile["node_id"] as? String ?? ""\n                popup.addItem(withTitle: "\\(profileName) • \\(mode) • \\(node)")'''
          new='''                let node = profile["node_id"] as? String ?? ""\n                let prefs = profile["preferences"] as? [String: Any]\n                let encrypted = prefs?["auto_require_encrypted"] as? Bool ?? false\n                let obfuscated = prefs?["auto_require_obfuscation"] as? Bool ?? false\n                let requirements = prefs == nil ? "AUTO n/a" : encrypted && obfuscated ? "AUTO Encrypted+Obfuscation" : encrypted ? "AUTO Encrypted" : obfuscated ? "AUTO Obfuscation" : "AUTO Off"\n                popup.addItem(withTitle: "\\(profileName) • \\(mode) • \\(node) • \\(requirements)")'''
          if s.count(old)!=1: raise SystemExit('macOS saved-profile label seam drifted')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('client/linux/routervpn-connection-profiles-v11.inc')
          s=p.read_text(encoding='utf-8')
          old='''                char *label = g_strdup_printf("%s • %s • %s", obj_string(p, "name"), obj_string(p, "mode"), obj_string(p, "node_id"));\n                gtk_combo_box_text_append(GTK_COMBO_BOX_TEXT(combo), id, label);'''
          new='''                JsonObject *prefs = json_object_has_member(p, "preferences") ? json_object_get_object_member(p, "preferences") : NULL;\n                gboolean encrypted = prefs != NULL && json_object_has_member(prefs, "auto_require_encrypted") && json_object_get_boolean_member(prefs, "auto_require_encrypted");\n                gboolean obfuscated = prefs != NULL && json_object_has_member(prefs, "auto_require_obfuscation") && json_object_get_boolean_member(prefs, "auto_require_obfuscation");\n                const char *requirements = prefs == NULL ? "AUTO n/a" : (encrypted && obfuscated ? "AUTO Encrypted+Obfuscation" : (encrypted ? "AUTO Encrypted" : (obfuscated ? "AUTO Obfuscation" : "AUTO Off")));\n                char *label = g_strdup_printf("%s • %s • %s • %s", obj_string(p, "name"), obj_string(p, "mode"), obj_string(p, "node_id"), requirements);\n                gtk_combo_box_text_append(GTK_COMBO_BOX_TEXT(combo), id, label);'''
          if s.count(old)!=1: raise SystemExit('Linux saved-profile label seam drifted')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('deploy/native-auto-requirements-ui-audit.py')
          s=p.read_text(encoding='utf-8')
          for path in ['client/RouterVPN-Windows-ProfileSettings.ps1','client/macos/RouterVPNProfileSettings.swift','client/linux/routervpn-connection-profiles-v11.inc']:
              marker=f'    "{path}",\n'
              pos=s.find(marker)
              if pos<0: raise SystemExit(f'audit block missing {path}')
              end=s.find('\n)',pos)
              block=s[pos:end]
              lines=[]
              if '"AUTO Encrypted+Obfuscation"' not in block: lines.append('    "AUTO Encrypted+Obfuscation",')
              if '"AUTO n/a"' not in block: lines.append('    "AUTO n/a",')
              if lines:
                  s=s[:end]+"\n"+"\n".join(lines)+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/native-auto-requirements-ui-audit.py
          python3 deploy/profile-settings-audit.py
          python3 deploy/product-parity-audit.py
          python3 deploy/full-audit-v4.py
          python3 deploy/validate-repo.py
      - name: Commit source and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-desktop-profile-auto-badges.yml
          git config user.name 'Eabusham2'
          git config user.email 'eabusham2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Show AUTO requirements on desktop saved profiles'
          git push origin HEAD:main
