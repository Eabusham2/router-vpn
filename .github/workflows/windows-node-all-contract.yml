name: Windows ALL controller and restoration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-all:
    name: Actual Windows ALL and restoration on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: windows-latest, cgo: '1'}
          - {arch: arm64, runner: windows-11-arm, cgo: '0'}
    concurrency:
      # A release invocation retains its own required jobs, independently of
      # the diagnostic standalone controller workflow's concurrency groups.
      group: windows-release-all-${{ github.workflow }}-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: false
    env:
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate complete ALL source and release dependencies
        shell: pwsh
        run: |
          python deploy/test_windows_node_process_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows ALL lost its complete source or verdict contract' }
          python deploy/test_windows_release_gates.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows ALL lost its authoritative release dependency' }
      - name: Pinned compiler for native AMD64 race checks
        if: matrix.arch == 'amd64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-release-all-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned Windows ALL compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned Windows ALL C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Execute complete native ALL and restoration
        timeout-minutes: 20
        shell: pwsh
        run: |
          python deploy/test_windows_node_process.py --suite prospective-all
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows ALL and restoration failed' }
