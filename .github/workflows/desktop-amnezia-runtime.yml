name: Desktop AmneziaWG encrypted runtime
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-amnezia-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  encrypted-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Install native GTK form test libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libjson-glib-dev libcurl4-openssl-dev xvfb xauth
      - name: Execute the native import form and exact Go profile compiler
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_desktop_amnezia_forms.py 2>&1 | tee "$RUNNER_TEMP/desktop-amnezia-forms.log"
      - name: Execute the native Speed Lab path form and exact Go consumer
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_desktop_speed_lab_forms.py 2>&1 | tee "$RUNNER_TEMP/desktop-speed-lab-forms.log"
      - name: Execute owned external comparison and final adoption
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=300s ./cmd/client -run '^TestDesktopExternalComparison' -skip '^TestDesktopExternalComparisonForm' 2>&1 | tee "$RUNNER_TEMP/desktop-external-comparison.log"
      - name: Verify native network cohort notifications and routing ownership
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_desktop_socket_uid_runner.py TrustedPrivilegeExecutable
          python3 deploy/test_desktop_network_cohort.py 2>&1 | tee "$RUNNER_TEMP/desktop-network-cohort.log"
      - name: Execute captured Tor bridge updates and the actual importer
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_desktop_tor_bridge_forms_runner.py
          python3 deploy/test_desktop_tor_bridge_forms.py 2>&1 | tee "$RUNNER_TEMP/desktop-tor-forms.log"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python3 deploy/test_desktop_tor_bridge_forms.py --shell pwsh.exe 2>&1 | tee "$RUNNER_TEMP/desktop-tor-forms-pwsh.log"
          fi
      - name: Verify actual macOS Speed Lab cancellation and ownership
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_macos_speed_lab_transport.py 2>&1 | tee "$RUNNER_TEMP/macos-speed-lab-transport.log"
          python3 deploy/test_macos_performance_measurement.py 2>&1 | tee "$RUNNER_TEMP/macos-performance-measurement.log"
          python3 deploy/test_macos_ordered_latency.py --self-test 2>&1 | tee "$RUNNER_TEMP/macos-ordered-latency.log"
      - name: Verify the packaged native AWG process
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_sing_packet_preparation.py
          python3 deploy/test_amnezia_timer_preparation.py
          python3 deploy/test_gvisor_scheduler_preparation.py
          python3 deploy/test_gvisor_forwarder_runner.py
          python3 deploy/test_desktop_amnezia_runtime.py 2>&1 | tee "$RUNNER_TEMP/desktop-amnezia-runtime.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-amnezia-runtime-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-amnezia-runtime.log
            ${{ runner.temp }}/desktop-amnezia-forms.log
            ${{ runner.temp }}/desktop-tor-forms.log
            ${{ runner.temp }}/desktop-tor-forms-pwsh.log
            ${{ runner.temp }}/desktop-speed-lab-forms.log
            ${{ runner.temp }}/desktop-external-comparison.log
            ${{ runner.temp }}/desktop-network-cohort.log
            ${{ runner.temp }}/macos-speed-lab-transport.log
            ${{ runner.temp }}/macos-performance-measurement.log
          if-no-files-found: error
          retention-days: 7
