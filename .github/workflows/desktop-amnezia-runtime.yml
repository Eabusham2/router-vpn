name: Desktop AmneziaWG encrypted runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/amnezia/**'
      - 'internal/awgpolicy/**'
      - 'internal/mobilemultihop/**'
      - 'internal/common/**'
      - 'cmd/client/**'
      - 'client/Select-Standard-Engine.ps1'
      - 'client/native-multihop-windows.ps1'
      - 'client/native-openvpn-windows.ps1'
      - 'client/RouterVPN-Windows-TorBridge.ps1'
      - 'client/RouterVPN-Windows-SpeedLab.ps1'
      - 'client/test-windows-speed-lab-paths.ps1'
      - 'client/macos/RouterVPNMacSpeedLab*.swift'
      - 'client/linux/routervpn-speed-lab-*.inc'
      - 'client/test-windows-external-amnezia.ps1'
      - 'client/macos/RouterVPNMacExternalNode.swift'
      - 'client/linux/routervpn-external-node-v14.inc'
      - 'client/linux/test-external-amnezia.c'
      - 'modes/select-standard-engine.sh'
      - 'modes/native-standard-exit-linux.sh'
      - 'modes/native-multihop-darwin.sh'
      - 'modes/native-openvpn-standard-exit.sh'
      - 'deploy/build-amnezia-runtime.py'
      - 'deploy/package-amnezia-runtime.sh'
      - 'deploy/seal-amnezia-runtime.py'
      - 'deploy/package-builds.sh'
      - 'deploy/package-linux-native.sh'
      - 'deploy/package-macos-native.sh'
      - 'deploy/prepare-relay-core.py'
      - 'deploy/prepare-mobile-amnezia.py'
      - 'deploy/prepare-sing-packet-concurrency.py'
      - 'deploy/test_sing_packet_preparation.py'
      - 'deploy/test_desktop_amnezia_runtime.py'
      - 'deploy/test_desktop_amnezia_forms.py'
      - 'deploy/test_desktop_speed_lab_forms.py'
      - 'deploy/test_macos_speed_lab_transport.py'
      - '.github/workflows/desktop-amnezia-runtime.yml'
permissions:
  contents: read
concurrency:
  group: desktop-amnezia-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  encrypted-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install native GTK form test libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libjson-glib-dev xvfb xauth
      - name: Execute the native import form and exact Go profile compiler
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_desktop_amnezia_forms.py 2>&1 | tee "$RUNNER_TEMP/desktop-amnezia-forms.log"
      - name: Execute the native Speed Lab path form and exact Go consumer
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_desktop_speed_lab_forms.py 2>&1 | tee "$RUNNER_TEMP/desktop-speed-lab-forms.log"
      - name: Verify actual macOS Speed Lab cancellation and ownership
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_macos_speed_lab_transport.py 2>&1 | tee "$RUNNER_TEMP/macos-speed-lab-transport.log"
      - name: Verify the packaged native AWG process
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_sing_packet_preparation.py
          python3 deploy/test_desktop_amnezia_runtime.py 2>&1 | tee "$RUNNER_TEMP/desktop-amnezia-runtime.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-amnezia-runtime-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-amnezia-runtime.log
            ${{ runner.temp }}/desktop-amnezia-forms.log
            ${{ runner.temp }}/desktop-speed-lab-forms.log
            ${{ runner.temp }}/macos-speed-lab-transport.log
          if-no-files-found: error
          retention-days: 7
