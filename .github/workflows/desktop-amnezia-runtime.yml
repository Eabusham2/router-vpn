name: Desktop AmneziaWG encrypted runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/amnezia/**'
      - 'internal/awgpolicy/**'
      - 'internal/mobilemultihop/**'
      - 'internal/common/**'
      - 'cmd/client/**'
      - 'client/Select-Standard-Engine.ps1'
      - 'client/native-multihop-windows.ps1'
      - 'client/native-openvpn-windows.ps1'
      - 'modes/select-standard-engine.sh'
      - 'modes/native-standard-exit-linux.sh'
      - 'modes/native-multihop-darwin.sh'
      - 'modes/native-openvpn-standard-exit.sh'
      - 'deploy/build-amnezia-runtime.py'
      - 'deploy/package-amnezia-runtime.sh'
      - 'deploy/seal-amnezia-runtime.py'
      - 'deploy/package-builds.sh'
      - 'deploy/package-linux-native.sh'
      - 'deploy/package-macos-native.sh'
      - 'deploy/prepare-relay-core.py'
      - 'deploy/prepare-mobile-amnezia.py'
      - 'deploy/test_desktop_amnezia_runtime.py'
      - '.github/workflows/desktop-amnezia-runtime.yml'
permissions:
  contents: read
concurrency:
  group: desktop-amnezia-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  encrypted-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify the packaged native AWG process
        shell: bash
        run: |
          set -o pipefail
          python3 deploy/test_desktop_amnezia_runtime.py 2>&1 | tee "$RUNNER_TEMP/desktop-amnezia-runtime.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-amnezia-runtime-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-amnezia-runtime.log
          if-no-files-found: error
          retention-days: 7
