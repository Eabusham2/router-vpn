name: Direct main exact-head monitor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-exact-head-monitor.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: direct-main-exact-head-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wait for exact-head build and apply only recognized repairs
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          target="$GITHUB_SHA"
          run_id=''
          conclusion=''
          for attempt in $(seq 1 160); do
            row=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" --jq ".workflow_runs[] | select(.head_sha==\"${target}\" and .name==\"Build all Router VPN release gates\") | [.id,.status,(.conclusion//\"\")] | @tsv" | head -n1 || true)
            if [[ -n "$row" ]]; then
              IFS=$'\t' read -r run_id status conclusion <<<"$row"
              [[ "$status" == completed ]] && break
            fi
            sleep 15
          done
          [[ -n "$run_id" ]] || { echo "No exact-head build-all run appeared for $target"; exit 1; }
          [[ -n "$conclusion" ]] || { echo "Exact-head run $run_id did not complete in time"; exit 1; }

          rm -rf /tmp/router-vpn-ci-logs
          mkdir -p /tmp/router-vpn-ci-logs
          if [[ "$conclusion" != success ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral") | [.id,.name] | @tsv' > /tmp/failed-jobs.tsv
            while IFS=$'\t' read -r job_id job_name; do
              [[ -n "$job_id" ]] || continue
              safe=$(printf '%s' "$job_name" | tr '/ ' '__' | tr -cd 'A-Za-z0-9_.-')
              gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > "/tmp/router-vpn-ci-logs/${job_id}-${safe}.txt" || true
            done < /tmp/failed-jobs.tsv
            python3 .github/scripts/known-ci-repair.py /tmp/router-vpn-ci-logs
          fi

          rm -f .github/scripts/known-ci-repair.py
          rm -f .github/workflows/direct-main-exact-head-monitor.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'Monitor found no source delta.'
            exit 0
          fi
          if [[ -f .github/unresolved-exact-head-ci.txt ]]; then
            git commit -m 'Record unresolved exact-head CI failure [skip ci]'
          elif [[ "$conclusion" == success ]]; then
            git commit -m 'Remove temporary exact-head monitor'
          else
            git commit -m 'Fix recognized exact-head CI failures'
          fi
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ github.token }}
