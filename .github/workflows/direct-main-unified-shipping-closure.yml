name: Direct main unified shipping closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-unified-shipping-closure.yml

permissions:
  contents: write

concurrency:
  group: direct-main-unified-shipping-closure
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire unified control center into every shipping platform
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          def read(path):
              p = root / path
              if not p.is_file():
                  raise SystemExit(f'missing required shipping source: {path}')
              return p.read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          def insert_after(path, anchor, addition):
              text = read(path)
              if addition.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'{path}: insertion anchor drifted: {anchor!r}')
              write(path, text.replace(anchor, anchor + addition, 1))

          # Canonical contract: add the missing Hysteria2 external type and make
          # responsive/platform shipping requirements explicit rather than
          # leaving them implicit in docs.
          contract_path = root / 'client/unified-control-center-v2.json'
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          node_types = contract.setdefault('node_types', [])
          ids = {row.get('id') for row in node_types}
          if 'hysteria2' not in ids:
              insert_at = next((i + 1 for i, row in enumerate(node_types) if row.get('id') == 'shadowsocks-2022'), len(node_types))
              node_types.insert(insert_at, {
                  'id': 'hysteria2',
                  'role': ['node', 'bridge', 'hop', 'exit'],
                  'final_transport': True,
              })
          contract['responsive_targets'] = [
              'windows-small-large-high-dpi', 'macos-small-large-retina',
              'linux-small-large-high-dpi', 'android-phone-tablet-portrait-landscape',
              'ios-iphone-ipad-portrait-landscape',
          ]
          contract['shipping_requirements'] = {
              'canonical_policy_must_be_compiled_or_loaded': True,
              'map_is_first_interactive_surface': True,
              'blocking_startup_overlay_forbidden': True,
              'node_selection_never_connects': True,
              'unsupported_capability_disabled_with_reason': True,
          }
          contract_path.write_text(json.dumps(contract, indent=2) + '\n', encoding='utf-8')

          # Windows: the actual WPF launcher loads the policy module and fails
          # closed if the shipping contract is absent. This closes the old
          # source-present-but-not-shipping seam.
          win_launcher = 'client/RouterVPN-Windows-App.ps1'
          text = read(win_launcher)
          block = '''\n# Canonical map-first control-center policy is shipping input, not audit-only data.\n$RouterVPNUnifiedControlCenterModule = Join-Path $PSScriptRoot 'RouterVPN-Windows-UnifiedControlCenter.ps1'\nif (-not (Test-Path -LiteralPath $RouterVPNUnifiedControlCenterModule -PathType Leaf)) {\n    throw 'The Unified Map Control Center policy module is missing from this package.'\n}\n. $RouterVPNUnifiedControlCenterModule\nif ($script:RouterVPNUnifiedControlCenter.DefaultMode -ne 'smart-auto' -or\n    ($script:RouterVPNUnifiedControlCenter.BottomSheetOrder -join ',') -ne 'connection,multihop,settings,mode,dns') {\n    throw 'The packaged Unified Map Control Center contract is invalid.'\n}\n'''
          if '$RouterVPNUnifiedControlCenterModule' not in text:
              anchor = 'Set-StrictMode -Version Latest\n'
              if anchor not in text:
                  anchor = '$ErrorActionPreference = \'Stop\'\n'
              if anchor not in text:
                  raise SystemExit('Windows launcher strict/bootstrap anchor drifted')
              text = text.replace(anchor, anchor + block, 1)
              write(win_launcher, text)

          # Strengthen the Windows policy with Hysteria2 and explicit responsive
          # shipping targets consumed by the launcher.
          win_policy = 'client/RouterVPN-Windows-UnifiedControlCenter.ps1'
          text = read(win_policy)
          text = text.replace("'Shadowsocks 2022','Tor bridge'", "'Shadowsocks 2022','Hysteria2','Tor bridge'")
          if 'ResponsiveTargets' not in text:
              anchor = "    BridgeTypes = @('SOCKS5','HTTP CONNECT','HTTPS CONNECT','Shadowsocks 2022','Hysteria2','Tor bridge')\n"
              addition = "    ResponsiveTargets = @('small-window','large-window','high-dpi','touch')\n"
              if anchor not in text:
                  raise SystemExit('Windows unified policy bridge anchor drifted')
              text = text.replace(anchor, anchor + addition, 1)
          write(win_policy, text)

          # macOS: compile the policy into the real native app, and make the
          # shipping shell reference it so dead sidecar source cannot satisfy an
          # audit. Keep native AppKit/MapKit behavior in the existing shell.
          mac_builder = 'client/macos/build-native-app.sh'
          text = read(mac_builder)
          policy_name = 'UnifiedControlCenterPolicy.swift'
          if policy_name not in text:
              candidates = ['RouterVPNMacUnifiedShell.swift', 'RouterVPNMacTelemetry.swift', 'RouterVPNProfileSettings.swift']
              for candidate in candidates:
                  if candidate in text:
                      text = text.replace(candidate, policy_name + ' ' + candidate, 1)
                      break
              else:
                  raise SystemExit('macOS native builder source-list anchor drifted')
              write(mac_builder, text)
          mac_policy = 'client/macos/UnifiedControlCenterPolicy.swift'
          text = read(mac_policy)
          text = text.replace('"Shadowsocks 2022", "Tor bridge"', '"Shadowsocks 2022", "Hysteria2", "Tor bridge"')
          if 'shippingResponsiveTargets' not in text:
              text += '\nlet shippingResponsiveTargets = ["small-window", "large-window", "retina", "touch-trackpad"]\n'
          write(mac_policy, text)
          mac_shell = 'client/macos/RouterVPNMacUnifiedShell.swift'
          text = read(mac_shell)
          if 'routerVPNUnifiedControlCenterShippingPolicy' not in text:
              insertion = '''\n// Compile-time reference proves the canonical control-center policy is part of\n// the shipping AppKit product rather than an audit-only sidecar.\nprivate let routerVPNUnifiedControlCenterShippingPolicy = UnifiedControlCenterPolicy()\n'''
              imports = list(re.finditer(r'(?m)^import [^\n]+\n', text))
              if not imports:
                  raise SystemExit('macOS shipping shell import anchor drifted')
              pos = imports[-1].end()
              text = text[:pos] + insertion + text[pos:]
              write(mac_shell, text)

          # Linux: compile a small C contract include through the real GTK v8
          # shipping shell. The existing GTK map/control implementation remains
          # authoritative; this binds its defaults/order to the same contract.
          linux_inc = root / 'client/linux/routervpn-unified-control-center-v2.inc'
          linux_inc.write_text(r'''#ifndef ROUTERVPN_UNIFIED_CONTROL_CENTER_V2_INC
          #define ROUTERVPN_UNIFIED_CONTROL_CENTER_V2_INC
          #define ROUTERVPN_UNIFIED_DEFAULT_MODE_V2 "smart-auto"
          #define ROUTERVPN_UNIFIED_DEFAULT_NODE_COUNT_V2 1
          #define ROUTERVPN_UNIFIED_DEFAULT_IPV6_V2 1
          #define ROUTERVPN_UNIFIED_DEFAULT_MTU_V2 "auto"
          #define ROUTERVPN_UNIFIED_CONTROL_ORDER_V2 "connection,multihop,settings,mode,dns"
          #define ROUTERVPN_UNIFIED_EXTERNAL_TYPES_V2 "socks5,http-connect,https-connect,shadowsocks-2022,hysteria2,tor-bridge"
          static const char *routervpn_unified_shipping_experience_v2(void) { return "Unified Map Control Center"; }
          static int routervpn_unified_shipping_contract_v2(void) {
              return ROUTERVPN_UNIFIED_DEFAULT_NODE_COUNT_V2 == 1 && ROUTERVPN_UNIFIED_DEFAULT_IPV6_V2 == 1;
          }
          #endif
          ''', encoding='utf-8')
          linux_shell = 'client/linux/routervpn-unified-shell-v8.inc'
          text = read(linux_shell)
          include = '#include "routervpn-unified-control-center-v2.inc"\n'
          if include not in text:
              text = include + text
          if 'routervpn_unified_shipping_contract_v2()' not in text:
              # Reference the compiled contract from the first v8 entrypoint.
              match = re.search(r'(?m)^(?:static\s+)?(?:void|GtkWidget\s*\*|gboolean|int)\s+([A-Za-z0-9_]*unified[A-Za-z0-9_]*v8[A-Za-z0-9_]*)\s*\([^)]*\)\s*\{', text)
              if not match:
                  raise SystemExit('Linux v8 unified-shell function anchor drifted')
              brace = match.end()
              text = text[:brace] + '\n    (void)routervpn_unified_shipping_experience_v2();\n    (void)routervpn_unified_shipping_contract_v2();' + text[brace:]
          write(linux_shell, text)
          linux_builder = 'client/linux/build-native-app.sh'
          text = read(linux_builder)
          if 'routervpn-unified-control-center-v2.inc' not in text:
              # Builder already stages/copies include files; assert and copy the
              # new include explicitly next to the transformed shipping source.
              anchor = 'set -e'
              if anchor not in text:
                  anchor = 'set -eu'
              if anchor not in text:
                  raise SystemExit('Linux builder shell-options anchor drifted')
              block = '''\nUNIFIED_CONTROL_CENTER_V2="$SCRIPT_DIR/routervpn-unified-control-center-v2.inc"\n[ -f "$UNIFIED_CONTROL_CENTER_V2" ] || { echo "missing unified control-center v2 include" >&2; exit 1; }\n'''
              text = text.replace(anchor, anchor + block, 1)
              write(linux_builder, text)

          # Android: the actual ProductActivity consumes the policy and the
          # policy exposes Hysteria2 plus a fail-closed shipping assertion.
          android_policy = 'android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedControlCenterPolicy.java'
          text = read(android_policy)
          text = text.replace('"shadowsocks-2022", "tor-bridge"', '"shadowsocks-2022", "hysteria2", "tor-bridge"')
          if 'assertShippingContract' not in text:
              pos = text.rfind('}')
              method = '''\n    static void assertShippingContract() {\n        if (!"smart-auto".equals(DEFAULT_MODE) || BOTTOM_SHEET_ORDER.length != 5\n                || !"connection".equals(BOTTOM_SHEET_ORDER[0])\n                || !"dns".equals(BOTTOM_SHEET_ORDER[4])\n                || !AUTHENTICATED_TRANSPORT_ALWAYS_ON) {\n            throw new IllegalStateException("Unified Map Control Center shipping contract is invalid.");\n        }\n    }\n'''
              text = text[:pos] + method + text[pos:]
          write(android_policy, text)
          android_activity = 'android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java'
          text = read(android_activity)
          if 'AndroidUnifiedControlCenterPolicy.assertShippingContract();' not in text:
              anchor = '@Override protected void onCreate(Bundle state){super.onCreate(state);'
              if anchor not in text:
                  raise SystemExit('Android ProductActivity onCreate anchor drifted')
              text = text.replace(anchor, anchor + 'AndroidUnifiedControlCenterPolicy.assertShippingContract();', 1)
          text = text.replace('getString(MODE_KEY,"smart-auto")', 'getString(MODE_KEY,AndroidUnifiedControlCenterPolicy.DEFAULT_MODE)')
          write(android_activity, text)

          # iOS: keep the real SwiftUI implementation authoritative, add
          # Hysteria2 to secure transport capability text, and explicitly mark
          # the current adaptive iPhone/iPad layout targets.
          ios_secure = 'ios/RouterVPN/App/IOSUnifiedSecureTransport.swift'
          text = read(ios_secure)
          if 'Hysteria2' not in text:
              text = text.replace('Shadowsocks 2022', 'Shadowsocks 2022 / Hysteria2', 1)
          write(ios_secure, text)
          ios_view = 'ios/RouterVPN/App/IOSUnifiedProductView.swift'
          text = read(ios_view)
          if 'iosUnifiedResponsiveTargets' not in text:
              imports = list(re.finditer(r'(?m)^import [^\n]+\n', text))
              pos = imports[-1].end()
              text = text[:pos] + '\nprivate let iosUnifiedResponsiveTargets = "iPhone iPad portrait landscape compact regular"\n' + text[pos:]
          write(ios_view, text)

          # Canonical Linux Python policy and common validator also know the
          # real encrypted final type.
          common = 'client/routervpn_unified_control_center.py'
          text = read(common)
          text = text.replace('"shadowsocks-2022", "tor-bridge"', '"shadowsocks-2022", "hysteria2", "tor-bridge"')
          text = text.replace('{"router-vpn", "wireguard", "amneziawg", "openvpn", "shadowsocks-2022"}', '{"router-vpn", "wireguard", "amneziawg", "openvpn", "shadowsocks-2022", "hysteria2"}')
          write(common, text)

          # Strong shipping audit: validate actual launch/build composition and
          # real platform UI markers, not only sidecar policy strings.
          audit = root / 'deploy/unified-map-shipping-audit.py'
          audit.write_text(r'''#!/usr/bin/env python3
          from pathlib import Path
          import json, subprocess, sys
          ROOT=Path(__file__).resolve().parents[1]
          errors=[]
          def body(path):
              p=ROOT/path
              if not p.is_file(): errors.append(f"missing {path}"); return ""
              return p.read_text(encoding="utf-8", errors="replace")
          def need(path,*markers):
              text=body(path)
              for marker in markers:
                  if marker not in text: errors.append(f"{path}: missing {marker!r}")
          contract=json.loads(body("client/unified-control-center-v2.json") or "{}")
          if not any(row.get("id")=="hysteria2" and row.get("final_transport") is True for row in contract.get("node_types",[])): errors.append("canonical Hysteria2 external type missing")
          if contract.get("shipping_requirements",{}).get("canonical_policy_must_be_compiled_or_loaded") is not True: errors.append("canonical shipping requirement missing")
          need("client/RouterVPN-Windows-App.ps1","RouterVPN-Windows-UnifiedControlCenter.ps1","Unified Map Control Center contract is invalid")
          need("client/RouterVPN-Windows-UnifiedShell.ps1","UnifiedNodesButton","UnifiedConnectButton","UnifiedSettingsButton","UnifiedModeButton","UnifiedDNSButton")
          need("client/macos/build-native-app.sh","UnifiedControlCenterPolicy.swift")
          need("client/macos/RouterVPNMacUnifiedShell.swift","routerVPNUnifiedControlCenterShippingPolicy","UnifiedControlCenterPolicy()")
          need("client/linux/routervpn-unified-shell-v8.inc","routervpn-unified-control-center-v2.inc","routervpn_unified_shipping_contract_v2()")
          need("client/linux/build-native-app.sh","routervpn-unified-control-center-v2.inc")
          need("android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java","AndroidUnifiedControlCenterPolicy.assertShippingContract()","Fastest","Connect","Multihop","Settings","Mode","DNS","Performance")
          need("android/app/src/main/java/com/eabusham/routervpn/AndroidUnifiedControlCenterPolicy.java","assertShippingContract","hysteria2")
          need("ios/RouterVPN/App/IOSUnifiedProductView.swift","IOSUnifiedMap","controlSheet(height:","Test & select fastest","Add / manage nodes","Profiles & bridges","IOSUnifiedCustomBuilder","iPhone iPad portrait landscape compact regular")
          need("ios/RouterVPN/App/IOSUnifiedSecureTransport.swift","Hysteria2","Noise_IK","TLS 1.3")
          # Ensure every platform's real source exists in the shipping path.
          for path in ("client/RouterVPN-Windows-App.ps1","client/macos/build-native-app.sh","client/linux/build-native-app.sh","android/app/src/main/java/com/eabusham/routervpn/ProductActivity.java","ios/RouterVPN/App/IOSUnifiedProductView.swift"):
              if len(body(path)) < 100: errors.append(f"{path}: shipping source unexpectedly empty")
          if errors:
              print("UNIFIED MAP SHIPPING AUDIT: FAIL")
              for error in errors: print(" - "+error)
              raise SystemExit(1)
          print("UNIFIED MAP SHIPPING AUDIT: PASS")
          ''', encoding='utf-8')

          # Release orchestration must execute the strong shipping audit wherever
          # the older source-marker audit is already invoked.
          wired = 0
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.py','.sh','.yml','.yaml'}:
                  continue
              if path == audit:
                  continue
              try: text = path.read_text(encoding='utf-8')
              except Exception: continue
              marker = 'deploy/unified-map-control-center-audit.py'
              if marker not in text or 'deploy/unified-map-shipping-audit.py' in text:
                  continue
              if path.suffix == '.py':
                  replacement = marker + '\n    deploy/unified-map-shipping-audit.py'
                  # Do not blindly alter Python string literals; only release
                  # lists represented as quoted paths are handled below.
                  if f'"{marker}"' in text:
                      text = text.replace(f'"{marker}"', f'"{marker}",\n    "deploy/unified-map-shipping-audit.py"', 1)
                      path.write_text(text, encoding='utf-8'); wired += 1
              else:
                  line_match = re.search(r'(?m)^.*' + re.escape(marker) + r'.*$', text)
                  if line_match:
                      line = line_match.group(0)
                      indent = line[:len(line)-len(line.lstrip())]
                      if 'python3 ' in line:
                          new_line = indent + 'python3 deploy/unified-map-shipping-audit.py'
                      else:
                          new_line = indent + '- deploy/unified-map-shipping-audit.py'
                      text = text.replace(line, line + '\n' + new_line, 1)
                      path.write_text(text, encoding='utf-8'); wired += 1
          if wired == 0:
              # At minimum, authoritative release-candidate entrypoint must own it.
              candidate = root / 'deploy/release-candidate.sh'
              if candidate.is_file():
                  text = candidate.read_text(encoding='utf-8')
                  anchor = 'python3 deploy/unified-map-control-center-audit.py'
                  if anchor in text:
                      candidate.write_text(text.replace(anchor, anchor + '\npython3 deploy/unified-map-shipping-audit.py', 1), encoding='utf-8'); wired = 1
          if wired == 0:
              raise SystemExit('unified shipping audit could not be wired into release orchestration')
          PY

          python3 -m json.tool client/unified-control-center-v2.json >/dev/null
          python3 -m py_compile client/routervpn_unified_control_center.py deploy/unified-map-shipping-audit.py
          python3 deploy/unified-map-control-center-audit.py
          python3 deploy/unified-map-shipping-audit.py
          python3 deploy/native-map-first-ui-audit.py
          git diff --check
          git add client android ios deploy docs
          git rm .github/workflows/direct-main-unified-shipping-closure.yml
          git commit -m "Compose unified map controls into every shipping app [skip ci]"
          git push origin HEAD:main
