name: Router private-port exposure safety

on:
  push:
    branches: [main]
    paths:
      - 'server/**/*.sh'
      - 'server/**/*.py'
      - 'server/portainer-current.yaml'
      - 'deploy/test_reality_port_migration.py'
      - 'router/**/*.sh'
      - 'scripts/**/*.sh'
      - 'client/**/*.sh'
      - 'deploy/router-private-port-exposure-audit.py'
      - '.github/workflows/router-private-port-safety.yml'
  pull_request:
    paths:
      - 'server/**/*.sh'
      - 'server/**/*.py'
      - 'server/portainer-current.yaml'
      - 'deploy/test_reality_port_migration.py'
      - 'router/**/*.sh'
      - 'scripts/**/*.sh'
      - 'client/**/*.sh'
      - 'deploy/router-private-port-exposure-audit.py'
      - '.github/workflows/router-private-port-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-private-port-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-ports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove private and admin ports are never WAN forwarded
        run: python3 deploy/router-private-port-exposure-audit.py
      - name: Regression-test REALITY / block-page port migration
        run: python3 deploy/test_reality_port_migration.py
