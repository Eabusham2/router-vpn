name: Windows complete MAX and native WFP

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'mobile/desktop/**'
      - 'mobile/externalpolicy/**'
      - 'mobile/strategy/**'
      - 'mobile/pq/**'
      - 'mobile/xray/**'
      - 'mobile/amnezia/**'
      - 'mobile/rosenpass/**'
      - 'mobile/startwhitening/**'
      - 'cmd/start-layer-relay/**'
      - 'client/Protect-RouterVPN-Windows-PrivateRoot.ps1'
      - 'client/test-windows-private-acl.ps1'
      - 'deploy/prepare-*.py'
      - 'deploy/build*pq*.py'
      - 'deploy/build-native-runtime.py'
      - '.github/actions/go-windows-sockets/**'
      - 'deploy/prepare-go-windows-sockets.py'
      - 'deploy/test_go_windows_sockets.py'
      - 'deploy/test_windows_node_pq*.py'
      - 'deploy/test_desktop_node_pq.py'
      - 'deploy/test_pq_reference_preparation.py'
      - 'deploy/test_desktop_node_physical.py'
      - 'deploy/test_desktop_node_max*.py'
      - 'deploy/test_windows_node_max*.py'
      - 'deploy/test_server_pq_traffic.py'
      - 'deploy/test_windows_node_physical*.py'
      - 'deploy/fixtures/windows-node-physical/**'
      - 'deploy/setup-desktop-native-toolchain.py'
      - 'deploy/install-desktop-windows-toolchain.py'
      - '.github/workflows/windows-node-max-contract.yml'
      - '.github/workflows/release-candidate.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/**'
      - 'mobile/desktop/**'
      - 'mobile/externalpolicy/**'
      - 'mobile/strategy/**'
      - 'mobile/pq/**'
      - 'mobile/xray/**'
      - 'mobile/amnezia/**'
      - 'mobile/rosenpass/**'
      - 'mobile/startwhitening/**'
      - 'cmd/start-layer-relay/**'
      - 'client/Protect-RouterVPN-Windows-PrivateRoot.ps1'
      - 'client/test-windows-private-acl.ps1'
      - 'deploy/prepare-*.py'
      - 'deploy/build*pq*.py'
      - 'deploy/build-native-runtime.py'
      - '.github/actions/go-windows-sockets/**'
      - 'deploy/prepare-go-windows-sockets.py'
      - 'deploy/test_go_windows_sockets.py'
      - 'deploy/test_windows_node_pq*.py'
      - 'deploy/test_desktop_node_pq.py'
      - 'deploy/test_pq_reference_preparation.py'
      - 'deploy/test_desktop_node_physical.py'
      - 'deploy/test_desktop_node_max*.py'
      - 'deploy/test_windows_node_max*.py'
      - 'deploy/test_server_pq_traffic.py'
      - 'deploy/test_windows_node_physical*.py'
      - 'deploy/fixtures/windows-node-physical/**'
      - 'deploy/setup-desktop-native-toolchain.py'
      - 'deploy/install-desktop-windows-toolchain.py'
      - '.github/workflows/windows-node-max-contract.yml'
      - '.github/workflows/release-candidate.yml'

permissions:
  contents: read

concurrency:
  # Keep the standalone automatic diagnostic serial; explicit and reusable
  # evidence runs own their original caller and run instead of its shared lane.
  group: windows-node-max-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.workflow == 'Windows complete MAX and native WFP' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  native-max:
    name: Actual complete MAX and WFP on ${{ matrix.target }} (${{ matrix.suite }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
        suite: [quic, tls, succession, ownership-controls-1, ownership-controls-2]
        include:
          - platform: amd64
            runner: windows-latest
            target: windows/amd64
            slug: windows-amd64
          - platform: arm64
            runner: windows-11-arm
            target: windows/arm64
            slug: windows-arm64
    concurrency:
      group: windows-node-max-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}-${{ matrix.slug }}-${{ matrix.suite }}
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: ./.github/actions/go-windows-sockets
      - name: Verify native scope and prospective admission boundaries
        shell: pwsh
        run: |
          python deploy/test_windows_node_max_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Complete MAX native source/scope boundary failed' }
          python deploy/test_pq_reference_preparation.py
          if ($LASTEXITCODE -ne 0) { throw 'Complete MAX private reference preparation failed' }
      - name: Private ACL readback in Windows PowerShell 5.1 and 7
        timeout-minutes: 6
        shell: pwsh
        run: |
          $systemShell = [IO.Path]::Combine([Environment]::GetFolderPath([Environment+SpecialFolder]::System), 'WindowsPowerShell', 'v1.0', 'powershell.exe')
          $coreShell = [IO.Path]::Combine($PSHOME, 'pwsh.exe')
          foreach ($shell in @($systemShell, $coreShell)) {
            & $shell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File client/test-windows-private-acl.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Actual private ACL readback/failure controls failed' }
          }
      - name: Select exact native Rust target and verified LLVM compiler
        shell: pwsh
        run: |
          python deploy/setup-desktop-native-toolchain.py '${{ matrix.target }}' (Join-Path $env:RUNNER_TEMP 'routervpn-max-native-toolchain-${{ matrix.suite }}')
          if ($LASTEXITCODE -ne 0) { throw 'Exact MAX native toolchain preparation failed' }
      - name: Execute required complete MAX suite with actual WFP and native rekey
        timeout-minutes: 90
        shell: pwsh
        run: |
          # All five suites are required on each architecture. The former
          # combined AMD64 run passed succession and foreign predecessors but
          # reached 150 minutes during its compiled controls. Keep every case
          # and every individual native startup/query/retirement deadline.
          # Actual CGO/WFP is scoped to this executable; only TUN is modeled.
          # Execute the shipping admission predicate; the compiled closed-family
          # control and every ownership/credential negative remain required.
          python deploy/test_windows_node_max.py --standalone --sha $env:GITHUB_SHA --receipt (Join-Path $env:RUNNER_TEMP 'routervpn-windows-max-${{ matrix.suite }}-receipt.json') --suite '${{ matrix.suite }}'
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows complete MAX/WFP composition failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-max-native-${{ matrix.slug }}-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/routervpn-windows-max-${{ matrix.suite }}-receipt.json
          if-no-files-found: error
          retention-days: 7
