name: Direct main download delivery UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-download-delivery-ui.yml

permissions:
  contents: write

concurrency:
  group: direct-main-download-delivery-ui
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Surface exact source and fixed expiry in Setup Center
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 - <<'PY'
          from pathlib import Path
          import ast,re
          root=Path('.')
          path=root/'server/scripts/setup_center_ux_patch.py'
          text=path.read_text(encoding='utf-8')
          if 'function renderDownloadRetention' not in text:
              anchor="const persistedJobKey='routervpn.setup.download-job.v2';const downloadRetentionLabel='Available for 30 minutes after Ready';const downloadRetentionMs=30*60*1000"
              if anchor not in text:
                  # Older punctuation from the first retention slice.
                  match=re.search(r"const persistedJobKey='routervpn\.setup\.download-job\.v2'[^\n]*downloadRetentionMs=30\*60\*1000",text)
                  if not match: raise SystemExit('Setup Center retention constants anchor drifted')
                  anchor=match.group(0)
              addition=r''';
          const retentionLine=document.createElement('div');
          retentionLine.id='rvDownloadRetention';retentionLine.className='muted';retentionLine.setAttribute('role','status');retentionLine.setAttribute('aria-live','polite');
          panel.appendChild(retentionLine);
          function fixedExpiryMilliseconds(job){
            const raw=Number(job&&job.expires_at||0);if(!Number.isFinite(raw)||raw<=0)return 0;
            return raw<100000000000?raw*1000:raw;
          }
          function renderDownloadRetention(job){
            const phaseName=String(job&&job.phase||job&&job.status||'').toLowerCase();
            const expiry=fixedExpiryMilliseconds(job);
            if(!expiry){retentionLine.textContent=phaseName==='building'?'GitHub package unavailable; building the requested package locally in a bounded temporary workspace.':'';return;}
            const remaining=Math.max(0,expiry-Date.now());
            if(remaining<=0){retentionLine.textContent='Temporary package expired after 30 minutes and is being deleted.';return;}
            const minutes=Math.ceil(remaining/60000);
            const source=String(job&&job.source||job&&job.package_source||'').toLowerCase();
            const sourceLabel=source.includes('local')||source.includes('build')?'Local fallback build':source.includes('release')?'Exact-SHA GitHub Release':'Exact-SHA GitHub artifact';
            retentionLine.textContent=`${sourceLabel} • available for ${minutes} more minute${minutes===1?'':'s'} • fixed expiry ${new Date(expiry).toLocaleTimeString()}`;
          }
          '''
              text=text.replace(anchor,anchor+addition,1)

          # Call the renderer after every authenticated job-status JSON parse.
          patterns=[
              r'(?P<line>(?P<indent>\s+)(?:const|let)\s+(?P<name>data|job|status)\s*=\s*await\s+[^;]+\.json\(\);)',
              r'(?P<line>(?P<indent>\s+)(?P<name>data|job|status)\s*=\s*await\s+[^;]+\.json\(\);)',
          ]
          inserted=0
          for pattern in patterns:
              def repl(match):
                  nonlocal_insert[0]+=1
                  return match.group('line')+'\n'+match.group('indent')+f'renderDownloadRetention({match.group("name")});'
              nonlocal_insert=[0]
              text,n=re.subn(pattern,repl,text)
              inserted+=nonlocal_insert[0]
          if inserted==0 and 'renderDownloadRetention(data);' not in text:
              # Fallback to the existing poll's status/phase assignment.
              marker="phase.textContent="
              index=text.find(marker)
              if index<0: raise SystemExit('Setup Center job-status rendering anchor drifted')
              line_end=text.find('\n',index)
              text=text[:line_end+1]+'renderDownloadRetention(data);\n'+text[line_end+1:]
          path.write_text(text,encoding='utf-8')
          ast.parse(text)

          test=root/'server/scripts/test_download_delivery_ui.py'
          test.write_text('''#!/usr/bin/env python3\nimport ast\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[2]\nsource=(ROOT/"server/scripts/setup_center_ux_patch.py").read_text(encoding="utf-8")\nast.parse(source)\nfor marker in ("function renderDownloadRetention","fixedExpiryMilliseconds","available for ${minutes} more minute","fixed expiry","GitHub package unavailable; building the requested package locally","Temporary package expired after 30 minutes and is being deleted","renderDownloadRetention("):\n    assert marker in source, marker\nassert "expiry-Date.now()" in source\nassert "expires_at=Date.now" not in source and "expires_at = Date.now" not in source\nprint("SETUP CENTER DOWNLOAD DELIVERY UI: PASS")\n''',encoding='utf-8')

          audit=root/'deploy/exact-sha-download-delivery-audit.py'
          source=audit.read_text(encoding='utf-8')
          if 'test_download_delivery_ui.py' not in source:
              anchor='print("EXACT-SHA DOWNLOAD DELIVERY AUDIT: PASS")'
              if anchor not in source: raise SystemExit('exact delivery audit final anchor drifted')
              source=source.replace(anchor,'subprocess.run([sys.executable, str(ROOT/"server/scripts/test_download_delivery_ui.py")], check=True)\n'+anchor,1)
              audit.write_text(source,encoding='utf-8')
          PY

          chmod +x server/scripts/test_download_delivery_ui.py
          python3 -m py_compile server/scripts/setup_center_ux_patch.py server/scripts/test_download_delivery_ui.py
          python3 server/scripts/test_download_delivery_ui.py
          python3 deploy/exact-sha-download-delivery-audit.py
          git diff --check
          git add server deploy
          git rm .github/workflows/direct-main-download-delivery-ui.yml
          git commit -m "Show exact source and fixed 30-minute package expiry [skip ci]"
          git push origin HEAD:main
