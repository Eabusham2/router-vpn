name: Native authenticated AES and whitening traffic
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  native-start-layer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify policy and compose exact authenticated engine
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 ./internal/startwhitening ./cmd/start-layer-relay
          go test -race -count=1 ./internal/nativecomposite ./internal/mobilemultihop -run TestPairedSSServiceCompanion
          python3 deploy/test_prepare_mobile_whitening.py
          python3 deploy/test_native_runner_dependencies.py
          SING="$RUNNER_TEMP/routervpn-whitening-core"
          git init "$SING"
          git -C "$SING" remote add origin https://github.com/SagerNet/sing-box.git
          git -C "$SING" fetch --depth=1 origin 1ac1a339cb1223e9c70eae14c44411c75033c02d
          git -C "$SING" checkout --detach FETCH_HEAD
          python3 deploy/prepare-mobile-whitening.py "$SING"
          (cd "$SING" && go mod tidy)
          bash deploy/test_mobile_whitening_pinned.sh "$SING"
  apple-start-layer-composition:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Execute actual Swift Start Layer composition
        run: |
          python3 deploy/test_ios_start_layer.py
          python3 deploy/test_ios_ss_service_asset.py
          python3 deploy/test_ios_ss_service_dns.py
