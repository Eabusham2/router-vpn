name: Logical desktop UI smoke CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logical-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Check logical compatibility JavaScript syntax
        run: node --check cmd/client/logical_ui.js
      - name: Build controller
        run: go build -o "$RUNNER_TEMP/router-vpn-client" ./cmd/client
      - name: Smoke-test read-only browser boundary and logical API
        run: |
          cat >"$RUNNER_TEMP/client.json" <<EOF
          {
            "listen": "127.0.0.1:18788",
            "health_url": "https://connectivitycheck.gstatic.com/generate_204",
            "auto_test_seconds": 2,
            "modes_file": "$GITHUB_WORKSPACE/configs/client/modes.json",
            "state_file": "$RUNNER_TEMP/state.json",
            "scripts_dir": "$GITHUB_WORKSPACE/modes",
            "profiles_file": "$RUNNER_TEMP/routers.json"
          }
          EOF
          HOMEVPN_CLIENT_CONFIG="$RUNNER_TEMP/client.json" HOMEVPN_ROOT="$RUNNER_TEMP/runtime" \
            "$RUNNER_TEMP/router-vpn-client" >"$RUNNER_TEMP/client.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true; cat "$RUNNER_TEMP/client.log"' EXIT
          for _ in $(seq 1 40); do
            curl -fsS http://127.0.0.1:18788/api/status >/dev/null 2>&1 && break
            sleep .2
          done
          curl -fsS http://127.0.0.1:18788/ >"$RUNNER_TEMP/index.html"
          curl -fsS http://127.0.0.1:18788/logical-ui.js >"$RUNNER_TEMP/logical-ui.js"
          curl -fsS http://127.0.0.1:18788/api/logical-modes >"$RUNNER_TEMP/logical.json"
          curl -fsS http://127.0.0.1:18788/api/session >"$RUNNER_TEMP/session.json"
          grep -q '<script src="/logical-ui.js"></script>' "$RUNNER_TEMP/index.html"
          grep -q 'readOnlyDiagnostics' "$RUNNER_TEMP/logical-ui.js"
          grep -q '/api/session' "$RUNNER_TEMP/logical-ui.js"
          grep -q '/api/multihop/status' "$RUNNER_TEMP/logical-ui.js"
          grep -q 'forbiddenLoopbackMutations' "$RUNNER_TEMP/logical-ui.js"
          ! grep -q '/api/connect-logical' "$RUNNER_TEMP/logical-ui.js"
          ! grep -Eq 'fetch\(|XMLHttpRequest|\.open\(' "$RUNNER_TEMP/logical-ui.js"
          python3 - "$RUNNER_TEMP/logical.json" "$RUNNER_TEMP/session.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          session=json.load(open(sys.argv[2]))
          assert len(data)==16, len(data)
          ids={x['id'] for x in data}
          assert {'base-raw','base-pq','max-quic','max-tls','all'} <= ids
          assert 'max-quic-wg' not in ids
          assert 'max-quic-awg' not in ids
          assert 'max-tls-wg' not in ids
          assert 'max-tls-awg' not in ids
          for key in ('base-raw','base-pq','max-quic','max-tls','all'):
            item=next(x for x in data if x['id']==key)
            assert item['base_selector'] is True
            assert item['fallback'] is True
          assert isinstance(session, dict)
          PY
