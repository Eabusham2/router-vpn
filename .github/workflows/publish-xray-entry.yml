name: Verify saved native Xray entry source
on:
  push:
    paths:
      - '.github/workflows/publish-xray-entry.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 60ffb479aea2e63a577547ba331d65ca06f0d4ae
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Verify exact saved source and stage commit without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          BASE='60ffb479aea2e63a577547ba331d65ca06f0d4ae'
          TREE='1f8c155e5867084bbc9e38fb776fdf64a68c5940'
          PARENT=os.environ['GITHUB_SHA']
          payload=''
          patch=lzma.decompress(base64.b64decode(payload,validate=True),memlimit=128*1024*1024)
          assert len(patch)==20482 and hashlib.sha256(patch).hexdigest()=='caa326faaaa29619ecb6c50b74d2e48408aedb807dce8f64bc8e8ce3c28502db'
          def git(*args): return subprocess.check_output(['git',*args])
          assert git('rev-parse','HEAD').decode().strip()==BASE
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'entry.patch';file.write_bytes(patch)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(file)],check=True)
          assert git('write-tree').decode().strip()==TREE
          for command in [['go','test','-race','-count=1','-timeout=90s','./internal/mobilemultihop'],['go','vet','./internal/mobilemultihop'],['python3','deploy/test_native_runner_dependencies.py']]:
              subprocess.run(command,check=True,timeout=240)
          assert git('diff','--name-only').strip()==b''
          def api(path,data=None):
              request=urllib.request.Request('https://api.github.com/repos/Eabusham2/router-vpn/'+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=40) as response:return json.load(response)
          assert api('git/ref/heads/main')['object']['sha']==PARENT
          entries=[]
          for name in git('diff','--cached','--name-only').decode().splitlines():
              mode,sha,_=git('ls-files','--stage','--',name).decode().split('\t')[0].split()
              content=git('cat-file','blob',sha)
              uploaded=api('git/blobs',{'encoding':'base64','content':base64.b64encode(content).decode()})
              assert uploaded['sha']==sha
              entries.append({'path':name,'mode':mode,'type':'blob','sha':sha})
          entries.append({'path':'.github/workflows/publish-xray-entry.yml','mode':'100644','type':'blob','sha':None})
          parent=api('git/commits/'+PARENT)
          tree=api('git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          assert tree['sha']==TREE
          staged=api('git/commits',{'message':'Compile and validate native REALITY and XHTTP multihop entries','tree':TREE,'parents':[PARENT]})
          result={'commit':staged['sha'],'parent':PARENT,'tree':TREE,'files':len(entries)-1,'ref_updated':False}
          print('VERIFIED_SOURCE_COMMIT '+json.dumps(result),flush=True)
          pathlib.Path(os.environ['RUNNER_TEMP'],'verified-entry.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-entry-commit
          path: ${{ runner.temp }}/verified-entry.json
          if-no-files-found: error
          retention-days: 7
