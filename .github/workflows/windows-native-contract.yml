name: Windows native contract

on:
  push:
    branches: [main]
    paths-ignore:
      - 'client/macos/**'
      - '.github/workflows/macos-native-*.yml'
      - 'internal/mobiletor/desktop_socket_darwin_*.go'
  pull_request:
    paths-ignore:
      - 'client/macos/**'
      - '.github/workflows/macos-native-*.yml'
      - 'internal/mobiletor/desktop_socket_darwin_*.go'


concurrency:
  group: windows-native-contract-${{ github.ref }}
  # Finish the active native diagnostic; GitHub retains only the newest pending
  # head. Frequent coherent commits must not starve the actual kernel fixtures.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Pinned compiler for Windows identity race gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-identity-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned Windows identity compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned Windows identity C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Private ACL readback in Windows PowerShell 5.1 and 7
        if: ${{ success() || failure() }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          $systemShell = [IO.Path]::Combine([Environment]::GetFolderPath([Environment+SpecialFolder]::System), 'WindowsPowerShell', 'v1.0', 'powershell.exe')
          $coreShell = [IO.Path]::Combine($PSHOME, 'pwsh.exe')
          foreach ($shell in @($systemShell, $coreShell)) {
            & $shell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File client/test-windows-private-acl.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Actual private ACL readback/failure controls failed' }
          }
      - name: Native Windows controller process and private pipe ownership
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_windows_controller_foundation.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows controller process ownership gate failed' }
      - name: Native protected owner records and retained preparation handles
        if: ${{ success() || failure() }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          python deploy/test_windows_protection_owner.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows protection owner preparation failed' }
      - name: Native retained firewall snapshot and durable callback ownership
        if: ${{ success() || failure() }}
        timeout-minutes: 6
        shell: pwsh
        run: |
          python deploy/test_windows_protection_observation.py
          if ($LASTEXITCODE -ne 0) { throw 'Native retained protection observation failed' }
      - name: Pinned controller TLS and actual shipping handler
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_windows_controller_transport.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows controller transport gate failed' }
      - name: Actual owned Windows controller child entry and catalog authority
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          python deploy/test_windows_controller_privilege.py
          if ($LASTEXITCODE -ne 0) { throw 'Owned Windows controller child entry gate failed' }
      - name: Captured GUI request framing and cancellation ownership
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_windows_controller_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Captured Windows GUI bridge gate failed' }
      - name: Native GUI pipe transport in PowerShell 5.1 and 7
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($shell in @('powershell.exe', 'pwsh')) {
            python deploy/test_windows_gui_transport.py --shell $shell
            if ($LASTEXITCODE -ne 0) { throw "Native GUI pipe transport gate failed in $shell" }
            python deploy/test_windows_gui_adapter.py --shell $shell
            if ($LASTEXITCODE -ne 0) { throw "PowerShell UI adapter gate failed in $shell" }
            python deploy/test_windows_ui_state.py --shell $shell
            if ($LASTEXITCODE -ne 0) { throw "Captured Windows UI state gate failed in $shell" }
          }
          # Build once with the shipping Framework compiler, then load the same
          # production DLL in both runtimes. Independent recompilation cannot
          # establish compatibility of the packaged assembly.
          $owned = Join-Path $env:RUNNER_TEMP ('routervpn-ui-framework-' + [guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $owned -ErrorAction Stop)
          try {
            $assembly = Join-Path $owned 'RouterVPN.ControllerTransport.dll'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/test-windows-controller-transport.ps1 -CompileAssembly $assembly
            if ($LASTEXITCODE -ne 0) { throw 'Framework controller transport compilation failed' }
            foreach ($shell in @('powershell.exe', 'pwsh')) {
              & $shell -NoProfile -ExecutionPolicy Bypass -File client/test-windows-controller-transport.ps1 -LoadAssembly $assembly
              if ($LASTEXITCODE -ne 0) { throw "The Framework transport DLL failed to load in $shell" }
            }
          } finally {
            Remove-Item -LiteralPath $owned -Recurse -Force -ErrorAction Stop
          }
      - name: Actual original-user GUI Job and binary pipe ownership
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_windows_controller_gui.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows GUI child ownership gate failed' }
      - name: Actual CSharp GUI through owned Go pipe and pinned TLS
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          python deploy/test_windows_gui_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual CSharp and Go GUI composition gate failed' }
      - name: Actual PowerShell UI adapter through owned Go pipe and pinned TLS
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          foreach ($shell in @('powershell.exe', 'pwsh')) {
            python deploy/test_windows_gui_powershell.py --shell $shell
            if ($LASTEXITCODE -ne 0) { throw "Actual PowerShell and Go UI composition gate failed in $shell" }
          }
      - name: Actual installed and Portable Windows Session with packaged App and Tray
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          python deploy/test_windows_app_session.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual composed Windows Session gate failed' }
      - name: Isolated Windows socket token and ALE endpoint proof
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_desktop_windows_identity_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows identity source-copy contract failed' }
          python deploy/test_desktop_windows_identity.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows isolated socket identity gate failed' }
      - name: Owned Windows WFP baseline and recovery
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_desktop_windows_wfp.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual owned Windows WFP baseline gate failed' }
      - name: Retained TCP descriptor and exact source-port cleanup
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          go test -race -mod=readonly ./internal/mobiletor -run '^TestDesktopSocket(BoundTCPBytesAndRemovalBeforeRelease|ReservationProbeRejectsActuallyReleasedPort)$' -count=1 -timeout=60s
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows retained socket cleanup gate failed' }
      - name: Owned Windows WFP traffic, control expiry and process death
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_desktop_windows_traffic.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual owned Windows WFP traffic gate failed' }
      - name: Captured ordinary external host and native wrapper identities
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          go test -race -mod=readonly ./cmd/client -run '^TestDesktopExternalPhysical' -count=1 -timeout=120s
          if ($LASTEXITCODE -ne 0) { throw 'Windows ordinary physical host capture failed' }
          foreach ($shell in @('pwsh', 'powershell.exe')) {
            & $shell -NoProfile -ExecutionPolicy Bypass -File client/test-windows-native-wrapper-ownership.ps1
            if ($LASTEXITCODE -ne 0) { throw "Windows ordinary physical wrapper failed in $shell" }
          }
      - name: Owned Windows protection and portable package dispatch
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($shell in @('pwsh','powershell.exe')){
            python deploy/test_windows_owned_protection.py --shell $shell
            if($LASTEXITCODE -ne 0){throw "Owned Windows protection adapter failed in $shell"}
            & $shell -NoProfile -ExecutionPolicy Bypass -File client/test-windows-protection-dispatch.ps1
            if($LASTEXITCODE -ne 0){throw "Full Windows protection dispatcher failed in $shell"}
            python deploy/test_windows_legacy_protection_recovery.py --shell $shell
            if($LASTEXITCODE -ne 0){throw "Legacy Windows recovery ownership failed in $shell"}
          }
      - name: Parse native PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'client/Private-RouterVPN-State.ps1',
            'client/Private-RouterVPN-Protection.ps1',
            'client/test-windows-owned-protection.ps1',
            'client/test-windows-protection-dispatch.ps1',
            'client/test-windows-legacy-protection-recovery.ps1',
            'client/Private-RouterVPN-Job.ps1',
            'client/test-windows-private-job.ps1',
            'client/Private-RouterVPN-Wfp.ps1',
            'client/test-windows-wfp.ps1',
            'client/test-windows-tor-wrapper-lifecycle.ps1',
            'client/native-wireguard-windows.ps1',
            'client/native-windows-mode.ps1',
            'client/test-windows-home-dns.ps1',
            'client/Optimize-RouterVPN-MTU.ps1',
            'client/RouterVPN-Windows-MTU.ps1',
            'client/RouterVPN-Windows-DNSMeasurement.ps1',
            'client/RouterVPN-Windows-ProfileSettings.ps1',
            'client/test-windows-device-settings.ps1',
            'client/windows-kill-switch.ps1',
            'client/test-windows-kill-switch.ps1',
            'client/test-private-router-vpn-state.ps1',
            'client/Prepare-Windows-Mode-Catalog-v2.ps1',
            'client/Setup-Windows-Runtime.ps1',
            'client/install-windows.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message) at $($_.Extent.Text)" }
              throw "PowerShell parser rejected $file"
            }
          }
      - name: Executable-scoped Windows WFP enforcement
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($shell in @('pwsh','powershell.exe')){
            & $shell -NoProfile -ExecutionPolicy Bypass -File client/test-windows-wfp-endpoints.ps1 -SourceRoot $env:GITHUB_WORKSPACE
            if($LASTEXITCODE -ne 0){throw "Windows WFP endpoint reservation failed in $shell"}
            & $shell -NoProfile -ExecutionPolicy Bypass -File client/test-windows-wfp.ps1 -SourceRoot $env:GITHUB_WORKSPACE
            if($LASTEXITCODE -ne 0){throw "Windows WFP kernel enforcement failed in $shell"}
          }
      - name: Async action completion and cancellation regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./client/test-windows-async-actions.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/test-windows-async-actions.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 async action regressions failed' }
      - name: Composed Windows Help and main-control bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./client/test-windows-help-binding.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/test-windows-help-binding.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 composed Help binding regressions failed' }
      - name: Native MTU progress, exact cancellation and final rollback receipts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python deploy/test_desktop_mtu.py --platform windows --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 MTU ownership regressions failed' }
          python deploy/test_desktop_mtu.py --platform windows --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 MTU ownership regressions failed' }
      - name: Imported-node startup settings preserve captured identity
        shell: pwsh
        run: |
          python deploy/test_desktop_startup_settings.py --platform windows --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 startup settings regressions failed' }
          python deploy/test_desktop_startup_settings.py --platform windows --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 startup settings regressions failed' }
      - name: Imported-node common device settings and real WPF form
        shell: pwsh
        run: |
          python deploy/test_windows_device_settings.py --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 device settings regressions failed' }
          python deploy/test_windows_device_settings.py --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 device settings regressions failed' }
      - name: Native protection controls preserve the captured node
        shell: pwsh
        run: |
          python deploy/test_desktop_protection_settings.py --platform windows --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 protection settings regressions failed' }
          python deploy/test_desktop_protection_settings.py --platform windows --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 protection settings regressions failed' }
      - name: Complete profiles preserve every exit transport and execution choice
        shell: pwsh
        run: |
          python deploy/test_desktop_connection_profile_modes.py --platform windows --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 connection profile mode regressions failed' }
          python deploy/test_desktop_connection_profile_modes.py --platform windows --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 connection profile mode regressions failed' }
      - name: DNS editors preserve the captured node and selected transport
        shell: pwsh
        run: |
          python deploy/test_desktop_dns_settings.py --platform windows --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 DNS settings regressions failed' }
          python deploy/test_desktop_dns_settings.py --platform windows --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 DNS settings regressions failed' }
      - name: Home DNS runtime preserves the captured node and transport
        shell: pwsh
        run: |
          python deploy/test_windows_home_dns.py --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 Home DNS runtime regressions failed' }
          python deploy/test_windows_home_dns.py --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 Home DNS runtime regressions failed' }
      - name: Compact DNS and complete editor shipping composition
        shell: pwsh
        run: |
          python deploy/test_desktop_quick_dns.py --platform windows --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 compact DNS regressions failed' }
          python deploy/test_desktop_quick_dns.py --platform windows --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 compact DNS regressions failed' }
      - name: Native DNS measurements, measured drafts and exact worker drain
        shell: pwsh
        run: |
          python deploy/test_windows_dns_measurement.py --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 7 native DNS ownership regressions failed' }
          python deploy/test_windows_dns_measurement.py --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 native DNS ownership regressions failed' }
      - name: Tor helper test cleanup regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./client/test-windows-tor-cleanup.ps1
          ./client/test-windows-tor-adoption.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/test-windows-tor-cleanup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 Tor cleanup regressions failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/test-windows-tor-adoption.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 Tor adoption regressions failed' }
      - name: Windows suspended-process Job ownership
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($shell in @('pwsh','powershell.exe')){
            & $shell -NoProfile -ExecutionPolicy Bypass -File client/test-windows-private-job.ps1 -SourceRoot $env:GITHUB_WORKSPACE
            if($LASTEXITCODE -ne 0){throw "Windows suspended-process Job tests failed in $shell"}
          }
      - name: Tor wrapper ownership and prelaunch failure witnesses
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($shell in @('pwsh','powershell.exe')){
            & $shell -NoProfile -ExecutionPolicy Bypass -File client/test-windows-tor-wrapper-lifecycle.ps1 -SourceRoot $env:GITHUB_WORKSPACE
            if($LASTEXITCODE -ne 0){throw "Windows Tor wrapper lifecycle tests failed in $shell"}
          }
      - name: Windows firewall primitives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('Get-NetFirewallProfile','Set-NetFirewallProfile','New-NetFirewallRule','Get-NetFirewallRule','Remove-NetFirewallRule')) {
            if (-not (Get-Command $name -ErrorAction SilentlyContinue)) { throw "Missing Windows firewall primitive: $name" }
          }
          ./client/test-windows-kill-switch.ps1
          ./client/test-windows-kill-switch.ps1 -PreserveJsonArrays
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/test-windows-kill-switch.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 captured firewall regressions failed' }
          ./client/test-private-router-vpn-state.ps1
      - name: Captured native wrapper ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./client/test-windows-native-wrapper-ownership.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/test-windows-native-wrapper-ownership.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 native wrapper ownership regressions failed' }
      - name: Assert no current WSL dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'client/Setup-Windows-Runtime.ps1',
            'client/Prepare-Windows-Mode-Catalog-v2.ps1',
            'client/native-windows-mode.ps1',
            'cmd/client/windows_runtime.go',
            'cmd/portable-launcher/main.go',
            'deploy/package-builds.sh'
          )
          foreach ($file in $files) {
            $body = (Get-Content -Raw $file).ToLowerInvariant()
            if ($body.Contains('wsl.exe') -or $body.Contains('requires wsl2')) { throw "Current Windows runtime still depends on WSL: $file" }
          }
      - name: Go native contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = & go test -v ./cmd/portable-launcher ./internal/controllerprocess ./internal/common 2>&1
          $exit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) {
            $message = (($output | Select-Object -Last 80) -join "`n").Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows Go contract failure::$message"
            exit $exit
          }
      - name: Native workspace deletion and captured Tor child cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep every existing test and its deadlines. The growing lifecycle
          # matrices must not consume one shared package timeout.
          $scopes = @(
            @{ Run = '^TestDesktopRuntimeWorkspace'; Skip = '' },
            @{ Run = '^TestDesktopDNS'; Skip = '' },
            @{ Run = '^Test(DesktopNodePhysical|DesktopNativeStaging|NativeMultihopRetainedStage)'; Skip = '' },
            @{ Run = '^Test(DesktopExternalCompiledPhysical|DesktopMappedLayerPhysical|DesktopExternalFullRouterPredecessor)'; Skip = '' },
            @{ Run = '^TestDesktopTorMTU'; Skip = '' },
            @{ Run = '^TestDesktopTor'; Skip = '^TestDesktopTorMTU' },
            @{ Run = '^TestSpeedLab'; Skip = '' }
          )
          foreach ($scope in $scopes) {
            $arguments = @('test', '-v', '-count=1', '-timeout=180s', './cmd/client', '-run', $scope.Run)
            if ($scope.Skip) { $arguments += @('-skip', $scope.Skip) }
            & go @arguments
            if ($LASTEXITCODE -ne 0) { throw "Windows captured workspace or Tor child cleanup failed: $($scope.Run)" }
          }
      - name: Standalone runtime verifier startup isolation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & go test -v -count=1 -timeout=180s ./cmd/client -run '^TestRuntimeUtilityStartup$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Packaged recovery uses the owned Windows launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python deploy/test_windows_recovery_launcher.py --shell pwsh
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 recovery launcher dispatch failed' }
          python deploy/test_windows_recovery_launcher.py --shell powershell.exe
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 recovery launcher dispatch failed' }
