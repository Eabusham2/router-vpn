      - name: Verify remaining controller and proof ownership tests
        run: python3 deploy/test_mobile_multihop_groups.py --group runtime_remaining

  shared_fifty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify typed execution fifty and retained ownership
        # Complete disjoint phases retain their 180-second race deadlines.
        run: python3 deploy/test_mobile_multihop_groups.py --group fifty

  shared_fifty_closed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify closed execution capture publication and retirement
        # Complete disjoint phases retain their 180-second race deadlines.
        run: python3 deploy/test_mobile_multihop_groups.py --group fifty_closed

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify relay and Amnezia policy
        run: go test -race -count=1 -timeout=5m ./internal/multihoprelay ./internal/awgpolicy

  contract:
    if: ${{ always() }}
    needs: [android, android_ordered_source, android_execution_source, android_connect_source, android_connect_final_layers, android_connect_final_layers_extended, android_socks_source, android_openvpn_source, android_openvpn_host, android_imported_source, android_multiple_imported, android_candidates, android_layered_candidates, android_typed_connected_candidates, android_hosts, android_latency, shared_core, shared_runtime, shared_runtime_depth, shared_runtime_remaining, shared_fifty, shared_fifty_closed, shared_imported_prefix, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every contract group to pass
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          ANDROID_ORDERED_SOURCE_RESULT: ${{ needs.android_ordered_source.result }}
          ANDROID_EXECUTION_SOURCE_RESULT: ${{ needs.android_execution_source.result }}
          ANDROID_CONNECT_SOURCE_RESULT: ${{ needs.android_connect_source.result }}
          ANDROID_CONNECT_FINAL_LAYERS_RESULT: ${{ needs.android_connect_final_layers.result }}
          ANDROID_CONNECT_FINAL_LAYERS_EXTENDED_RESULT: ${{ needs.android_connect_final_layers_extended.result }}
          ANDROID_SOCKS_SOURCE_RESULT: ${{ needs.android_socks_source.result }}
          ANDROID_OPENVPN_SOURCE_RESULT: ${{ needs.android_openvpn_source.result }}
          ANDROID_OPENVPN_HOST_RESULT: ${{ needs.android_openvpn_host.result }}
          ANDROID_IMPORTED_SOURCE_RESULT: ${{ needs.android_imported_source.result }}
          ANDROID_MULTIPLE_IMPORTED_RESULT: ${{ needs.android_multiple_imported.result }}
          ANDROID_CANDIDATES_RESULT: ${{ needs.android_candidates.result }}
          ANDROID_LAYERED_CANDIDATES_RESULT: ${{ needs.android_layered_candidates.result }}
          ANDROID_TYPED_CONNECTED_CANDIDATES_RESULT: ${{ needs.android_typed_connected_candidates.result }}
          ANDROID_HOSTS_RESULT: ${{ needs.android_hosts.result }}
          ANDROID_LATENCY_RESULT: ${{ needs.android_latency.result }}
          SHARED_CORE_RESULT: ${{ needs.shared_core.result }}
          SHARED_RUNTIME_RESULT: ${{ needs.shared_runtime.result }}
          SHARED_RUNTIME_DEPTH_RESULT: ${{ needs.shared_runtime_depth.result }}
          SHARED_RUNTIME_REMAINING_RESULT: ${{ needs.shared_runtime_remaining.result }}
          SHARED_FIFTY_RESULT: ${{ needs.shared_fifty.result }}
          SHARED_FIFTY_CLOSED_RESULT: ${{ needs.shared_fifty_closed.result }}
          SHARED_IMPORTED_PREFIX_RESULT: ${{ needs.shared_imported_prefix.result }}
          RELAY_RESULT: ${{ needs.relay.result }}
        run: |
          test "$ANDROID_RESULT" = success
          test "$ANDROID_ORDERED_SOURCE_RESULT" = success
          test "$ANDROID_EXECUTION_SOURCE_RESULT" = success
          test "$ANDROID_CONNECT_SOURCE_RESULT" = success
          test "$ANDROID_CONNECT_FINAL_LAYERS_RESULT" = success
          test "$ANDROID_CONNECT_FINAL_LAYERS_EXTENDED_RESULT" = success
          test "$ANDROID_SOCKS_SOURCE_RESULT" = success
          test "$ANDROID_OPENVPN_SOURCE_RESULT" = success
          test "$ANDROID_OPENVPN_HOST_RESULT" = success
          test "$ANDROID_IMPORTED_SOURCE_RESULT" = success
          test "$ANDROID_MULTIPLE_IMPORTED_RESULT" = success
          test "$ANDROID_CANDIDATES_RESULT" = success
          test "$ANDROID_LAYERED_CANDIDATES_RESULT" = success
          test "$ANDROID_TYPED_CONNECTED_CANDIDATES_RESULT" = success
          test "$ANDROID_HOSTS_RESULT" = success
          test "$ANDROID_LATENCY_RESULT" = success
          test "$SHARED_CORE_RESULT" = success
          test "$SHARED_RUNTIME_RESULT" = success
          test "$SHARED_RUNTIME_DEPTH_RESULT" = success
          test "$SHARED_RUNTIME_REMAINING_RESULT" = success
          test "$SHARED_FIFTY_RESULT" = success
          test "$SHARED_FIFTY_CLOSED_RESULT" = success
          test "$SHARED_IMPORTED_PREFIX_RESULT" = success
          test "$RELAY_RESULT" = success
