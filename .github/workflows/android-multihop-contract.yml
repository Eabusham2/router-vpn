      - name: Verify required Android candidates checks
        run: |
          python3 android/test_android_node_candidates.py
          python3 android/test_android_node_connect_candidates.py
          python3 android/test_android_node_socks_candidates.py
          python3 android/test_android_node_candidate_profile.py
          python3 android/test_android_node_candidate_prefix_capture.py
          python3 android/test_android_node_candidate_prefix_host.py
          python3 android/test_android_node_candidate_prefix_owner.py
          python3 android/test_android_node_candidate_preparation.py
          python3 android/test_android_node_candidate_preparation_owner.py
          python3 android/test_android_node_candidate_preparation_ui.py

  android_layered_candidates:
