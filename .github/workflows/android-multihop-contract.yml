name: Android multihop contract

on:
  push:
    paths:
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidNodeStore.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidMultihopController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidMultihopRuntime.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidPathProbe.java'
      - 'android/test_android_multihop_contract.py'
      - '.github/workflows/android-multihop-contract.yml'
  pull_request:
    paths:
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidNodeStore.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidMultihopController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidMultihopRuntime.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidPathProbe.java'
      - 'android/test_android_multihop_contract.py'
      - '.github/workflows/android-multihop-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Android multihop boundaries
        run: python3 android/test_android_multihop_contract.py
