name: Android multihop contract

on:
  push:
    paths:
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidNodeStore.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidMultihopController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidMultihopRuntime.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidPathProbe.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/MainActivity.java'
      - 'android/test_android_multihop_contract.py'
      - 'android/test_android_multihop_graph.py'
      - 'internal/mobilemultihop/**'
      - 'internal/awgpolicy/**'
      - 'internal/multihoprelay/**'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidConnectionProfileStore.java'
      - 'android/test_android_multihop_modes.py'
      - 'mobile/routervpn_multihop_native_test.go.tmpl'
      - 'android/app/src/main/java/com/eabusham/routervpn/NativeSingBoxController.java'
      - '.github/workflows/android-multihop-contract.yml'
  pull_request:
    paths:
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidNodeStore.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidMultihopController.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidMultihopRuntime.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidPathProbe.java'
      - 'android/app/src/main/java/com/eabusham/routervpn/MainActivity.java'
      - 'android/test_android_multihop_contract.py'
      - 'android/test_android_multihop_graph.py'
      - 'internal/mobilemultihop/**'
      - 'internal/awgpolicy/**'
      - 'internal/multihoprelay/**'
      - 'android/app/src/main/java/com/eabusham/routervpn/AndroidConnectionProfileStore.java'
      - 'android/test_android_multihop_modes.py'
      - 'mobile/routervpn_multihop_native_test.go.tmpl'
      - 'android/app/src/main/java/com/eabusham/routervpn/NativeSingBoxController.java'
      - '.github/workflows/android-multihop-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x', cache: false}
      - name: Install Android JSON for shipping-controller tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Verify Android multihop boundaries and executable graph
        run: |
          python3 android/test_android_multihop_contract.py
          python3 android/test_android_multihop_modes.py
          python3 android/test_android_multihop_graph.py
          go test -race -count=1 -timeout=120s ./internal/mobilemultihop ./internal/multihoprelay ./internal/awgpolicy
