        run: python3 android/test_android_node_layered_candidates.py

  android_typed_connected_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Install Android JSON for actual typed candidate host checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Verify typed connected candidate source, profiles and ownership
        run: |
          python3 android/test_android_typed_connected_candidates.py
          python3 android/test_android_typed_connected_candidate_host.py
          python3 android/test_android_execution_entry_candidates.py
          python3 android/test_android_selected_draft_candidates.py

  android_hosts:
    strategy:
      fail-fast: false
      matrix:
        group: [transports, sessions, execution]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Install Android JSON for shipping-controller tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Verify required Android hosts checks
        env:
          HOST_GROUP: ${{ matrix.group }}
        run: |
          case "$HOST_GROUP" in
            transports)
              python3 android/test_android_connect_execution_runtime.py
              python3 android/test_android_socks_execution_runtime.py
              python3 android/test_android_node_chain_runtime.py
              ;;
            sessions)
              python3 android/test_android_node_chain_openvpn_runtime.py
              python3 android/test_android_node_chain_imported_runtime.py
              python3 android/test_android_node_chain_socks_runtime.py
              python3 android/test_android_node_chain_connect_runtime.py
              ;;
            execution)
              python3 android/test_android_node_chain_execution_runtime.py
              python3 android/test_android_node_chain_execution_restore.py
              python3 android/test_android_node_chain_mtu.py
              ;;
            *) exit 1 ;;
          esac

  android_latency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Install Android JSON for shipping-controller tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Verify required Android latency checks
        run: |
          python3 android/test_android_ordered_latency.py
          python3 android/test_android_ordinary_ordered_latency.py
          python3 android/test_android_connect_ordered_latency.py
          python3 android/test_android_execution_ordered_latency.py
          python3 android/test_android_execution_ordered_latency_data.py
          python3 android/test_android_ordered_history_source_transaction.py

  shared_core:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        part: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify every shared graph and lifecycle test
        # Complete disjoint phases retain their 180-second race deadlines.
        env:
          CORE_SHARD: ${{ matrix.shard }}
          CORE_PART: ${{ matrix.part }}
        run: python3 deploy/test_mobile_multihop_groups.py --group core --core-shard "$CORE_SHARD" --core-part "$CORE_PART"

  shared_imported_prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify all 108 imported SS prefix cases
        # 300s discovery + six 240s outer bounds + 360s setup margin = 35m.
        # Each actual Go phase retains the original 180-second race deadline.
        run: python3 deploy/test_mobile_multihop_groups.py --group imported_prefix

  shared_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify every shared graph and lifecycle test
        # Complete disjoint phases retain their 180-second race deadlines.
        run: python3 deploy/test_mobile_multihop_groups.py --group runtime

  shared_runtime_depth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify every selected private stream source depth
        run: python3 deploy/test_mobile_multihop_groups.py --group runtime_depth

  shared_runtime_remaining:
