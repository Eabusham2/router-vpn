      - name: Install Android JSON for shipping-controller tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Verify required Android independent imported Local checks
        run: |
          python3 android/test_android_multiple_imported_local.py

  android_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
