      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Install Android JSON for shipping-controller tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Verify required Android imported source checks
        run: |
          python3 android/test_android_imported_prefix_execution_capture.py

  android_multiple_imported:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
