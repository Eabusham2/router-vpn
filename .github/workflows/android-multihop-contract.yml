permissions:
  contents: read

# Superseded runs cannot produce acceptance for the current source.
concurrency:
  group: android-multihop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify complete workflow inventory and required aggregate
        run: python3 deploy/test_android_multihop_workflow.py
      - name: Install Android JSON for shipping-controller tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Verify Android multihop boundaries and executable graph
        run: |
          python3 android/test_android_multihop_contract.py
          python3 android/test_android_node_chain_capture.py
          python3 android/test_android_node_chain_execution_capture.py
          python3 android/test_android_node_candidates.py
          python3 android/test_android_ordered_presentation.py
          python3 android/test_android_node_chain_runtime.py
          python3 android/test_android_node_candidate_preparation.py
          python3 android/test_android_node_chain_execution_runtime.py
          python3 android/test_android_node_chain_execution_restore.py
          python3 android/test_android_node_chain_mtu.py
          python3 android/test_android_multihop_modes.py
          python3 android/test_android_home_dns.py
          python3 android/test_android_router_dns_retest.py
          python3 android/test_android_multihop_graph.py
          python3 android/test_android_pq_selection.py
          python3 android/test_android_max_selection.py
          python3 android/test_android_naive_multihop.py

  shared_core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify every shared graph and lifecycle test
        # Complete disjoint phases retain their 180-second race deadlines.
        run: python3 deploy/test_mobile_multihop_groups.py --group core

  shared_runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify every shared graph and lifecycle test
        # Complete disjoint phases retain their 180-second race deadlines.
        run: python3 deploy/test_mobile_multihop_groups.py --group runtime

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Verify relay and Amnezia policy
        run: go test -race -count=1 -timeout=5m ./internal/multihoprelay ./internal/awgpolicy

  contract:
    if: ${{ always() }}
    needs: [android, shared_core, shared_runtime, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every contract group to pass
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          SHARED_CORE_RESULT: ${{ needs.shared_core.result }}
          SHARED_RUNTIME_RESULT: ${{ needs.shared_runtime.result }}
          RELAY_RESULT: ${{ needs.relay.result }}
        run: |
          test "$ANDROID_RESULT" = success
          test "$SHARED_CORE_RESULT" = success
          test "$SHARED_RUNTIME_RESULT" = success
          test "$RELAY_RESULT" = success
