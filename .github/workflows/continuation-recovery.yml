name: Publish verified multihop continuation
on:
  push:
    paths:
      - '.github/workflows/continuation-recovery.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Verify source, test, and publish exact Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, tempfile, time, urllib.request
          ROOT = pathlib.Path.cwd()
          OUT = pathlib.Path(os.environ['RUNNER_TEMP']) / 'multihop-publication'
          OUT.mkdir(exist_ok=True)
          BASE = os.environ['GITHUB_SHA']
          API = 'https://api.github.com/repos/Eabusham2/router-vpn/'
          FINAL = 'f70c10e6655cef24eff4c74afc8170c1ce8e0628'
          PARTS = '434b463f8e56710942a7432849ca69a8e44cf8a9 39e432576e21f50a4c49595bcef1c32806c7aacd cc327c2599258088a28ecfd2f62f9016f8d395ad 069a153317e95c8343a742cec8e078cb4cb65c8c 9d78c9ff5066290737bf234e54c504641122bfa6 a06e614edbad7a3157b38fdcc57b2275266c211e e0fe7b7f71d03ac1df2e393381f385dc76feb48c 2cd4520eae7922b78a1467368570f0e14a8804d0 7acb3c16dd92fd7d95bebd5a3e1ebc143a6c6dde d170cd4ebb435b04ad08b7f9d7b868403daa98fd 069ab66f791859142621f5ba0b1583500a3f15a0 ab369d023811db5705f69e658767204056bc67b7'.split()
          def api(path, data=None):
              body = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(API+path, data=body, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(request, timeout=40) as response: return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504) or attempt == 3: raise
                      time.sleep(2**attempt)
          def git(*args): return subprocess.check_output(['git',*args])
          def fetch_blob(sha):
              value = api('git/blobs/'+sha)
              raw = base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == sha, 'blob mismatch'
              return raw
          assert git('status','--porcelain').strip() == b'', 'dirty checkout'
          assert api('git/ref/heads/main')['object']['sha'] == BASE, 'main advanced'
          git('rm','.github/workflows/continuation-recovery.yml')
          saved = api('git/trees/7521caa5514d03444f7fbb5f04230574d12095e6?recursive=1')
          assert not saved.get('truncated')
          fragments = sorted((x for x in saved['tree'] if x['type']=='blob' and x['path'].startswith('.github/routervpn-source-import/patch.')), key=lambda x:x['path'])
          assert len(fragments)==27
          with tempfile.TemporaryDirectory() as temp:
              for item in fragments:
                  path=pathlib.Path(temp)/pathlib.PurePosixPath(item['path']).name
                  path.write_bytes(fetch_blob(item['sha']))
                  git('apply','--index','--unidiff-zero',str(path))
              assert git('write-tree').decode().strip()=='85182758fd6dd12d65f62105171656eddf5b0f7b', 'recovered tree mismatch'
              encoded=b''.join(fetch_blob(sha) for sha in PARTS)
              assert len(encoded)==88172
              patch=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=128*1024*1024)
              assert len(patch)==300899
              assert hashlib.sha256(patch).hexdigest()=='592a965f94aab863c29ff42a8769345ea6b096659511c274b49780f6758c708b'
              path=pathlib.Path(temp)/'complete.patch';path.write_bytes(patch)
              git('apply','--index',str(path))
          assert git('write-tree').decode().strip()==FINAL, 'final tree mismatch'
          print('Reconstructed exact source tree',FINAL,flush=True)
          checks=[['go','test','-race','-count=1','-timeout=240s','./...'],['go','vet','./...'],['python3','deploy/test_multihop_execution.py'],['python3','deploy/validate-repo.py']]
          for index,command in enumerate(checks):
              with (OUT/('check-'+str(index)+'.log')).open('w') as log:
                  subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=420)
              print('PASS', ' '.join(command),flush=True)
          assert git('diff','--name-only').strip()==b'', 'tests modified tracked source'
          assert git('write-tree').decode().strip()==FINAL
          head=api('git/commits/'+BASE)
          entries=[]
          for status,path in (row.split('\t',1) for row in git('diff','--cached','--name-status','--no-renames').decode().splitlines()):
              if status=='D': entries.append({'path':path,'mode':'100644','type':'blob','sha':None});continue
              meta=git('ls-files','--stage','--',path).decode().split('\t')[0].split()
              mode,sha=meta[0],meta[1]
              raw=git('cat-file','blob',sha)
              published=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert published['sha']==sha, 'published blob mismatch'
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
              print('Published source',path,flush=True)
          tree=api('git/trees',{'base_tree':head['tree']['sha'],'tree':entries})
          assert tree['sha']==FINAL, 'remote tree mismatch'
          assert api('git/ref/heads/main')['object']['sha']==BASE, 'main advanced before final commit'
          commit=api('git/commits',{'message':'Integrate proved local/server multihop comparison across all native clients','tree':FINAL,'parents':[BASE]})
          result={'commit':commit['sha'],'base':BASE,'tree':FINAL,'source_files':len(entries)-1,'checks':[' '.join(c) for c in checks],'ref_updated':False}
          (OUT/'staged-commit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result),flush=True)
          print('Source objects verified. No branch was created or updated by this job.',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-vpn-verified-publication
          path: ${{ runner.temp }}/multihop-publication/
          if-no-files-found: error
          retention-days: 7
