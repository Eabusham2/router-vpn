name: Publish verified Apple exit checkpoint
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-apple-exits-checkpoint
  cancel-in-progress: false
jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Restore the three exact tested commits
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          BASE='493e6096cd7c79c57cd3d27aa92815904da23d9c'
          OWN='.github/workflows/publish-apple-exits-checkpoint.yml'
          DIR='deploy/continuation-apple-exits'
          SPECS=[
           ('apple-source.patch','3ca611397eb743745f9d9e240943b06146cf9633aa398de8ed1623ef257bfac7','f12ed60b12e465f0f2b77b6f41b30c6a65642ed6','Wire native Xray exits into Apple multihop with exact compiler ownership'),
           ('apple-tests.patch','9e466215925ebb07de9223bad59072241d5beb76565c1ea7c91cd704792e12ef','ec82209009d81f44d19a1f37e3cadf1ff6a2d54f','Test Apple native Xray exit combinations through shipping Swift and Go'),
           ('apple-gates.patch','14162ea19547dc19bb0416f60ab440d4a92d4278ef774ad834ecd9145b979555','7ed4adcc0657c0e40b78268140142a2887304a71','Require complete Apple exit matrices under the host SDK')]
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^')==BASE,'Main changed since source capture'
          assert not git('status','--porcelain')
          patches=[]
          for name,digest,tree,message in SPECS:
           raw=(pathlib.Path(DIR)/name).read_bytes()
           assert hashlib.sha256(raw).hexdigest()==digest,name
           target=pathlib.Path(os.environ['RUNNER_TEMP'])/name;target.write_bytes(raw);patches.append(target)
          subprocess.run(['git','rm','--',OWN,*[DIR+'/'+x[0] for x in SPECS]],check=True)
          commits=[]
          for (name,digest,tree,message),patch in zip(SPECS,patches):
           subprocess.run(['git','apply','--index','--check',str(patch)],check=True)
           subprocess.run(['git','apply','--index',str(patch)],check=True)
           assert git('write-tree')==tree,'Replayed tree differs from tested source'
           subprocess.run(['git','-c','user.name=Router VPN Development','-c','user.email=router-vpn@users.noreply.github.com','commit','-m',message],check=True)
           commits.append({'sha':git('rev-parse','HEAD'),'tree':tree,'message':message})
          pathlib.Path(os.environ['RUNNER_TEMP'],'apple-commits.json').write_text(json.dumps(commits,indent=2))
          print('EXACT_REPLAY_COMMITS '+json.dumps(commits),flush=True)
          PY
      - name: Rerun actual Swift and shared policy checks
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -timeout=120s ./internal/applexray ./internal/mobilemultihop ./internal/multihoprelay
          go vet ./internal/applexray ./internal/mobilemultihop ./internal/multihoprelay
          python3 deploy/test_ios_xray_exits.py
          python3 deploy/test_ios_multihop_profiles.py
          python3 deploy/test_ios_mtu_policy.py
          python3 ios/RouterVPN/test_packet_tunnel_libbox_contract.py
          python3 deploy/test_mobile_xray_entry_bindings.py
          python3 deploy/test_native_policy_scope.py
      - name: Fast-forward main only when its captured head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse 'HEAD^{tree}')" = 7ed4adcc0657c0e40b78268140142a2887304a71
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/main
          echo "PUSHED_APPLE_EXIT_HEAD=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-exit-commits
          path: ${{ runner.temp }}/apple-commits.json
          if-no-files-found: warn
          retention-days: 7
