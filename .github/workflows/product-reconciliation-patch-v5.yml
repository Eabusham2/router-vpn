name: Product reconciliation patch v5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/product-reconciliation-patch-v5.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate normal source files only
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d >/tmp/reconcile.py
          python3 /tmp/reconcile.py
          python3 -m py_compile server/scripts/generate-setup-assets.py server/scripts/test_setup_methods_contract.py deploy/validate-repo.py
          python3 server/scripts/test_setup_methods_contract.py
          python3 deploy/validate-repo.py
          git config user.name 'Router VPN CI'
          git config user.email 'actions@users.noreply.github.com'
          git add server/scripts/generate-setup-assets.py server/scripts/test_setup_methods_contract.py deploy/validate-repo.py
          git commit -m 'Reconcile Setup Center methods and native platform guidance'
          git push origin HEAD:main
