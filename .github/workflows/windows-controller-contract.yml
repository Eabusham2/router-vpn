name: Windows controller contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-controller-contract.yml'
      - 'internal/windowscontroller/**'
      - 'internal/windowsbootstrap/**'
      - 'internal/windowsprotection/**'
      - 'internal/controllertransport/**'
      - 'internal/controllerbridge/**'
      - 'internal/windowsuibridge/**'
      - 'internal/windowsapp/**'
      - 'internal/mobiletor/desktop_socket_windows_probe*'
      - 'cmd/client/controller_*'
      - 'cmd/client/desktop_node_process*'
      - 'cmd/client/desktop_node_journal*'
      - 'cmd/client/desktop_node_owned*'
      - 'cmd/client/desktop_node_protection*'
      - 'cmd/client/bundled_*.go'
      - 'cmd/client/private_runtime_permissions_windows.go'
      - 'cmd/client/main.go'
      - 'cmd/windows-app-launcher/**'
      - 'cmd/portable-launcher/**'
      - 'cmd/app-update/**'
      - 'deploy/test_windows_controller*'
      - 'deploy/test_windows_node_process*'
      - 'deploy/test_windows_protection_owner.py'
      - 'client/RouterVPN-Windows-ControllerTransport.cs'
      - 'client/RouterVPN-Windows-ControllerTransport.psm1'
      - 'client/RouterVPN-Windows-UIState.psm1'
      - 'client/RouterVPN-Windows-*.ps1'
      - 'client/test-windows-*.ps1'
      - 'client/test-windows-controller-transport.ps1'
      - 'client/test-windows-controller-adapter.ps1'
      - 'deploy/test_windows_gui_transport.py'
      - 'deploy/test_windows_gui_bridge.py'
      - 'deploy/test_windows_gui_adapter.py'
      - 'deploy/test_windows_gui_powershell.py'
      - 'deploy/test_windows_app_session.py'
      - 'deploy/diagnose_windows_ui_startup.py'
      - 'deploy/test_windows_ui_startup_diagnostic.py'
      - 'deploy/test_windows_ui_state.py'
      - 'client/test-windows-ui-state.ps1'
      - 'deploy/windows_*_preparation_gate.py'
      - 'deploy/fixtures/windows-controller-transport/**'
      - 'deploy/test_desktop_windows_wfp.py'
      - 'deploy/test_desktop_windows_identity.py'
      - 'deploy/install-desktop-windows-toolchain.py'
      - 'go.mod'
  pull_request:
    paths:
      - '.github/workflows/windows-controller-contract.yml'
      - 'internal/windowscontroller/**'
      - 'internal/windowsbootstrap/**'
      - 'internal/windowsprotection/**'
      - 'internal/controllertransport/**'
      - 'internal/controllerbridge/**'
      - 'internal/windowsuibridge/**'
      - 'internal/windowsapp/**'
      - 'internal/mobiletor/desktop_socket_windows_probe*'
      - 'cmd/client/controller_*'
      - 'cmd/client/desktop_node_process*'
      - 'cmd/client/desktop_node_journal*'
      - 'cmd/client/desktop_node_owned*'
      - 'cmd/client/desktop_node_protection*'
      - 'cmd/client/bundled_*.go'
      - 'cmd/client/private_runtime_permissions_windows.go'
      - 'cmd/client/main.go'
      - 'cmd/windows-app-launcher/**'
      - 'cmd/portable-launcher/**'
      - 'cmd/app-update/**'
      - 'deploy/test_windows_controller*'
      - 'deploy/test_windows_node_process*'
      - 'deploy/test_windows_protection_owner.py'
      - 'client/RouterVPN-Windows-ControllerTransport.cs'
      - 'client/RouterVPN-Windows-ControllerTransport.psm1'
      - 'client/RouterVPN-Windows-UIState.psm1'
      - 'client/RouterVPN-Windows-*.ps1'
      - 'client/test-windows-*.ps1'
      - 'client/test-windows-controller-transport.ps1'
      - 'client/test-windows-controller-adapter.ps1'
      - 'deploy/test_windows_gui_transport.py'
      - 'deploy/test_windows_gui_bridge.py'
      - 'deploy/test_windows_gui_adapter.py'
      - 'deploy/test_windows_gui_powershell.py'
      - 'deploy/test_windows_app_session.py'
      - 'deploy/diagnose_windows_ui_startup.py'
      - 'deploy/test_windows_ui_startup_diagnostic.py'
      - 'deploy/test_windows_ui_state.py'
      - 'client/test-windows-ui-state.ps1'
      - 'deploy/windows_*_preparation_gate.py'
      - 'deploy/fixtures/windows-controller-transport/**'
      - 'deploy/test_desktop_windows_wfp.py'
      - 'deploy/test_desktop_windows_identity.py'
      - 'deploy/install-desktop-windows-toolchain.py'
      - 'go.mod'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-ui-diagnostic:
    name: First Windows UI launch stage timings (instrumented)
    runs-on: windows-latest
    timeout-minutes: 10
    concurrency:
      group: windows-first-ui-diagnostic-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Validate fixed timing instrumentation boundaries
        shell: pwsh
        run: |
          python deploy/test_windows_ui_startup_diagnostic.py
          if ($LASTEXITCODE -ne 0) { throw 'First-launch instrumentation changed the original transport code' }
      - name: Pinned compiler for first-launch Session diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-first-ui-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned first-launch compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned first-launch C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Observe the first instrumented installed Session without retry
        shell: pwsh
        run: |
          python deploy/diagnose_windows_ui_startup.py
          if ($LASTEXITCODE -ne 0) { throw 'Instrumented first UI launch failed; original stage timings are above' }
    # This fresh job locates a cold-start delay. Its instrumented result cannot
    # replace acceptance in the independent exact-source Session job below.
  node-process:
    name: Actual retained Windows Node child process
    runs-on: windows-latest
    timeout-minutes: 12
    concurrency:
      group: windows-node-process-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact native process gate inputs and result boundaries
        shell: pwsh
        run: |
          python deploy/test_windows_node_process_runner.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Node process gate lost its source or result boundary' }
      - name: Pinned compiler for the retained Node process race checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-node-process-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned Windows Node process compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned Windows Node process C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Execute actual Node child ownership and the three negative controls
        timeout-minutes: 10
        shell: pwsh
        run: |
          python deploy/test_windows_node_process.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual retained Windows Node process gate failed' }
  ui-state:
    name: Saved Windows UI state in PowerShell 5.1 and 7
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute saved profile, CUSTOM and state ownership regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($shell in @('powershell.exe', 'pwsh')) {
            python deploy/test_windows_ui_state.py --shell $shell
            if ($LASTEXITCODE -ne 0) { throw "Captured Windows UI state gate failed in $shell" }
          }
    # The same state checks and executable negative controls previously ran
    # inside the long controller job. Keep both shell versions mandatory while
    # making their exact-source outcome observable independently of UAC work.
  elevation:
    name: Actual Windows Shell elevation diagnostic
    runs-on: windows-latest
    timeout-minutes: 8
    concurrency:
      group: windows-shell-elevation-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Compile the exact native elevation case with pointer checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '0'
          $binary = Join-Path $env:RUNNER_TEMP 'routervpn-shell-elevation.test.exe'
          go test -c -mod=readonly -gcflags=all=-d=checkptr=2 -o $binary ./internal/windowscontroller
          if ($LASTEXITCODE -ne 0) { throw 'Native Shell elevation diagnostic did not compile' }
      - name: Execute the actual retained Shell process and failure diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'routervpn-shell-elevation.test.exe'
          & $binary '-test.run=^TestWindowsControllerFoundation(ActualElevatedLaunch|SuspendedLaunch.*|SuspendedCallbackRefusal|PinnedAncestorsRejectReplacement)$' '-test.count=1' '-test.timeout=120s' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows Shell elevation remains unproved; see its native diagnostics' }
          & $binary '-test.run=^TestWindowsControllerMachineDirectories$' '-test.count=1' '-test.timeout=30s' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw 'Native machine-directory capture failed its independent environment checks' }
      - name: Observe actual linked limited-token access to the retained suspended thread
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'routervpn-shell-elevation.test.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Native linked-token diagnostic has no compiled exact-source binary' }
          & $binary '-test.run=^TestWindowsControllerUACAcceptanceLimitedTokenThreadAccess$' '-test.count=1' '-test.timeout=60s' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw 'Actual linked-token thread access was not observed with verified identity and reversion' }
      - name: Prove retained global Shell mapping and reject local or replacement owners
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'routervpn-shell-elevation.test.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Protected Shell mapping proof has no compiled exact-source binary' }
          & $binary '-test.run=^TestWindowsControllerFoundationProtectedShell.*$' '-test.count=1' '-test.timeout=60s' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw 'Protected global Shell capture remains unproved; no broker activation or ordinary UAC acceptance' }
      - name: Observe constructed restricted-medium access to the retained suspended thread
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'routervpn-shell-elevation.test.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Constructed-medium diagnostic has no compiled exact-source binary' }
          & $binary '-test.run=^TestWindowsControllerFoundationConstructedMediumThreadAccess$' '-test.count=1' '-test.timeout=60s' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw 'Constructed-medium access was not observed with verified identity and reversion; this is not UAC acceptance' }
      - name: Reject the unfiltered constructor that retains elevated token authority
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'routervpn-shell-elevation.test.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Explicit Medium constructor has no compiled exact-source binary' }
          & $binary '-test.run=^TestWindowsControllerFoundationConstructedPrimaryMediumWithoutLUA$' '-test.count=1' '-test.timeout=60s' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw 'The unfiltered constructor was not rejected under the unchanged native authority checks; this is not UAC acceptance' }
      - name: Probe retained GLOBALROOT Shell bootstrap without executing child code
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $env:RUNNER_TEMP 'routervpn-shell-elevation.test.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'GLOBALROOT bootstrap probe has no compiled exact-source binary' }
          & $binary '-test.run=^TestWindowsControllerGlobalRootSuspendedShellProbe$' '-test.count=1' '-test.timeout=60s' '-test.v'
          if ($LASTEXITCODE -ne 0) { throw 'Retained GLOBALROOT Shell bootstrap remains unproved; no production fallback or ordinary UAC acceptance' }
    # This short job exposes the exact failing launch immediately. The complete
    # race-instrumented foundation, all negative controls and shipping Session
    # composition remain required in the independent controller job below.
  session:
    name: Actual installed and Portable Windows Session
    runs-on: windows-latest
    timeout-minutes: 12
    concurrency:
      group: windows-owned-session-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Pinned compiler for the actual composed Session race checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-session-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned Windows Session compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned Windows Session C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Actual installed and Portable Windows Session with packaged App and Tray
        timeout-minutes: 10
        shell: pwsh
        run: |
          python deploy/test_windows_app_session.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual composed Windows Session gate failed' }
  controller:
    runs-on: windows-latest
    concurrency:
      group: windows-controller-contract-${{ github.ref }}
      # Retain the active complete native result while the independent short
      # Shell job can finish and expose the next concrete launch observation.
      cancel-in-progress: false
    # Keep the previously measured controller-gate budget while complete
    # Session execution runs independently above. No process or drain deadline
    # changes when the native observations can complete in parallel.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Pinned compiler for actual Windows race checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerLines = @(python deploy/install-desktop-windows-toolchain.py (Join-Path $env:RUNNER_TEMP 'routervpn-controller-llvm'))
          if ($LASTEXITCODE -ne 0 -or $compilerLines.Count -ne 1) { throw 'Pinned Windows controller compiler installation failed' }
          $compilerBin = [string]$compilerLines[0]
          $compiler = Join-Path $compilerBin 'x86_64-w64-mingw32-clang.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Pinned Windows controller C compiler is missing' }
          "CC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Exact process, private pipe and joined controller lifetime
        shell: pwsh
        run: |
          python deploy/test_windows_controller_foundation.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows controller ownership gate failed' }
      - name: Native protected owner records and retained preparation handles
        if: ${{ success() || failure() }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          python deploy/test_windows_protection_owner.py
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows protection owner preparation failed' }
      - name: Pinned controller TLS and actual shipping handler
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_windows_controller_transport.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Windows controller transport gate failed' }
      - name: Actual owned Windows controller child entry and catalog authority
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          python deploy/test_windows_controller_privilege.py
          if ($LASTEXITCODE -ne 0) { throw 'Owned Windows controller child entry gate failed' }
      - name: Captured GUI request framing and cancellation ownership
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_windows_controller_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Captured Windows GUI bridge gate failed' }
      - name: Native GUI pipe transport in PowerShell 5.1 and 7
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($shell in @('powershell.exe', 'pwsh')) {
            python deploy/test_windows_gui_transport.py --shell $shell
            if ($LASTEXITCODE -ne 0) { throw "Native GUI pipe transport gate failed in $shell" }
            python deploy/test_windows_gui_adapter.py --shell $shell
            if ($LASTEXITCODE -ne 0) { throw "PowerShell UI adapter gate failed in $shell" }
          }
          # Build once with the shipping Framework compiler, then load the same
          # production DLL in both runtimes. Independent recompilation cannot
          # establish compatibility of the packaged assembly.
          $owned = Join-Path $env:RUNNER_TEMP ('routervpn-ui-framework-' + [guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $owned -ErrorAction Stop)
          try {
            $assembly = Join-Path $owned 'RouterVPN.ControllerTransport.dll'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File client/test-windows-controller-transport.ps1 -CompileAssembly $assembly
            if ($LASTEXITCODE -ne 0) { throw 'Framework controller transport compilation failed' }
            foreach ($shell in @('powershell.exe', 'pwsh')) {
              & $shell -NoProfile -ExecutionPolicy Bypass -File client/test-windows-controller-transport.ps1 -LoadAssembly $assembly
              if ($LASTEXITCODE -ne 0) { throw "The Framework transport DLL failed to load in $shell" }
            }
          } finally {
            Remove-Item -LiteralPath $owned -Recurse -Force -ErrorAction Stop
          }
      - name: Actual original-user GUI Job and binary pipe ownership
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_windows_controller_gui.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows GUI child ownership gate failed' }
      - name: Actual CSharp GUI through owned Go pipe and pinned TLS
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          python deploy/test_windows_gui_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual CSharp and Go GUI composition gate failed' }
      - name: Actual PowerShell UI adapter through owned Go pipe and pinned TLS
        if: ${{ success() || failure() }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          foreach ($shell in @('powershell.exe', 'pwsh')) {
            python deploy/test_windows_gui_powershell.py --shell $shell
            if ($LASTEXITCODE -ne 0) { throw "Actual PowerShell and Go UI composition gate failed in $shell" }
          }
      - name: Actual ordinary-user protection absence and denial
        if: ${{ success() || failure() }}
        shell: pwsh
        run: |
          python deploy/test_desktop_windows_wfp.py
          if ($LASTEXITCODE -ne 0) { throw 'Actual ordinary Windows probe gate failed' }
