name: Direct main retained result leases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-retained-result-leases.yml

permissions:
  contents: write

concurrency:
  group: direct-main-retained-result-leases
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make Ready package retention fixed and restart safe
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 - <<'PY'
          from pathlib import Path
          import ast, re

          root=Path('.')
          helper=root/'server/scripts/download_retention.py'
          helper.write_text(r'''#!/usr/bin/env python3
          """Owned, fixed-expiry leases for Setup Center package results."""
          from __future__ import annotations
          import json, os, re, shutil, stat, threading, time
          from pathlib import Path
          from typing import Any

          RETENTION_SECONDS=30*60
          SWEEP_SECONDS=30
          MAX_RESULT_BYTES=4*1024*1024*1024
          SAFE_ID=re.compile(r"[^A-Za-z0-9._-]+")
          _started=False
          _lock=threading.Lock()

          def _root() -> Path:
              raw=os.environ.get("ROUTER_VPN_DOWNLOAD_RETENTION_DIR","").strip()
              path=Path(raw) if raw else Path(os.environ.get("ROUTER_VPN_STATE_DIR","/var/lib/router-vpn"))/"download-results"
              path.mkdir(mode=0o700,parents=True,exist_ok=True)
              if path.is_symlink() or not path.is_dir(): raise RuntimeError("download retention root is unsafe")
              os.chmod(path,0o700)
              return path

          def _get(job: Any, *names: str):
              for name in names:
                  if isinstance(job,dict) and name in job: return job.get(name)
                  if hasattr(job,name): return getattr(job,name)
              return None

          def _set(job: Any, name: str, value: Any) -> None:
              if isinstance(job,dict): job[name]=value
              else:
                  try: setattr(job,name,value)
                  except Exception: pass

          def _find_path(job: Any):
              for name in ("result_path","output_path","download_path","artifact_path","file_path","path"):
                  value=_get(job,name)
                  if value:
                      path=Path(str(value))
                      if path.is_file(): return name,path
              return None,None

          def _atomic_json(path: Path, value: dict) -> None:
              raw=(json.dumps(value,sort_keys=True,separators=(",",":"))+"\n").encode()
              tmp=path.with_name("."+path.name+f".{os.getpid()}.{time.time_ns()}.tmp")
              fd=os.open(tmp,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
              try:
                  with os.fdopen(fd,"wb",closefd=True) as out:
                      out.write(raw); out.flush(); os.fsync(out.fileno())
                  os.replace(tmp,path)
                  directory=os.open(path.parent,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
                  try: os.fsync(directory)
                  finally: os.close(directory)
              finally:
                  try: tmp.unlink()
                  except FileNotFoundError: pass

          def retain_ready_job(job: Any, *, now: float|None=None) -> Any:
              """Copy a Ready result to an owned lease; access never extends it."""
              now=float(time.time() if now is None else now)
              expiry=now+RETENTION_SECONDS
              field,source=_find_path(job)
              _set(job,"ready_at",_get(job,"ready_at") or now)
              _set(job,"retention_seconds",RETENTION_SECONDS)
              _set(job,"expires_at",expiry)
              _set(job,"retention_label","30 minutes")
              if source is None: return job
              info=source.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_size<=0 or info.st_size>MAX_RESULT_BYTES: raise RuntimeError("Ready package result is not a safe bounded regular file")
              job_id=str(_get(job,"id","job_id","jobId") or f"anonymous-{time.time_ns()}")
              job_id=SAFE_ID.sub("-",job_id).strip(".-")[:96] or f"job-{time.time_ns()}"
              destination_dir=_root()/job_id
              destination_dir.mkdir(mode=0o700,parents=False,exist_ok=True); os.chmod(destination_dir,0o700)
              destination=destination_dir/(SAFE_ID.sub("-",source.name).strip(".-") or "router-vpn-package")
              if source.resolve()!=destination.resolve():
                  temporary=destination.with_name("."+destination.name+f".{time.time_ns()}.tmp")
                  with source.open("rb") as inp, temporary.open("xb") as out:
                      shutil.copyfileobj(inp,out,1024*1024); out.flush(); os.fsync(out.fileno())
                  os.chmod(temporary,0o600); os.replace(temporary,destination)
                  directory=os.open(destination_dir,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
                  try: os.fsync(directory)
                  finally: os.close(directory)
              _atomic_json(destination_dir/"lease.json",{
                  "schema_version":1,"job_id":job_id,"file":destination.name,
                  "ready_at":now,"expires_at":expiry,"retention_seconds":RETENTION_SECONDS,
              })
              if field: _set(job,field,str(destination))
              _set(job,"retained_result_path",str(destination))
              return job

          def _remove_owned_directory(directory: Path) -> None:
              root=_root().resolve()
              try: resolved=directory.resolve(strict=True)
              except FileNotFoundError: return
              if resolved.parent!=root or directory.is_symlink(): return
              tomb=directory.with_name("."+directory.name+f".expired.{time.time_ns()}")
              try: os.replace(directory,tomb)
              except FileNotFoundError: return
              shutil.rmtree(tomb,ignore_errors=False)

          def sweep_expired_results(*, now: float|None=None) -> int:
              now=float(time.time() if now is None else now); removed=0
              for directory in list(_root().iterdir()):
                  if directory.is_symlink() or not directory.is_dir(): continue
                  lease=directory/"lease.json"
                  try:
                      if lease.is_symlink() or lease.stat().st_size>64*1024: continue
                      value=json.loads(lease.read_text(encoding="utf-8"))
                      expiry=float(value.get("expires_at") or 0)
                  except Exception: continue
                  if expiry>0 and now>=expiry:
                      _remove_owned_directory(directory); removed+=1
              return removed

          def _janitor() -> None:
              while True:
                  try: sweep_expired_results()
                  except Exception: pass
                  time.sleep(SWEEP_SECONDS)

          def start_download_retention_janitor() -> None:
              global _started
              with _lock:
                  if _started: return
                  _started=True
                  thread=threading.Thread(target=_janitor,name="router-vpn-download-retention",daemon=True)
                  thread.start()
          ''',encoding='utf-8')

          jobs_path=root/'server/scripts/download_jobs.py'
          source=jobs_path.read_text(encoding='utf-8')
          if 'from download_retention import' not in source:
              imports=list(re.finditer(r'(?m)^(?:from\s+[^\n]+\s+import\s+[^\n]+|import\s+[^\n]+)\n',source))
              pos=imports[-1].end() if imports else source.find('\n')+1
              source=source[:pos]+'from download_retention import retain_ready_job, start_download_retention_janitor\n'+source[pos:]

          tree=ast.parse(source)
          lines=source.splitlines(keepends=True)
          inserts=[]
          started=False
          ready_calls=0
          # Start janitor from manager construction.
          for node in ast.walk(tree):
              if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name=='__init__':
                  # Prefer DownloadJobManager but accept the first class whose
                  # name contains Job/Download and owns this initializer.
                  owner=next((c for c in tree.body if isinstance(c,ast.ClassDef) and node in c.body and ('job' in c.name.lower() or 'download' in c.name.lower())),None)
                  if owner:
                      line=node.body[0].lineno-1 if node.body else node.lineno
                      indent=' '*(node.col_offset+4)
                      if 'start_download_retention_janitor()' not in ast.get_source_segment(source,node):
                          inserts.append((line,indent+'start_download_retention_janitor()\n')); started=True
                      else: started=True
                      break
          # Every assignment/update that transitions a job to Ready receives a
          # fixed lease immediately after the state mutation.
          for node in ast.walk(tree):
              value_ready=False; job_expr=None
              if isinstance(node,(ast.Assign,ast.AnnAssign)):
                  value=node.value
                  value_ready=isinstance(value,ast.Constant) and str(value.value).lower()=='ready'
                  targets=node.targets if isinstance(node,ast.Assign) else [node.target]
                  if value_ready:
                      target=targets[0]
                      if isinstance(target,ast.Subscript): job_expr=ast.unparse(target.value)
                      elif isinstance(target,ast.Attribute): job_expr=ast.unparse(target.value)
              elif isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and node.func.attr=='update' and node.args:
                  arg=node.args[0]
                  if isinstance(arg,ast.Dict):
                      pairs={ast.literal_eval(k):ast.literal_eval(v) for k,v in zip(arg.keys,arg.values) if isinstance(k,ast.Constant) and isinstance(v,ast.Constant)}
                      value_ready=str(pairs.get('status') or pairs.get('phase') or '').lower()=='ready'
                      if value_ready: job_expr=ast.unparse(node.func.value)
              if value_ready and job_expr and hasattr(node,'end_lineno'):
                  function=next((f for f in ast.walk(tree) if isinstance(f,(ast.FunctionDef,ast.AsyncFunctionDef)) and f.lineno<=node.lineno<=getattr(f,'end_lineno',f.lineno)),None)
                  segment=ast.get_source_segment(source,function) if function else ''
                  marker=f'retain_ready_job({job_expr})'
                  if marker not in (segment or ''):
                      indent=' '*node.col_offset
                      inserts.append((node.end_lineno,indent+marker+'\n')); ready_calls+=1
                  else: ready_calls+=1
          if not started: raise SystemExit('DownloadJobManager initializer was not found for retention janitor')
          if ready_calls==0: raise SystemExit('No Ready transition was found for result retention')
          for index,text in sorted(inserts,key=lambda item:item[0],reverse=True): lines.insert(index,text)
          source=''.join(lines)
          ast.parse(source)
          jobs_path.write_text(source,encoding='utf-8')

          test=root/'server/scripts/test_download_retention_leases.py'
          test.write_text(r'''#!/usr/bin/env python3
          import importlib.util, json, os, pathlib, tempfile
          ROOT=pathlib.Path(__file__).resolve().parents[2]
          spec=importlib.util.spec_from_file_location("download_retention",ROOT/"server/scripts/download_retention.py")
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as td:
              root=pathlib.Path(td)/"retained"; source=pathlib.Path(td)/"build"/"package.zip"; source.parent.mkdir(); source.write_bytes(b"package-data")
              os.environ["ROUTER_VPN_DOWNLOAD_RETENTION_DIR"]=str(root)
              job={"id":"job-1","status":"ready","result_path":str(source)}
              module.retain_ready_job(job,now=1000)
              retained=pathlib.Path(job["result_path"])
              assert retained.is_file() and retained.read_bytes()==b"package-data"
              assert job["expires_at"]==2800 and job["retention_seconds"]==1800
              # Reading/downloading does not slide the fixed expiry.
              retained.read_bytes(); assert job["expires_at"]==2800
              assert module.sweep_expired_results(now=2799)==0 and retained.exists()
              assert module.sweep_expired_results(now=2800)==1 and not retained.exists()
          print("DOWNLOAD RETAINED RESULT LEASE TEST: PASS")
          ''',encoding='utf-8')

          audit_path=root/'deploy/download-retention-audit.py'
          audit=audit_path.read_text(encoding='utf-8')
          if 'test_download_retention_leases.py' not in audit:
              anchor='print("DOWNLOAD RETENTION AUDIT: PASS")'
              if anchor not in audit: raise SystemExit('download retention audit anchor drifted')
              audit=audit.replace(anchor,'import subprocess, sys\nsubprocess.run([sys.executable, str(ROOT/"server/scripts/test_download_retention_leases.py")], check=True)\n'+anchor,1)
              audit_path.write_text(audit,encoding='utf-8')
          PY

          chmod +x server/scripts/download_retention.py server/scripts/test_download_retention_leases.py
          python3 -m py_compile server/scripts/download_retention.py server/scripts/download_jobs.py server/scripts/test_download_retention_leases.py
          python3 server/scripts/test_download_retention_leases.py
          python3 deploy/download-retention-audit.py
          git diff --check
          git add server deploy
          git rm .github/workflows/direct-main-retained-result-leases.yml
          git commit -m "Hold Ready download and local-build results for 30 minutes [skip ci]"
          git push origin HEAD:main
