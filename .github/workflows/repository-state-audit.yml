name: Repository state audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked generated Python artifacts
        run: |
          set -euo pipefail
          tracked_generated="$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)"
          if [ -n "$tracked_generated" ]; then
            echo 'Generated Python cache/bytecode must not be tracked:' >&2
            printf '%s\n' "$tracked_generated" >&2
            exit 1
          fi
          echo 'No tracked Python cache/bytecode artifacts.'

      - name: Reject self-mutating source workflows
        run: |
          set -euo pipefail
          mutators="$(grep -RIlE 'git[[:space:]]+push[[:space:]]+origin[[:space:]]+HEAD:(refs/heads/)?main' .github/workflows || true)"
          if [ -n "$mutators" ]; then
            echo 'CI workflows must not rewrite source and push directly to main:' >&2
            printf '%s\n' "$mutators" >&2
            exit 1
          fi
          echo 'No self-mutating source workflows.'

      - name: Verify branch inventory without deleting work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep the API call outside process substitution so authentication,
          # rate-limit and network failures cannot look like an empty result.
          branch_names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          mapfile -t branches <<< "$branch_names"
          if [ "${#branches[@]}" -ne 1 ] || [ "${branches[0]}" != main ]; then
            printf 'Repository must contain exactly one branch named main. Found: %s\n' "${branches[*]}" >&2
            exit 1
          fi

          echo 'Repository state OK: main only. Branch cleanup requires review.'

      - name: Check public README links
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd()
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          errors = []
          for rel in paths:
              path = root / rel
              if not rel or 'readme' not in path.name.lower():
                  continue
              for target in re.findall(r'\]\(([^\s)]+)', path.read_text(encoding='utf-8')):
                  parsed = urlsplit(target.strip('<>'))
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  destination = (path.parent / unquote(parsed.path)).resolve()
                  if not destination.is_relative_to(root) or not destination.exists():
                      errors.append(f'{rel}: broken local link {target}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Public README relative links: PASS')
          PY
