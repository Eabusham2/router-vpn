name: Unify release workflows

on:
  push:
    branches: [main]
    paths:
      - 'deploy/unify-release-workflows.py'
      - '.github/workflows/unify-release-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unify-release-workflows-main
  cancel-in-progress: false

jobs:
  unify:
    if: github.repository == 'Eabusham2/router-vpn'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply idempotent workflow migration to latest main
        run: |
          set -euo pipefail
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          python3 deploy/unify-release-workflows.py
          git diff --check
          grep -Fq 'workflow_call:' .github/workflows/release-candidate.yml
          grep -Fq 'uses: ./.github/workflows/release-candidate.yml' .github/workflows/build-all.yml
      - name: Commit only release workflow wiring
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/release-candidate.yml .github/workflows/build-all.yml; then
            echo 'Release workflows already unified.'
            exit 0
          fi
          git add .github/workflows/release-candidate.yml .github/workflows/build-all.yml
          git commit -m 'Make release-candidate the authoritative build-all matrix'
          git pull --rebase origin main
          git push origin HEAD:main
