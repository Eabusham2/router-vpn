name: Publish ARM64 Portainer images

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-arm64-portainer-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate-source:
    name: Validate source before registry publication
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x', cache: false}
      - name: Compile and syntax gates
        run: |
          set -euo pipefail
          go test ./cmd/update-controller -count=1
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile
          find modes server client deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          python3 deploy/validate-repo.py
          python3 deploy/durable-state-syntax-audit.py

  publish:
    needs: validate-source
    name: Build and publish ARM64 images
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: init
            dockerfile: server/init/Dockerfile
            image: router-vpn-init
          - name: agent
            dockerfile: deploy/router-agent.Dockerfile
            image: router-vpn-agent
          - name: updater
            dockerfile: deploy/update-controller.Dockerfile
            image: router-vpn-updater
          - name: wireguard
            dockerfile: server/wireguard/Dockerfile
            image: router-vpn-wireguard
          - name: awg2
            dockerfile: server/awg2/Dockerfile
            image: router-vpn-awg2
          - name: rosenpass
            dockerfile: server/rosenpass/Dockerfile
            image: router-vpn-rosenpass
          - name: naive
            dockerfile: server/naive/Dockerfile
            image: router-vpn-naive
          - name: ss-v2ray
            dockerfile: server/ss-v2ray/Dockerfile
            image: router-vpn-ss-v2ray
          - name: aux
            dockerfile: server/aux-proxies/Dockerfile
            image: router-vpn-aux
    steps:
      - uses: actions/checkout@v4
      - name: Record exact source tree identity
        shell: bash
        run: |
          set -euo pipefail
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          [[ "$tree_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'SOURCE_TREE_SHA=%s\n' "$tree_sha" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/eabusham2/${{ matrix.image }}:arm64-main
            ghcr.io/eabusham2/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Eabusham2/router-vpn
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source-tree=${{ env.SOURCE_TREE_SHA }}
      - name: Verify published exact-SHA ARM64 image provenance
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/eabusham2/${{ matrix.image }}:${GITHUB_SHA}"
          digest='${{ steps.publish.outputs.digest }}'
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/arm64 "$ref" >/dev/null
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = 'arm64'
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')" = 'https://github.com/Eabusham2/router-vpn'
          test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.source-tree" }}')" = "$SOURCE_TREE_SHA"
          printf '%s %s %s\n' "$ref" "$digest" "$SOURCE_TREE_SHA"
