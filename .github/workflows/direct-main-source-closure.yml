name: Direct main source closure

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-source-closure.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: direct-main-source-closure
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Apply and certify the final clean source tree
        shell: bash
        run: |
          set -u
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 .github/scripts/source-closure.py
          rm -f .github/scripts/source-closure.py .github/workflows/direct-main-source-closure.yml

          report=/tmp/source-closure-failures.txt
          : > "$report"
          failed=0
          names=()
          run_check() {
            name="$1"; shift
            log="/tmp/${name}.log"
            "$@" >"$log" 2>&1
            rc=$?
            if [[ $rc -ne 0 ]]; then
              failed=1; names+=("$name")
              { echo "===== ${name} rc=${rc} ====="; tail -n 240 "$log"; echo; } >> "$report"
            fi
          }
          run_check current-requirements python3 deploy/current-requirements-audit.py
          run_check production-compose python3 deploy/test-production-release-compose.py
          run_check source-provenance python3 deploy/test_source_provenance.py
          run_check source-provenance-adoption python3 deploy/test_source_provenance_adoption_identity.py
          run_check download-jobs python3 server/scripts/test_download_jobs.py
          run_check download-retention python3 deploy/setup-center-download-retention-audit.py
          run_check linux-session python3 deploy/linux-session-mutation-audit.py
          run_check unified-map-shipping python3 deploy/unified-map-shipping-audit.py
          run_check native-map python3 deploy/native-map-first-ui-audit.py
          run_check product-parity python3 deploy/product-parity-audit.py
          run_check profile-settings python3 deploy/profile-settings-audit.py
          run_check native-session python3 deploy/native-session-mutation-audit.py
          run_check durable-state python3 deploy/durable-state-transaction-audit.py
          run_check validate-repo python3 deploy/validate-repo.py
          run_check release-orchestration python3 deploy/release-orchestration-audit.py
          run_check full-audit python3 deploy/full-audit-v4.py
          run_check recovered-1-264 python3 deploy/recovered-requirements-1-264-audit.py
          run_check recovered-265-311 python3 deploy/recovered-requirements-265-311-audit.py
          run_check recovered-312-356 python3 deploy/recovered-addendum-312-356-audit.py
          run_check recovered-corrections python3 deploy/recovered-corrections-audit.py
          run_check go-client go test ./cmd/client -count=1
          run_check go-updater go test ./cmd/update-controller -count=1
          run_check go-agent go test ./cmd/router-agent -count=1
          run_check shell-syntax bash -c "find modes server client deploy router -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n"
          run_check python-syntax bash -c "find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile"
          run_check diff-check git diff --check

          if [[ $failed -ne 0 ]]; then
            cp "$report" .github/current-source-failures.txt
            git add -A
            git commit -m "Apply source closure; record remaining failures: ${names[*]} [skip ci]"
            git push origin HEAD:main
            exit 1
          fi

          rm -f .github/current-source-failures.txt
          git add -A
          git commit -m 'Close all reconciled source and shipping requirements'
          git push origin HEAD:main
          for ref in $(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); if($2!="main") print $2}'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
