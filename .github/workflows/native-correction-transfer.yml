name: Verify native release corrections
on:
  push:
    paths: ['.github/workflows/native-correction-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Reconstruct exact correction, test, and upload source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, tempfile, urllib.request
          API='https://api.github.com/repos/Eabusham2/router-vpn/'
          OUT=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-corrections';OUT.mkdir()
          def api(path,data=None):
              request=urllib.request.Request(API+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=40) as response:return json.load(response)
          def git(*args):return subprocess.check_output(['git',*args])
          git('rm','.github/workflows/native-correction-transfer.yml')
          assert git('write-tree').decode().strip()=='f70c10e6655cef24eff4c74afc8170c1ce8e0628','unexpected baseline'
          blob=api('git/blobs/2c18bcfc8e8f593f99284f5dc7d9dab83ca80ca7')
          encoded=base64.b64decode(blob['content'])
          assert hashlib.sha1(b'blob '+str(len(encoded)).encode()+b'\0'+encoded).hexdigest()=='2c18bcfc8e8f593f99284f5dc7d9dab83ca80ca7'
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='a7e920ac36745f3626b8521cfb930e3e5bc50458eb193ba36fc55a97fea0b662'
          with tempfile.NamedTemporaryFile() as file:
              file.write(patch);file.flush();git('apply','--index',file.name)
          final='04c6eec14342f3ead25739dac6d587e8908c0f4a'
          assert git('write-tree').decode().strip()==final
          checks=[['python3','ios/RouterVPN/test_packet_tunnel_libbox_contract.py'],['go','test','-race','-count=1','-timeout=240s','./...'],['go','vet','./...']]
          for i,command in enumerate(checks):
              with (OUT/('check-'+str(i)+'.log')).open('w') as log:subprocess.run(command,check=True,stdout=log,stderr=subprocess.STDOUT,timeout=300)
              print('PASS',' '.join(command),flush=True)
          assert git('diff','--name-only').strip()==b''
          entries=[]
          for row in git('diff','--cached','--name-status','--no-renames').decode().splitlines():
              status,path=row.split('\t',1)
              if status=='D':continue
              mode,sha,stage=git('ls-files','--stage','--',path).decode().split('\t')[0].split()
              raw=git('cat-file','blob',sha)
              remote=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert remote['sha']==sha
              entries.append({'path':path,'mode':mode,'type':'blob','sha':sha})
              print('Verified source',path,sha,flush=True)
          (OUT/'manifest.json').write_text(json.dumps({'tree':final,'files':entries,'checks':checks},indent=2))
          print('Verified tree',final,'— no branch updated by this job',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: router-vpn-native-corrections
          path: ${{ runner.temp }}/native-corrections/
          if-no-files-found: error
          retention-days: 7
