name: Release gap audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Compile and test shared source contracts
        run: go test ./cmd/client ./internal/common
      - name: Test safe-upgrade generated credential preservation
        run: |
          python3 server/scripts/test_preserve_generated_state.py
          bash -n server/scripts/generate-transports.sh
          bash -n server/scripts/generate-xray-pq.sh
          bash -n server/scripts/generate-tls-alternates.sh
          bash -n server/scripts/generate-advanced-profiles.sh
      - name: Run strict native AI identity release-gap audit
        run: python3 deploy/release-gap-audit.py
      - name: Guard shipping native app onboarding lifecycle
        run: python3 client/test_native_onboarding_contract.py
      - name: Guard safe cross-platform profile settings
        run: python3 deploy/profile-settings-audit.py
      - name: Guard cross-platform mode DNS and responsive product parity
        run: python3 deploy/product-parity-audit.py
