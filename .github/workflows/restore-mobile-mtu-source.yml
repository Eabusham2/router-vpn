name: Restore mobile MTU source

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact current main SHA; refuse a moved branch
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: restore-mobile-mtu-source
  cancel-in-progress: false

jobs:
  restore-tested-source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check exact parent and authenticated source checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib,re,os
          from pathlib import Path
          assert re.fullmatch('[0-9a-f]{40}',os.environ['EXPECTED_HEAD'])
          patch=Path('docs/continuations/mtu-recovery-20261001.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='e2c61ce4644649cc901d843b4ac4c5f6ce6340b5a5c48569d3a44b08b52b8691'
          PY
          git apply --unidiff-zero --check --include='android/*' --include='deploy/prepare-mobile-multihop.py' --include='deploy/test_mobile_mtu_status.py' docs/continuations/mtu-recovery-20261001.patch
          git apply --unidiff-zero --include='android/*' --include='deploy/prepare-mobile-multihop.py' --include='deploy/test_mobile_mtu_status.py' docs/continuations/mtu-recovery-20261001.patch
      - name: Execute real production-source behavioral contracts before committing
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libandroid-json-java
          go test -race ./internal/mobilemtu ./internal/hopmeasure ./internal/mtuprobe
          python3 android/test_android_mtu_measurement_gate.py
          python3 android/test_android_mtu_session.py
          python3 android/test_android_layered_service_compile.py
          python3 modes/test_mtu_policy.py
          python3 -m py_compile deploy/prepare-mobile-multihop.py deploy/prepare-mobile-mtu.py deploy/test_mobile_mtu_status.py
          bash -n android/build-sing-box-libbox.sh
      - name: Commit only the reviewed application-source manifest, then fast-forward main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          files=json.loads(Path('docs/continuations/mtu-recovery-20261001.json').read_text())['files']
          selected=[p for p in files if p.startswith('android/') or p in ['deploy/prepare-mobile-multihop.py','deploy/test_mobile_mtu_status.py']]
          assert selected and all(not p.startswith('/') and '..' not in Path(p).parts and not p.startswith('.github/') for p in selected)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed.issubset(set(selected)),sorted(changed-set(selected))
          subprocess.run(['git','add','--']+selected,check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate recovered Android Auto-MTU sessions, controls and measurement leases'
          git push origin HEAD:refs/heads/main
          git rev-parse HEAD > restored-head.txt
          printf 'Restored source commit: `%s`\n\nBoundary-double tests are not physical-device proof. Run exact-head native release CI separately.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: restored-mobile-mtu-head-${{ github.run_id }}
          path: restored-head.txt
          retention-days: 14
