name: Complete native desktop transport runtimes

on:
  workflow_call:
    inputs:
      platform:
        description: Build all, windows, darwin, or linux native targets
        type: string
        default: all
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, windows, darwin, linux]
        default: all

permissions:
  contents: read

jobs:
  kernel-mtu:
    name: Actual native TUN MTU ownership and rollback
    needs: runtime
    if: inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Require actual isolated kernel TUN transaction
        run: |
          test -c /dev/net/tun
          python3 deploy/test_desktop_node_mtu_kernel_contract.py
          python3 deploy/test_desktop_mtu_kernel.py
      - uses: actions/download-artifact@v4
        with:
          name: RouterVPN-native-runtime-linux-amd64-${{ github.sha }}
          path: native-mtu-runtime
      - name: Require shipping node command private-file MTU and checked cleanup
        run: |
          python3 deploy/native-runtime-bundle.py extract linux/amd64 native-mtu-runtime/native-linux-amd64.tar.gz native-mtu-runtime/verified
          python3 deploy/test_desktop_node_mtu_kernel.py --bundle native-mtu-runtime/verified --receipt native-mtu-evidence/node-kernel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RouterVPN-node-kernel-MTU-${{ github.sha }}
          path: native-mtu-evidence
          if-no-files-found: warn
          retention-days: 14

  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          NATIVE_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python3 - <<'PY'
          import json, os
          platform = os.environ['NATIVE_PLATFORM']
          assert platform in ('all', 'windows', 'darwin', 'linux')
          targets = [
            ('linux', 'amd64', 'ubuntu-24.04'),
            ('linux', 'arm64', 'ubuntu-24.04-arm'),
            ('darwin', 'amd64', 'macos-15-intel'),
            ('darwin', 'arm64', 'macos-15'),
            ('windows', 'amd64', 'windows-latest'),
            ('windows', 'arm64', 'windows-11-arm'),
          ]
          matrix = {'include': [{'target': system+'/'+arch, 'slug': system+'-'+arch,
                                 'runner': runner} for system, arch, runner in targets
                                if platform in ('all', system)]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix='+json.dumps(matrix, separators=(',', ':'))+'\n')
          PY

  tor-windows:
    name: Pinned Windows Tor compile prerequisite
    if: inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source build tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends autoconf automake libtool make perl pkg-config
      - name: Compile the exact user-mode Tor helper and native C tests
        run: |
          python3 deploy/build-desktop-tor.py compile windows/amd64 dist/tor-compiled/windows-amd64 --work "$RUNNER_TEMP/tor-source-build" --cache "$RUNNER_TEMP/tor-source-cache" --compiler "$RUNNER_TEMP/tor-llvm-mingw" --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Tor-Windows-compile-${{ github.sha }}
          path: dist/tor-compiled/windows-amd64
          if-no-files-found: error
          retention-days: 3

  runtime:
    name: Complete native engine ${{ matrix.target }}
    needs: [targets, tor-windows]
    if: always() && needs.targets.result == 'success' && (needs.tor-windows.result == 'success' || needs.tor-windows.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends clang libclang-dev cmake ninja-build pkg-config libssl-dev autoconf automake libtool make perl nftables iproute2 passwd util-linux
      - name: Install native macOS build libraries
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config openssl@3 autoconf automake libtool
      - name: Prepare exact Rust and native C toolchains
        shell: bash
        run: python3 deploy/setup-desktop-native-toolchain.py '${{ matrix.target }}' "$RUNNER_TEMP/native-toolchain"
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: RouterVPN-Tor-Windows-compile-${{ github.sha }}
          path: dist/tor-compiled/windows-amd64
      - name: Native DNS proxy H3 exchanges and kernel proof
        shell: bash
        env:
          ROUTER_VPN_DNS_TARGET: '${{ matrix.target }}'
        run: |
          set -euo pipefail
          python3 deploy/test_dnsproxy_build.py
          python3 - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          target = os.environ['ROUTER_VPN_DNS_TARGET']
          if target not in {'linux/amd64', 'linux/arm64', 'darwin/amd64', 'darwin/arm64', 'windows/amd64', 'windows/arm64'}:
              raise RuntimeError('Unknown native DNS test target')
          selector = os.environ.copy()
          selector['GOTOOLCHAIN'] = 'go1.26.3'
          identity = subprocess.check_output(['go', 'env', 'GOROOT', 'GOHOSTOS', 'GOHOSTARCH'], env=selector, text=True).splitlines()
          if len(identity) != 3 or '/'.join(identity[1:]) != target:
              raise RuntimeError('DNS tests must execute on the actual target architecture')
          go = Path(identity[0])/'bin'/('go.exe' if target.startswith('windows/') else 'go')
          command = [sys.executable, 'deploy/build-dnsproxy.py', 'test', '--go', str(go)]
          if target == 'windows/arm64':
              command.append('--without-race')
          subprocess.run(command, check=True)
          PY
      - name: Compute complete source identity
        id: policy
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('native_build', 'deploy/build-native-runtime.py')
          build = importlib.util.module_from_spec(spec); spec.loader.exec_module(build)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha256='+build.digest()+'\n')
          PY
      - uses: actions/cache/restore@v4
        id: engine-cache
        with:
          key: complete-native-v1-${{ runner.os }}-${{ matrix.slug }}-${{ steps.policy.outputs.sha256 }}-${{ hashFiles('deploy/setup-desktop-native-toolchain.py', 'deploy/install-desktop-windows-toolchain.py') }}
          path: dist/native-runtime/${{ matrix.slug }}
      - name: Build and validate the complete native engine
        shell: bash
        run: |
          set -euo pipefail
          # macOS Bash 3.2 treats an empty array as unset under nounset.
          runtime_args=('${{ matrix.target }}' 'dist/native-runtime/${{ matrix.slug }}')
          if [[ '${{ matrix.target }}' == windows/* ]]; then
            runtime_args+=(--tor-compiled dist/tor-compiled/windows-amd64)
          fi
          python3 deploy/build-native-runtime.py "${runtime_args[@]}"
          python3 deploy/test_desktop_tor_package.py --package 'dist/native-runtime/${{ matrix.slug }}' --target '${{ matrix.target }}' --within-native
          python3 deploy/test_desktop_native_bundle.py 'dist/native-runtime/${{ matrix.slug }}' '${{ matrix.target }}'
          python3 deploy/test_native_runtime_delivery.py --bundle 'dist/native-runtime/${{ matrix.slug }}' --target '${{ matrix.target }}'
          python3 deploy/native-runtime-bundle.py archive '${{ matrix.target }}' 'dist/native-runtime/${{ matrix.slug }}' 'dist/native-artifact/native-${{ matrix.slug }}.tar.gz'
      - uses: actions/cache/save@v4
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
          path: dist/native-runtime/${{ matrix.slug }}
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-native-runtime-${{ matrix.slug }}-${{ github.sha }}
          path: dist/native-artifact/native-${{ matrix.slug }}.tar.gz
          if-no-files-found: error
          retention-days: 3
