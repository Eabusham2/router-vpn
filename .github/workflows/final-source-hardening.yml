name: Final source hardening patch
on:
  push:
    paths:
      - .github/workflows/final-source-hardening.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact bounded source replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Linux multihop: contained stale-start and teardown cleanup.
          replace_once(
              "modes/run-multihop.sh",
              'rm -rf "$RUN"\nmkdir -p "$RUN"',
              'HOMEVPN_ROOT="$ROOT" python3 "$SCRIPT_DIR/cleanup-private-runtime.py" "$RUN"\nmkdir -p "$RUN"',
          )
          replace_once(
              "modes/run-multihop.sh",
              '    python3 "$SCRIPT_DIR/kill-switch.py" release >/dev/null 2>&1 || true\n  exit "$status"',
              '    python3 "$SCRIPT_DIR/kill-switch.py" release >/dev/null 2>&1 || true\n  HOMEVPN_ROOT="$ROOT" python3 "$SCRIPT_DIR/cleanup-private-runtime.py" "$RUN" >/dev/null 2>&1 || true\n  exit "$status"',
          )

          # macOS native multihop: cleanup only the already-validated runtime dir.
          replace_once(
              "client/native-multihop-darwin.sh",
              '  stop_owned\n  release_guard\n}',
              '  stop_owned\n  release_guard\n  HOMEVPN_ROOT="$ROOT" python3 "$ROOT/modes/cleanup-private-runtime.py" "$RUNTIME_DIR" >/dev/null 2>&1 || true\n}',
          )

          # Windows native multihop: RuntimeDir is already required to be inside Root\\run.
          replace_once(
              "client/native-multihop-windows.ps1",
              "function Stop-Owned{if(Test-Path -LiteralPath $PidFile){$n=0;if([int]::TryParse((Get-Content -Raw -LiteralPath $PidFile).Trim(),[ref]$n)-and$n-gt 0){Stop-Process -Id $n -Force -ErrorAction SilentlyContinue};Remove-Item -LiteralPath $PidFile -Force -ErrorAction SilentlyContinue}}\nif($Action-eq'down'){Stop-Owned;try{Kill 'release'}catch{Write-Warning $_.Exception.Message};exit 0}",
              "function Stop-Owned{if(Test-Path -LiteralPath $PidFile){$n=0;if([int]::TryParse((Get-Content -Raw -LiteralPath $PidFile).Trim(),[ref]$n)-and$n-gt 0){Stop-Process -Id $n -Force -ErrorAction SilentlyContinue};Remove-Item -LiteralPath $PidFile -Force -ErrorAction SilentlyContinue}}\nfunction Remove-PrivateRuntime{if(Test-Path -LiteralPath $RuntimeDir){[IO.Directory]::Delete($RuntimeDir,$true)}}\nif($Action-eq'down'){Stop-Owned;try{Kill 'release'}catch{Write-Warning $_.Exception.Message};Remove-PrivateRuntime;exit 0}",
          )
          replace_once(
              "client/native-multihop-windows.ps1",
              "  try{Kill 'release'}catch{Write-Warning $_.Exception.Message}\n}",
              "  try{Kill 'release'}catch{Write-Warning $_.Exception.Message}\n  Remove-PrivateRuntime\n}",
          )

          # Linux sing-box: download exact release bytes, verify digest, validate archive, then extract.
          replace_once(
              "client/install-linux.sh",
              '  TMP_SB=$(mktemp -d)\n  curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-${SB_ARCH}.tar.gz" | tar -xz -C "$TMP_SB"\n  SB_DIR="$TMP_SB/sing-box-${SB_VER}-linux-${SB_ARCH}"',
              '''  TMP_SB=$(mktemp -d)\n  SB_TGZ="$TMP_SB/sing-box.tar.gz"\n  case "$SB_ARCH" in\n    arm64) SB_SHA256=1ffa3b48ad6fa98f9fd810482e39bdd5b6157782ef11ce37d67bdcfd9338547a ;;\n    amd64) SB_SHA256=1540533adb3df24f5ad5f14b5c7ca3dbc2401b10a1c1eb278fcadcada47ec6c4 ;;\n    *) echo "Unsupported sing-box architecture: $SB_ARCH" >&2; exit 1 ;;\n  esac\n  curl --proto '=https' --tlsv1.2 -fL "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-${SB_ARCH}.tar.gz" -o "$SB_TGZ"\n  printf '%s  %s\\n' "$SB_SHA256" "$SB_TGZ" | sha256sum -c -\n  python3 - "$SB_TGZ" <<'PYARCHIVE'\nimport pathlib,stat,sys,tarfile\np=pathlib.Path(sys.argv[1])\nif p.stat().st_size > 256*1024*1024: raise SystemExit('sing-box archive exceeds safety limit')\ncount=0; total=0\nwith tarfile.open(p,'r:gz') as tf:\n  for m in tf.getmembers():\n    count += 1; total += max(0,m.size)\n    q=pathlib.PurePosixPath(m.name)\n    if q.is_absolute() or '..' in q.parts: raise SystemExit('unsafe sing-box archive path')\n    if m.issym() or m.islnk() or m.isdev() or m.isfifo(): raise SystemExit('unsafe sing-box archive member type')\n    if not (m.isdir() or m.isfile()): raise SystemExit('unsupported sing-box archive member type')\n    if count > 4096 or total > 1024*1024*1024: raise SystemExit('sing-box archive expansion exceeds safety limit')\nPYARCHIVE\n  mkdir -p "$TMP_SB/extract"\n  tar --no-same-owner --no-same-permissions -xzf "$SB_TGZ" -C "$TMP_SB/extract"\n  SB_DIR="$TMP_SB/extract/sing-box-${SB_VER}-linux-${SB_ARCH}"''',
          )

          # Exact immutable source objects for locally built runtimes.
          replace_once(
              "client/install-linux.sh",
              '  if git clone https://github.com/rosenpass/rosenpass "$TMP_RP/rosenpass" \\\n    && (cd "$TMP_RP/rosenpass" && git checkout 00569eb && cargo build --release --bin rosenpass) \\\n',
              '  if git clone --filter=blob:none --no-checkout https://github.com/rosenpass/rosenpass "$TMP_RP/rosenpass" \\\n    && git -C "$TMP_RP/rosenpass" fetch --depth=1 origin 00569eb273016a10d2e75e5142236f06f7c3d4b3 \\\n    && git -C "$TMP_RP/rosenpass" checkout --detach 00569eb273016a10d2e75e5142236f06f7c3d4b3 \\\n    && [[ $(git -C "$TMP_RP/rosenpass" rev-parse HEAD) == 00569eb273016a10d2e75e5142236f06f7c3d4b3 ]] \\\n    && (cd "$TMP_RP/rosenpass" && cargo build --release --bin rosenpass) \\\n',
          )
          replace_once(
              "client/install-linux.sh",
              '  if git clone https://github.com/shadowsocks/v2ray-plugin "$TMP_V2/v2ray-plugin" \\\n    && (cd "$TMP_V2/v2ray-plugin" && git checkout e9af1cdd2549d528deb20a4ab8d61c5fbe51f306 && GOTOOLCHAIN=auto go build -trimpath -ldflags=\'\'-s -w\'\' -o v2ray-plugin .); then',
              '  if git clone --filter=blob:none --no-checkout https://github.com/shadowsocks/v2ray-plugin "$TMP_V2/v2ray-plugin" \\\n    && git -C "$TMP_V2/v2ray-plugin" fetch --depth=1 origin e9af1cdd2549d528deb20a4ab8d61c5fbe51f306 \\\n    && git -C "$TMP_V2/v2ray-plugin" checkout --detach e9af1cdd2549d528deb20a4ab8d61c5fbe51f306 \\\n    && (cd "$TMP_V2/v2ray-plugin" && GOTOOLCHAIN=auto go build -trimpath -ldflags=\'\'-s -w\'\' -o v2ray-plugin .); then',
          )
          replace_once(
              "client/install-linux.sh",
              '  git clone --branch v3.0.2 --depth 1 https://github.com/amnezia-vpn/amneziawg-go "$TMP/amneziawg-go"\n',
              '  git clone --filter=blob:none --no-checkout https://github.com/amnezia-vpn/amneziawg-go "$TMP/amneziawg-go"\n  git -C "$TMP/amneziawg-go" fetch --depth=1 origin 0527dfa47639714dd8f5c9ffbd9d40d19083f0ba\n  git -C "$TMP/amneziawg-go" checkout --detach 0527dfa47639714dd8f5c9ffbd9d40d19083f0ba\n  [[ $(git -C "$TMP/amneziawg-go" rev-parse HEAD) == 0527dfa47639714dd8f5c9ffbd9d40d19083f0ba ]]\n',
          )
          replace_once(
              "client/install-linux.sh",
              '  git clone https://github.com/amnezia-vpn/amneziawg-tools "$TMP/amneziawg-tools"\n  (cd "$TMP/amneziawg-tools" && git checkout 05434cab7d91bbbc607d18ec5fade91f4b83774c)\n',
              '  git clone --filter=blob:none --no-checkout https://github.com/amnezia-vpn/amneziawg-tools "$TMP/amneziawg-tools"\n  git -C "$TMP/amneziawg-tools" fetch --depth=1 origin 05434cab7d91bbbc607d18ec5fade91f4b83774c\n  git -C "$TMP/amneziawg-tools" checkout --detach 05434cab7d91bbbc607d18ec5fade91f4b83774c\n  [[ $(git -C "$TMP/amneziawg-tools" rev-parse HEAD) == 05434cab7d91bbbc607d18ec5fade91f4b83774c ]]\n',
          )
          PY
          bash -n modes/run-multihop.sh
          bash -n client/native-multihop-darwin.sh
          bash -n client/install-linux.sh
          python3 deploy/native-download-policy-audit.py
          go test ./cmd/client ./internal/common
      - name: Commit bounded hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modes/run-multihop.sh client/native-multihop-darwin.sh client/native-multihop-windows.ps1 client/install-linux.sh
          git diff --cached --check
          git commit -m 'Close final runtime hardening gaps'
          git push
