name: One-shot iOS private profile migration

on:
  push:
    branches:
      - automation/ios-private-profiles

permissions:
  contents: write

concurrency:
  group: one-shot-ios-private-profile-migration
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Migrate profile persistence and remove transport automation
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 .github/scripts/apply-ios-private-profiles.py
          git push origin HEAD:main
          git push origin --delete automation/ios-private-profiles || true
