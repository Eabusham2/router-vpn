name: Apply connection-profile UI truth

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch profile descriptions and audit
        shell: bash
        run: |
          set -euo pipefail
          git switch -C publish origin/main
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'client/RouterVPN-Windows-ProfileSettings.ps1': (
              'Save or restore the selected node plus current Mode/CUSTOM layers, DNS, kill switch, IPv6, MTU, and exact multihop entry → exit → exit-transport choice. Node keys, API tokens and external credentials are referenced by node ID and are never copied into a connection profile.',
              'Save or restore the selected node plus current Mode/CUSTOM layers, DNS, kill switch, IPv6, WG/AWG base/fallback, AUTO encryption/obfuscation requirements, MTU, and exact multihop entry → exit → exit-transport choice. Node keys, API tokens and external credentials are referenced by node ID and are never copied into a connection profile.'),
            'client/macos/RouterVPNProfileSettings.swift': (
              'Save/load the selected node plus current Mode/CUSTOM layers, DNS, kill switch, IPv6, MTU and multihop choices. Node keys, API tokens and external credentials stay only in the linked node store and are never duplicated here.',
              'Save/load the selected node plus current Mode/CUSTOM layers, DNS, kill switch, IPv6, WG/AWG base/fallback, AUTO encryption/obfuscation requirements, MTU and multihop choices. Node keys, API tokens and external credentials stay only in the linked node store and are never duplicated here.'),
            'client/linux/routervpn-connection-profiles-v11.inc': (
              'Profiles save the selected node plus current Mode/CUSTOM layers, DNS/settings and an exact staged multihop Entry -> Exit -> exit transport. Node keys/API tokens/credentials stay in the linked private node stores. Load never connects automatically.',
              'Profiles save the selected node plus current Mode/CUSTOM layers, DNS, kill switch, IPv6, WG/AWG base/fallback, AUTO encryption/obfuscation requirements, MTU and an exact staged multihop Entry -> Exit -> exit transport. Node keys/API tokens/credentials stay in the linked private node stores. Load never connects automatically.')
          }
          for path, (old, new) in replacements.items():
              p = Path(path); s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: profile description seam drifted')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('deploy/native-auto-requirements-ui-audit.py')
          s = p.read_text(encoding='utf-8')
          anchors = [
            ('"Both are Off by default",\n)', '"Both are Off by default",\n    "AUTO encryption/obfuscation requirements",\n)'),
            ('"Both AUTO requirements are Off by default",\n)', '"Both AUTO requirements are Off by default",\n    "AUTO encryption/obfuscation requirements",\n)'),
            ('"auto_require_obfuscation",\n)\nrequire(\n    "android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialog.java"', '"auto_require_obfuscation",\n)\nrequire(\n    "client/linux/routervpn-connection-profiles-v11.inc",\n    "AUTO encryption/obfuscation requirements",\n    "Load never connects automatically",\n)\nrequire(\n    "android/app/src/main/java/com/eabusham/routervpn/AndroidProfileSettingsDialog.java"')
          ]
          for old, new in anchors:
              if s.count(old) != 1:
                  raise SystemExit('native UI audit seam drifted')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Source gates
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/native-auto-requirements-ui-audit.py
          python3 deploy/profile-settings-audit.py
          python3 deploy/product-parity-audit.py
          python3 deploy/full-audit-v4.py
          python3 deploy/validate-repo.py
      - name: Commit real source and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-profile-ui-truth.yml
          git config user.name 'Eabusham2'
          git config user.email 'eabusham2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Describe full AUTO policy in connection profiles'
          git push origin HEAD:main
