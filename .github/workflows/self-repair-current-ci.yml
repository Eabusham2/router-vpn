name: Repair current validator drift

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-repair-current-ci.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase on live main
        run: git pull --rebase origin main
      - name: Repair only stale validator strings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('deploy/validate-repo.py')
          s = p.read_text()
          old = '"Strict embedded libbox sessions require", "Shadowsocks or Hysteria2 exit",\n    "AWG-entry multihop", "Network changes reset libbox",'
          new = '"Strict embedded libbox/Xray sessions require", "Shadowsocks or Hysteria2 exit",\n    "AWG-entry multihop", "Network changes reset/revalidate libbox and native Xray",'
          if s.count(old) != 1:
              raise SystemExit(f'validator anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          python3 deploy/validate-repo.py
      - name: Commit validator repair
        run: |
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git add deploy/validate-repo.py
          git commit -m 'Refresh Android product validator truth'
          git pull --rebase origin main
          git push origin HEAD:main
