name: ARM64 Portainer preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - 'modes/**'
      - 'cmd/**'
      - 'internal/**'
      - 'configs/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/arm64-portainer-preflight.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: arm64-portainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-portainer:
    name: Build production images for linux/arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report preflight start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "commit=$GITHUB_SHA status=started workflow=ARM64-Portainer-preflight"

      - name: Static production preflight
        run: |
          python3 deploy/validate-repo.py
          python3 -m json.tool configs/client/modes.json >/dev/null
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile
          find modes server client deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          docker compose -f server/portainer-current.yaml config >/dev/null

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build init image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/init/Dockerfile -t router-vpn-preflight-init:arm64 .

      - name: Run ARM64 init end to end
        run: |
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 \
            -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 \
            -e ENDPOINT=203.0.113.10 \
            router-vpn-preflight-init:arm64

      - name: Build router agent image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f deploy/router-agent.Dockerfile -t router-vpn-preflight-agent:arm64 .

      - name: Build WireGuard image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/wireguard/Dockerfile -t router-vpn-preflight-wireguard:arm64 .

      - name: Build AmneziaWG image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/awg2/Dockerfile -t router-vpn-preflight-awg2:arm64 .

      - name: Build Rosenpass image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/rosenpass/Dockerfile -t router-vpn-preflight-rosenpass:arm64 .

      - name: Build Naive image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/naive/Dockerfile -t router-vpn-preflight-naive:arm64 .

      - name: Build SS plus V2Ray image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/ss-v2ray/Dockerfile -t router-vpn-preflight-ss-v2ray:arm64 .

      - name: Smoke-test built ARM64 binaries
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh router-vpn-preflight-init:arm64 -c 'test -x /usr/local/bin/router-vpn-init && test -x /src/server/scripts/generate-transports.sh && test -x /src/server/scripts/generate-xray-pq.sh && test -x /src/server/scripts/create-bundle-json.py && test -x /src/server/scripts/apply-runtime.sh'
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh router-vpn-preflight-agent:arm64 -c 'test -x /usr/local/bin/router-vpn-agent'
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/amneziawg-go router-vpn-preflight-awg2:arm64 --version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/rosenpass router-vpn-preflight-rosenpass:arm64 --version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/caddy router-vpn-preflight-naive:arm64 version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/v2ray-plugin router-vpn-preflight-ss-v2ray:arm64 -version >/dev/null

      - name: Report preflight result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_STATUS: ${{ job.status }}
        run: gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "commit=$GITHUB_SHA status=$PREFLIGHT_STATUS workflow=ARM64-Portainer-preflight"
