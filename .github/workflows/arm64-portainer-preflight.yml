name: ARM64 Portainer preflight

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: arm64-portainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-portainer:
    name: Build production images for linux/arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Static production preflight
        run: |
          python3 deploy/validate-repo.py
          python3 -m json.tool configs/client/modes.json >/dev/null
          python3 -m json.tool configs/client/logical-modes.json >/dev/null
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile
          find modes server client deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          sh -n router/asus-merlin-router-vpn-forwards.sh
          python3 - <<'PY'
          import pathlib,re
          text=pathlib.Path('server/portainer-current.yaml').read_text()
          if re.search(r'(?m)^\s*build:\s*$', text):
              raise SystemExit('ERROR: Portainer production compose must stay image-only')
          if re.search(r'(?m)^\s*context:\s*https?://', text):
              raise SystemExit('ERROR: remote Git Docker build contexts are forbidden')
          if '/src/server/scripts/download-broker.py' not in text or 'ROUTER_VPN_GITHUB_SHA:' not in text:
              raise SystemExit('ERROR: production :8786 dynamic broker contract is missing')
          tags=re.findall(r'ghcr\.io/eabusham2/router-vpn-(?:init|agent|wireguard|awg2|rosenpass|naive|ss-v2ray|aux):([0-9a-f]{40})', text)
          if not tags or len(set(tags)) != 1:
              raise SystemExit('ERROR: custom production images must share one exact source SHA')
          PY
          docker compose -f server/portainer-current.yaml config >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build init image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/init/Dockerfile -t router-vpn-preflight-init:arm64 .

      - name: Run ARM64 init end to end
        run: |
          TEST_ROOT="$RUNNER_TEMP/router-vpn-preflight"
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 -e ENDPOINT=1.1.1.1 \
            -v "$TEST_ROOT:/opt/router-vpn" router-vpn-preflight-init:arm64
          docker run --rm --platform linux/arm64 -v "$TEST_ROOT:/opt/router-vpn:ro" alpine:3.22 sh -c '
            test -e /opt/router-vpn/.initialized &&
            test -s /opt/router-vpn/config/router-agent.json &&
            test -s /opt/router-vpn/config/transports/server.json &&
            test -s /opt/router-vpn/config/xray/server.json &&
            test -s /opt/router-vpn/client-bundle/router-vpn-bundle.json
          '

      - name: Run ARM64 finalizer end to end
        run: |
          TEST_ROOT="$RUNNER_TEMP/router-vpn-preflight"
          docker run --rm --privileged --platform linux/arm64 \
            -e WAN_INTERFACE=eth0 -e LAN_CIDR=192.168.50.0/24 \
            -e ADGUARD4=192.168.50.133 -e ENDPOINT=1.1.1.1 \
            -e OVERTLS_PORT=14443 -e OVERTLS_INTERNAL_PORT=14444 -e SSR_PORT=15443 \
            -v "$TEST_ROOT:/opt/router-vpn" --entrypoint /bin/bash \
            router-vpn-preflight-init:arm64 /src/server/finalize/current-entrypoint.sh
          docker run --rm --platform linux/arm64 -v "$TEST_ROOT:/opt/router-vpn:ro" alpine:3.22 sh -c '
            test -e /opt/router-vpn/.finalized &&
            test ! -e /opt/router-vpn/router-vpn-client-bundle.zip &&
            test ! -e /opt/router-vpn/downloads/router-vpn-client-bundle.zip &&
            test -s /opt/router-vpn/config/rosenpass/server.toml &&
            test -s /opt/router-vpn/client-bundle/routers.json &&
            test -s /opt/router-vpn/client-bundle/router-vpn-bundle.json &&
            test -s /opt/router-vpn/client-bundle/logical-modes.json &&
            test -s /opt/router-vpn/client-bundle/setup-assets.json &&
            test -s /opt/router-vpn/downloads/router-vpn-device-setup.html &&
            test -s /opt/router-vpn/downloads/download-policy.json &&
            test -s /opt/router-vpn/config/aux/overtls-server.json &&
            test -s /opt/router-vpn/config/aux/ssr-server.json &&
            ! find /opt/router-vpn/downloads -maxdepth 1 -type f -name "*.zip" | grep -q .
          '

      - name: Build router agent image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f deploy/router-agent.Dockerfile -t router-vpn-preflight-agent:arm64 .

      - name: Build WireGuard image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/wireguard/Dockerfile -t router-vpn-preflight-wireguard:arm64 .

      - name: Build AmneziaWG image
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/router-vpn-awg2-arm64.log"
          for attempt in 1 2; do
            echo "=== AmneziaWG ARM64 build attempt ${attempt}/2 ==="
            if docker buildx build --platform linux/arm64 --progress=plain --load -f server/awg2/Dockerfile -t router-vpn-preflight-awg2:arm64 . >"$log" 2>&1; then
              cat "$log"
              exit 0
            fi
            echo "=== AmneziaWG ARM64 attempt ${attempt} failed ===" >&2
            tail -n 180 "$log" >&2 || true
            if [[ $attempt -lt 2 ]]; then
              echo 'Retrying once to distinguish transient Debian/GitHub fetch failure from deterministic build failure...' >&2
              sleep 4
            fi
          done
          echo '::error title=ARM64 AmneziaWG build failed::AmneziaWG failed twice; see the build tail above.'
          exit 1

      - name: Build Rosenpass image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/rosenpass/Dockerfile -t router-vpn-preflight-rosenpass:arm64 .

      - name: Build Naive image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/naive/Dockerfile -t router-vpn-preflight-naive:arm64 .

      - name: Build SS plus V2Ray image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/ss-v2ray/Dockerfile -t router-vpn-preflight-ss-v2ray:arm64 .

      - name: Build auxiliary proxy image
        run: docker buildx build --platform linux/arm64 --progress=plain --load -f server/aux-proxies/Dockerfile -t router-vpn-preflight-aux:arm64 .

      - name: Smoke-test built ARM64 binaries
        run: |
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh router-vpn-preflight-init:arm64 -c 'test -x /usr/local/bin/router-vpn-init && test -x /src/server/scripts/generate-setup-assets.py && test -x /src/server/scripts/generate-aux-proxies.py && test -x /src/server/scripts/create-bundle-json.py && test -x /src/server/scripts/build-download-on-demand.py && test -x /src/server/scripts/download-broker.py && test -x /src/server/scripts/apply-runtime.sh && command -v go >/dev/null'
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh router-vpn-preflight-agent:arm64 -c 'test -x /usr/local/bin/router-vpn-agent'
          docker run --rm --platform linux/arm64 --entrypoint /bin/sh router-vpn-preflight-wireguard:arm64 -c 'command -v wg >/dev/null && command -v wg-quick >/dev/null && command -v wireguard-go >/dev/null && wireguard-go --version 2>&1 | grep -qi wireguard'
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/amneziawg-go router-vpn-preflight-awg2:arm64 --version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/rosenpass router-vpn-preflight-rosenpass:arm64 --version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/caddy router-vpn-preflight-naive:arm64 version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/bin/v2ray-plugin router-vpn-preflight-ss-v2ray:arm64 -version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/overtls-bin router-vpn-preflight-aux:arm64 --version >/dev/null
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/ssr-server router-vpn-preflight-aux:arm64 -h >/dev/null 2>&1

