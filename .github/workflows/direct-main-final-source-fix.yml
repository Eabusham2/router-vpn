name: Direct main final source integration fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-final-source-fix.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: direct-main-final-source-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Apply integration fixes and run the authoritative source matrix
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 .github/scripts/final-source-fix.py

          python3 deploy/current-requirements-audit.py
          python3 deploy/test-production-release-compose.py
          python3 deploy/test_source_provenance.py
          python3 deploy/test_source_provenance_adoption_identity.py
          python3 server/scripts/test_download_jobs.py
          python3 deploy/setup-center-download-retention-audit.py
          python3 deploy/linux-session-mutation-audit.py
          python3 deploy/unified-map-shipping-audit.py
          python3 deploy/native-map-first-ui-audit.py
          python3 deploy/product-parity-audit.py
          python3 deploy/profile-settings-audit.py
          python3 deploy/native-session-mutation-audit.py
          python3 deploy/durable-state-transaction-audit.py
          python3 deploy/validate-repo.py
          python3 deploy/release-orchestration-audit.py
          go test ./cmd/client ./cmd/update-controller -count=1
          git diff --check

          rm -f .github/scripts/final-source-fix.py
          rm -f .github/workflows/direct-main-final-source-fix.yml
          git add -A
          git commit -m 'Fix final shipping and release integration drift'
          git push origin HEAD:main

          for ref in $(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); if($2!="main") print $2}'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${ref}" || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
