name: One-shot connection profile v4 migration

on:
  push:
    paths:
      - .github/workflows/connection-profile-v4-migration-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure commit identity
        run: |
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
      - name: Upgrade desktop connection profile store to schema v4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cmd/client/connection_profiles.go')
          s = p.read_text()
          old = 'const connectionProfileStoreVersion = 1'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, 'const connectionProfileStoreVersion = 4')
          old = '''\tif store.Version == 0 {
\t\tstore.Version = connectionProfileStoreVersion
\t}
\tif store.Version != connectionProfileStoreVersion {
\t\treturn connectionProfileStore{}, fmt.Errorf("unsupported connection profile store version %d", store.Version)
\t}
'''
          new = '''\tstoredVersion := store.Version
\tif storedVersion == 0 {
\t\tstoredVersion = 1
\t}
\tif storedVersion < 1 || storedVersion > connectionProfileStoreVersion {
\t\treturn connectionProfileStore{}, fmt.Errorf("unsupported connection profile store version %d", store.Version)
\t}
\tstore.Version = connectionProfileStoreVersion
'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          old = '''\t}
\treturn store, nil
}

func persistConnectionProfileStore'''
          new = '''\t}
\tif storedVersion < connectionProfileStoreVersion {
\t\tif err := persistConnectionProfileStore(a, store); err != nil {
\t\t\treturn connectionProfileStore{}, fmt.Errorf("migrate connection profile store to schema v%d: %w", connectionProfileStoreVersion, err)
\t\t}
\t}
\treturn store, nil
}

func persistConnectionProfileStore'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          p.write_text(s)
          PY
          gofmt -w cmd/client/connection_profiles.go
          git add cmd/client/connection_profiles.go
          git commit -m "Migrate desktop connection profiles to schema v4"
          git push origin HEAD:main
      - name: Upgrade Android connection profile store to schema v4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/java/com/eabusham/routervpn/AndroidConnectionProfileStore.java')
          s = p.read_text()
          old = '    static final int SCHEMA_VERSION=1, MAX_PROFILES=64, MAX_STORE=512*1024;\n    private static final String FILE_NAME="connection-profiles-v1.json";'
          new = '    static final int SCHEMA_VERSION=4, MAX_PROFILES=64, MAX_STORE=512*1024;\n    private static final String FILE_NAME="connection-profiles-v4.json", LEGACY_FILE_NAME="connection-profiles-v1.json";'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          old = '    private final Context context; private final AndroidNodeStore nodes; private final AndroidStandardExitStore exits; private final File file;\n    AndroidConnectionProfileStore(Context context,AndroidNodeStore nodes,AndroidStandardExitStore exits){this.context=context.getApplicationContext();this.nodes=nodes;this.exits=exits;this.file=new File(this.context.getFilesDir(),FILE_NAME);}'
          new = '    private final Context context; private final AndroidNodeStore nodes; private final AndroidStandardExitStore exits; private final File file, legacyFile;\n    AndroidConnectionProfileStore(Context context,AndroidNodeStore nodes,AndroidStandardExitStore exits){this.context=context.getApplicationContext();this.nodes=nodes;this.exits=exits;this.file=new File(this.context.getFilesDir(),FILE_NAME);this.legacyFile=new File(this.context.getFilesDir(),LEGACY_FILE_NAME);}'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          new_read = r'''    private JSONArray readRows() throws Exception {
        File source = file;
        boolean legacyPath = false;
        if (!file.exists()) {
            if (!legacyFile.exists()) return new JSONArray();
            source = legacyFile;
            legacyPath = true;
        }
        byte[] stored = AndroidPrivateFileStore.read(source, MAX_STORE);
        JSONObject root = new JSONObject(new String(stored, StandardCharsets.UTF_8));
        int schema = root.optInt("schema_version", 0);
        if (schema < 1 || schema > SCHEMA_VERSION) {
            throw new IllegalStateException("Unsupported connection profile store schema " + schema + ".");
        }
        JSONArray rows = root.optJSONArray("profiles");
        if (rows == null) rows = new JSONArray();
        if (rows.length() > MAX_PROFILES) throw new IllegalStateException("Too many saved connection profiles.");
        Set<String> ids = new HashSet<>();
        for (int i = 0; i < rows.length(); i++) {
            JSONObject row = rows.getJSONObject(i);
            String id = row.optString("id", "");
            cleanName(row.optString("name", ""));
            if (!safeId(id) || !ids.add(id)) {
                throw new IllegalStateException("Connection profile store contains invalid/duplicate ids.");
            }
            String kind = row.optString("node_kind", "");
            if (!"router-vpn".equals(kind) && !"external".equals(kind)) {
                throw new IllegalStateException("Connection profile node kind is invalid.");
            }
            if (row.optString("node_id", "").isEmpty()) {
                throw new IllegalStateException("Connection profile node id is missing.");
            }
            normalizeMode(row.optString("mode", "smart-auto"));
            jsonStrings(row.optJSONArray("custom_layers"), 32);
            normalizeMultiMode(row.optString("multihop_exit_mode", "shadowsocks"));
            JSONObject policy = row.optJSONObject("policy");
            if (policy != null) {
                Iterator<String> keys = policy.keys();
                while (keys.hasNext()) {
                    String key = keys.next();
                    if (!allowedPolicyKey(key)) {
                        throw new IllegalStateException("Connection profile contains non-whitelisted node data: " + key);
                    }
                }
            }
        }
        if (legacyPath || schema < SCHEMA_VERSION) {
            writeRows(rows);
            AndroidPrivateFileStore.remove(legacyFile, MAX_STORE);
        } else if (legacyFile.exists()) {
            AndroidPrivateFileStore.remove(legacyFile, MAX_STORE);
        }
        return rows;
    }'''
          pattern = r'    private JSONArray readRows\(\) throws Exception \{.*?\n    \}\n\n    private void writeRows'
          s, count = re.subn(pattern, new_read + '\n\n    private void writeRows', s, count=1, flags=re.S)
          assert count == 1, count
          p.write_text(s)
          PY
          git add android/app/src/main/java/com/eabusham/routervpn/AndroidConnectionProfileStore.java
          git commit -m "Migrate Android connection profiles to schema v4"
          git push origin HEAD:main
      - name: Upgrade iOS connection profile store to schema v4
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ios/RouterVPN/App/IOSConnectionProfilesView.swift')
          s = p.read_text()
          old = 'private let iosConnectionProfilesFile = "connection-profiles.json"\nprivate let iosConnectionProfilesMaximumBytes = 512 * 1024'
          new = 'private let iosConnectionProfilesFile = "connection-profiles.json"\nprivate let iosConnectionProfilesSchemaVersion = 4\nprivate let iosConnectionProfilesMaximumBytes = 512 * 1024'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          marker = '\n@MainActor\nprivate enum IOSConnectionProfileStore {'
          envelope = '''

private struct IOSConnectionProfileEnvelope: Codable {
    var schemaVersion: Int
    var profiles: [IOSConnectionProfileRecord]

    enum CodingKeys: String, CodingKey {
        case schemaVersion = "schema_version"
        case profiles
    }
}
'''
          assert s.count(marker) == 1, s.count(marker)
          s = s.replace(marker, envelope + marker)
          new_load = r'''    private static func loadAll() throws -> [IOSConnectionProfileRecord] {
        let decoder = JSONDecoder()
        if let data = try IOSPrivateJSONStore.read(
            iosConnectionProfilesFile,
            maximumBytes: iosConnectionProfilesMaximumBytes
        ) {
            if let envelope = try? decoder.decode(IOSConnectionProfileEnvelope.self, from: data) {
                guard envelope.schemaVersion >= 1, envelope.schemaVersion <= iosConnectionProfilesSchemaVersion else {
                    throw issue("Unsupported connection profile store schema \(envelope.schemaVersion).")
                }
                let values = try validateStoredProfiles(envelope.profiles)
                if envelope.schemaVersion < iosConnectionProfilesSchemaVersion { try persist(values) }
                return sorted(values)
            }
            // The pre-v4 private store was a raw array. Treat that exact shape as
            // known schema v1, validate it fully, then atomically rewrite v4.
            let values = try validateStoredProfiles(decoder.decode([IOSConnectionProfileRecord].self, from: data))
            try persist(values)
            return sorted(values)
        }

        guard let legacy = UserDefaults.standard.data(forKey: iosConnectionProfilesKey) else { return [] }
        guard !legacy.isEmpty, legacy.count <= iosConnectionProfilesMaximumBytes else {
            throw issue("Legacy connection profile store has an invalid size.")
        }
        let values = try validateStoredProfiles(decoder.decode([IOSConnectionProfileRecord].self, from: legacy))
        try persist(values)
        UserDefaults.standard.removeObject(forKey: iosConnectionProfilesKey)
        return sorted(values)
    }'''
          pattern = r'    private static func loadAll\(\) throws -> \[IOSConnectionProfileRecord\] \{.*?\n    \}\n\n    static func snapshot'
          s, count = re.subn(pattern, new_load + '\n\n    static func snapshot', s, count=1, flags=re.S)
          assert count == 1, count
          old_persist = '''    private static func persist(_ values: [IOSConnectionProfileRecord]) throws {
        guard values.count <= 64 else { throw issue("Connection profile limit exceeded.") }
        let data = try JSONEncoder().encode(values)
        try IOSPrivateJSONStore.write(
            data,
            filename: iosConnectionProfilesFile,
            maximumBytes: iosConnectionProfilesMaximumBytes
        )
    }
'''
          new_persist = '''    private static func persist(_ values: [IOSConnectionProfileRecord]) throws {
        let validated = try validateStoredProfiles(values)
        let envelope = IOSConnectionProfileEnvelope(schemaVersion: iosConnectionProfilesSchemaVersion, profiles: validated)
        let data = try JSONEncoder().encode(envelope)
        try IOSPrivateJSONStore.write(
            data,
            filename: iosConnectionProfilesFile,
            maximumBytes: iosConnectionProfilesMaximumBytes
        )
    }

    private static func validateStoredProfiles(_ values: [IOSConnectionProfileRecord]) throws -> [IOSConnectionProfileRecord] {
        guard values.count <= 64 else { throw issue("Connection profile limit exceeded.") }
        var ids = Set<String>()
        for value in values {
            _ = try cleanName(value.name)
            guard !value.id.isEmpty, value.id.count <= 128, ids.insert(value.id).inserted else {
                throw issue("Connection profile store contains an invalid or duplicate id.")
            }
            guard (value.nodeKind == "router-vpn" || value.nodeKind == "external"),
                  !value.nodeID.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty else {
                throw issue("Connection profile store contains an invalid node reference.")
            }
            _ = try normalizeLayers(value.customLayers)
            if value.nodeKind == "router-vpn", value.preferences == nil {
                throw issue("Router connection profile is missing its non-secret preference snapshot.")
            }
        }
        return values
    }

    private static func sorted(_ values: [IOSConnectionProfileRecord]) -> [IOSConnectionProfileRecord] {
        values.sorted { $0.name.localizedCaseInsensitiveCompare($1.name) == .orderedAscending }
    }
'''
          assert s.count(old_persist) == 1, s.count(old_persist)
          s = s.replace(old_persist, new_persist)
          p.write_text(s)
          PY
          git add ios/RouterVPN/App/IOSConnectionProfilesView.swift
          git commit -m "Migrate iOS connection profiles to schema v4"
          git push origin HEAD:main
