name: macOS native app

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/macos/**'
      - 'deploy/package-macos-native.sh'
      - 'deploy/materialize-desktop-icons.py'
      - 'cmd/client/**'
      - 'cmd/dnsproxy/**'
      - 'internal/common/**'
      - 'modes/**'
      - 'client/**'
      - 'configs/client/**'
      - 'deploy/check-generic-package-secrets.py'
      - '.github/workflows/macos-native-app.yml'
  push:
    branches: [main]
    paths:
      - 'client/macos/**'
      - 'deploy/package-macos-native.sh'
      - 'deploy/materialize-desktop-icons.py'
      - 'cmd/client/**'
      - 'cmd/dnsproxy/**'
      - 'internal/common/**'
      - 'modes/**'
      - 'client/**'
      - 'configs/client/**'
      - 'deploy/check-generic-package-secrets.py'
      - '.github/workflows/macos-native-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-macos:
    name: Native AppKit packages amd64 + arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Use canonical macOS temp root
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Desktop icon generator self-test
        run: python3 deploy/materialize-desktop-icons.py --self-test
      - name: Test controller and shared contracts
        run: go test ./cmd/client ./internal/common
      - name: Build native macOS packages
        run: |
          chmod +x client/macos/build-native-app.sh deploy/package-macos-native.sh
          ./deploy/package-macos-native.sh
      - name: Verify native AppKit package contract and signatures
        run: |
          for arch in amd64 arm64; do
            archive="dist/macos-native/RouterVPN-darwin-$arch.tar.gz"
            test -s "$archive"
            members="$RUNNER_TEMP/macos-$arch-members.txt"
            tar -tzf "$archive" > "$members"
            grep -Fxq "RouterVPN-darwin-$arch/RouterVPN.app/Contents/MacOS/RouterVPN" "$members"
            grep -Fxq "RouterVPN-darwin-$arch/RouterVPN.app/Contents/Resources/RouterVPN.icns" "$members"
            grep -Fxq "RouterVPN-darwin-$arch/RouterVPN.app/Contents/Info.plist" "$members"
            grep -Fxq "RouterVPN-darwin-$arch/LICENSE" "$members"
            ! grep -Fq 'router-vpn-bundle.json' "$members"
            inspect="$RUNNER_TEMP/macos-$arch-inspect"
            rm -rf "$inspect"
            mkdir -p "$inspect"
            tar -xzf "$archive" -C "$inspect"
            root="$inspect/RouterVPN-darwin-$arch"
            app="$root/RouterVPN.app"
            plist="$app/Contents/Info.plist"
            icon="$app/Contents/Resources/RouterVPN.icns"
            test -s "$icon"
            test "$(plutil -extract CFBundleIconFile raw -o - "$plist")" = 'RouterVPN'
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --verify --strict --verbose=2 "$root/router-vpn-client"
            codesign --verify --strict --verbose=2 "$root/router-vpn-dns"
            signature="$RUNNER_TEMP/macos-$arch-codesign.txt"
            codesign -dv --verbose=2 "$app" >"$signature" 2>&1
            grep -Eq 'Signature=adhoc|Authority=Developer ID Application' "$signature"
          done
          (cd dist/macos-native && shasum -a 256 -c SHA256SUMS)
          test ! -d dist/macos-native/work
          grep -Fq 'NSWindow(' client/macos/RouterVPNMacNative.swift
          grep -Fq 'NSTabViewController' client/macos/RouterVPNMacNative.swift
          grep -Fq 'http://127.0.0.1:8788' client/macos/RouterVPNMacNative.swift
          ! grep -Eq 'import[[:space:]]+WebKit|WKWebView|SFSafariViewController' client/macos/RouterVPNMacNative.swift
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-macOS-Native-CI
          path: |
            dist/macos-native/RouterVPN-darwin-amd64.tar.gz
            dist/macos-native/RouterVPN-darwin-arm64.tar.gz
            dist/macos-native/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
