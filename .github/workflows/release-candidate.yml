name: Router VPN release candidate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}-${{ github.sha }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  macos-owned-controller:
    name: Native macOS controller ownership on both architectures
    uses: ./.github/workflows/macos-native-installer-contract.yml

  native-runtimes:
    name: Build and verify complete native runtimes
    uses: ./.github/workflows/desktop-native-runtime.yml
    with:
      platform: all

  source-audit:
    name: Source security and release-gap audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Universal source syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.py' -not -path './.git/*' -print0 | xargs -0 python3 -m py_compile
          find modes server client deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Go source contracts
        run: go test ./...
      - name: Android graph integration dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Repository and current-product contracts
        run: |
          python3 deploy/validate-repo.py
          python3 deploy/test_native_runtime_delivery.py
          python3 deploy/test_linux_runtime_install.py
          python3 deploy/test_desktop_native_toolchain.py
          python3 deploy/test_desktop_native_dependencies.py
          python3 deploy/test_desktop_pq_output.py
          python3 deploy/test_desktop_pq_dependencies.py
          python3 deploy/test_desktop_bindgen.py
          python3 deploy/test_mobile_tor_module_graph.py
          python3 deploy/test_mobile_tor_source_closure.py
          python3 deploy/test_multihop_execution.py
          python3 deploy/test_native_hop_measurement.py
          python3 deploy/test_mobile_lan_policy.py
          python3 deploy/test_mobile_performance_shipping.py
          python3 deploy/test_bundled_xray.py
          python3 modes/test_runtime_pid_registration.py
          python3 deploy/test_desktop_tor_unix_wrapper.py
          python3 modes/test_cleanup_private_runtime.py
          python3 deploy/full-audit-v4.py
          python3 deploy/release-gap-audit.py
          python3 deploy/product-parity-audit.py
          python3 deploy/profile-settings-audit.py
          python3 deploy/native-auto-requirements-ui-audit.py
          python3 deploy/native-session-mutation-audit.py
          python3 deploy/backend-session-transaction-audit.py
          python3 deploy/profile-schema-shipping-audit.py
          python3 deploy/linux-full-profile-shipping-audit.py
          python3 deploy/native-download-policy-audit.py
          python3 deploy/native-artifact-workflow-parity-audit.py
          python3 deploy/workflow-structure-audit.py
          python3 deploy/reusable-workflow-concurrency-audit.py
          python3 deploy/workflow-evidence-pipeline-audit.py
          python3 deploy/server-image-dependency-audit.py
          python3 deploy/setup-center-publication-audit.py
          python3 deploy/production-install-state-audit.py
          python3 deploy/profile-readiness-marker-audit.py
          python3 deploy/test_source_provenance.py
          python3 deploy/test-release-candidate-provenance.py
          python3 deploy/test_windows_release_gates.py
          python3 deploy/private-bundle-boundary-audit.py
          python3 deploy/docker-cleanup-safety-audit.py
          python3 deploy/router-forwarding-audit.py
          python3 deploy/test_router_forwarding_fail_open.py
          python3 deploy/release-orchestration-audit.py
          python3 deploy/test_live_release_evidence.py
          python3 deploy/recovered-release-audit-v3.py
          python3 deploy/historical-regression-audit.py
          python3 deploy/recovered-corrections-audit.py
          python3 deploy/recovered-requirements-1-264-audit.py
          python3 deploy/recovered-requirements-265-311-audit.py
          python3 deploy/recovered-addendum-312-356-audit.py
          python3 deploy/latest-a20-product-contract-audit.py
          python3 deploy/binding-edge-requirements-audit.py
          python3 deploy/daita-safety-audit.py
          python3 modes/test_smart_auto_rollback.py
          python3 deploy/test-killswitch-transition-contract.py
          python3 deploy/test_macos_killswitch_contract.py
          python3 modes/test_kill_switch.py
          python3 modes/test_mtu_policy.py
          python3 modes/test_multihop.py
          python3 deploy/test-router-local-package-fallback.py
          python3 deploy/test-production-release-compose.py
          python3 server/finalize/test_sync_endpoint.py
          python3 server/scripts/test_preserve_generated_state.py
          python3 server/scripts/test_native_artifact_policy.py
          python3 server/scripts/test_mobile_artifact_provenance.py
          python3 server/scripts/test_download_broker_exact_sha.py
          python3 server/scripts/test_setup_auth.py
          python3 server/scripts/test_broker_security.py
          python3 server/scripts/test_download_jobs.py
          python3 server/scripts/test_download_safety.py
          python3 server/scripts/test_setup_center_release.py
          python3 server/scripts/test_setup_center_update.py
          python3 server/scripts/test_setup_imports.py
          python3 server/scripts/test_setup_center_server.py
          python3 server/scripts/test_setup_center_server_control.py
          python3 server/scripts/test_setup_center_requirement_349.py
          python3 server/scripts/test_setup_center_router_onboarding.py
          python3 server/scripts/test_setup_center_verified_onboarding.py
          python3 client/test_native_onboarding_contract.py
          python3 android/test_android_runtime_contract.py
          python3 android/test_android_multihop_contract.py
          python3 android/test_android_multihop_graph.py
          python3 android/test_android_pq_selection.py
          python3 android/test_android_max_selection.py
          python3 android/test_android_naive_multihop.py
          python3 android/test_android_session_identity_contract.py
          python3 android/test_android_native_policy_contract.py
          python3 android/test_android_standard_exit_contract.py
          python3 android/test_android_connection_profiles_contract.py
          python3 android/test_android_via_entry_latency_contract.py
          python3 modes/test_profile_id_safety.py
      - name: Weighted source/manual release accounting
        run: |
          python3 deploy/weighted-release-audit.py > "$RUNNER_TEMP/weighted.json"
          python3 - "$RUNNER_TEMP/weighted.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['source_weight']==88.0 and r['manual_live_weight']==12.0, r
          assert r['source_score_percent']==100.0, r
          print('weighted full release score',r['score_percent'],'source completion',r['source_score_percent'])
          PY
      - name: Setup Center onboarding and AI Help contracts
        run: |
          python3 server/scripts/test_ai_help_provider.py
          python3 server/scripts/test_setup_center_ai.py
          python3 server/scripts/test_setup_center_guide.py
          python3 server/scripts/test_setup_center_ux_patch.py
          python3 server/scripts/test_setup_center_entrypoint.py
          python3 server/scripts/test_setup_center_server_control.py
          sh -n server/scripts/run-setup-center.sh
          sh -n server/scripts/configure-ai-help.sh

  paired-openvpn:
    name: Paired native OpenVPN encrypted paths and lease ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Execute both native owners, Start Layers and replay controls
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="$RUNNER_TEMP/routervpn-paired-openvpn"
          git init -q "$VENDOR"
          git -C "$VENDOR" remote add origin https://github.com/SagerNet/sing-box.git
          git -C "$VENDOR" fetch --depth=1 origin 1ac1a339cb1223e9c70eae14c44411c75033c02d
          git -C "$VENDOR" checkout --detach FETCH_HEAD
          python3 deploy/test_external_openvpn_native.py --core "$VENDOR" 2>&1 | tee "$RUNNER_TEMP/paired-openvpn.log"
          python3 deploy/test_external_openvpn_remote_native.py --core "$VENDOR" 2>&1 | tee -a "$RUNNER_TEMP/paired-openvpn.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-openvpn-${{ github.sha }}
          path: ${{ runner.temp }}/paired-openvpn.log
          retention-days: 1

  generic-builds:
    needs: native-runtimes
    name: Generic desktop and Windows packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: RouterVPN-native-runtime-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifacts
          merge-multiple: true
      - name: Build and package generic clients
        run: |
          chmod +x deploy/build-client.sh deploy/package-builds.sh
          ./deploy/build-client.sh
          python3 deploy/native-runtime-bundle.py stage "$RUNNER_TEMP/native-runtime-artifacts" dist/native-runtime linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
          ./deploy/package-builds.sh
          (cd dist/packages && sha256sum -c SHA256SUMS)
          bash deploy/scope-windows-release-candidate.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-generic-release-candidate
          path: |
            dist/packages/*
          if-no-files-found: error
          retention-days: 1

  windows-native-smoke:
    name: Windows native + Portable ${{ matrix.arch }}
    needs: generic-builds
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: windows-latest}
          - {arch: arm64, runner: windows-11-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Native workspace deletion and captured Tor child cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep every existing test and its deadlines. The growing lifecycle
          # matrices must not consume one shared package timeout.
          $scopes = @(
            @{ Run = '^TestDesktopRuntimeWorkspace'; Skip = '' },
            @{ Run = '^TestDesktopDNS'; Skip = '' },
            @{ Run = '^TestDesktopTorMTU'; Skip = '' },
            @{ Run = '^TestDesktopTor'; Skip = '^TestDesktopTorMTU' },
            @{ Run = '^TestSpeedLab'; Skip = '' }
          )
          foreach ($scope in $scopes) {
            $arguments = @('test', '-v', '-count=1', '-timeout=180s', './cmd/client', '-run', $scope.Run)
            if ($scope.Skip) { $arguments += @('-skip', $scope.Skip) }
            & go @arguments
            if ($LASTEXITCODE -ne 0) { throw "Windows captured workspace or Tor child cleanup failed: $($scope.Run)" }
          }
      - name: Verify native Windows Tor host compatibility API
        shell: pwsh
        env: {ROUTER_VPN_REQUIRE_TOR_HELPERS: '1'}
        run: go test -v -run '^TestWindowsTor(ArchitecturePolicy|HostCompatibilityNative)$' ./cmd/client
      - uses: actions/download-artifact@v4
        with: {name: RouterVPN-generic-release-candidate, path: artifacts}
      - name: Execute Portable native WPF self-test and relocation
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'; $arch=$env:ROUTER_VPN_ARCH
          $archive=(Get-ChildItem artifacts -Recurse -Filter "RouterVPN-Portable-Windows-$arch.zip"|Select-Object -First 1).FullName
          if(-not $archive){throw "Missing Portable $arch package"}
          $extract=Join-Path $env:RUNNER_TEMP "portable-$arch"; Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue; Expand-Archive $archive $extract -Force
          $root=Get-ChildItem $extract -Directory|Select-Object -First 1; $exe=Join-Path $root.FullName 'RouterVPNPortable.exe'
          $p=Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru; if($p.ExitCode-ne 0){$diag=Join-Path $root.FullName 'Data\self-test-error.txt';$detail=if(Test-Path $diag){(Get-Content $diag -Raw).Trim()}else{'no diagnostic file'};throw "Portable self-test failed: $($p.ExitCode): $detail"}
          foreach($rel in @('Data\client.json','Data\routers.json','Data\modes.windows.json','Data\logical-modes.json','Data\windows-runtime.json')){if(-not(Test-Path(Join-Path $root.FullName $rel))){throw "Missing $rel"}}
          try{Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8788/api/status' -TimeoutSec 1|Out-Null;throw 'controller remained alive'}catch{if($_.Exception.Message-eq'controller remained alive'){throw}}
          $movedParent=Join-Path $env:RUNNER_TEMP "portable-moved-$arch"; New-Item -ItemType Directory -Force $movedParent|Out-Null; $moved=Join-Path $movedParent $root.Name; Move-Item $root.FullName $moved
          $p2=Start-Process (Join-Path $moved 'RouterVPNPortable.exe') -ArgumentList '--self-test' -Wait -PassThru; if($p2.ExitCode-ne 0){$diag=Join-Path $moved 'Data\self-test-error.txt';$detail=if(Test-Path $diag){(Get-Content $diag -Raw).Trim()}else{'no diagnostic file'};throw "Relocated Portable self-test failed: $($p2.ExitCode): $detail"}
      - name: Verify installed package native entrypoint
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'
          $arch=$env:ROUTER_VPN_ARCH; $archive=(Get-ChildItem artifacts -Recurse -Filter "RouterVPN-Windows-$arch.zip"|Select-Object -First 1).FullName
          $extract=Join-Path $env:RUNNER_TEMP "installed-$arch"; Expand-Archive $archive $extract -Force; $root=Get-ChildItem $extract -Directory|Select-Object -First 1; $start=Get-Content (Join-Path $root.FullName 'Start-RouterVPN.ps1') -Raw
          if($start-notmatch'RouterVPN-Windows-App\.ps1'){throw 'installed package not native WPF'}; if($start-match'msedge\.exe|chrome\.exe|--app='){throw 'browser shell regression'}
          $killTest=Join-Path $root.FullName 'client\test-windows-kill-switch.ps1'; if(-not(Test-Path $killTest)){throw 'shipped Windows package missing kill-switch contract test'}; & $killTest; $privateStateTest=Join-Path $root.FullName 'client\test-private-router-vpn-state.ps1'; if(-not(Test-Path $privateStateTest)){throw 'shipped Windows package missing private profile-store contract test'}; & $privateStateTest
          $asyncTest=Join-Path $root.FullName 'client\test-windows-async-actions.ps1'
          if(-not(Test-Path -LiteralPath $asyncTest)){throw 'shipped Windows package missing async lifecycle regression tests'}
          & $asyncTest -Root $root.FullName
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $asyncTest -Root $root.FullName
          if($LASTEXITCODE -ne 0){throw 'Windows PowerShell 5.1 packaged async lifecycle tests failed'}
          $runtimeTest=Join-Path $root.FullName 'client\test-windows-runtime-install.ps1'
          & $runtimeTest -SourceRoot $root.FullName
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runtimeTest -SourceRoot $root.FullName
          if($LASTEXITCODE -ne 0){throw 'Windows PowerShell 5.1 runtime installation fixture failed'}
          & (Join-Path $root.FullName 'client\test-windows-installed-runtimes.ps1') -PackageRoot $root.FullName -ExpectedArchitecture $arch
      - name: Execute packaged device and DNS ownership gates
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'; $arch=$env:ROUTER_VPN_ARCH
          $installed=Join-Path $env:RUNNER_TEMP "installed-$arch"
          $roots=@(Get-ChildItem -LiteralPath $installed -Directory)
          if($roots.Count -ne 1){throw 'Expected exactly one extracted Windows release package'}
          foreach($shell in @('pwsh','powershell.exe')){
            python deploy/test_windows_release_gates.py --package-root $roots[0].FullName --shell $shell
            if($LASTEXITCODE -ne 0){throw "Packaged Windows $arch device/DNS gates failed in $shell"}
          }
      - name: Execute packaged suspended-process Job ownership
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'; $arch=$env:ROUTER_VPN_ARCH
          $installed=Join-Path $env:RUNNER_TEMP "installed-$arch"
          $roots=@(Get-ChildItem -LiteralPath $installed -Directory)
          if($roots.Count -ne 1){throw 'Expected exactly one extracted Windows release package'}
          $test=Join-Path $roots[0].FullName 'client/test-windows-private-job.ps1'
          if(-not(Test-Path -LiteralPath $test -PathType Leaf)){throw 'Shipped Windows package lacks its suspended-process Job test'}
          foreach($shell in @('pwsh','powershell.exe')){
            & $shell -NoProfile -ExecutionPolicy Bypass -File $test -SourceRoot $roots[0].FullName
            if($LASTEXITCODE -ne 0){throw "Packaged Windows $arch suspended-process Job tests failed in $shell"}
          }
      - name: Execute packaged Windows WFP enforcement
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'; $arch=$env:ROUTER_VPN_ARCH
          $installed=Join-Path $env:RUNNER_TEMP "installed-$arch"
          $roots=@(Get-ChildItem -LiteralPath $installed -Directory)
          if($roots.Count -ne 1){throw 'Expected exactly one extracted Windows release package'}
          $test=Join-Path $roots[0].FullName 'client/test-windows-wfp.ps1'
          if(-not(Test-Path -LiteralPath $test -PathType Leaf)){throw 'Shipped Windows package lacks its WFP enforcement test'}
          foreach($shell in @('pwsh','powershell.exe')){
            & $shell -NoProfile -ExecutionPolicy Bypass -File $test -SourceRoot $roots[0].FullName
            if($LASTEXITCODE -ne 0){throw "Packaged Windows $arch WFP kernel enforcement failed in $shell"}
          }
      - name: Execute packaged owned Windows protection adapter
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'; $arch=$env:ROUTER_VPN_ARCH
          $installed=Join-Path $env:RUNNER_TEMP "installed-$arch"
          $roots=@(Get-ChildItem -LiteralPath $installed -Directory)
          if($roots.Count -ne 1){throw 'Expected exactly one extracted Windows release package'}
          $relocated=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP "portable-moved-$arch") -Directory)
          if($relocated.Count -ne 1){throw 'Expected exactly one relocated Portable release package'}
          $packages=@($roots[0].FullName,(Join-Path $relocated[0].FullName 'App/RouterVPN'))
          foreach($package in $packages){
            foreach($name in @('test-windows-owned-protection.ps1','test-windows-protection-dispatch.ps1')){
              $test=Join-Path $package ('client/'+$name)
              if(-not(Test-Path -LiteralPath $test -PathType Leaf)){throw "Shipped Windows package lacks its owned protection fixture: $name"}
              foreach($shell in @('pwsh','powershell.exe')){
                & $shell -NoProfile -ExecutionPolicy Bypass -File $test
                if($LASTEXITCODE -ne 0){throw "Packaged Windows $arch $name failed in $shell at $package"}
              }
            }
          }
      - name: Execute packaged Tor wrapper lifecycle
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'; $arch=$env:ROUTER_VPN_ARCH
          $installed=Join-Path $env:RUNNER_TEMP "installed-$arch"
          $roots=@(Get-ChildItem -LiteralPath $installed -Directory)
          if($roots.Count -ne 1){throw 'Expected exactly one extracted Windows release package'}
          $test=Join-Path $roots[0].FullName 'client/test-windows-tor-wrapper-lifecycle.ps1'
          if(-not(Test-Path -LiteralPath $test -PathType Leaf)){throw 'Shipped Windows package lacks its Tor wrapper lifecycle test'}
          foreach($shell in @('pwsh','powershell.exe')){
            & $shell -NoProfile -ExecutionPolicy Bypass -File $test -SourceRoot $roots[0].FullName
            if($LASTEXITCODE -ne 0){throw "Packaged Windows $arch Tor wrapper lifecycle tests failed in $shell"}
          }
      - name: Execute shipped Tor helpers on the actual Windows architecture
        shell: pwsh
        env: {ROUTER_VPN_ARCH: '${{ matrix.arch }}'}
        run: |
          $ErrorActionPreference='Stop'; $arch=$env:ROUTER_VPN_ARCH
          $installed=Join-Path $env:RUNNER_TEMP "installed-$arch"
          $root=Get-ChildItem -LiteralPath $installed -Directory|Select-Object -First 1
          $test=Join-Path $root.FullName 'client\test-windows-tor-compatibility.ps1'
          if(-not(Test-Path -LiteralPath $test)){throw 'Shipped Windows package lacks Tor compatibility test'}
          & $test -SourceRoot $root.FullName -ExpectedArchitecture $arch

  android:
    name: Android native APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.5.0'}
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Android graph integration dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Exercise production signing and upgrade version contract with a disposable key
        run: python3 android/test_android_signing.py --gradle gradle --sdk "$ANDROID_HOME" -v
      - name: Runtime contracts and APK
        run: |
          sudo apt-get install -y --no-install-recommends build-essential autoconf automake libtool pkg-config perl patch
          python3 android/test_android_runtime_contract.py
          python3 android/test_android_multihop_contract.py
          python3 android/test_android_multihop_graph.py
          python3 android/test_android_pq_selection.py
          python3 android/test_android_max_selection.py
          python3 android/test_android_naive_multihop.py
          python3 android/test_android_session_identity_contract.py
          python3 android/test_android_native_policy_contract.py
          python3 android/test_android_standard_exit_contract.py
          python3 android/test_android_connection_profiles_contract.py
          python3 android/test_android_via_entry_latency_contract.py
      - name: Build and verify the configured Android delivery
        env:
          ROUTERVPN_ANDROID_KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && secrets.ROUTERVPN_ANDROID_KEYSTORE_BASE64 || '' }}
          ROUTERVPN_ANDROID_STORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ROUTERVPN_ANDROID_STORE_PASSWORD || '' }}
          ROUTERVPN_ANDROID_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.ROUTERVPN_ANDROID_KEY_ALIAS || '' }}
          ROUTERVPN_ANDROID_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ROUTERVPN_ANDROID_KEY_PASSWORD || '' }}
          ROUTERVPN_ANDROID_CERT_SHA256: ${{ github.ref == 'refs/heads/main' && vars.ROUTERVPN_ANDROID_CERT_SHA256 || '' }}
          ROUTERVPN_ANDROID_REQUIRE_PRODUCTION: ${{ github.ref == 'refs/heads/main' && vars.ROUTERVPN_ANDROID_REQUIRE_PRODUCTION || '' }}
        run: python3 android/build-delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Android-release-candidate
          path: |
            android/app/build/outputs/routervpn/app-debug.apk
            android/app/build/outputs/routervpn/android-delivery.json
          if-no-files-found: error
          retention-days: 1

  ios:
    name: iOS/iPadOS real WireGuard + Libbox PacketTunnel
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Run iOS/iPadOS source contracts
        working-directory: ios/RouterVPN
        run: |
          python3 test_dns_policy_contract.py
          python3 test_libbox_bridge_contract.py
          python3 test_libbox_build_contract.py
          python3 test_libbox_link_contract.py
          python3 test_packet_tunnel_libbox_contract.py
          python3 test_runtime_selection_contract.py
          python3 ../../deploy/test_ios_speed_lab_http_boundary.py
          python3 ../../deploy/test_ios_physical_path.py
          python3 ../../deploy/test_ios_pq_selection.py
          python3 ../../deploy/test_ios_max_selection.py
          python3 ../../deploy/test_ios_max_multihop.py
          python3 ../../deploy/test_ios_composite_multihop.py
          python3 ../../deploy/test_ios_composite_multihop_pinned_contract.py
          python3 ../../deploy/test_ios_tor_profile.py
          python3 ../../deploy/test_ios_tor_server_profile.py
          python3 ../../deploy/test_ios_tor_compare.py
          python3 ../../deploy/test_ios_mtu_client.py
          python3 ../../deploy/test_ios_libbox_delivery.py
          python3 ../../deploy/test_ios_naive_multihop.py
      - name: Install XcodeGen
        run: |
          brew install xcodegen autoconf automake libtool pkg-config
          python3 deploy/test_ios_provenance_order.py --native
      - name: Prepare exact pinned WireGuardKit
        working-directory: ios/RouterVPN
        run: sh prepare-wireguard-kit.sh
      - name: Prepare exact pinned Libbox before Xcode resolves the framework
        working-directory: ios/RouterVPN
        run: ./prepare-libbox.sh
      - name: Generate and build unsigned native app
        working-directory: ios/RouterVPN
        run: |
          xcodegen generate
          xcodebuild -project RouterVPN.xcodeproj -scheme RouterVPN -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$PWD/build/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM='' ROUTER_VPN_SOURCE_SHA="$GITHUB_SHA" INFOPLIST_KEY_RouterVPNSourceSHA="$GITHUB_SHA" build
      - name: Verify pinned engines and package IPA
        working-directory: ios/RouterVPN
        run: |
          APP="$PWD/build/DerivedData/Build/Products/Release-iphoneos/RouterVPN.app"; EXT="$APP/PlugIns/RouterVPNPacketTunnel.appex"; WG="$PWD/.deps/wireguard-apple"; IPA="$PWD/build/RouterVPN-native-unsigned-resignable.ipa"
          test -d "$EXT" || { echo "::error::PacketTunnel extension is missing"; exit 1; }
          test "$(git -C "$WG" rev-parse HEAD)" = '9d5ee60edefa95b933a738dd7cda671dd18021fc' || { echo "::error::WireGuardKit commit pin mismatch"; exit 1; }
          test "$(sed -n '1p' "$WG/Package.swift")" = '// swift-tools-version:5.5' || { echo "::error::WireGuardKit Package.swift toolchain contract changed"; exit 1; }
          test "$(cat .deps/wireguard-apple.pin)" = '9d5ee60edefa95b933a738dd7cda671dd18021fc' || { echo "::error::WireGuardKit recorded pin mismatch"; exit 1; }
          test -s "$PWD/build/DerivedData/Build/Products/Release-iphoneos/libwg-go.a" || { echo "::error::libwg-go.a is missing"; exit 1; }
          test "$(plutil -extract RouterVPNSourceSHA raw -o - "$APP/Info.plist")" = "$GITHUB_SHA" || { echo "::error::iOS app source SHA mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNSourceRepository raw -o - "$APP/Info.plist")" = 'Eabusham2/router-vpn' || { echo "::error::iOS app source repository mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNArtifactFamily raw -o - "$APP/Info.plist")" = 'ios-app' || { echo "::error::iOS app artifact family mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNSourceSHA raw -o - "$EXT/Info.plist")" = "$GITHUB_SHA" || { echo "::error::iOS PacketTunnel source SHA mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNSourceRepository raw -o - "$EXT/Info.plist")" = 'Eabusham2/router-vpn' || { echo "::error::iOS PacketTunnel source repository mismatch"; exit 1; }
          test "$(plutil -extract RouterVPNArtifactFamily raw -o - "$EXT/Info.plist")" = 'ios-packet-tunnel' || { echo "::error::iOS PacketTunnel artifact family mismatch"; exit 1; }
          test -d .deps/Libbox.xcframework || { echo "::error::Libbox.xcframework is missing"; exit 1; }
          test -s .deps/libbox-LICENSE.txt || { echo "::error::Libbox license is missing"; exit 1; }
          grep -Fq '1.14.1+1ac1a339cb1223e9c70eae14c44411c75033c02d+go1.26.3+0.1.12+ios,iossimulator' .deps/Libbox.xcframework.pin || { echo "::error::Libbox exact pin mismatch"; exit 1; }
          for marker in 'WireGuardAdapter(with: self)' 'startLibbox' 'RouterVPNLibboxEngine' 'body["node_id"] as? String == expectedNodeID' 'body["proof"] as? String == Self.proofKind'; do grep -Fq "$marker" PacketTunnel/PacketTunnelProvider.swift || { echo "::error::PacketTunnel source contract missing: $marker"; exit 1; }; done
          rm -rf build/unsigned; mkdir -p build/unsigned/Payload; ditto "$APP" build/unsigned/Payload/RouterVPN.app; (cd build/unsigned && zip -qry ../RouterVPN-native-unsigned-resignable.ipa Payload); unzip -tq "$IPA" >/dev/null
          python3 ../../server/scripts/mobile-artifact-provenance.py --name router-vpn-ios.ipa --path "$IPA" --sha "$GITHUB_SHA" --repo Eabusham2/router-vpn
      - uses: actions/upload-artifact@v4
        with: {name: RouterVPN-iOS-release-candidate, path: ios/RouterVPN/build/RouterVPN-native-unsigned-resignable.ipa, if-no-files-found: error, retention-days: 1}

  macos:
    needs: [native-runtimes, macos-owned-controller]
    name: macOS native AppKit amd64 + arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: RouterVPN-native-runtime-darwin-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifacts
          merge-multiple: true
      - name: Verify and stage exact native runtime payloads
        shell: bash
        run: python3 deploy/native-runtime-bundle.py stage "$RUNNER_TEMP/native-runtime-artifacts" dist/native-runtime darwin/amd64 darwin/arm64
      - name: Build native macOS packages
        run: |
          chmod +x client/macos/build-native-app.sh deploy/package-macos-native.sh
          ./deploy/package-macos-native.sh
          (cd dist/macos-native && shasum -a 256 -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-macOS-release-candidate
          path: |
            dist/macos-native/RouterVPN-darwin-amd64.tar.gz
            dist/macos-native/RouterVPN-darwin-arm64.tar.gz
            dist/macos-native/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  linux:
    needs: native-runtimes
    name: Linux native GTK ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.3', cache: false}
      - name: Install GTK native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libcurl4-openssl-dev libjson-glib-dev pkg-config file xvfb xauth binutils
      - uses: actions/download-artifact@v4
        with:
          pattern: RouterVPN-native-runtime-linux-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-runtime-artifacts
          merge-multiple: true
      - name: Verify and stage exact native runtime payloads
        shell: bash
        run: python3 deploy/native-runtime-bundle.py stage "$RUNNER_TEMP/native-runtime-artifacts" dist/native-runtime linux/${{ matrix.arch }}
      - name: Build native Linux package
        run: |
          chmod +x client/linux/build-native-app.sh deploy/package-linux-native.sh
          ./deploy/package-linux-native.sh '${{ matrix.arch }}'
          (cd dist/linux-native && sha256sum -c "RouterVPN-linux-${{ matrix.arch }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-Linux-${{ matrix.arch }}-release-candidate
          path: |
            dist/linux-native/RouterVPN-linux-${{ matrix.arch }}.tar.gz
            dist/linux-native/RouterVPN-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 1

  aggregate:
    name: Aggregate one-SHA native release candidate
    needs: [source-audit, paired-openvpn, generic-builds, windows-native-smoke, android, ios, macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {pattern: '*-release-candidate', path: dist/release-candidate, merge-multiple: false}
      - name: Manifest and verify artifact tree
        run: |
          python3 deploy/verify-release-candidate-provenance.py dist/release-candidate --sha "$GITHUB_SHA"
          (cd dist && find release-candidate -type f -print | sort)
          (cd dist && find release-candidate -type f -print0 | sort -z | xargs -0 sha256sum > RELEASE-CANDIDATE-SHA256SUMS)
          test -s dist/RELEASE-CANDIDATE-SHA256SUMS
          (cd dist && sha256sum -c RELEASE-CANDIDATE-SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: RouterVPN-release-candidate-${{ github.sha }}
          path: |
            dist/release-candidate/**
            dist/RELEASE-CANDIDATE-SHA256SUMS
          if-no-files-found: error
          retention-days: 1
