name: One-shot RC source repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-rc-source-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Windows source repair to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path

          for rel, func in (
              ('client/RouterVPN-Windows-UnifiedShell.ps1', 'Add-RouterVPNUnifiedWindowsShell'),
              ('client/RouterVPN-Windows-Telemetry.ps1', 'Add-RouterVPNTelemetryWindowsShell'),
          ):
              path = Path(rel)
              text = path.read_text(encoding='utf-8')
              top = 'Set-StrictMode -Version Latest\n\n'
              if text.startswith(top):
                  text = text[len(top):]
              seam = f'function {func} {{\n'
              local = seam + '    Set-StrictMode -Version Latest\n'
              if local not in text:
                  if seam not in text:
                      raise SystemExit(f'{rel}: transform function seam missing')
                  text = text.replace(seam, local, 1)
              path.write_text(text, encoding='utf-8')

          # Temporary diagnostics are not part of the product.
          diag = Path('.github/workflows/rc-failure-diagnostic.yml')
          if diag.exists():
              diag.unlink()

          # This workflow is one-shot; remove it in the repair commit.
          me = Path('.github/workflows/one-shot-rc-source-repair.yml')
          if me.exists():
              me.unlink()
          PY

          python3 deploy/validate-repo.py
          go test ./cmd/portable-launcher ./cmd/windows-app-launcher

      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Router VPN CI Repair'
          git config user.email 'actions@github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Windows helper strict-mode scope'
          git pull --rebase origin main
          git push origin HEAD:main
