name: Final source hardening patch v2
on:
  push:
    paths:
      - .github/workflows/final-source-hardening-v2.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def one(label,path,old,new):
              p=Path(path); t=p.read_text(); n=t.count(old); print(label,n)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              p.write_text(t.replace(old,new,1))

          one('linux start cleanup','modes/run-multihop.sh','rm -rf "$RUN"\nmkdir -p "$RUN"','HOMEVPN_ROOT="$ROOT" python3 "$SCRIPT_DIR/cleanup-private-runtime.py" "$RUN"\nmkdir -p "$RUN"')
          one('linux teardown cleanup','modes/run-multihop.sh','    python3 "$SCRIPT_DIR/kill-switch.py" release >/dev/null 2>&1 || true\n  exit "$status"','    python3 "$SCRIPT_DIR/kill-switch.py" release >/dev/null 2>&1 || true\n  HOMEVPN_ROOT="$ROOT" python3 "$SCRIPT_DIR/cleanup-private-runtime.py" "$RUN" >/dev/null 2>&1 || true\n  exit "$status"')
          one('mac cleanup','client/native-multihop-darwin.sh','  stop_owned\n  release_guard\n}','  stop_owned\n  release_guard\n  HOMEVPN_ROOT="$ROOT" python3 "$ROOT/modes/cleanup-private-runtime.py" "$RUNTIME_DIR" >/dev/null 2>&1 || true\n}')
          one('win cleanup function','client/native-multihop-windows.ps1',"function Stop-Owned{if(Test-Path -LiteralPath $PidFile){$n=0;if([int]::TryParse((Get-Content -Raw -LiteralPath $PidFile).Trim(),[ref]$n)-and$n-gt 0){Stop-Process -Id $n -Force -ErrorAction SilentlyContinue};Remove-Item -LiteralPath $PidFile -Force -ErrorAction SilentlyContinue}}\nif($Action-eq'down'){Stop-Owned;try{Kill 'release'}catch{Write-Warning $_.Exception.Message};exit 0}","function Stop-Owned{if(Test-Path -LiteralPath $PidFile){$n=0;if([int]::TryParse((Get-Content -Raw -LiteralPath $PidFile).Trim(),[ref]$n)-and$n-gt 0){Stop-Process -Id $n -Force -ErrorAction SilentlyContinue};Remove-Item -LiteralPath $PidFile -Force -ErrorAction SilentlyContinue}}\nfunction Remove-PrivateRuntime{if(Test-Path -LiteralPath $RuntimeDir){[IO.Directory]::Delete($RuntimeDir,$true)}}\nif($Action-eq'down'){Stop-Owned;try{Kill 'release'}catch{Write-Warning $_.Exception.Message};Remove-PrivateRuntime;exit 0}")
          one('win finally cleanup','client/native-multihop-windows.ps1',"  try{Kill 'release'}catch{Write-Warning $_.Exception.Message}\n}","  try{Kill 'release'}catch{Write-Warning $_.Exception.Message}\n  Remove-PrivateRuntime\n}")

          old='  curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-${SB_ARCH}.tar.gz" | tar -xz -C "$TMP_SB"'
          new='''  SB_TGZ="$TMP_SB/sing-box.tar.gz"
          case "$SB_ARCH" in
            arm64) SB_SHA256=1ffa3b48ad6fa98f9fd810482e39bdd5b6157782ef11ce37d67bdcfd9338547a ;;
            amd64) SB_SHA256=1540533adb3df24f5ad5f14b5c7ca3dbc2401b10a1c1eb278fcadcada47ec6c4 ;;
            *) echo "Unsupported sing-box architecture: $SB_ARCH" >&2; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 -fL "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-${SB_ARCH}.tar.gz" -o "$SB_TGZ"
          printf '%s  %s\\n' "$SB_SHA256" "$SB_TGZ" | sha256sum -c -
          python3 - "$SB_TGZ" <<'PYARCHIVE'
          import pathlib,sys,tarfile
          p=pathlib.Path(sys.argv[1])
          if p.stat().st_size>256*1024*1024: raise SystemExit('archive too large')
          c=0; total=0
          with tarfile.open(p,'r:gz') as tf:
              for m in tf.getmembers():
                  c+=1; total+=max(0,m.size); q=pathlib.PurePosixPath(m.name)
                  if q.is_absolute() or '..' in q.parts: raise SystemExit('unsafe archive path')
                  if m.issym() or m.islnk() or m.isdev() or m.isfifo(): raise SystemExit('unsafe archive member')
                  if not (m.isdir() or m.isfile()): raise SystemExit('unsupported archive member')
                  if c>4096 or total>1024*1024*1024: raise SystemExit('archive expansion too large')
          PYARCHIVE
          tar --no-same-owner --no-same-permissions -xzf "$SB_TGZ" -C "$TMP_SB"'''
          new='\n'.join(x[10:] if x.startswith('          ') else x for x in new.splitlines())
          one('linux sing-box verify','client/install-linux.sh',old,new)
          one('linux rosenpass full sha','client/install-linux.sh','git checkout 00569eb && cargo build --release --bin rosenpass','git checkout 00569eb273016a10d2e75e5142236f06f7c3d4b3 && [[ $(git rev-parse HEAD) == 00569eb273016a10d2e75e5142236f06f7c3d4b3 ]] && cargo build --release --bin rosenpass')
          one('linux awg immutable','client/install-linux.sh','  git clone --branch v3.0.2 --depth 1 https://github.com/amnezia-vpn/amneziawg-go "$TMP/amneziawg-go"\n','  git clone --filter=blob:none --no-checkout https://github.com/amnezia-vpn/amneziawg-go "$TMP/amneziawg-go"\n  git -C "$TMP/amneziawg-go" fetch --depth=1 origin 0527dfa47639714dd8f5c9ffbd9d40d19083f0ba\n  git -C "$TMP/amneziawg-go" checkout --detach 0527dfa47639714dd8f5c9ffbd9d40d19083f0ba\n  [[ $(git -C "$TMP/amneziawg-go" rev-parse HEAD) == 0527dfa47639714dd8f5c9ffbd9d40d19083f0ba ]]\n')
          PY
          bash -n modes/run-multihop.sh
          bash -n client/native-multihop-darwin.sh
          bash -n client/install-linux.sh
          python3 deploy/native-download-policy-audit.py
          go test ./cmd/client ./internal/common
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modes/run-multihop.sh client/native-multihop-darwin.sh client/native-multihop-windows.ps1 client/install-linux.sh
          git diff --cached --check
          git commit -m 'Close final runtime hardening gaps'
          git push
