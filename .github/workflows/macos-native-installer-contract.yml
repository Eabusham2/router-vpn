name: macOS native installer contract

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/client/**'
      - 'internal/**'
      - '!internal/mobiletor/desktop_socket_windows*.go'
      - '!internal/mobiletor/desktop_socket_native_windows*.go'
      - 'client/macos/**'
      - 'client/install-macos-*'
      - 'client/install-linux-native.py'
      - 'modes/kill-switch-platform.py'
      - 'modes/kill-switch.py'
      - 'modes/darwin_kill_switch.py'
      - 'modes/darwin_pf_baseline.py'
      - 'modes/profile_id.py'
      - 'deploy/test_macos_controller_privilege.py'
      - 'deploy/test_desktop_darwin_guardian_runner.py'
      - 'deploy/test_desktop_darwin_observation.py'
      - 'deploy/test_macos_installer_trust.py'
      - 'deploy/test_macos_native_install.py'
      - 'deploy/test_macos_image_identity.py'
      - 'deploy/test_macos_generation.py'
      - 'deploy/macos_process_inventory_probe.py'
      - 'deploy/macos_es_process_probe.py'
      - 'deploy/test_macos_es_process_probe.py'
      - 'deploy/test_macos_installer_entry.py'
      - 'deploy/test_linux_controller_privilege.py'
      - 'deploy/test_linux_native_install.py'
      - 'deploy/test_desktop_socket_uid.py'
      - 'deploy/darwin_race_toolchain.py'
      - 'deploy/test_darwin_race_toolchain.py'
      - '.github/workflows/macos-native-installer-contract.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/client/**'
      - 'internal/**'
      - '!internal/mobiletor/desktop_socket_windows*.go'
      - '!internal/mobiletor/desktop_socket_native_windows*.go'
      - 'client/macos/**'
      - 'client/install-macos-*'
      - 'client/install-linux-native.py'
      - 'modes/kill-switch-platform.py'
      - 'modes/kill-switch.py'
      - 'modes/darwin_kill_switch.py'
      - 'modes/darwin_pf_baseline.py'
      - 'modes/profile_id.py'
      - 'deploy/test_macos_controller_privilege.py'
      - 'deploy/test_desktop_darwin_guardian_runner.py'
      - 'deploy/test_desktop_darwin_observation.py'
      - 'deploy/test_macos_installer_trust.py'
      - 'deploy/test_macos_native_install.py'
      - 'deploy/test_macos_image_identity.py'
      - 'deploy/test_macos_generation.py'
      - 'deploy/macos_process_inventory_probe.py'
      - 'deploy/macos_es_process_probe.py'
      - 'deploy/test_macos_es_process_probe.py'
      - 'deploy/test_macos_installer_entry.py'
      - 'deploy/test_linux_controller_privilege.py'
      - 'deploy/test_linux_native_install.py'
      - 'deploy/test_desktop_socket_uid.py'
      - 'deploy/darwin_race_toolchain.py'
      - 'deploy/test_darwin_race_toolchain.py'
      - '.github/workflows/macos-native-installer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-controller:
    name: Native controller ownership on ${{ matrix.runner }}
    # Native -race supervisors fork child processes; use the official Darwin
    # pre-exec race fix (golang/go#79806) without changing package provenance.
    env:
      GOTOOLCHAIN: go1.26.5
    concurrency:
      group: macos-owned-controller-${{ github.workflow }}-${{ github.ref }}-${{ matrix.runner }}
      # Keep the active diagnostic for each architecture while allowing the
      # other native lane to advance independently after its own verdict.
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false
      - name: Verify separate native race compiler identity controls
        run: python3 deploy/test_darwin_race_toolchain.py
      - name: Observe process inventory before native fixtures without granting installation authority
        run: |
          python3 deploy/test_macos_native_install.py --observe-before-fixtures > "$RUNNER_TEMP/routervpn-macos-before.json"
          cat "$RUNNER_TEMP/routervpn-macos-before.json"
      - name: Diagnose the exact refused executable through a bounded native ES event
        # A missing FDA approval or event is an explicit failed diagnostic.
        # It must not suppress or replace any ordinary installer acceptance.
        continue-on-error: true
        timeout-minutes: 1
        run: python3 deploy/macos_es_process_probe.py --baseline "$RUNNER_TEMP/routervpn-macos-before.json"
      - name: Capture original copied and unlinked native main-image identities
        run: python3 deploy/test_macos_image_identity.py
      - name: Prove complete managed generation and original-image refusal
        id: managed-generation
        run: python3 deploy/test_macos_generation.py
      - name: Prove installed supervisor, native peer identity and joined AppKit shutdown
        run: |
          python3 deploy/test_desktop_darwin_guardian_runner.py
          python3 deploy/test_macos_controller_privilege.py --go "$(command -v go)"
      - name: Prove privileged interpreter ownership and installation rollback
        run: |
          python3 deploy/test_macos_installer_entry.py
          python3 deploy/test_macos_installer_trust.py
          python3 deploy/test_macos_native_install.py --inventory-baseline "$RUNNER_TEMP/routervpn-macos-before.json"
      - name: Prove managed inventory through the actual complete host process list
        if: ${{ !cancelled() && steps.managed-generation.outcome == 'success' }}
        run: python3 deploy/test_macos_generation.py --native-full-host-inventory

  contract:
    concurrency:
      group: macos-owned-controller-contract-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and native-app-only contract
        run: |
          bash -n client/install-macos-final.sh
          bash -n client/install-macos-complete.sh
          python3 deploy/test_macos_image_identity.py
          python3 deploy/test_macos_installer_entry.py
          python3 deploy/test_macos_es_process_probe.py
          grep -Fq 'native AppKit app is the daily-use UI' client/install-macos-complete.sh
          ! grep -Eq 'Google Chrome|Microsoft Edge|Brave Browser|Chromium|--app=' client/install-macos-final.sh
          ! grep -Eq 'Open http://127\.0\.0\.1:8788|open http://127\.0\.0\.1:8788' client/install-macos-final.sh client/install-macos-complete.sh
