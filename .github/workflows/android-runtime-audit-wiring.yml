name: Android runtime audit wiring

on:
  push:
    branches: [main]
    paths:
      - 'deploy/migrate-android-runtime-audits.py'
      - '.github/workflows/android-runtime-audit-wiring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase on live main
        run: git pull --rebase origin main
      - name: Apply guarded audit migration
        run: |
          python3 deploy/migrate-android-runtime-audits.py
          gofmt -w internal/common/native_runtime_contract_test.go
      - name: Validate migrated audits
        run: |
          python3 deploy/full-audit-v4.py
          go test ./internal/common
          python3 android/test_android_runtime_contract.py
          python3 android/test_android_native_policy_contract.py
      - name: Push validated audit migration
        run: |
          if git diff --quiet -- deploy/full-audit-v4.py internal/common/native_runtime_contract_test.go; then
            echo 'Android repository audits already current'
            exit 0
          fi
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git add deploy/full-audit-v4.py internal/common/native_runtime_contract_test.go
          git commit -m 'Audit native Android Xray ALL DNS and recovery'
          git pull --rebase origin main
          git push origin HEAD:main
