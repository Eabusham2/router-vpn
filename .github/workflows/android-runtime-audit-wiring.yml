name: Android runtime audit wiring

on:
  push:
    branches: [main]
    paths:
      - 'deploy/migrate-android-runtime-audits.py'
      - 'deploy/migrate-weighted-android-runtime.py'
      - 'deploy/migrate-android-combined-runtime-audits.py'
      - '.github/workflows/android-runtime-audit-wiring.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase on live main
        run: git pull --rebase origin main
      - name: Apply guarded audit migrations
        run: |
          python3 deploy/migrate-android-runtime-audits.py
          python3 deploy/migrate-weighted-android-runtime.py
          python3 deploy/migrate-android-combined-runtime-audits.py
          gofmt -w internal/common/native_runtime_contract_test.go
      - name: Validate migrated audits
        run: |
          python3 deploy/full-audit-v4.py
          go test ./internal/common
          python3 android/test_android_runtime_contract.py
          python3 android/test_android_native_policy_contract.py
          python3 deploy/weighted-release-audit.py > /tmp/weighted.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/weighted.json'))
          assert r['source_weight']==88.0, r
          assert r['manual_live_weight']==12.0, r
          failed=[g for g in r['gates'] if g['kind']=='source' and not g['pass']]
          if failed: raise SystemExit('source gates failed: '+repr(failed))
          PY
      - name: Push validated audit migrations
        run: |
          if git diff --quiet -- deploy/full-audit-v4.py deploy/weighted-release-audit.py internal/common/native_runtime_contract_test.go; then
            echo 'Android repository audits already current'
            exit 0
          fi
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git add deploy/full-audit-v4.py deploy/weighted-release-audit.py internal/common/native_runtime_contract_test.go
          git commit -m 'Audit one combined Android Go runtime'
          git pull --rebase origin main
          git push origin HEAD:main
