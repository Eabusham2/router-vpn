name: Darwin installed ordered host native pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New main pushes supersede this standalone producer and its owned children.
  # Explicit dispatches and PR evidence retain an independent run lane.
  group: darwin-node-host-native-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  native-runtimes:
    uses: ./.github/workflows/desktop-native-runtime.yml
    with:
      platform: darwin
  host:
    needs: native-runtimes
    uses: ./.github/workflows/darwin-node-host-tun.yml

  prefix-host:
    needs: native-runtimes
    uses: ./.github/workflows/darwin-node-prefix-host-tun.yml
