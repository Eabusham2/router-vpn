name: One-shot Android profile transactions

on:
  push:
    branches:
      - automation/android-profile-transactions

permissions:
  contents: write

concurrency:
  group: one-shot-android-profile-transactions
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Android profile transactions and remove transport automation
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 .github/scripts/apply-android-profile-transactions.py
          git push origin HEAD:main
          git push origin --delete automation/android-profile-transactions || true
