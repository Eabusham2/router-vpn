name: Typed connected candidate encrypted ownership

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'internal/mobilemultihop/**'
      - 'internal/hopmeasure/**'
      - 'mobile/**'
      - 'deploy/**'
      - 'go.mod'
      - '.github/workflows/typed-connected-candidates.yml'
  pull_request:
    paths:
      - 'internal/mobilemultihop/**'
      - 'internal/hopmeasure/**'
      - 'mobile/**'
      - 'deploy/**'
      - 'go.mod'
      - '.github/workflows/typed-connected-candidates.yml'

permissions:
  contents: read

concurrency:
  group: typed-connected-candidates-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  encrypted:
    name: Original ${{ matrix.family }} connected candidates
    runs-on: ubuntu-24.04
    # Two original preparations and two original compiles: 4*600s;
    # CONNECT's six mandatory phases: 6*190s, preflight60s. 75min leaves
    # 15min for checkout, tool installation, source hashing and upload.
    # Existing SOCKS/CONNECT job and per-case clocks are unchanged.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        family: [SOCKS, CONNECT]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install original native compiler and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git iproute2 util-linux
      - name: Require strict connected ownership inventories
        run: |
          python3 deploy/test_node_chain_typed_connected_candidates_runner.py
          python3 deploy/test_typed_connected_candidates_native_runner.py
      - name: Prove every original encrypted connected candidate phase
        env:
          CGO_ENABLED: '1'
        run: |
          python3 deploy/test_typed_connected_candidates_native.py --source "$GITHUB_WORKSPACE" --require-commit "$GITHUB_SHA" --family '${{ matrix.family }}' --output '${{ runner.temp }}/typed-connected-${{ matrix.family }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RouterVPN-typed-connected-${{ matrix.family }}-${{ github.sha }}
          path: ${{ runner.temp }}/typed-connected-${{ matrix.family }}
          if-no-files-found: error
