name: Android runtime truth contract

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Install Android graph parser dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libandroid-json-java
      - name: Validate Android runtime truth
        run: python3 android/test_android_runtime_contract.py
