name: Android runtime truth contract

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runtime-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Android runtime truth
        run: python3 android/test_android_runtime_contract.py
