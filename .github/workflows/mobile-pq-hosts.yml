name: Native mobile Rosenpass hosts
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-pq-hosts.yml'
      - 'mobile/rosenpass/**'
      - 'mobile/pq/**'
      - 'mobile/routervpn_pq_bridge.go.tmpl'
      - 'deploy/*pq*'
      - 'android/app/src/main/java/com/eabusham/routervpn/RouterPQNative.java'
      - 'ios/RouterVPN/PacketTunnel/RouterVPNPQFactory.swift'
      - 'ios/RouterVPN/App/IOSNativePQProfile.swift'
      - 'ios/RouterVPN/App/IOSRuntimeSelection.swift'
permissions:
  contents: read
concurrency:
  group: mobile-pq-hosts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hosts:
    name: PQ protocol host ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: android}
          - {os: macos-15, platform: ios}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          # Command-line tools are installed by the action; legacy 'tools' is retired.
          packages: platform-tools
      - name: Linux compiler dependencies
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-dev cmake ninja-build
      - name: Apple compiler dependencies
        if: matrix.platform == 'ios'
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
      - name: Execute actual host adapters with an isolated protocol test double
        run: python3 deploy/test_mobile_pq_hosts.py
      - name: Cross-build the real pinned protocol for every packaged architecture
        run: python3 deploy/build-mobile-pq.py --platform '${{ matrix.platform }}' --output '${{ runner.temp }}/native-pq'
      - name: Preserve exact source identity
        if: always()
        run: |
          mkdir -p '${{ runner.temp }}/pq-build-evidence'
          git rev-parse HEAD > '${{ runner.temp }}/pq-build-evidence/source-sha.txt'
          test ! -f '${{ runner.temp }}/native-pq/source.json' || cp '${{ runner.temp }}/native-pq/source.json' '${{ runner.temp }}/pq-build-evidence/'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-pq-build-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/pq-build-evidence/
          if-no-files-found: error
          retention-days: 7
