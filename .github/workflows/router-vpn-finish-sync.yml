name: Router VPN finish validated sync
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/router-vpn-finish-sync.yml
permissions:
  contents: write
concurrency:
  group: router-vpn-finish-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Finish exact validated worktree sync
        shell: bash
        run: |
          set -euo pipefail
          BASE=9a7330d6a8ce05fc53a8082b6f57a7e45af7fe6c
          git merge-base --is-ancestor "$BASE" HEAD
          awk '
            /cat > \/tmp\/routervpn-sync.patch.xz.b64 <<'\''ROUTER_VPN_PATCH'\''/ {inpatch=1; next}
            inpatch && /ROUTER_VPN_PATCH/ {exit}
            inpatch {sub(/^          /,""); print}
          ' .github/workflows/router-vpn-one-shot-sync.yml > /tmp/routervpn-sync.patch.xz.b64
          base64 -d /tmp/routervpn-sync.patch.xz.b64 | xz -d > /tmp/routervpn-sync.patch
          echo '39f239d3b4202294f8a420d28d4d1171696e434a10d58dc82ed3b1461ee159d0  /tmp/routervpn-sync.patch' | sha256sum -c -
          git rm -rf --ignore-unmatch .routervpn-final-patch
          git rm -f --ignore-unmatch .github/workflows/apply-routervpn-final-batch.yml
          git rm -f --ignore-unmatch .github/workflows/router-vpn-one-shot-sync.yml
          git rm -f --ignore-unmatch .github/workflows/router-vpn-finish-sync.yml
          git checkout "$BASE" -- .github/workflows/source-snapshot.yml
          git apply --check /tmp/routervpn-sync.patch
          git apply --index /tmp/routervpn-sync.patch
          git add -A
          git config user.name 'Eabusham2'
          git config user.email 'eabusham2@gmail.com'
          git commit -m 'Sync validated Router-VPN safety and release contracts'
          git push origin HEAD:main
