name: Router acceleration and household fail-open safety

on:
  push:
    branches: [main]
    paths:
      - 'server/**/*.sh'
      - 'router/**/*.sh'
      - 'scripts/**/*.sh'
      - 'client/**/*.sh'
      - 'deploy/router-acceleration-safety-audit.py'
      - '.github/workflows/router-acceleration-safety.yml'
  pull_request:
    paths:
      - 'server/**/*.sh'
      - 'router/**/*.sh'
      - 'scripts/**/*.sh'
      - 'client/**/*.sh'
      - 'deploy/router-acceleration-safety-audit.py'
      - '.github/workflows/router-acceleration-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-acceleration-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  household-fail-open:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove Router VPN never disables ASUS acceleration
        run: python3 deploy/router-acceleration-safety-audit.py
