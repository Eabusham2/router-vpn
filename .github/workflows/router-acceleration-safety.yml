name: Router acceleration and exact-source safety

on:
  pull_request:
    paths:
      - 'server/**/*.sh'
      - 'router/**/*.sh'
      - 'scripts/**/*.sh'
      - 'client/**/*.sh'
      - 'deploy/router-acceleration-safety-audit.py'
      - '.github/workflows/router-acceleration-safety.yml'
      - '.github/workflows/source-snapshot.yml'
      - 'deploy/source-snapshot-durability-audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-acceleration-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  household-fail-open:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prove Router VPN never disables ASUS acceleration
        run: python3 deploy/router-acceleration-safety-audit.py
      - name: Prove exact-source evidence survives release auditing
        run: python3 deploy/source-snapshot-durability-audit.py
