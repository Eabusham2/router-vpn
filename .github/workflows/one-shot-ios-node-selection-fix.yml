name: One-shot ordered source corrections

on:
  push:
    branches:
      - automation/ios-source-fix

permissions:
  contents: write

concurrency:
  group: one-shot-ordered-source-corrections
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply, validate, commit, and clean up
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          python3 .github/scripts/apply-ordered-source-corrections.py
          git push origin HEAD:main
          git push origin --delete automation/ios-source-fix || true
