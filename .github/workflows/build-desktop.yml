name: Build desktop and router binaries
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x'}
      - run: ./deploy/build-client.sh
      - uses: actions/upload-artifact@v4
        with:
          name: router-vpn-binaries
          path: dist/
