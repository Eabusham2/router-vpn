name: Native desktop onboarding contract

on:
  push:
    branches: [main]
    paths:
      - 'client/migrate-native-onboarding.py'
      - 'client/test_native_onboarding_contract.py'
      - 'client/RouterVPN-Windows-App.ps1'
      - 'client/macos/RouterVPNMacApp.swift'
      - 'client/linux/routervpn-gtk.c'
      - '.github/workflows/native-onboarding-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-onboarding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wire-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase on live main
        run: git pull --rebase origin main
      - name: Apply guarded native onboarding migration
        run: python3 client/migrate-native-onboarding.py
      - name: Validate native onboarding truth
        run: |
          python3 client/test_native_onboarding_contract.py
          python3 -m py_compile client/migrate-native-onboarding.py client/test_native_onboarding_contract.py
      - name: Push migrated native shells
        run: |
          if git diff --quiet -- client/RouterVPN-Windows-App.ps1 client/macos/RouterVPNMacApp.swift client/linux/routervpn-gtk.c; then
            echo 'Native desktop onboarding already current'
            exit 0
          fi
          git config user.name 'router-vpn-ci'
          git config user.email 'router-vpn-ci@users.noreply.github.com'
          git add client/RouterVPN-Windows-App.ps1 client/macos/RouterVPNMacApp.swift client/linux/routervpn-gtk.c
          git commit -m 'Add native desktop onboarding'
          git pull --rebase origin main
          git push origin HEAD:main
