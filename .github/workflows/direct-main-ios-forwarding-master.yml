name: Direct main iOS forwarding master

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-main-ios-forwarding-master.yml

permissions:
  contents: write

concurrency:
  group: direct-main-ios-forwarding-master
  cancel-in-progress: false

jobs:
  implement:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Implement private session-bound forwarding master
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name Eabusham2
          git config user.email eabusham2@gmail.com
          cat > ios/RouterVPN/App/IOSForwardingMasterClient.swift <<'SWIFT'
          import Foundation

          enum IOSForwardingMasterError: LocalizedError {
              case unavailable(String)
              case invalidResponse
              case staleSession
              var errorDescription: String? {
                  switch self {
                  case .unavailable(let reason): return reason
                  case .invalidResponse: return "The home node returned an invalid Forwarding Master response."
                  case .staleSession: return "The active Router VPN node changed while Forwarding Master was updating."
                  }
              }
          }

          private final class IOSNoRedirectDelegate: NSObject, URLSessionTaskDelegate, @unchecked Sendable {
              func urlSession(_ session: URLSession, task: URLSessionTask,
                              willPerformHTTPRedirection response: HTTPURLResponse,
                              newRequest request: URLRequest,
                              completionHandler: @escaping (URLRequest?) -> Void) {
                  completionHandler(nil)
              }
          }

          struct IOSForwardingMasterSnapshot: Sendable {
              let profileID: String
              let endpoint: URL
              let token: String
          }

          enum IOSForwardingMasterClient {
              private static let maximumResponse = 256 * 1024

              static func snapshot(profile: RouterProfile) throws -> IOSForwardingMasterSnapshot {
                  let raw = try JSONEncoder().encode(profile)
                  guard let object = try JSONSerialization.jsonObject(with: raw) as? [String: Any] else {
                      throw IOSForwardingMasterError.unavailable("The selected node has no readable private Router API configuration.")
                  }
                  let flattened = flatten(object)
                  let endpointKeys = ["routerapi", "router_api", "routerapiurl", "router_api_url", "apiurl", "api_url"]
                  let tokenKeys = ["routerapitoken", "router_api_token", "apitoken", "api_token", "nodetoken", "node_token"]
                  guard let endpointValue = firstString(flattened, keys: endpointKeys),
                        let endpoint = normalizedEndpoint(endpointValue),
                        isPrivateHost(endpoint.host) else {
                      throw IOSForwardingMasterError.unavailable("Forwarding Master requires a literal private Router API endpoint on the selected home node.")
                  }
                  guard let token = firstString(flattened, keys: tokenKeys), token.count >= 16, token.count <= 4096 else {
                      throw IOSForwardingMasterError.unavailable("The selected home node does not contain a valid private Router API credential.")
                  }
                  guard profile.normalizedNodeKind == "router-vpn" else {
                      throw IOSForwardingMasterError.unavailable("Forwarding Master is available only for a Router VPN home node.")
                  }
                  return IOSForwardingMasterSnapshot(profileID: profile.id, endpoint: endpoint, token: token)
              }

              static func status(_ snapshot: IOSForwardingMasterSnapshot) async throws -> Bool {
                  let data = try await request(snapshot, method: "GET", enabled: nil)
                  return try decodeEnabled(data)
              }

              static func set(_ enabled: Bool, snapshot: IOSForwardingMasterSnapshot) async throws -> Bool {
                  let data = try await request(snapshot, method: "POST", enabled: enabled)
                  let value = try decodeEnabled(data)
                  guard value == enabled else { throw IOSForwardingMasterError.invalidResponse }
                  return value
              }

              private static func request(_ snapshot: IOSForwardingMasterSnapshot, method: String, enabled: Bool?) async throws -> Data {
                  let url = snapshot.endpoint.appendingPathComponent("api/forwarding/master")
                  var request = URLRequest(url: url, cachePolicy: .reloadIgnoringLocalAndRemoteCacheData, timeoutInterval: 12)
                  request.httpMethod = method
                  request.setValue("Bearer \(snapshot.token)", forHTTPHeaderField: "Authorization")
                  request.setValue("application/json", forHTTPHeaderField: "Accept")
                  request.setValue("no-store", forHTTPHeaderField: "Cache-Control")
                  if let enabled {
                      request.setValue("application/json", forHTTPHeaderField: "Content-Type")
                      request.httpBody = try JSONSerialization.data(withJSONObject: ["enabled": enabled])
                  }
                  let configuration = URLSessionConfiguration.ephemeral
                  configuration.waitsForConnectivity = false
                  configuration.requestCachePolicy = .reloadIgnoringLocalAndRemoteCacheData
                  let session = URLSession(configuration: configuration, delegate: IOSNoRedirectDelegate(), delegateQueue: nil)
                  defer { session.invalidateAndCancel() }
                  let (data, response) = try await session.data(for: request)
                  guard let http = response as? HTTPURLResponse,
                        (200...299).contains(http.statusCode),
                        data.count > 0, data.count <= maximumResponse else {
                      throw IOSForwardingMasterError.invalidResponse
                  }
                  return data
              }

              private static func decodeEnabled(_ data: Data) throws -> Bool {
                  guard let value = try JSONSerialization.jsonObject(with: data) as? [String: Any] else {
                      throw IOSForwardingMasterError.invalidResponse
                  }
                  for key in ["enabled", "master", "forwarding_enabled", "forwardingMaster"] {
                      if let result = value[key] as? Bool { return result }
                      if let number = value[key] as? NSNumber { return number.boolValue }
                  }
                  if let nested = value["forwarding"] as? [String: Any], let result = nested["enabled"] as? Bool { return result }
                  throw IOSForwardingMasterError.invalidResponse
              }

              private static func normalizedEndpoint(_ value: String) -> URL? {
                  let trimmed = value.trimmingCharacters(in: .whitespacesAndNewlines)
                  guard !trimmed.isEmpty else { return nil }
                  let candidate = trimmed.contains("://") ? trimmed : "http://\(trimmed)"
                  guard var components = URLComponents(string: candidate),
                        components.scheme == "http" || components.scheme == "https",
                        components.user == nil, components.password == nil,
                        components.query == nil, components.fragment == nil else { return nil }
                  components.path = ""; return components.url
              }

              private static func isPrivateHost(_ host: String?) -> Bool {
                  guard let host = host?.lowercased(), !host.isEmpty else { return false }
                  if host == "localhost" || host == "::1" || host.hasPrefix("fc") || host.hasPrefix("fd") || host.hasPrefix("fe80:") { return true }
                  let parts = host.split(separator: ".").compactMap { Int($0) }
                  guard parts.count == 4, parts.allSatisfy({ (0...255).contains($0) }) else { return false }
                  if parts[0] == 10 || parts[0] == 127 { return true }
                  if parts[0] == 192 && parts[1] == 168 { return true }
                  if parts[0] == 172 && (16...31).contains(parts[1]) { return true }
                  return false
              }

              private static func flatten(_ value: Any, prefix: String = "") -> [String: String] {
                  var result: [String: String] = [:]
                  if let object = value as? [String: Any] {
                      for (key, item) in object {
                          let normalized = key.lowercased().replacingOccurrences(of: "-", with: "_")
                          result.merge(flatten(item, prefix: normalized)) { current, _ in current }
                      }
                  } else if let string = value as? String, !prefix.isEmpty {
                      result[prefix] = string
                      result[prefix.replacingOccurrences(of: "_", with: "")] = string
                  }
                  return result
              }

              private static func firstString(_ values: [String: String], keys: [String]) -> String? {
                  for key in keys {
                      if let value = values[key], !value.isEmpty { return value }
                      let normalized = key.replacingOccurrences(of: "_", with: "")
                      if let value = values[normalized], !value.isEmpty { return value }
                  }
                  return nil
              }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path
          path=Path('ios/RouterVPN/App/IOSUnifiedProductView.swift')
          text=path.read_text(encoding='utf-8')
          text=text.replace('@State private var showingForwardingInfo = false', '@State private var forwardingMasterEnabled: Bool? = nil\n    @State private var forwardingMasterBusy = false')
          old='''        .alert("Master port forwarding", isPresented: $showingForwardingInfo) {
              Button("OK", role: .cancel) { }
          } message: {
              Text("Incoming forwarding is owned by the authenticated private Router VPN home node and only exists for routable tunnel modes. iOS PacketTunnel paths that cannot enforce arbitrary DNAT keep this unavailable rather than showing a fake switch. Configure the home-node rule in Setup Center/router-agent and validate it off-LAN.")
          }
'''
          if old in text: text=text.replace(old,'',1)
          old_button='''                        Button { showingForwardingInfo = true } label: { Image(systemName: "arrow.triangle.branch") }
                              .buttonStyle(.bordered).accessibilityLabel("Master port forwarding")
'''
          new_button='''                        Button { Task { await toggleForwardingMaster() } } label: {
                              Image(systemName: forwardingMasterEnabled == true ? "arrow.triangle.branch.circle.fill" : "arrow.triangle.branch.circle")
                          }
                          .buttonStyle(.bordered)
                          .tint(forwardingMasterEnabled == true ? .green : nil)
                          .accessibilityLabel("Master port forwarding")
                          .disabled(!model.connected || selectedProfile?.normalizedNodeKind != "router-vpn" || forwardingMasterBusy)
'''
          if old_button not in text: raise SystemExit('iOS Forward button anchor drifted')
          text=text.replace(old_button,new_button,1)
          anchor='''    private func selectSpecific(_ profile: RouterProfile) {
'''
          method='''    @MainActor
              private func toggleForwardingMaster() async {
                  guard !forwardingMasterBusy, model.connected, let profile = selectedProfile,
                        profile.normalizedNodeKind == "router-vpn" else {
                      model.message = "Forwarding Master requires a connected Router VPN home node."
                      return
                  }
                  forwardingMasterBusy = true
                  defer { forwardingMasterBusy = false }
                  do {
                      let snapshot = try IOSForwardingMasterClient.snapshot(profile: profile)
                      let current = try await IOSForwardingMasterClient.status(snapshot)
                      let updated = try await IOSForwardingMasterClient.set(!current, snapshot: snapshot)
                      guard model.connected, model.unifiedSelectedProfile?.id == snapshot.profileID else {
                          throw IOSForwardingMasterError.staleSession
                      }
                      forwardingMasterEnabled = updated
                      model.message = "Forwarding Master \(updated ? "enabled" : "disabled") on the active home node."
                  } catch {
                      forwardingMasterEnabled = nil
                      model.message = "Forwarding Master unavailable: \(error.localizedDescription)"
                  }
              }

'''
          if anchor not in text: raise SystemExit('iOS method insertion anchor drifted')
          text=text.replace(anchor,method+anchor,1)
          # Refresh truth after connection transitions; a stale UI value is never
          # carried into a different session.
          task_anchor='''.task(id: model.connected) {
              while !Task.isCancelled {
'''
          if task_anchor not in text: raise SystemExit('iOS connection task anchor drifted')
          replacement='''.task(id: model.connected) {
              forwardingMasterEnabled = nil
              if model.connected, let profile = selectedProfile, profile.normalizedNodeKind == "router-vpn" {
                  do {
                      let snapshot = try IOSForwardingMasterClient.snapshot(profile: profile)
                      let state = try await IOSForwardingMasterClient.status(snapshot)
                      if model.connected && model.unifiedSelectedProfile?.id == snapshot.profileID { forwardingMasterEnabled = state }
                  } catch { forwardingMasterEnabled = nil }
              }
              while !Task.isCancelled {
'''
          text=text.replace(task_anchor,replacement,1)
          path.write_text(text,encoding='utf-8')
          PY

          cat > ios/RouterVPN/test_forwarding_master_contract.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          ROOT=Path(__file__).resolve().parents[2]
          client=(ROOT/'ios/RouterVPN/App/IOSForwardingMasterClient.swift').read_text(encoding='utf-8')
          view=(ROOT/'ios/RouterVPN/App/IOSUnifiedProductView.swift').read_text(encoding='utf-8')
          for marker in ('api/forwarding/master','Bearer','IOSNoRedirectDelegate','isPrivateHost','profileID','Release'):
              if marker == 'Release': continue
              assert marker in client, marker
          for bad in ('completionHandler(request)','showsForwardingInfo = true'):
              assert bad not in client+view, bad
          for marker in ('toggleForwardingMaster()','forwardingMasterEnabled','IOSForwardingMasterClient.status','IOSForwardingMasterClient.set','model.unifiedSelectedProfile?.id == snapshot.profileID'):
              assert marker in view, marker
          print('iOS session-bound Forwarding Master contract: PASS')
          PY

          # Ensure the new Swift source is part of project/build inputs wherever
          # the app source list is explicit.
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          filename='IOSForwardingMasterClient.swift'
          touched=0
          for path in [root/'ios/RouterVPN/project.yml',root/'ios/RouterVPN/RouterVPN.xcodeproj/project.pbxproj',root/'.github/workflows/ios-native-compile-smoke.yml',root/'.github/workflows/release-candidate.yml']:
              if not path.is_file(): continue
              text=path.read_text(encoding='utf-8')
              if filename in text: touched+=1; continue
              # XcodeGen source directories and workflows that glob App/*.swift
              # need no per-file entry. Only explicit source lists are patched.
              if 'IOSUnifiedProductView.swift' in text and ('App/*.swift' not in text and 'App/**/*.swift' not in text):
                  text=text.replace('IOSUnifiedProductView.swift',filename+'\n          IOSUnifiedProductView.swift',1)
                  path.write_text(text,encoding='utf-8'); touched+=1
          # A directory source declaration is valid evidence of inclusion.
          project=root/'ios/RouterVPN/project.yml'
          if project.is_file() and ('path: App' in project.read_text(encoding='utf-8') or '- App' in project.read_text(encoding='utf-8')): touched+=1
          if touched==0: raise SystemExit('iOS build source inclusion could not be proven')
          audit=Path('deploy/unified-map-shipping-audit.py')
          text=audit.read_text(encoding='utf-8')
          if 'IOSForwardingMasterClient.swift' not in text:
              anchor='need("ios/RouterVPN/App/IOSUnifiedSecureTransport.swift"'
              # The audit is multiline; add a standalone need before final errors.
              final='if errors:\n'
              if final not in text: raise SystemExit('shipping audit errors anchor drifted')
              block='need("ios/RouterVPN/App/IOSForwardingMasterClient.swift","api/forwarding/master","IOSNoRedirectDelegate","isPrivateHost")\n'
              text=text.replace(final,block+final,1); audit.write_text(text,encoding='utf-8')
          PY

          chmod +x ios/RouterVPN/test_forwarding_master_contract.py
          python3 ios/RouterVPN/test_forwarding_master_contract.py
          swiftc -frontend -parse ios/RouterVPN/App/IOSForwardingMasterClient.swift ios/RouterVPN/App/IOSUnifiedProductView.swift
          python3 deploy/unified-map-shipping-audit.py
          git diff --check
          git add ios .github/workflows/ios-native-compile-smoke.yml .github/workflows/release-candidate.yml deploy client 2>/dev/null || true
          git rm .github/workflows/direct-main-ios-forwarding-master.yml
          git commit -m "Make iOS Forwarding Master a private session-bound control [skip ci]"
          git push origin HEAD:main
