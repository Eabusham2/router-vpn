name: Windows selected candidate controller diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-selected-candidate-controller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/go-windows-sockets
      - name: Run the connected controller race tests
        shell: pwsh
        timeout-minutes: 20
        run: python deploy/test_desktop_selected_candidate_controller.py --phase connected --receipt "$env:RUNNER_TEMP/selected-candidate-controller.json"
      - name: Preserve the controller receipt and per-root transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selected-candidate-controller-windows-amd64-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selected-candidate-controller.json
            ${{ runner.temp }}/selected-candidate-controller.json.*.jsonl
          if-no-files-found: error
          retention-days: 7
