name: One-shot release concurrency repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-release-concurrency-repair.yml

permissions:
  contents: write

concurrency:
  group: one-shot-release-concurrency-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'Eabusham2/router-vpn'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply audited release-concurrency repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b6d0b1521733c45e416aa13e790749e5ef7f625a"
          python3 - <<'PY'
          from pathlib import Path

          workflow_replacements = {
              ".github/workflows/source-snapshot.yml": (
                  "group: source-snapshot-${{ github.ref }}-${{ github.sha }}",
                  "group: source-snapshot-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}",
              ),
              ".github/workflows/release-candidate.yml": (
                  "group: release-candidate-${{ github.ref }}-${{ github.sha }}",
                  "group: release-candidate-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}",
              ),
              ".github/workflows/arm64-portainer-preflight.yml": (
                  "group: arm64-portainer-${{ github.ref }}-${{ github.sha }}",
                  "group: arm64-portainer-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}",
              ),
              ".github/workflows/publish-arm64-images.yml": (
                  "group: publish-arm64-portainer-${{ github.ref }}-${{ github.sha }}",
                  "group: publish-arm64-portainer-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}",
              ),
              ".github/workflows/production-release-compose.yml": (
                  "group: production-release-compose-${{ github.ref }}-${{ github.sha }}",
                  "group: production-release-compose-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}",
              ),
          }
          for filename, (old, new) in workflow_replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1 or new in text:
                  raise SystemExit(f"unexpected concurrency source in {filename}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          audit = Path("deploy/release-orchestration-audit.py")
          text = audit.read_text(encoding="utf-8")
          for old, new in (
              ("group: source-snapshot-${{ github.ref }}-${{ github.sha }}", "group: source-snapshot-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}"),
              ("group: release-candidate-${{ github.ref }}-${{ github.sha }}", "group: release-candidate-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}"),
              ("group: arm64-portainer-${{ github.ref }}-${{ github.sha }}", "group: arm64-portainer-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}"),
              ("group: publish-arm64-portainer-${{ github.ref }}-${{ github.sha }}", "group: publish-arm64-portainer-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}"),
              ("group: production-release-compose-${{ github.ref }}-${{ github.sha }}", "group: production-release-compose-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}"),
              ('assert concurrency in body, f"{rel} can be canceled by a different release SHA"', 'assert concurrency in body, (\n        f"{rel} must isolate the authoritative caller from standalone same-SHA diagnostics"\n    )'),
              ('assert "cancel-in-progress: true" in body, f"{rel} does not collapse duplicate same-SHA runs"', 'assert "cancel-in-progress: true" in body, f"{rel} does not collapse duplicates from the same caller"'),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected audit source: {old}")
              text = text.replace(old, new)
          audit.write_text(text, encoding="utf-8")
          PY
          python3 deploy/workflow-structure-audit.py
          python3 deploy/workflow-evidence-pipeline-audit.py
          python3 deploy/workflow-source-integrity-audit.py
          python3 deploy/validate-repo.py
          python3 deploy/release-orchestration-audit.py
          git diff --check
      - name: Commit repair directly to main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-release-concurrency-repair.yml
          git add \
            .github/workflows/source-snapshot.yml \
            .github/workflows/release-candidate.yml \
            .github/workflows/arm64-portainer-preflight.yml \
            .github/workflows/publish-arm64-images.yml \
            .github/workflows/production-release-compose.yml \
            deploy/release-orchestration-audit.py
          git diff --cached --check
          git config user.name "Eabusham2"
          git config user.email "eabusham2@gmail.com"
          git commit -m "Isolate reusable release workflow concurrency"
          git push origin HEAD:main
