name: router-vpn
services:
  init:
    image: router-vpn-init:local
    build:
      context: ..
      dockerfile: server/init/Dockerfile
    container_name: router-vpn-init
    network_mode: host
    privileged: true
    volumes:
      - /opt/router-vpn:/opt/router-vpn
    environment:
      WAN_INTERFACE: ${WAN_INTERFACE:-eth0}
      LAN_CIDR: ${LAN_CIDR:-192.168.50.0/24}
      LAN_CIDR6: ${LAN_CIDR6:-fd00::/8}
      ADGUARD4: ${ADGUARD4:-192.168.50.133}
      ENDPOINT: ${ENDPOINT:-}
      WG_PORT: ${WG_PORT:-51820}
      AWG_PORT: ${AWG_PORT:-585}
      ROSENPASS_PORT: ${ROSENPASS_PORT:-51822}
      REALITY_PORT: ${REALITY_PORT:-443}
      HY2_PORT: ${HY2_PORT:-8443}
      SS_PORT: ${SS_PORT:-8388}
      XRAY_PQ_PORT: ${XRAY_PQ_PORT:-10443}
      XHTTP_PORT: ${XHTTP_PORT:-11443}
      SS_V2RAY_PORT: ${SS_V2RAY_PORT:-12443}
      NAIVE_PORT: ${NAIVE_PORT:-13443}
      ROUTER_VPN_TLS_NAME: ${ROUTER_VPN_TLS_NAME:-}
      REALITY_TARGET: ${REALITY_TARGET:-www.microsoft.com:443}
    restart: "no"

  finalize-current:
    image: router-vpn-init:local
    container_name: router-vpn-finalize
    network_mode: host
    privileged: true
    depends_on:
      init: {condition: service_completed_successfully}
    entrypoint: ["/bin/bash", "/src/server/finalize/current-entrypoint.sh"]
    volumes:
      - /opt/router-vpn:/opt/router-vpn
    environment:
      WAN_INTERFACE: ${WAN_INTERFACE:-eth0}
      LAN_CIDR: ${LAN_CIDR:-192.168.50.0/24}
      LAN_CIDR6: ${LAN_CIDR6:-fd00::/8}
      ADGUARD4: ${ADGUARD4:-192.168.50.133}
      ENDPOINT: ${ENDPOINT:-}
      WG_PORT: ${WG_PORT:-51820}
      AWG_PORT: ${AWG_PORT:-585}
      ROSENPASS_PORT: ${ROSENPASS_PORT:-51822}
      REALITY_PORT: ${REALITY_PORT:-443}
      HY2_PORT: ${HY2_PORT:-8443}
      SS_PORT: ${SS_PORT:-8388}
      XRAY_PQ_PORT: ${XRAY_PQ_PORT:-10443}
      XHTTP_PORT: ${XHTTP_PORT:-11443}
      SS_V2RAY_PORT: ${SS_V2RAY_PORT:-12443}
      NAIVE_PORT: ${NAIVE_PORT:-13443}
      ROUTER_VPN_TLS_NAME: ${ROUTER_VPN_TLS_NAME:-}
      REALITY_TARGET: ${REALITY_TARGET:-www.microsoft.com:443}
    restart: "no"

  router-agent:
    build:
      context: ..
      dockerfile: deploy/router-agent.Dockerfile
    container_name: router-vpn-agent
    network_mode: host
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config:/etc/router-vpn:ro
    environment:
      ROUTER_VPN_CONFIG: /etc/router-vpn/router-agent.json

  wireguard:
    build:
      context: ..
      dockerfile: server/wireguard/Dockerfile
    container_name: router-vpn-wireguard
    network_mode: host
    restart: unless-stopped
    privileged: true
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/wireguard:/data:ro
      - /lib/modules:/lib/modules:ro
    environment:
      WAN_INTERFACE: ${WAN_INTERFACE:-eth0}
      WG_CONFIG: /data/wg0.conf

  awg2:
    build:
      context: ..
      dockerfile: server/awg2/Dockerfile
    container_name: router-vpn-awg2
    network_mode: host
    restart: unless-stopped
    privileged: true
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - /opt/router-vpn/config/awg2:/data:ro
      - /lib/modules:/lib/modules:ro
    environment:
      WAN_INTERFACE: ${WAN_INTERFACE:-eth0}
      AWG_CONFIG: /data/awg0.conf

  rosenpass:
    build:
      context: ..
      dockerfile: server/rosenpass/Dockerfile
    container_name: router-vpn-rosenpass
    network_mode: host
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    depends_on:
      finalize-current: {condition: service_completed_successfully}
      wireguard: {condition: service_started}
      awg2: {condition: service_started}
    volumes:
      - /opt/router-vpn/config/rosenpass:/data
    environment:
      ROSENPASS_CONFIG: /data/server.toml
      ROSENPASS_ENV: /data/server.env

  transports:
    image: ghcr.io/sagernet/sing-box:v1.13.12
    container_name: router-vpn-transports
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/transports/server.json:/etc/sing-box/config.json:ro
      - /opt/router-vpn/config/transports/cert.pem:/etc/sing-box/cert.pem:ro
      - /opt/router-vpn/config/transports/key.pem:/etc/sing-box/key.pem:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  xray-pq:
    image: ghcr.io/xtls/xray-core:26.7.11
    container_name: router-vpn-xray
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/xray/server.json:/etc/xray/config.json:ro
    command: ["run", "-c", "/etc/xray/config.json"]

  naive:
    build:
      context: ..
      dockerfile: server/naive/Dockerfile
    container_name: router-vpn-naive
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/tls:/router-vpn:ro
      - /opt/router-vpn/caddy-data:/data
      - /opt/router-vpn/caddy-config:/config
    environment:
      ROUTER_VPN_TLS_SETTINGS: /router-vpn/settings.env

  ss-v2ray:
    build:
      context: ..
      dockerfile: server/ss-v2ray/Dockerfile
    container_name: router-vpn-ss-v2ray
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
      naive: {condition: service_started}
    volumes:
      - /opt/router-vpn/config/tls:/router-vpn:ro
      - /opt/router-vpn/caddy-data:/caddy-data:ro
    environment:
      ROUTER_VPN_TLS_SETTINGS: /router-vpn/settings.env

  bundle-web:
    image: busybox:1.36
    container_name: router-vpn-bundle-web
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/downloads:/www:ro
    command: ["httpd", "-f", "-p", "8786", "-h", "/www"]

  socks5:
    image: ghcr.io/sagernet/sing-box:v1.13.12
    container_name: router-vpn-socks5
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
      wireguard: {condition: service_started}
      awg2: {condition: service_started}
    volumes:
      - /opt/router-vpn/config/socks5.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]
