name: router-vpn
services:
  init:
    image: ghcr.io/eabusham2/router-vpn-init:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-init
    network_mode: host
    privileged: true
    volumes:
      - /opt/router-vpn:/opt/router-vpn
    environment:
      WAN_INTERFACE: ${WAN_INTERFACE:-eth0}
      LAN_CIDR: ${LAN_CIDR:-192.168.50.0/24}
      LAN_CIDR6: ${LAN_CIDR6:-fd00::/8}
      ADGUARD4: ${ADGUARD4:-192.168.50.133}
      ENDPOINT: ${ENDPOINT:-}
      WG_PORT: ${WG_PORT:-51820}
      AWG_PORT: ${AWG_PORT:-585}
      ROSENPASS_PORT: ${ROSENPASS_PORT:-51822}
      REALITY_PORT: ${REALITY_PORT:-443}
      HY2_PORT: ${HY2_PORT:-8443}
      SS_PORT: ${SS_PORT:-8388}
      XRAY_PQ_PORT: ${XRAY_PQ_PORT:-10443}
      XHTTP_PORT: ${XHTTP_PORT:-11443}
      SS_V2RAY_PORT: ${SS_V2RAY_PORT:-12443}
      NAIVE_PORT: ${NAIVE_PORT:-13443}
      OVERTLS_PORT: ${OVERTLS_PORT:-14443}
      OVERTLS_INTERNAL_PORT: ${OVERTLS_INTERNAL_PORT:-14444}
      SSR_PORT: ${SSR_PORT:-15443}
      ROUTER_VPN_TLS_NAME: ${ROUTER_VPN_TLS_NAME:-}
      REALITY_TARGET: ${REALITY_TARGET:-www.microsoft.com:443}
    restart: "no"

  finalize-current:
    image: ghcr.io/eabusham2/router-vpn-init:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-finalize
    network_mode: host
    privileged: true
    depends_on:
      init: {condition: service_completed_successfully}
    entrypoint: ["/bin/bash", "/src/server/finalize/current-entrypoint.sh"]
    volumes:
      - /opt/router-vpn:/opt/router-vpn
    environment:
      WAN_INTERFACE: ${WAN_INTERFACE:-eth0}
      LAN_CIDR: ${LAN_CIDR:-192.168.50.0/24}
      LAN_CIDR6: ${LAN_CIDR6:-fd00::/8}
      ADGUARD4: ${ADGUARD4:-192.168.50.133}
      ENDPOINT: ${ENDPOINT:-}
      WG_PORT: ${WG_PORT:-51820}
      AWG_PORT: ${AWG_PORT:-585}
      ROSENPASS_PORT: ${ROSENPASS_PORT:-51822}
      REALITY_PORT: ${REALITY_PORT:-443}
      HY2_PORT: ${HY2_PORT:-8443}
      SS_PORT: ${SS_PORT:-8388}
      XRAY_PQ_PORT: ${XRAY_PQ_PORT:-10443}
      XHTTP_PORT: ${XHTTP_PORT:-11443}
      SS_V2RAY_PORT: ${SS_V2RAY_PORT:-12443}
      NAIVE_PORT: ${NAIVE_PORT:-13443}
      OVERTLS_PORT: ${OVERTLS_PORT:-14443}
      OVERTLS_INTERNAL_PORT: ${OVERTLS_INTERNAL_PORT:-14444}
      SSR_PORT: ${SSR_PORT:-15443}
      ROUTER_VPN_TLS_NAME: ${ROUTER_VPN_TLS_NAME:-}
      REALITY_TARGET: ${REALITY_TARGET:-www.microsoft.com:443}
    restart: "no"

  router-agent:
    image: ghcr.io/eabusham2/router-vpn-agent:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-agent
    network_mode: host
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW]
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config:/etc/router-vpn:ro
      - /opt/router-vpn/admin-state:/var/lib/router-vpn
    environment:
      ROUTER_VPN_CONFIG: /etc/router-vpn/router-agent.json
      ROUTER_VPN_ADMIN_STATE: /var/lib/router-vpn/admin-state.json
      ROUTER_VPN_LAN_CIDR: ${LAN_CIDR:-192.168.50.0/24}
      ROUTER_VPN_LAN_CIDR6: ${LAN_CIDR6:-fd00::/8}

  wireguard:
    image: ghcr.io/eabusham2/router-vpn-wireguard:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-wireguard
    network_mode: host
    restart: unless-stopped
    privileged: true
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/wireguard:/data:ro
      - /lib/modules:/lib/modules:ro
    environment:
      WAN_INTERFACE: ${WAN_INTERFACE:-eth0}
      WG_CONFIG: /data/wg0.conf

  awg2:
    image: ghcr.io/eabusham2/router-vpn-awg2:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-awg2
    network_mode: host
    restart: unless-stopped
    privileged: true
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - /opt/router-vpn/config/awg2:/data:ro
      - /lib/modules:/lib/modules:ro
    environment:
      WAN_INTERFACE: ${WAN_INTERFACE:-eth0}
      AWG_CONFIG: /data/awg0.conf

  rosenpass:
    image: ghcr.io/eabusham2/router-vpn-rosenpass:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-rosenpass
    network_mode: host
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    depends_on:
      finalize-current: {condition: service_completed_successfully}
      wireguard: {condition: service_started}
      awg2: {condition: service_started}
    volumes:
      - /opt/router-vpn/config/rosenpass:/data
    environment:
      ROSENPASS_CONFIG: /data/server.toml
      ROSENPASS_ENV: /data/server.env

  transports:
    image: ghcr.io/sagernet/sing-box:v1.13.12
    container_name: router-vpn-transports
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/transports/server.json:/etc/sing-box/config.json:ro
      - /opt/router-vpn/config/transports/cert.pem:/etc/sing-box/cert.pem:ro
      - /opt/router-vpn/config/transports/key.pem:/etc/sing-box/key.pem:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]

  xray-pq:
    image: ghcr.io/xtls/xray-core:26.7.11
    container_name: router-vpn-xray
    network_mode: host
    user: "0:0"
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/xray/server.json:/etc/xray/config.json:ro
    command: ["run", "-c", "/etc/xray/config.json"]

  naive:
    image: ghcr.io/eabusham2/router-vpn-naive:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-naive
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/tls:/router-vpn:ro
      - /opt/router-vpn/caddy-data:/data
      - /opt/router-vpn/caddy-config:/config
    environment:
      ROUTER_VPN_TLS_SETTINGS: /router-vpn/settings.env

  ss-v2ray:
    image: ghcr.io/eabusham2/router-vpn-ss-v2ray:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-ss-v2ray
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
      naive: {condition: service_started}
    volumes:
      - /opt/router-vpn/config/tls:/router-vpn:ro
      - /opt/router-vpn/caddy-data:/caddy-data:ro
    environment:
      ROUTER_VPN_TLS_SETTINGS: /router-vpn/settings.env

  aux-proxies:
    image: ghcr.io/eabusham2/router-vpn-aux:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-aux
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    volumes:
      - /opt/router-vpn/config/aux:/router-vpn:ro
    environment:
      ROUTER_VPN_AUX_DIR: /router-vpn

  bundle-web:
    image: ghcr.io/eabusham2/router-vpn-init:e2a616278142ff4579a11728f05b081bd7e4d665
    container_name: router-vpn-bundle-web
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
    # setup-center-server.py is the authenticated LAN surface and imports
    # /src/server/scripts/download-broker.py internally for download/pairing APIs.
    entrypoint: ["python3", "/src/server/scripts/setup-center-ai-server.py"]
    command: ["--base", "/opt/router-vpn", "--bind", "0.0.0.0", "--port", "8786"]
    volumes:
      - /opt/router-vpn:/opt/router-vpn:ro
    environment:
      ROUTER_VPN_GITHUB_REPO: Eabusham2/router-vpn
      ROUTER_VPN_GITHUB_BRANCH: main
      ROUTER_VPN_GITHUB_SHA: e2a616278142ff4579a11728f05b081bd7e4d665
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8786/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  socks5:
    image: ghcr.io/sagernet/sing-box:v1.13.12
    container_name: router-vpn-socks5
    network_mode: host
    restart: unless-stopped
    depends_on:
      finalize-current: {condition: service_completed_successfully}
      wireguard: {condition: service_started}
      awg2: {condition: service_started}
    volumes:
      - /opt/router-vpn/config/socks5.json:/etc/sing-box/config.json:ro
    command: ["run", "-c", "/etc/sing-box/config.json"]