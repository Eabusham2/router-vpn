<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Router VPN</title><style>
body{font-family:system-ui;margin:0;background:#111;color:#eee}.wrap{max-width:760px;margin:auto;padding:20px}button,select,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #555;background:#1e1e1e;color:#fff}button{cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.card{background:#1b1b1b;padding:16px;border-radius:14px;margin:12px 0}.on{color:#72e092}.off{color:#ff8d8d}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #333;text-align:left}.grow{flex:1}label{display:flex;align-items:center;gap:7px}.small{opacity:.75;font-size:13px}</style></head><body><div class="wrap"><h1>Router VPN</h1><div class="card"><div id="status">Loading…</div><div class="row"><select id="mode" class="grow"></select><button onclick="connectMode()">Connect</button><button onclick="autoMode()">AUTO</button><button onclick="disconnect()">Off</button></div><div class="row"><label><input id="daita" type="checkbox" onchange="opts()"> DAITA (exact engine required)</label><label><input id="jumbo" type="checkbox" onchange="opts()"> Jumbo TUN</label></div><div class="small">DNS: home AdGuard • IPv4 + IPv6 • one profile</div></div><div class="card"><h3>SOCKS5 proxy</h3><div id="socksinfo" class="small">Loading…</div><div class="small">Connect the VPN first, then enter these details in the app that should use SOCKS5.</div></div><div class="card"><h3>Port forwarding</h3><div class="row"><select id="proto"><option>tcp</option><option>udp</option><option>both</option></select><input id="from" type="number" placeholder="From" value="25565"><input id="to" type="number" placeholder="To" value="25565"><input id="target" type="number" placeholder="Target" value="25565"><button onclick="forward(false)">Apply</button><button onclick="forward(true)">Protected DMZ</button><button onclick="clearForward()">Clear</button></div></div><div class="card"><h3>Modes</h3><table><thead><tr><th>Mode</th><th>Protection</th><th>Ping</th><th>Traffic</th><th>Speed</th><th>Ready</th></tr></thead><tbody id="modes"></tbody></table></div><pre id="msg"></pre></div><script>
async function j(u,o){let r=await fetch(u,o);let t=await r.text();if(!r.ok)throw Error(t);try{return JSON.parse(t)}catch{return t}}
async function init(){let info=await j('/api/info');socksinfo.textContent=`${info.socks_host}:${info.socks_port}  •  ${info.socks_username}  •  ${info.socks_password}`;let m=await j('/api/modes');mode.innerHTML=m.map(x=>`<option value="${x.id}" ${x.available?'':'disabled'}>${x.name}${x.available?'':' — install engine'}</option>`).join('');modes.innerHTML=m.map(x=>`<tr title="${x.reason||''}"><td>${x.name}</td><td>${x.protection}</td><td>${x.ping_min_ms}–${x.ping_max_ms} ms</td><td>+${x.traffic_min_pct}–${x.traffic_max_pct}%</td><td>-${x.speed_loss_min_pct}–${x.speed_loss_max_pct}%</td><td>${x.available?'✓':'—'}</td></tr>`).join('');await refresh();setInterval(refresh,2000)}
async function refresh(){let s=await j('/api/status');status.innerHTML=`Status: <b class="${s.connected?'on':'off'}">${s.connected?s.mode:'OFF'}</b>`;daita.checked=s.daita;jumbo.checked=s.jumbo}
async function post(u,b={}){try{msg.textContent=JSON.stringify(await j(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),null,2)}catch(e){msg.textContent=e.message}refresh()}
function connectMode(){post('/api/connect',{mode:mode.value})}function autoMode(){post('/api/auto')}function disconnect(){post('/api/disconnect')}function opts(){post('/api/options',{daita:daita.checked,jumbo:jumbo.checked})}function forward(dmz){post('/api/forward',{protocol:proto.value,from:+from.value,to:+to.value,target_port:+target.value,dmz})}function clearForward(){post('/api/forward/clear')}
init()</script></body></html>
